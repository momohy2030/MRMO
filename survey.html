<!DOCTYPE html>
<html lang="ar" dir="rtl" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام إدارة الأعمال المساحية - SURVEY ERP</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: { fontFamily: { sans: ['Cairo', 'sans-serif'] } }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-database-compat.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Cairo', sans-serif; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    @media print {
      body { background-color: white !important; font-size: 11px; }
      .print-hidden { display: none !important; }
      .print-area { box-shadow: none !important; border: none !important; width: 100% !important; margin: 0 !important; }
      .dark .print-area { color: black !important; background: white !important; }
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 antialiased transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- إعدادات قاعدة البيانات الخاصة بك ---
    const firebaseConfig = {
      apiKey: "AIzaSyDHjQTNfAh3wQ8tSOXOIewJNXaDCHADrR8",
      authDomain: "mrmo-d8760.firebaseapp.com",
      databaseURL: "https://mrmo-d8760-default-rtdb.firebaseio.com",
      projectId: "mrmo-d8760",
      storageBucket: "mrmo-d8760.firebasestorage.app",
      messagingSenderId: "510855132508",
      appId: "1:510855132508:web:feee377429a2d88c277d99",
      measurementId: "G-N9DW5R28H0"
    };

    const SUPER_ADMIN_EMAIL = "mohamedmo686686@gmail.com";
    const ADMIN_EMAILS = [SUPER_ADMIN_EMAIL, "mohamedmohy676676@gmail.com", "+201095545982"];

    let db = null;
    let auth = null;
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      auth = firebase.auth();
      auth.languageCode = 'ar';
    } catch (e) { console.error(e); }

    const parseNum = (val) => {
      if (typeof val === "number") return isNaN(val) ? 0 : val;
      if (!val) return 0;
      const clean = String(val).replace(/,/g, '').replace(/،/g, '.').trim();
      const n = parseFloat(clean);
      return isNaN(n) ? 0 : n;
    };

    // --- دالة PDF والواتساب ---
    const generatePdfAndOpenWhatsApp = (elementId, filename, textMessage, targetPhone = "201095545982") => {
      const element = document.getElementById(elementId);
      if (!element) return;
      const opt = {
        margin: 5, filename: filename, image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(element).save().then(() => {
        const cleanPhone = targetPhone.replace(/[^0-9]/g, '');
        window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(textMessage)}`, '_blank');
      });
    };

    function App() {
      const [user, setUser] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);
      const [isSuperAdmin, setIsSuperAdmin] = useState(false);
      const [authLoading, setAuthLoading] = useState(true);

      const [activeTab, setActiveTab] = useState("dashboard");
      const [sidebarOpen, setSidebarOpen] = useState(false);
      
      const [operations, setOperations] = useState([]);
      const [transactions, setTransactions] = useState([]);
      const [payments, setPayments] = useState([]);
      const [loginLogs, setLoginLogs] = useState([]);
      
      const [settings, setSettings] = useState({
        engineers: ["م أحمد نبيل", "م أيمن", "م علاء", "م أسامة"],
        opTypes: ["رفع شبكي", "توقيع مساحي", "كروكي تقنين", "حساب كميات"],
        logo: "",
        theme: localStorage.getItem('theme') || 'light'
      });

      const [vaultMonth, setVaultMonth] = useState(new Date().toISOString().substring(0, 7)); // YYYY-MM
      const [toast, setToast] = useState({ show: false, message: "" });
      const [editItemData, setEditItemData] = useState(null);
      const [selectedClientForStatement, setSelectedClientForStatement] = useState("");
      const [selectedEngineerForStatement, setSelectedEngineerForStatement] = useState("");

      const todayDate = new Date().toISOString().split('T')[0];

      // تطبيق الـ Theme
      useEffect(() => {
        if (settings.theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', settings.theme);
      }, [settings.theme]);

      const showToast = (message) => {
        setToast({ show: true, message });
        setTimeout(() => setToast({ show: false, message: "" }), 3000);
      };

      // النماذج
      const [newOp, setNewOp] = useState({
        date: todayDate, clientName: "", opType: "", workDescription: "", engineer: "م أحمد نبيل",
        isFaddan: false, faddanQty: 1, faddanPrice: 0,
        isSketch: false, sketchesCount: 1,
        agreedAmount: 0, paidNow: 0, laborCost: 0, carCost: 0,
        engDayType: "full", // full=2000, half=1500, percent=80%
        deviceDayType: "full" // full=3500, half=1750, none=0
      });

      const [newPayment, setNewPayment] = useState({ date: todayDate, clientName: "", amount: "", notes: "" });
      const [newTx, setNewTx] = useState({ date: todayDate, type: "income", category: "إيراد عام", amount: "", notes: "" });

      useEffect(() => {
        if (!auth) { setAuthLoading(false); return; }
        return auth.onAuthStateChanged((curr) => {
          if (curr) {
            const email = (curr.email || "").toLowerCase();
            setUser(curr);
            setIsSuperAdmin(email === SUPER_ADMIN_EMAIL.toLowerCase());
            setIsAdmin(ADMIN_EMAILS.some(e => email.includes(e.toLowerCase())));

            if (db && !sessionStorage.getItem('survey_log')) {
              db.ref('survey_data/login_logs').push({ name: curr.displayName||curr.email, email, date: new Date().toLocaleString('ar-EG') });
              sessionStorage.setItem('survey_log', 'true');
            }
          } else {
            setUser(null); setIsAdmin(false); setIsSuperAdmin(false);
          }
          setAuthLoading(false);
        });
      }, []);

      useEffect(() => {
        if (!db) return;
        const ref = db.ref('survey_data');
        ref.on('value', (snap) => {
          const d = snap.val() || {};
          const toArr = (v) => (v ? (Array.isArray(v) ? v : Object.values(v)) : []);
          setOperations(toArr(d.operations).reverse());
          setTransactions(toArr(d.transactions).reverse());
          setPayments(toArr(d.payments).reverse());
          setLoginLogs(toArr(d.login_logs).reverse());
          
          if (d.settings) {
            setSettings(prev => ({
              ...prev,
              engineers: d.settings.engineers || prev.engineers,
              opTypes: d.settings.opTypes || prev.opTypes,
              logo: d.settings.logo || prev.logo
            }));
          }
        });
      }, []);

      const updateSettingArray = (key, title) => {
        const val = prompt(`إضافة ${title} جديد:`);
        if (val && val.trim()) {
          const updated = [...settings[key], val.trim()];
          setSettings(p => ({ ...p, [key]: updated }));
          if(db) db.ref(`survey_data/settings/${key}`).set(updated);
        }
      };

      const calculateOperationShares = (op) => {
        const total = parseNum(op.agreedAmount);
        let engFee = 0, deviceFee = 0, officeFee = 0;

        // حساب المهندس
        if (op.engDayType === 'full') engFee = 2000;
        else if (op.engDayType === 'half') engFee = 1500;
        else if (op.engDayType === 'percent') engFee = total * 0.80;

        // حساب الجهاز
        if (op.deviceDayType === 'full') deviceFee = 3500;
        else if (op.deviceDayType === 'half') deviceFee = 1750;
        else deviceFee = 0;

        // حساب المكتب
        if (op.engDayType === 'percent') {
          officeFee = total * 0.20; 
        } else {
          officeFee = Math.max(0, total - engFee - deviceFee - parseNum(op.laborCost) - parseNum(op.carCost));
        }

        return { engFee, deviceFee, officeFee };
      };

      const handleAddOperation = (e) => {
        e.preventDefault();
        const total = newOp.isFaddan ? parseNum(newOp.faddanQty) * parseNum(newOp.faddanPrice) : parseNum(newOp.agreedAmount);
        const finalOp = { ...newOp, agreedAmount: total };
        const shares = calculateOperationShares(finalOp);

        const opToSave = {
          id: Date.now(), ...finalOp, ...shares, createdBy: user.email
        };

        const updatedOps = [opToSave, ...operations];
        setOperations(updatedOps);
        if (db) db.ref('survey_data/operations').set(updatedOps);

        if (parseNum(newOp.paidNow) > 0) {
          const autoPay = { id: Date.now() + 1, date: newOp.date, clientName: newOp.clientName, amount: parseNum(newOp.paidNow), notes: `مقدم عملية` };
          const autoTx = { id: Date.now() + 2, date: newOp.date, type: "income", category: "تحصيل مساحة", clientOrEntity: newOp.clientName, amount: parseNum(newOp.paidNow) };
          setPayments([autoPay, ...payments]);
          setTransactions([autoTx, ...transactions]);
          if(db){
            db.ref('survey_data/payments').set([autoPay, ...payments]);
            db.ref('survey_data/transactions').set([autoTx, ...transactions]);
          }
        }
        showToast("تم حفظ العملية بنجاح! ✅");
      };

      const handleAddPayment = (e) => {
        e.preventDefault();
        const item = { id: Date.now(), ...newPayment, amount: parseNum(newPayment.amount) };
        const tx = { id: Date.now()+1, date: item.date, type: 'income', category: 'سداد دفعة', clientOrEntity: item.clientName, amount: item.amount };
        
        const upPay = [item, ...payments];
        const upTx = [tx, ...transactions];
        setPayments(upPay); setTransactions(upTx);
        if (db) { db.ref('survey_data/payments').set(upPay); db.ref('survey_data/transactions').set(upTx); }
        setNewPayment({ date: todayDate, clientName: "", amount: "", notes: "" });
        showToast("تم قيد الدفعة للعميل! 💰");
      };

      const handleAddTransaction = (e) => {
        e.preventDefault();
        const item = { id: Date.now(), ...newTx, amount: parseNum(newTx.amount) };
        const updated = [item, ...transactions];
        setTransactions(updated);
        if(db) db.ref('survey_data/transactions').set(updated);
        setNewTx({ date: todayDate, type: "income", category: "إيراد عام", amount: "", notes: "" });
        showToast("تم حفظ الحركة بالخزينة!");
      };

      const deleteItem = (path, id, list, setter) => {
        if (!isAdmin) { showToast("مرفوض. للإدارة فقط."); return; }
        if (window.confirm("تأكيد الحذف النهائي؟")) {
          const updated = list.filter(item => item.id !== id);
          setter(updated);
          if (db) db.ref(`survey_data/${path}`).set(updated);
        }
      };

      // --- حسابات عامة ---
      const clientNames = Array.from(new Set([...operations.map(o=>o.clientName), ...payments.map(p=>p.clientName)])).filter(Boolean);
      
      // خزينة الشهر
      const monthlyTx = transactions.filter(t => t.date.startsWith(vaultMonth));
      const mIn = monthlyTx.filter(t=>t.type==='income').reduce((s,t)=>s+parseNum(t.amount),0);
      const mOut = monthlyTx.filter(t=>t.type==='expense').reduce((s,t)=>s+parseNum(t.amount),0);
      const mNet = mIn - mOut;

      // أرباح الجهاز والمكتب الشاملة
      const totalRtk = operations.reduce((s,o)=>s+(o.deviceFee||0),0);
      const totalOffice = operations.reduce((s,o)=>s+(o.officeFee||0),0);

      const navTabs = [
        { id: "dashboard", label: "لوحة التحكم", icon: "📊" },
        { id: "vault", label: "الخزينة", icon: "💵" },
        { id: "clients", label: "العملاء والأعمال", icon: "👥" },
        { id: "expenses", label: "مصاريف التشغيل", icon: "🚗" },
        { id: "engineers", label: "حساب المهندسين", icon: "👷" },
        { id: "rtk", label: "جهاز RTK", icon: "🛰️" },
        { id: "payments", label: "الدفعات", icon: "💰" },
        { id: "extracts", label: "المستخلصات", icon: "📄" },
        { id: "statement", label: "كشف العميل", icon: "📑" },
        { id: "office", label: "أرباح المكتب", icon: "🏢" },
        ...(isSuperAdmin ? [{ id: "logs", label: "سجل الدخول", icon: "🛡️" }] : []),
        { id: "settings", label: "الإعدادات", icon: "⚙️" }
      ];

      if (authLoading) return <div class="min-h-screen flex items-center justify-center bg-slate-900 text-white font-bold">جاري التهيئة...</div>;

      if (!user) {
        return (
          <div class="min-h-screen flex items-center justify-center bg-slate-900 p-4">
            <div class="bg-white p-8 rounded-3xl max-w-sm w-full text-center shadow-2xl">
              <div class="text-5xl mb-4">📐</div>
              <h2 class="text-2xl font-black text-slate-800">نظام المساحة ERP</h2>
              <button onClick={() => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())} class="mt-6 w-full bg-slate-900 text-white py-3 rounded-xl font-bold shadow-md">الدخول بحساب Google</button>
            </div>
          </div>
        );
      }

      return (
        <div class="flex h-screen overflow-hidden">
          {/* شريط جانبي (Sidebar) */}
          <aside class={`fixed md:relative z-40 w-64 h-full bg-slate-900 text-slate-300 flex flex-col transition-transform duration-300 ${sidebarOpen ? 'translate-x-0' : 'translate-x-full md:translate-x-0'}`}>
            <div class="p-4 border-b border-slate-800 flex justify-between items-center">
              <h1 class="font-black text-white text-lg flex items-center gap-2"><span>📐</span> مساحة ERP</h1>
              <button onClick={()=>setSidebarOpen(false)} class="md:hidden text-white text-xl">✕</button>
            </div>
            <nav class="flex-1 overflow-y-auto p-3 space-y-1 text-sm font-bold">
              {navTabs.map(t => (
                <button key={t.id} onClick={() => { setActiveTab(t.id); setSidebarOpen(false); }} class={`w-full text-right flex items-center gap-3 p-3 rounded-xl transition ${activeTab===t.id ? 'bg-indigo-600 text-white' : 'hover:bg-slate-800'}`}>
                  <span class="text-lg">{t.icon}</span> <span>{t.label}</span>
                </button>
              ))}
            </nav>
            <div class="p-4 border-t border-slate-800 text-xs">
              <div class="truncate text-slate-400 mb-2">{user.email}</div>
              <button onClick={()=>auth.signOut()} class="w-full bg-rose-600/20 text-rose-400 py-2 rounded-lg font-bold">تسجيل الخروج</button>
            </div>
          </aside>

          {/* محتوى الشاشة الرئيسي */}
          <main class="flex-1 flex flex-col h-full bg-slate-50 dark:bg-slate-900 relative">
            <header class="bg-white dark:bg-slate-800 border-b dark:border-slate-700 p-4 flex justify-between items-center shadow-sm">
              <div class="flex items-center gap-3">
                <button onClick={()=>setSidebarOpen(true)} class="md:hidden text-2xl dark:text-white">☰</button>
                <h2 class="font-black text-lg text-indigo-700 dark:text-indigo-400">{navTabs.find(t=>t.id===activeTab)?.label}</h2>
              </div>
              <div class="flex gap-2">
                <button onClick={() => setSettings(p=>({...p, theme: p.theme==='dark'?'light':'dark'}))} class="p-2 bg-slate-100 dark:bg-slate-700 rounded-lg text-lg">
                  {settings.theme === 'dark' ? '☀️' : '🌙'}
                </button>
                <a href="/" class="bg-slate-800 text-white px-4 py-2 rounded-lg font-bold text-xs flex items-center gap-1">🏗️ الإنشاءات</a>
              </div>
            </header>

            <div class="flex-1 overflow-y-auto p-4 md:p-6 pb-20">
              
              {/* 1. لوحة التحكم */}
              {activeTab === 'dashboard' && (
                <div class="space-y-6">
                  <DashboardCharts 
                    totalWork={operations.reduce((s,o)=>s+parseNum(o.agreedAmount),0)}
                    totalReceived={payments.reduce((s,p)=>s+parseNum(p.amount),0)}
                    totalExpenses={operations.reduce((s,o)=>s+parseNum(o.laborCost)+parseNum(o.carCost),0)}
                    opCounts={{
                      rtkFull: operations.filter(o=>o.engDayType==='full').length,
                      rtkHalf: operations.filter(o=>o.engDayType==='half').length,
                      sketch: operations.filter(o=>o.isSketch).length,
                      faddan: operations.filter(o=>o.isFaddan).length
                    }}
                  />
                </div>
              )}

              {/* 2. الخزينة */}
              {activeTab === 'vault' && (
                <div class="space-y-4">
                  <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border dark:border-slate-700 shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
                    <div class="flex items-center gap-2">
                      <label class="font-bold">تصفية شهر:</label>
                      <input type="month" value={vaultMonth} onChange={e=>setVaultMonth(e.target.value)} class="border p-2 rounded-xl dark:bg-slate-700 dark:border-slate-600"/>
                    </div>
                    <div class="flex gap-4 text-center text-sm">
                      <div><span class="block text-slate-500 text-[10px]">وارد الشهر</span><strong class="text-emerald-600 text-lg">{mIn.toLocaleString()}</strong></div>
                      <div><span class="block text-slate-500 text-[10px]">منصرف الشهر</span><strong class="text-rose-600 text-lg">{mOut.toLocaleString()}</strong></div>
                      <div class="bg-indigo-50 dark:bg-indigo-900/30 px-4 py-1 rounded-xl"><span class="block text-indigo-800 dark:text-indigo-300 text-[10px]">الصافي</span><strong class="text-indigo-700 dark:text-indigo-400 text-xl font-black">{mNet.toLocaleString()}</strong></div>
                    </div>
                  </div>

                  <form onSubmit={handleAddTransaction} class="bg-white dark:bg-slate-800 p-4 rounded-2xl border dark:border-slate-700 shadow-sm grid grid-cols-1 md:grid-cols-5 gap-3 text-xs font-bold">
                    <div>النوع <select value={newTx.type} onChange={e=>setNewTx({...newTx, type: e.target.value})} class="w-full border p-2 rounded-xl mt-1 dark:bg-slate-700"><option value="income">وارد</option><option value="expense">صادر</option></select></div>
                    <div>البند <input type="text" value={newTx.category} onChange={e=>setNewTx({...newTx, category: e.target.value})} class="w-full border p-2 rounded-xl mt-1 dark:bg-slate-700" required/></div>
                    <div>المبلغ <input type="number" value={newTx.amount} onChange={e=>setNewTx({...newTx, amount: e.target.value})} class="w-full border p-2 rounded-xl mt-1 dark:bg-slate-700 text-emerald-600" required/></div>
                    <div class="md:col-span-2 flex items-end"><button class="w-full bg-slate-800 dark:bg-indigo-600 text-white py-2 rounded-xl">حفظ بالخزينة</button></div>
                  </form>

                  <div class="bg-white dark:bg-slate-800 rounded-2xl border dark:border-slate-700 overflow-x-auto text-xs">
                    <table class="w-full text-right"><thead class="bg-slate-100 dark:bg-slate-700"><tr><th class="p-2">التاريخ</th><th class="p-2">البند</th><th class="p-2">المبلغ</th>{isAdmin && <th class="p-2">إجراء</th>}</tr></thead>
                    <tbody>
                      {monthlyTx.map(t=>(
                        <tr key={t.id} class="border-b dark:border-slate-700">
                          <td class="p-2">{t.date}</td>
                          <td class="p-2"><span class={t.type==='income'?'text-emerald-600':'text-rose-600'}>{t.type==='income'?'📥':'📤'} {t.category}</span></td>
                          <td class="p-2 font-black">{parseNum(t.amount).toLocaleString()}</td>
                          {isAdmin && <td class="p-2"><button onClick={()=>deleteItem('transactions',t.id,transactions,setTransactions)} class="text-rose-600">🗑️</button></td>}
                        </tr>
                      ))}
                    </tbody></table>
                  </div>
                </div>
              )}

              {/* 3. العملاء والعمليات */}
              {activeTab === 'clients' && (
                <div class="space-y-4">
                  <form onSubmit={handleAddOperation} class="bg-white dark:bg-slate-800 p-5 rounded-2xl border dark:border-slate-700 shadow-sm grid grid-cols-1 md:grid-cols-4 gap-4 text-xs font-bold">
                    <div>التاريخ <input type="date" value={newOp.date} onChange={e=>setNewOp({...newOp, date: e.target.value})} class="w-full border p-2 rounded-xl mt-1 dark:bg-slate-700" required/></div>
                    <div>اسم العميل <input type="text" value={newOp.clientName} onChange={e=>setNewOp({...newOp, clientName: e.target.value})} class="w-full border p-2 rounded-xl mt-1 dark:bg-slate-700" required/></div>
                    
                    <div>نوع العمل 
                      <div class="flex gap-1 mt-1">
                        <select value={newOp.opType} onChange={e=>setNewOp({...newOp, opType: e.target.value})} class="w-full border p-2 rounded-xl dark:bg-slate-700">
                          <option value="">اختر...</option>
                          {settings.opTypes.map(o=><option key={o}>{o}</option>)}
                        </select>
                        <button type="button" onClick={()=>updateSettingArray('opTypes','نوع عمل')} class="bg-slate-200 dark:bg-slate-600 px-2 rounded-xl">+</button>
                      </div>
                    </div>
                    
                    <div>المهندس 
                      <div class="flex gap-1 mt-1">
                        <select value={newOp.engineer} onChange={e=>setNewOp({...newOp, engineer: e.target.value})} class="w-full border p-2 rounded-xl dark:bg-slate-700">
                          {settings.engineers.map(e=><option key={e}>{e}</option>)}
                        </select>
                        <button type="button" onClick={()=>updateSettingArray('engineers','مهندس')} class="bg-slate-200 dark:bg-slate-600 px-2 rounded-xl">+</button>
                      </div>
                    </div>

                    <div class="md:col-span-2">بيان الأعمال (يوضع بالمستخلص) <input type="text" value={newOp.workDescription} onChange={e=>setNewOp({...newOp, workDescription: e.target.value})} class="w-full border p-2 rounded-xl mt-1 dark:bg-slate-700" required/></div>
                    
                    <div class="md:col-span-2 flex gap-4 mt-4">
                      <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" checked={newOp.isFaddan} onChange={e=>setNewOp({...newOp, isFaddan: e.target.checked})}/> حساب بالفدان</label>
                      <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" checked={newOp.isSketch} onChange={e=>setNewOp({...newOp, isSketch: e.target.checked})}/> كروكيات</label>
                    </div>

                    {newOp.isFaddan && <>
                      <div>عدد الأفدنة <input type="number" step="any" value={newOp.faddanQty} onChange={e=>setNewOp({...newOp, faddanQty: e.target.value})} class="w-full border p-2 rounded-xl mt-1 dark:bg-slate-700 bg-amber-50"/></div>
                      <div>سعر الفدان <input type="number" step="any" value={newOp.faddanPrice} onChange={e=>setNewOp({...newOp, faddanPrice: e.target.value})} class="w-full border p-2 rounded-xl mt-1 dark:bg-slate-700 bg-amber-50"/></div>
                    </>}
                    
                    {newOp.isSketch && <div>عدد الكروكيات <input type="number" value={newOp.sketchesCount} onChange={e=>setNewOp({...newOp, sketchesCount: e.target.value})} class="w-full border p-2 rounded-xl mt-1 dark:bg-slate-700"/></div>}

                    {!newOp.isFaddan && <div>المبلغ المتفق عليه <input type="number" value={newOp.agreedAmount} onChange={e=>setNewOp({...newOp, agreedAmount: e.target.value})} class="w-full border p-2 rounded-xl mt-1 dark:bg-slate-700 bg-indigo-50 text-indigo-700" required/></div>}

                    <div>مقدم مدفوع <input type="number" value={newOp.paidNow} onChange={e=>setNewOp({...newOp, paidNow: e.target.value})} class="w-full border p-2 rounded-xl mt-1 dark:bg-slate-700"/></div>
                    <div>مصاريف عمالة <input type="number" value={newOp.laborCost} onChange={e=>setNewOp({...newOp, laborCost: e.target.value})} class="w-full border p-2 rounded-xl mt-1 dark:bg-slate-700"/></div>
                    <div>مصاريف سيارة <input type="number" value={newOp.carCost} onChange={e=>setNewOp({...newOp, carCost: e.target.value})} class="w-full border p-2 rounded-xl mt-1 dark:bg-slate-700"/></div>

                    <div class="md:col-span-2 bg-slate-100 dark:bg-slate-700 p-3 rounded-xl border border-slate-300 dark:border-slate-600">
                      <label class="block mb-2 text-indigo-700 dark:text-indigo-300">⚙️ ضبط حسابات التوزيع:</label>
                      <div class="grid grid-cols-2 gap-2">
                        <div>جهد المهندس: 
                          <select value={newOp.engDayType} onChange={e=>setNewOp({...newOp, engDayType: e.target.value})} class="w-full p-2 rounded mt-1 bg-white dark:bg-slate-800">
                            <option value="full">يوم كامل (2000)</option><option value="half">نصف يوم (1500)</option><option value="percent">نسبة (80%)</option>
                          </select>
                        </div>
                        <div>استخدام الجهاز: 
                          <select value={newOp.deviceDayType} onChange={e=>setNewOp({...newOp, deviceDayType: e.target.value})} class="w-full p-2 rounded mt-1 bg-white dark:bg-slate-800">
                            <option value="full">يوم كامل (3500)</option><option value="half">نصف يوم (1750)</option><option value="none">بدون جهاز (0)</option>
                          </select>
                        </div>
                      </div>
                    </div>

                    <div class="md:col-span-4 mt-2"><button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl text-sm shadow">حفظ العملية</button></div>
                  </form>

                  <div class="bg-white dark:bg-slate-800 rounded-2xl border dark:border-slate-700 overflow-x-auto text-xs">
                    <table class="w-full text-right"><thead class="bg-slate-100 dark:bg-slate-700"><tr><th class="p-2">التاريخ</th><th class="p-2">العميل</th><th class="p-2">البيان</th><th class="p-2">المبلغ</th><th class="p-2">المهندس</th>{isAdmin && <th class="p-2 text-center">إجراء</th>}</tr></thead>
                    <tbody>
                      {operations.map(o=>(
                        <tr key={o.id} class="border-b dark:border-slate-700">
                          <td class="p-2">{o.date}</td><td class="p-2 font-bold">{o.clientName}</td><td class="p-2 truncate max-w-[150px]">{o.workDescription}</td>
                          <td class="p-2 font-black text-indigo-600 dark:text-indigo-400">{parseNum(o.agreedAmount).toLocaleString()}</td>
                          <td class="p-2">{o.engineer}</td>
                          {isAdmin && <td class="p-2 text-center"><button onClick={()=>deleteItem('operations',o.id,operations,setOperations)} class="text-rose-600">🗑️</button></td>}
                        </tr>
                      ))}
                    </tbody></table>
                  </div>
                </div>
              )}

              {/* 4. مصاريف التشغيل */}
              {activeTab === 'expenses' && (
                <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border dark:border-slate-700 overflow-x-auto text-xs">
                  <h3 class="font-bold mb-4">🚗 مصاريف العمالة والسيارة لكل عملية:</h3>
                  <table class="w-full text-right border"><thead class="bg-slate-100 dark:bg-slate-700"><tr><th class="p-2 border">العميل</th><th class="p-2 border">البيان</th><th class="p-2 border text-center">عمالة</th><th class="p-2 border text-center">سيارة</th><th class="p-2 border text-center text-rose-600">الإجمالي</th></tr></thead>
                  <tbody>
                    {operations.map(o=>{
                      const t = parseNum(o.laborCost)+parseNum(o.carCost);
                      return t>0 && <tr key={o.id} class="border-b dark:border-slate-700"><td class="p-2 border">{o.clientName}</td><td class="p-2 border">{o.workDescription}</td><td class="p-2 border text-center">{o.laborCost}</td><td class="p-2 border text-center">{o.carCost}</td><td class="p-2 border text-center font-bold text-rose-600">{t}</td></tr>
                    })}
                  </tbody></table>
                </div>
              )}

              {/* 5. بيان حساب المهندسين */}
              {activeTab === 'engineers' && (
                <div class="space-y-4">
                  <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border shadow-sm">
                    <label class="font-bold text-xs mb-2 block">اختر المهندس لعرض حسابه:</label>
                    <select value={selectedEngineerForStatement} onChange={e=>setSelectedEngineerForStatement(e.target.value)} class="w-full md:w-1/3 border p-2 rounded-xl dark:bg-slate-700 text-xs font-bold">
                      <option value="">-- القائمة --</option>{settings.engineers.map(e=><option key={e}>{e}</option>)}
                    </select>
                  </div>
                  {selectedEngineerForStatement && (() => {
                    const engOps = operations.filter(o=>o.engineer === selectedEngineerForStatement);
                    const totalEngDues = engOps.reduce((s,o)=>s+parseNum(o.engFee),0);
                    return (
                      <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border shadow-sm text-xs">
                        <div class="flex justify-between items-center mb-4"><h3 class="font-black text-sm">حساب: {selectedEngineerForStatement}</h3><span class="bg-indigo-100 text-indigo-800 px-3 py-1 rounded-xl font-bold">إجمالي المستحق: {totalEngDues.toLocaleString()} ج.م</span></div>
                        <table class="w-full text-right border"><thead class="bg-slate-100 dark:bg-slate-700"><tr><th class="p-2 border">التاريخ</th><th class="p-2 border">العميل والبيان</th><th class="p-2 border text-center">نوع الجهد</th><th class="p-2 border text-center text-emerald-600">الأتعاب المستحقة</th></tr></thead>
                        <tbody>{engOps.map(o=><tr key={o.id}><td class="p-2 border">{o.date}</td><td class="p-2 border">{o.clientName} - {o.workDescription}</td><td class="p-2 border text-center">{o.engDayType}</td><td class="p-2 border text-center font-bold text-emerald-600">{parseNum(o.engFee).toLocaleString()}</td></tr>)}</tbody></table>
                      </div>
                    )
                  })()}
                </div>
              )}

              {/* 6. جهاز RTK */}
              {activeTab === 'rtk' && (
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border shadow-sm text-center">
                  <h3 class="font-black text-lg text-indigo-700 dark:text-indigo-400 mb-2">إيرادات جهاز RTK المجمعة</h3>
                  <div class="text-4xl font-black mb-8">{totalRtk.toLocaleString()} ج.م</div>
                  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-xs">
                    <div class="p-4 border rounded-2xl bg-indigo-50 dark:bg-slate-700">م. مندور (50%)<br/><strong class="text-lg text-indigo-900 dark:text-indigo-300 mt-2 block">{(totalRtk*0.5).toLocaleString()}</strong></div>
                    <div class="p-4 border rounded-2xl">م. أسامة<br/><strong class="text-lg mt-2 block">{((totalRtk*0.5)/3).toLocaleString()}</strong></div>
                    <div class="p-4 border rounded-2xl">م. أيمن<br/><strong class="text-lg mt-2 block">{((totalRtk*0.5)/3).toLocaleString()}</strong></div>
                    <div class="p-4 border rounded-2xl">م. علاء<br/><strong class="text-lg mt-2 block">{((totalRtk*0.5)/3).toLocaleString()}</strong></div>
                  </div>
                </div>
              )}

              {/* 7. الدفعات */}
              {activeTab === 'payments' && (
                <div class="space-y-4 text-xs font-bold">
                  <form onSubmit={handleAddPayment} class="bg-white dark:bg-slate-800 p-4 rounded-2xl border shadow-sm grid grid-cols-1 md:grid-cols-4 gap-3">
                    <div>العميل <select value={newPayment.clientName} onChange={e=>setNewPayment({...newPayment, clientName:e.target.value})} class="w-full border p-2 rounded mt-1 dark:bg-slate-700" required><option value="">اختر</option>{clientNames.map(c=><option key={c}>{c}</option>)}</select></div>
                    <div>المبلغ <input type="number" value={newPayment.amount} onChange={e=>setNewPayment({...newPayment, amount:e.target.value})} class="w-full border p-2 rounded mt-1 dark:bg-slate-700 text-emerald-600" required/></div>
                    <div>الملاحظات <input type="text" value={newPayment.notes} onChange={e=>setNewPayment({...newPayment, notes:e.target.value})} class="w-full border p-2 rounded mt-1 dark:bg-slate-700"/></div>
                    <div class="flex items-end"><button class="w-full bg-emerald-600 text-white py-2 rounded">تسجيل دفعة واردة</button></div>
                  </form>
                  <table class="w-full text-right bg-white dark:bg-slate-800 rounded-2xl border"><thead class="bg-slate-100 dark:bg-slate-700"><tr><th class="p-2">التاريخ</th><th class="p-2">العميل</th><th class="p-2 text-center">المبلغ</th>{isAdmin&&<th class="p-2"></th>}</tr></thead>
                  <tbody>{payments.map(p=><tr key={p.id} class="border-b dark:border-slate-700"><td class="p-2">{p.date}</td><td class="p-2">{p.clientName}</td><td class="p-2 text-center text-emerald-600">{parseNum(p.amount).toLocaleString()}</td>{isAdmin&&<td class="p-2"><button onClick={()=>deleteItem('payments',p.id,payments,setPayments)}>🗑️</button></td>}</tr>)}</tbody></table>
                </div>
              )}

              {/* 8. المستخلصات المترابطة */}
              {activeTab === 'extracts' && (
                <div class="space-y-4 text-xs">
                  <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border shadow-sm print-hidden">
                    <label class="font-bold">استخراج مستخلص لعميل:</label>
                    <select value={selectedClientForStatement} onChange={e=>setSelectedClientForStatement(e.target.value)} class="w-full md:w-1/3 border p-2 rounded-xl mt-2 dark:bg-slate-700 font-bold">
                      <option value="">-- اختر --</option>{clientNames.map(c=><option key={c}>{c}</option>)}
                    </select>
                  </div>
                  {selectedClientForStatement && (() => {
                    const cOps = operations.filter(o=>o.clientName===selectedClientForStatement);
                    const cPays = payments.filter(p=>p.clientName===selectedClientForStatement);
                    const tWork = cOps.reduce((s,o)=>s+parseNum(o.agreedAmount),0);
                    const tPaid = cPays.reduce((s,p)=>s+parseNum(p.amount),0) + cOps.reduce((s,o)=>s+parseNum(o.paidNow),0);
                    const netDue = tWork - tPaid;

                    return (
                      <div id="extract-pdf-target" class="bg-white dark:bg-slate-800 p-6 rounded-2xl border shadow-sm print-area">
                        <div class="border-b-2 border-slate-900 pb-3 mb-4 flex justify-between">
                          <div><h2 class="font-black text-lg">شركة مساحة للاستشارات</h2><p class="text-[10px]">مستخلص أعمال مساحية</p></div>
                          {settings.logo && <img src={settings.logo} class="h-12 object-contain"/>}
                        </div>
                        <div class="mb-4"><strong>العميل:</strong> {selectedClientForStatement} &nbsp;|&nbsp; <strong>التاريخ:</strong> {todayDate}</div>
                        
                        <table class="w-full border text-right mb-4">
                          <thead class="bg-slate-100 dark:bg-slate-700"><tr><th class="p-2 border">البيان</th><th class="p-2 border text-center">المبلغ</th></tr></thead>
                          <tbody>{cOps.map(o=><tr key={o.id}><td class="p-2 border">{o.workDescription} {o.isFaddan?`(${o.faddanQty} فدان)`:''}</td><td class="p-2 border text-center">{parseNum(o.agreedAmount).toLocaleString()}</td></tr>)}</tbody>
                        </table>
                        
                        <div class="grid grid-cols-3 gap-2 text-center font-bold">
                          <div class="bg-slate-50 dark:bg-slate-700 p-2 rounded border">إجمالي الأعمال<br/><span class="text-lg">{tWork.toLocaleString()}</span></div>
                          <div class="bg-slate-50 dark:bg-slate-700 p-2 rounded border">المدفوعات<br/><span class="text-lg text-emerald-600">{tPaid.toLocaleString()}</span></div>
                          <div class="bg-indigo-50 dark:bg-indigo-900 p-2 rounded border border-indigo-200">الرصيد المستحق<br/><span class="text-xl text-indigo-700 dark:text-indigo-300">{netDue.toLocaleString()}</span></div>
                        </div>

                        <div class="mt-4 print-hidden flex justify-end gap-2">
                          <button onClick={()=>window.print()} class="bg-slate-800 text-white px-4 py-2 rounded">🖨️ طباعة</button>
                          <button onClick={()=>generatePdfAndOpenWhatsApp('extract-pdf-target', `مستخلص_${selectedClientForStatement}.pdf`, `مستخلص أعمال:\nالإجمالي: ${tWork}\nالمدفوع: ${tPaid}\nالمستحق: ${netDue}`)} class="bg-emerald-600 text-white px-4 py-2 rounded">📲 PDF + واتساب</button>
                        </div>
                      </div>
                    )
                  })()}
                </div>
              )}

              {/* 9. كشف حساب العميل */}
              {activeTab === 'statement' && (
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border shadow-sm text-center font-bold text-slate-500">
                  كشف الحساب التفصيلي مطابق بالكامل لآلية تبويب المستخلصات مع إظهار تواريخ الدفعات.<br/>(يرجى استخدام تبويب المستخلصات لاستخراج الكشوفات المالية للعملاء).
                </div>
              )}

              {/* 10. أرباح المكتب */}
              {activeTab === 'office' && (
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border shadow-sm text-center">
                  <h3 class="font-black text-lg mb-2">أرباح المكتب المجمعة (20% من الأعمال)</h3>
                  <div class="text-4xl font-black mb-8 text-emerald-600">{Math.round(totalOffice).toLocaleString()} ج.م</div>
                  <div class="grid grid-cols-2 md:grid-cols-5 gap-4 text-xs">
                    <div class="p-4 border rounded-2xl bg-amber-50 dark:bg-slate-700">في سبيل الله (10%)<br/><strong class="text-lg mt-2 block">{Math.round(totalOffice*0.1).toLocaleString()}</strong></div>
                    <div class="p-4 border rounded-2xl bg-blue-50 dark:bg-slate-700">م. أحمد نبيل (10%)<br/><strong class="text-lg mt-2 block">{Math.round(totalOffice*0.1).toLocaleString()}</strong></div>
                    <div class="p-4 border rounded-2xl">م. أسامة<br/><strong class="text-lg mt-2 block">{Math.round((totalOffice*0.8)/3).toLocaleString()}</strong></div>
                    <div class="p-4 border rounded-2xl">م. أيمن<br/><strong class="text-lg mt-2 block">{Math.round((totalOffice*0.8)/3).toLocaleString()}</strong></div>
                    <div class="p-4 border rounded-2xl">م. علاء<br/><strong class="text-lg mt-2 block">{Math.round((totalOffice*0.8)/3).toLocaleString()}</strong></div>
                  </div>
                </div>
              )}

              {/* 11. سجل الدخول والأمان */}
              {activeTab === 'logs' && isSuperAdmin && (
                <table class="w-full text-right bg-white dark:bg-slate-800 text-xs border rounded-2xl"><thead class="bg-slate-100 dark:bg-slate-700"><tr><th class="p-2">الاسم</th><th class="p-2">الإيميل</th><th class="p-2">الوقت</th></tr></thead>
                <tbody>{loginLogs.map((l,i)=><tr key={i} class="border-b dark:border-slate-700"><td class="p-2">{l.name}</td><td class="p-2">{l.email}</td><td class="p-2">{l.date}</td></tr>)}</tbody></table>
              )}

              {/* 12. الإعدادات */}
              {activeTab === 'settings' && (
                <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border shadow-sm max-w-sm text-xs">
                  <h3 class="font-bold mb-2">🖼️ شعار الترويسة المعتمد:</h3>
                  <input type="file" accept="image/*" onChange={(e)=>{
                    if(!isAdmin) return;
                    const f = e.target.files[0]; if(!f) return;
                    const r = new FileReader(); r.onload = (evt) => {
                      setSettings(p=>({...p, logo: evt.target.result}));
                      if(db) db.ref('survey_data/settings/logo').set(evt.target.result);
                      showToast("تم تحديث الشعار!");
                    }; r.readAsDataURL(f);
                  }} class="w-full p-2 border rounded"/>
                  {settings.logo && <img src={settings.logo} class="h-16 object-contain mt-3 border p-2 rounded" />}
                </div>
              )}
            </div>
          </main>

          {/* Toast */}
          {toast.show && <div class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-2 rounded-xl text-xs z-50 shadow-xl">{toast.message}</div>}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
