    function parseNum(val) {
      if (typeof val === "number") return isNaN(val) ? 0 : val;
      if (!val) return 0;
      const clean = String(val).replace(/,/g, '').replace(/،/g, '.').trim();
      const n = parseFloat(clean);
      return isNaN(n) ? 0 : n;
    }

    function toArr(v) {
      if (v === null || v === undefined) return [];
      if (Array.isArray(v)) return v;
      if (typeof v === 'object') return Object.values(v);
      return [String(v)];
    }

    const offlineStorage = {
      get(key, fallback = []) {
        try {
          const item = localStorage.getItem(`survey_${key}`);
          return item ? JSON.parse(item) : fallback;
        } catch { return fallback; }
      },
      set(key, data) {
        try { localStorage.setItem(`survey_${key}`, JSON.stringify(data)); } catch (e) {}
      },
      addToQueue(path, data) {
        const queue = this.get('offline_sync_queue', []);
        queue.push({ id: Date.now(), path, data });
        this.set('offline_sync_queue', queue);
      },
      syncQueue(databaseInstance) {
        if (!navigator.onLine || !databaseInstance) return;
        const queue = this.get('offline_sync_queue', []);
        if (queue.length === 0) return;
        queue.forEach(item => databaseInstance.ref(item.path).set(item.data));
        localStorage.removeItem('survey_offline_sync_queue');
      }
    };

    function exportCleanPdfAndWhatsApp(elementId, filename, textMessage) {
      let targetPhone = window.prompt("أدخل رقم هاتف المستلم (أو اتركه فارغاً لاختيار المحادثة مباشرة في واتساب):", "");
      if (targetPhone === null) return;
      targetPhone = targetPhone.replace(/[^0-9]/g, '');
      if (targetPhone.startsWith('01')) targetPhone = '20' + targetPhone.substring(1);

      const element = document.getElementById(elementId);
      if (!element || typeof html2pdf === 'undefined') {
        const url = targetPhone ? `https://wa.me/${targetPhone}?text=${encodeURIComponent(textMessage)}` : `https://wa.me/?text=${encodeURIComponent(textMessage)}`;
        window.open(url, '_blank');
        return;
      }

      const prevWidth = element.style.width; const prevMaxWidth = element.style.maxWidth; const prevPadding = element.style.padding;
      element.style.width = '800px'; element.style.maxWidth = '800px'; element.style.padding = '24px'; element.classList.add('pdf-render-mode');
      const opt = { margin: [8, 8, 8, 8], filename: filename || 'مستخلص.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true, logging: false, windowWidth: 1200, scrollX: 0, scrollY: 0 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
      
      html2pdf().set(opt).from(element).save().then(() => {
        element.style.width = prevWidth; element.style.maxWidth = prevMaxWidth; element.style.padding = prevPadding; element.classList.remove('pdf-render-mode');
        const url = targetPhone ? `https://wa.me/${targetPhone}?text=${encodeURIComponent(textMessage)}` : `https://wa.me/?text=${encodeURIComponent(textMessage)}`;
        window.open(url, '_blank');
      }).catch((err) => {
        element.style.width = prevWidth; element.style.maxWidth = prevMaxWidth; element.style.padding = prevPadding; element.classList.remove('pdf-render-mode');
        console.error(err);
        const url = targetPhone ? `https://wa.me/${targetPhone}?text=${encodeURIComponent(textMessage)}` : `https://wa.me/?text=${encodeURIComponent(textMessage)}`;
        window.open(url, '_blank');
      });
    }

    function DashboardCharts({ operations }) {
      const chart1Ref = useRef(null); const chart2Ref = useRef(null); const chart1Instance = useRef(null); const chart2Instance = useRef(null);

      const stats = useMemo(() => {
        let rtkCount = 0; let sketchCount = 0; let otherCount = 0; let monthlyRevenue = {};
        operations.forEach(o => {
          const t = String(o?.opType || '');
          if (t.includes('RTK')) rtkCount++; else if (t.includes('كروكي') || t.includes('قياس') || o?.isSketch) sketchCount++; else otherCount++;
          const m = String(o?.date || '').substring(0, 7) || 'غير محدد';
          monthlyRevenue[m] = (monthlyRevenue[m] || 0) + parseNum(o?.agreedAmount);
        });
        const months = Object.keys(monthlyRevenue).sort().slice(-6); const revenues = months.map(m => monthlyRevenue[m]);
        return { rtkCount, sketchCount, otherCount, months, revenues };
      }, [operations]);

      useEffect(() => {
        if (typeof Chart === 'undefined') return;
        if (chart1Instance.current) chart1Instance.current.destroy(); if (chart2Instance.current) chart2Instance.current.destroy();
        if (chart1Ref.current) {
          chart1Instance.current = new Chart(chart1Ref.current, {
            type: 'bar',
            data: { labels: stats.months.length ? stats.months : ['لا توجد بيانات'], datasets: [{ label: 'قيمة الأعمال الشهرية (ج.م)', data: stats.revenues.length ? stats.revenues : [0], backgroundColor: '#6366f1', borderRadius: 8 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
          });
        }
        if (chart2Ref.current) {
          chart2Instance.current = new Chart(chart2Ref.current, {
            type: 'doughnut',
            data: { labels: ['أعمال جهاز RTK', 'قياس وكروكيات', 'أعمال مساحية أخرى'], datasets: [{ data: [stats.rtkCount, stats.sketchCount, stats.otherCount], backgroundColor: ['#4f46e5', '#f59e0b', '#10b981'] }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10, family: 'Cairo' } } } } }
          });
        }
        return () => { if (chart1Instance.current) chart1Instance.current.destroy(); if (chart2Instance.current) chart2Instance.current.destroy(); };
      }, [stats]);

      return (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div className="bg-white dark:bg-slate-800 p-4 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-xs h-72 flex flex-col">
            <h4 className="font-bold text-xs text-slate-700 dark:text-slate-300 mb-2 text-center">📈 تطور قيمة الأعمال لآخر 6 شهور</h4>
            <div className="relative w-full flex-1 min-h-0"><canvas ref={chart1Ref}></canvas></div>
          </div>

            <h4 className="font-bold text-xs text-slate-700 dark:text-slate-300 mb-2 text-center">📊 نسبة وتوزيع الأعمال (RTK / كروكيات)</h4>
            <div className="relative w-full flex-1 min-h-0"><canvas ref={chart2Ref}></canvas></div>
          </div>
        </div>
      );
    }

    function App() {

      const [user, setUser] = useState(null);

      }, []);

      useEffect(() => {

        else document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', settings.theme);
      }, [settings.theme]);

      useEffect(() => {
        if (!auth) { setAuthLoading(false); return; }
        const safetyTimer = setTimeout(() => { setAuthLoading(false); }, 6000);

        const unsubscribe = auth.onAuthStateChanged((curr) => {

          const d = snap.val() || {};
          if (d.operations) { const arr = toArr(d.operations).reverse(); setOperations(arr); offlineStorage.set('operations', arr); }

        ref.on('value', handleData);

          else if (selectedType.includes('1/2') || selectedType.includes('نص')) { defaultAmount = 3250; defaultMethod = "auto"; } 
          else { defaultMethod = "percent80"; }
          return { ...prev, opType: selectedType, engCalcMethod: defaultMethod, agreedAmount: prev.isFaddan ? (parseNum(prev.faddanQty) * parseNum(prev.faddanPrice)) : defaultAmount };

          const updatedList = [...currentList, cleanVal]; const newSettings = { ...settings, [key]: updatedList };
          setSettings(newSettings); saveListSafely('settings', 'settings', newSettings);
          if (key === 'opTypes') handleOpTypeChange(cleanVal); else if (key === 'engineers') setNewOp(prev => ({ ...prev, engineer: cleanVal }));

      function calculateOperationShares(op) {
        if (!op) return { engFee: 0, eng1Fee: 0, eng2Fee: 0, deviceFee: 0, officeFee: 0, totalExpenses: 0 };
        const total = parseNum(op.agreedAmount); const labor = parseNum(op.laborCost); const car = parseNum(op.carCost);
        const totalExpenses = labor + car; const type = String(op.opType || ''); const method = op.engCalcMethod || 'auto';
        let engFee = 0, deviceFee = 0, officeFee = 0;
        const isEngDayDevHalf = method === 'engDay_devHalf' || type.includes('مهندس يوم + جهاز نصف يوم');
        const isHalfRtk = !isEngDayDevHalf && (type.includes('1/2') || type.includes('نص') || type.includes('نصف'));
        const isFullRtk = !isEngDayDevHalf && (type.includes('يوم RTK') || (type.includes('RTK') && !isHalfRtk));

        if (isEngDayDevHalf || isHalfRtk) deviceFee = 1750; else if (isFullRtk) deviceFee = 3500; else deviceFee = 0;

        if (isEngDayDevHalf) engFee = 2000;
        else if (method === 'percent80') engFee = total * 0.80;
        else if (method === 'percent70') engFee = total * 0.70;
        else if (method === 'customPercent') engFee = total * ((parseNum(op.engCustomPercent) || 80) / 100);
        else if (method === 'customFixed') engFee = parseNum(op.engCustomFixedAmount) || 0;
        else { if (isHalfRtk) engFee = 1500; else if (isFullRtk) engFee = 2000; else engFee = total * 0.80; }

        officeFee = Math.max(0, total - engFee - deviceFee - totalExpenses);
        const isShared = Boolean(op.hasSecondEngineer); const eng1Fee = isShared ? (engFee / 2) : engFee; const eng2Fee = isShared ? (engFee / 2) : 0;
        return { engFee: Number(engFee) || 0, eng1Fee: Number(eng1Fee) || 0, eng2Fee: Number(eng2Fee) || 0, deviceFee: Number(deviceFee) || 0, officeFee: Number(officeFee) || 0, totalExpenses: Number(totalExpenses) || 0 };
      }

                      <button type="button" onClick={()=>setNewOp({...newOp, engCalcMethod: 'auto'})} className={`p-2 rounded-xl border font-bold text-center transition ${newOp.engCalcMethod === 'auto' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200'}`}>⚡ تلقائي</button>
                      <button type="button" onClick={()=>setNewOp({...newOp, engCalcMethod: 'engDay_devHalf'})} className={`p-2 rounded-xl border font-bold text-center transition ${newOp.engCalcMethod === 'engDay_devHalf' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200'}`}>🛰 مهندس يوم + جهاز 1/2</button>
                      <button type="button" onClick={()=>setNewOp({...newOp, engCalcMethod: 'percent80'})} className={`p-2 rounded-xl border font-bold text-center transition ${newOp.engCalcMethod === 'percent80' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200'}`}>🎯 نسبة 80% مهندس</button>
                      <button type="button" onClick={()=>setNewOp({...newOp, engCalcMethod: 'percent70'})} className={`p-2 rounded-xl border font-bold text-center transition ${newOp.engCalcMethod === 'percent70' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200'}`}>🎯 نسبة 70% مهندس</button>
                      <button type="button" onClick={()=>setNewOp({...newOp, engCalcMethod: 'customFixed'})} className={`p-2 rounded-xl border font-bold text-center transition ${newOp.engCalcMethod === 'customFixed' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200'}`}>💵 مبلغ مقطوع ثابت</button>
                    </div>
                    {newOp.engCalcMethod === 'customFixed' && (
                      <div className="pt-1"><label className="block text-[10px] text-slate-600 dark:text-slate-300 mb-1">أدخل مبلغ أتعاب المهندس المقطوع (ج.م):</label><input type="number" step="any" value={newOp.engCustomFixedAmount} onChange={e=>setNewOp({...newOp, engCustomFixedAmount: e.target.value})} className="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-800 bg-white font-bold text-emerald-600" /></div>
                    )}
                  </div>

                  <div className="grid grid-cols-2 gap-2 pt-1">
                    <div>مصاريف عمالة <input type="number" value={newOp.laborCost} onChange={e=>setNewOp({...newOp, laborCost: e.target.value})} className="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-700"/></div>
                    <div>مصاريف سيارة <input type="number" value={newOp.carCost} onChange={e=>setNewOp({...newOp, carCost: e.target.value})} className="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-700"/></div>
                  </div>

                  <div>المحصل فوراً في الموقع (إن وجد) <input type="number" value={newOp.paidNow} onChange={e=>setNewOp({...newOp, paidNow: e.target.value})} className="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-700"/></div>

                  <div className="p-2.5 bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-800 rounded-xl text-[11px] text-emerald-900 dark:text-emerald-300 font-bold space-y-0.5">
                    <div className="flex justify-between"><span>👷 أتعاب المهندس: <strong>{(livePreview.engFee || 0).toLocaleString()} ج.م</strong></span><span>🛰 حصة الجهاز: <strong>{(livePreview.deviceFee || 0).toLocaleString()} ج.م</strong></span></div>
                    <div className="flex justify-between text-rose-600 dark:text-rose-400 pt-1 border-t border-emerald-200 dark:border-emerald-800/50 mt-1"><span>🚗 مصاريف (عمالة+سيارة): <strong>{(liveExpenses.totalExp || 0).toLocaleString()} ج.م</strong></span><span>🏢 صافي المكتب: <strong>{(livePreview.officeFee || 0).toLocaleString()} ج.م</strong></span></div>
                  </div>
                  <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-2xl font-black mt-2 shadow-sm">{editingOp ? 'حفظ التعديلات' : 'حفظ الطلعة اليومية'}</button>
                </form>
              </div>
            </div>
          )}

          {payModalOpen && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 print-hidden">
              <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs" onClick={()=>setPayModalOpen(false)}></div>
              <div className="relative bg-white dark:bg-slate-800 w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl z-50">
                <div className="flex justify-between items-center border-b dark:border-slate-700 pb-3 mb-3">
                  <h3 className="font-black text-sm">💰 تسجيل دفعة مسددة من العميل</h3>
                  <button onClick={()=>setPayModalOpen(false)} className="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
                </div>
                <form onSubmit={handleAddPayment} className="space-y-3 text-xs font-bold">
                  <div>التاريخ <input type="date" value={newPayment.date} onChange={e=>setNewPayment({...newPayment, date: e.target.value})} className="w-full border dark:border-slate-600 p-2.5 rounded-xl dark:bg-slate-700 mt-1" required/></div>
                  <div>العميل 
                    <select value={newPayment.clientName} onChange={e=>setNewPayment({...newPayment, clientName: e.target.value})} className="w-full border dark:border-slate-600 p-2.5 rounded-xl dark:bg-slate-700 mt-1" required>
                      <option value="">-- اختر العميل --</option>
                      {clientNames.map(c=><option key={c}>{c}</option>)}
                    </select>
                  </div>
                  <div>المبلغ المسدد <input type="number" value={newPayment.amount} onChange={e=>setNewPayment({...newPayment, amount: e.target.value})} className="w-full border dark:border-slate-600 p-2.5 rounded-xl dark:bg-slate-700 mt-1 text-emerald-600 font-black text-sm" required/></div>
                  <div>البيان / الملاحظات <input type="text" value={newPayment.notes} onChange={e=>setNewPayment({...newPayment, notes: e.target.value})} className="w-full border dark:border-slate-600 p-2.5 rounded-xl dark:bg-slate-700 mt-1"/></div>
                  <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-2xl font-black mt-2 shadow-sm">قيد الدفعة في الحساب</button>
                </form>
              </div>
            </div>
          )}

          <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-800 border-t dark:border-slate-700 px-2 py-1.5 flex justify-around items-center z-40 shadow-lg print-hidden">
            <button onClick={()=>setActiveTab('dashboard')} className={`flex flex-col items-center py-1 px-2 rounded-xl transition ${activeTab==='dashboard'?'text-indigo-600 dark:text-indigo-400 font-black':'text-slate-500'}`}><span className="text-base">📊</span><span className="text-[9px] mt-0.5">الرئيسية</span></button>
            <button onClick={()=>setActiveTab('extracts')} className={`flex flex-col items-center py-1 px-2 rounded-xl transition ${activeTab==='extracts'?'text-indigo-600 dark:text-indigo-400 font-black':'text-slate-500'}`}><span className="text-base">📄</span><span className="text-[9px] mt-0.5">المستخلص</span></button>
            <button onClick={()=>setActiveTab('operations')} className={`flex flex-col items-center py-1 px-2 rounded-xl transition ${activeTab==='operations'?'text-indigo-600 dark:text-indigo-400 font-black':'text-slate-500'}`}><span className="text-base">📐</span><span className="text-[9px] mt-0.5">الطلعات</span></button>
            <button onClick={()=>setActiveTab('vault')} className={`flex flex-col items-center py-1 px-2 rounded-xl transition ${activeTab==='vault'?'text-indigo-600 dark:text-indigo-400 font-black':'text-slate-500'}`}><span className="text-base">💵</span><span className="text-[9px] mt-0.5">الخزينة</span></button>
            <button onClick={()=>setDrawerOpen(true)} className="flex flex-col items-center py-1 px-2 text-slate-500"><span className="text-base">☰</span><span className="text-[9px] mt-0.5">المزيد</span></button>
          </nav>

          {toast.show && <div className="fixed bottom-16 md:bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 px-5 py-3 rounded-2xl text-xs z-50 shadow-2xl font-bold print-hidden toast-anim flex items-center gap-2">
            <span>{toast.type === 'error' ? '⚠️' : '✅'}</span>
            <span>{toast.message}</span>
          </div>}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
