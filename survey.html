  <!-- Service Worker مدمج وآمن بالكامل لمنع ظهور شاشة You're offline ولضمان العمل بدون إنترنت -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          const CACHE_NAME = 'survey-erp-offline-v4';
          self.addEventListener('install', (e) => { self.skipWaiting(); });
          self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });
          self.addEventListener('fetch', (e) => {
            if (e.request.method !== 'GET') return;
            e.respondWith(
              caches.match(e.request).then((cachedResponse) => {
                if (cachedResponse) return cachedResponse;
                return fetch(e.request).then((networkResponse) => {
                  if (networkResponse && networkResponse.status === 200) {
                    const responseClone = networkResponse.clone();
                    caches.open(CACHE_NAME).then((cache) => cache.put(e.request, responseClone));
                  }
                  return networkResponse;
                }).catch(() => caches.match(e.request));
              })
            );
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch((err) => console.log('SW init error:', err));
      });
    }
  </script>
