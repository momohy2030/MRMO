<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام إدارة الأعمال المساحية - SURVEY ERP</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-database-compat.js"></script>

  <meta name="theme-color" content="#0f172a">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    @media print {
      body { background-color: white !important; font-size: 11px; }
      .print-hidden { display: none !important; }
      .print-area { box-shadow: none !important; border: none !important; width: 100% !important; margin: 0 !important; }
    }
  </style>
</head>
<body class="text-slate-800 antialiased select-none sm:select-auto">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyDHjQTNfAh3wQ8tSOXOIewJNXaDCHADrR8",
      authDomain: "mrmo-d8760.firebaseapp.com",
      databaseURL: "https://mrmo-d8760-default-rtdb.firebaseio.com",
      projectId: "mrmo-d8760",
      storageBucket: "mrmo-d8760.firebasestorage.app",
      messagingSenderId: "510855132508",
      appId: "1:510855132508:web:feee377429a2d88c277d99",
      measurementId: "G-N9DW5R28H0"
    };

    const DIRECTOR_EMAILS = ["mohamedmohy676676@gmail.com", "+201000000000"];
    const ENGINEER_EMAILS = ["mesahaforconsultant@gmail.com"];

    let db = null;
    let auth = null;
    try {
      if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
      db = firebase.database();
      auth = firebase.auth();
      auth.languageCode = 'ar';
    } catch (e) { console.error(e); }

    const parseNum = (val) => {
      if (typeof val === "number") return isNaN(val) ? 0 : val;
      if (!val) return 0;
      const clean = String(val).replace(/,/g, '').replace(/،/g, '.').trim();
      const n = parseFloat(clean);
      return isNaN(n) ? 0 : n;
    };

    function App() {
      const [user, setUser] = useState(null);
      const [canEditOrDelete, setCanEditOrDelete] = useState(false);
      const [authLoading, setAuthLoading] = useState(true);

      const [activeTab, setActiveTab] = useState("dashboard");
      const [operations, setOperations] = useState([]);
      const [transactions, setTransactions] = useState([]);
      const [toast, setToast] = useState({ show: false, message: "" });
      const [editItemData, setEditItemData] = useState(null);

      const todayDate = new Date().toISOString().split('T')[0];

      const [newOp, setNewOp] = useState({
        date: todayDate,
        clientName: "",
        opType: "rtk_full",
        engineerName: "م. محمد",
        sketchesCount: 1,
        totalPrice: 6500,
        paidAmount: 0,
        laborCost: 0,
        carCost: 0,
        notes: ""
      });

      const [newTx, setNewTx] = useState({
        date: todayDate,
        type: "income",
        clientOrEntity: "",
        category: "تحصيل من عميل",
        amount: "",
        paymentMethod: "كاش",
        notes: ""
      });

      const showToast = (message) => {
        setToast({ show: true, message });
        setTimeout(() => setToast({ show: false, message: "" }), 3000);
      };

      useEffect(() => {
        if (!auth) { setAuthLoading(false); return; }
        return auth.onAuthStateChanged((curr) => {
          if (curr) {
            const email = (curr.email || "").toLowerCase();
            const authorized = DIRECTOR_EMAILS.some(e => email.includes(e.toLowerCase())) || ENGINEER_EMAILS.some(e => email.includes(e.toLowerCase()));
            setUser(curr);
            setCanEditOrDelete(authorized);
          } else {
            setUser(null);
            setCanEditOrDelete(false);
          }
          setAuthLoading(false);
        });
      }, []);

      useEffect(() => {
        if (!db) return;
        const ref = db.ref('survey_data');
        ref.on('value', (snap) => {
          const data = snap.val() || {};
          const toArr = (v) => (v ? (Array.isArray(v) ? v : Object.values(v)) : []);
          setOperations(toArr(data.operations).reverse());
          setTransactions(toArr(data.transactions).reverse());
        });
      }, []);

      const calculateShares = (op) => {
        const total = parseNum(op.totalPrice);
        const opType = op.opType;
        let engFee = 0;
        let deviceFee = 0;
        let officeFee = 0;

        if (opType === "rtk_full") {
          engFee = 2000;
          deviceFee = 3500;
          officeFee = Math.max(0, total - engFee - deviceFee - parseNum(op.laborCost) - parseNum(op.carCost));
        } else if (opType === "rtk_half") {
          engFee = 1500;
          deviceFee = 1750;
          officeFee = Math.max(0, total - engFee - deviceFee - parseNum(op.laborCost) - parseNum(op.carCost));
        } else {
          officeFee = total * 0.20;
          engFee = total * 0.80;
          deviceFee = 0;
        }

        const mandourShare = deviceFee * 0.50;
        const deviceTrioTotal = deviceFee * 0.50;
        const perPartnerDevice = deviceTrioTotal / 3;

        const charityShare = officeFee * 0.10;
        const ahmedShare = officeFee * 0.10;
        const officeTrioTotal = officeFee * 0.80;
        const perPartnerOffice = officeTrioTotal / 3;

        return {
          engFee,
          deviceFee,
          officeFee,
          mandour: mandourShare,
          ahmed: ahmedShare,
          charity: charityShare,
          alaa: perPartnerDevice + perPartnerOffice,
          ayman: perPartnerDevice + perPartnerOffice,
          osama: perPartnerDevice + perPartnerOffice
        };
      };

      const handleAddOperation = (e) => {
        e.preventDefault();
        if (!newOp.clientName || parseNum(newOp.totalPrice) <= 0) return;
        const shares = calculateShares(newOp);
        const newItem = {
          id: Date.now(),
          ...newOp,
          totalPrice: parseNum(newOp.totalPrice),
          paidAmount: parseNum(newOp.paidAmount),
          laborCost: parseNum(newOp.laborCost),
          carCost: parseNum(newOp.carCost),
          sketchesCount: parseInt(newOp.sketchesCount) || 1,
          shares,
          createdBy: user.displayName || user.email || "المستخدم"
        };

        const updated = [newItem, ...operations];
        setOperations(updated);
        if (db) db.ref('survey_data/operations').set(updated);

        if (parseNum(newOp.paidAmount) > 0) {
          const autoTx = {
            id: Date.now() + 1,
            date: newOp.date,
            type: "income",
            clientOrEntity: newOp.clientName,
            category: "دفعة مقدمة لعملية مساحية",
            amount: parseNum(newOp.paidAmount),
            paymentMethod: "كاش",
            notes: `تحصيل مباشر لعملية (${newOp.opType})`
          };
          const updatedTx = [autoTx, ...transactions];
          setTransactions(updatedTx);
          if (db) db.ref('survey_data/transactions').set(updatedTx);
        }

        setNewOp({ ...newOp, clientName: "", totalPrice: 6500, paidAmount: 0, laborCost: 0, carCost: 0, notes: "" });
        showToast("تم تسجيل العملية وتوزيع الحصص بنجاح! 📐");
      };

      const handleAddTransaction = (e) => {
        e.preventDefault();
        if (parseNum(newTx.amount) <= 0) return;
        const newItem = {
          id: Date.now(),
          ...newTx,
          amount: parseNum(newTx.amount),
          createdBy: user.displayName || user.email || "المستخدم"
        };
        const updated = [newItem, ...transactions];
        setTransactions(updated);
        if (db) db.ref('survey_data/transactions').set(updated);
        setNewTx({ ...newTx, amount: "", clientOrEntity: "", notes: "" });
        showToast("تم تسجيل الحركة النقدية في الخزينة! 💵");
      };

      const deleteItem = (path, id, list, setter) => {
        if (!canEditOrDelete) { showToast("الحذف مصرح للإدارة فقط 🔒"); return; }
        if (window.confirm("هل أنت متأكد من الحذف النهائي؟")) {
          const updated = list.filter(item => item.id !== id);
          setter(updated);
          if (db) db.ref(`survey_data/${path}`).set(updated);
          showToast("تم الحذف بنجاح! 🗑️");
        }
      };

      const handleSaveEditedItem = (e) => {
        e.preventDefault();
        if (!canEditOrDelete || !editItemData) return;
        const { type, data } = editItemData;

        if (type === 'operation') {
          const shares = calculateShares(data);
          const updatedData = {
            ...data,
            totalPrice: parseNum(data.totalPrice),
            paidAmount: parseNum(data.paidAmount),
            laborCost: parseNum(data.laborCost),
            carCost: parseNum(data.carCost),
            sketchesCount: parseInt(data.sketchesCount) || 1,
            shares
          };
          const updated = operations.map(it => it.id === data.id ? updatedData : it);
          setOperations(updated);
          if (db) db.ref('survey_data/operations').set(updated);
        } else if (type === 'transaction') {
          const updatedData = { ...data, amount: parseNum(data.amount) };
          const updated = transactions.map(it => it.id === data.id ? updatedData : it);
          setTransactions(updated);
          if (db) db.ref('survey_data/transactions').set(updated);
        }

        setEditItemData(null);
        showToast("تم حفظ التعديلات بنجاح! ✏️");
      };

      const clientMatrix = useMemo(() => {
        const map = {};
        operations.forEach(op => {
          const c = (op.clientName || 'عميل عام').trim();
          if (!map[c]) {
            map[c] = { name: c, rtkFull: 0, rtkHalf: 0, sketchMeas: 0, totalSketches: 0, totalBilled: 0, totalPaid: 0 };
          }
          if (op.opType === "rtk_full") map[c].rtkFull += 1;
          if (op.opType === "rtk_half") map[c].rtkHalf += 1;
          if (op.opType === "sketch_meas") map[c].sketchMeas += 1;
          map[c].totalSketches += (parseInt(op.sketchesCount) || 1);
          map[c].totalBilled += parseNum(op.totalPrice);
          map[c].totalPaid += parseNum(op.paidAmount);
        });

        transactions.filter(t => t.type === 'income').forEach(t => {
          const c = (t.clientOrEntity || '').trim();
          if (map[c]) {
            if (!t.category?.includes("دفعة مقدمة لعملية مساحية")) {
              map[c].totalPaid += parseNum(t.amount);
            }
          }
        });

        return Object.values(map);
      }, [operations, transactions]);

      const totalCashIn = transactions.filter(t => t.type === 'income').reduce((acc, t) => acc + parseNum(t.amount), 0);
      const totalCashOut = transactions.filter(t => t.type === 'expense').reduce((acc, t) => acc + parseNum(t.amount), 0);
      const currentVaultBalance = totalCashIn - totalCashOut;

      const partnerWallets = useMemo(() => {
        const w = { mandour: 0, ahmed: 0, charity: 0, alaa: 0, ayman: 0, osama: 0, totalEngineers: 0 };
        operations.forEach(op => {
          const s = op.shares || calculateShares(op);
          w.mandour += (s.mandour || 0);
          w.ahmed += (s.ahmed || 0);
          w.charity += (s.charity || 0);
          w.alaa += (s.alaa || 0);
          w.ayman += (s.ayman || 0);
          w.osama += (s.osama || 0);
          w.totalEngineers += (s.engFee || 0);
        });
        return w;
      }, [operations]);

      if (authLoading) return <div class="min-h-screen flex items-center justify-center bg-slate-900 text-white font-bold">جاري تحميل نظام المساحة... ⏳</div>;

      if (!user) {
        return (
          <div class="min-h-screen flex items-center justify-center bg-slate-900 p-4">
            <div class="bg-white p-8 rounded-3xl max-w-sm w-full text-center shadow-2xl">
              <div class="text-4xl mb-2">📐</div>
              <h2 class="text-xl font-black text-slate-800">نظام إدارة المساحة</h2>
              <p class="text-xs text-slate-500 mb-6">MOMOHY SURVEY ERP</p>
              <button onClick={() => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())} class="w-full bg-slate-900 hover:bg-black text-white py-3 rounded-2xl font-bold text-xs transition shadow-md">
                الدخول عبر حساب Google
              </button>
            </div>
          </div>
        );
      }

      return (
        <div class="min-h-screen pb-20">
          <header class="bg-slate-900 text-white p-3.5 sticky top-0 z-30 shadow flex justify-between items-center text-xs">
            <div class="flex items-center gap-2">
              <span class="text-xl">📐</span>
              <div>
                <h1 class="font-black text-sm">مساحة ERP</h1>
                <span class="text-[10px] text-slate-400">{canEditOrDelete ? "👑 مدير النظام / مهندس المشاريع" : "موظف"}</span>
              </div>
            </div>
            <div class="flex items-center gap-1.5 overflow-x-auto scrollbar-hide">
              <a href="/" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-xl font-bold flex items-center gap-1 shadow-sm transition whitespace-nowrap">
                🏗️ <span class="hidden sm:inline">قطاع الإنشاءات</span>
              </a>
              <button onClick={()=>setActiveTab('dashboard')} class={`px-3 py-1.5 rounded-xl font-bold whitespace-nowrap ${activeTab==='dashboard'?'bg-indigo-600 text-white':'bg-slate-800 text-slate-300'}`}>📊 لوحة التحكم</button>
              <button onClick={()=>setActiveTab('new_op')} class={`px-3 py-1.5 rounded-xl font-bold whitespace-nowrap ${activeTab==='new_op'?'bg-indigo-600 text-white':'bg-slate-800 text-slate-300'}`}>➕ عملية مساحية</button>
              <button onClick={()=>setActiveTab('cash')} class={`px-3 py-1.5 rounded-xl font-bold whitespace-nowrap ${activeTab==='cash'?'bg-indigo-600 text-white':'bg-slate-800 text-slate-300'}`}>💵 الخزينة والتصفية</button>
              <button onClick={()=>setActiveTab('partners')} class={`px-3 py-1.5 rounded-xl font-bold whitespace-nowrap ${activeTab==='partners'?'bg-indigo-600 text-white':'bg-slate-800 text-slate-300'}`}>🤝 محفظة الشركاء</button>
            </div>
          </header>

          <main class="max-w-7xl mx-auto px-4 mt-4">
            {/* 1. لوحة التحكم ومصفوفة العملاء */}
            {activeTab === 'dashboard' && (
              <div class="space-y-4">
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
                  <div class="bg-white p-3.5 rounded-2xl border shadow-sm"><span class="text-slate-400 font-bold block text-[10px]">إجمالي الواردات (التحصيلات)</span><strong class="text-emerald-600 text-base font-black">{totalCashIn.toLocaleString()} ج.م</strong></div>
                  <div class="bg-white p-3.5 rounded-2xl border shadow-sm"><span class="text-slate-400 font-bold block text-[10px]">إجمالي المصاريف الحقلية</span><strong class="text-rose-600 text-base font-black">{totalCashOut.toLocaleString()} ج.م</strong></div>
                  <div class="bg-indigo-50 border border-indigo-200 p-3.5 rounded-2xl shadow-sm"><span class="text-indigo-800 font-bold block text-[10px]">صافي سيولة الخزينة الحالية</span><strong class="text-indigo-900 text-lg font-black">{currentVaultBalance.toLocaleString()} ج.م</strong></div>
                  <div class="bg-amber-50 border border-amber-200 p-3.5 rounded-2xl shadow-sm"><span class="text-amber-800 font-bold block text-[10px]">صندوق الخير (لوجه الله)</span><strong class="text-amber-900 text-base font-black">{Math.round(partnerWallets.charity).toLocaleString()} ج.م</strong></div>
                </div>

                <div class="bg-white p-4 rounded-2xl border shadow-sm text-xs">
                  <h3 class="font-black text-slate-800 text-sm mb-3 border-b pb-2 flex items-center justify-between">
                    <span>👥 مصفوفة الأعمال والتحصيلات لكل عميل</span>
                    <span class="text-[11px] text-slate-400 font-normal">عدد العملاء: {clientMatrix.length}</span>
                  </h3>
                  <div class="overflow-x-auto">
                    <table class="w-full text-right border-collapse">
                      <thead>
                        <tr class="bg-slate-100 text-slate-700 border-b">
                          <th class="p-2.5">اسم العميل</th>
                          <th class="p-2.5 text-center">أيام RTK كاملة</th>
                          <th class="p-2.5 text-center">نصف يوم RTK</th>
                          <th class="p-2.5 text-center">قياس وكروكي</th>
                          <th class="p-2.5 text-center">إجمالي الكروكيات</th>
                          <th class="p-2.5 text-center">إجمالي الأعمال</th>
                          <th class="p-2.5 text-center text-emerald-700">المسدد</th>
                          <th class="p-2.5 text-center text-rose-700">المتبقي (مديونية)</th>
                        </tr>
                      </thead>
                      <tbody>
                        {clientMatrix.length === 0 ? <tr><td colSpan={8} class="text-center p-4 text-slate-400">لا توجد عمليات مسجلة بعد</td></tr> :
                        clientMatrix.map((c, i) => {
                          const due = c.totalBilled - c.totalPaid;
                          return (
                            <tr key={i} class="border-b hover:bg-slate-50">
                              <td class="p-2.5 font-bold text-slate-900">{c.name}</td>
                              <td class="p-2.5 text-center font-bold text-indigo-700">{c.rtkFull}</td>
                              <td class="p-2.5 text-center font-bold text-blue-600">{c.rtkHalf}</td>
                              <td class="p-2.5 text-center font-bold text-slate-700">{c.sketchMeas}</td>
                              <td class="p-2.5 text-center font-black bg-slate-50">{c.totalSketches}</td>
                              <td class="p-2.5 text-center font-bold">{c.totalBilled.toLocaleString()} ج.م</td>
                              <td class="p-2.5 text-center font-bold text-emerald-600">{c.totalPaid.toLocaleString()} ج.م</td>
                              <td class={`p-2.5 text-center font-black ${due > 0 ? 'text-rose-600 bg-rose-50' : 'text-slate-400'}`}>
                                {due > 0 ? `${due.toLocaleString()} ج.م` : 'خالص'}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* 2. تسجيل عملية مساحية */}
            {activeTab === 'new_op' && (
              <div class="space-y-4">
                <div class="bg-white p-5 rounded-2xl border shadow-sm text-xs">
                  <h3 class="font-black text-slate-800 text-sm mb-3 border-b pb-2">📐 تسجيل طلعة وعملية مساحية جديدة</h3>
                  <form onSubmit={handleAddOperation} class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                    <div>
                      <label class="block font-bold mb-1">التاريخ</label>
                      <input type="date" value={newOp.date} onChange={e=>setNewOp({...newOp, date: e.target.value})} class="w-full border p-2 rounded-xl bg-slate-50" required/>
                    </div>
                    <div>
                      <label class="block font-bold mb-1">اسم العميل</label>
                      <input type="text" value={newOp.clientName} onChange={e=>setNewOp({...newOp, clientName: e.target.value})} placeholder="مثال: شركة النيل للتطوير" class="w-full border p-2 rounded-xl font-bold" required/>
                    </div>
                    <div>
                      <label class="block font-bold mb-1 text-indigo-700">نوع العمل</label>
                      <select value={newOp.opType} onChange={e=>{
                        const val = e.target.value;
                        let defaultP = 6500;
                        if(val === 'rtk_half') defaultP = 4000;
                        if(val === 'sketch_meas') defaultP = 2500;
                        setNewOp({...newOp, opType: val, totalPrice: defaultP});
                      }} class="w-full border p-2 rounded-xl font-bold bg-indigo-50">
                        <option value="rtk_full">يوم جهاز RTK كامل (مهندس 2000 | جهاز 3500)</option>
                        <option value="rtk_half">نصف يوم جهاز RTK (مهندس 1500 | جهاز 1750)</option>
                        <option value="sketch_meas">قياس وكروكي (مهندس 80% | مكتب 20%)</option>
                      </select>
                    </div>
                    <div>
                      <label class="block font-bold mb-1">المهندس القائم بالعمل</label>
                      <input type="text" value={newOp.engineerName} onChange={e=>setNewOp({...newOp, engineerName: e.target.value})} class="w-full border p-2 rounded-xl" required/>
                    </div>
                    <div>
                      <label class="block font-bold mb-1">عدد الكروكيات المستخرجة</label>
                      <input type="number" value={newOp.sketchesCount} onChange={e=>setNewOp({...newOp, sketchesCount: e.target.value})} class="w-full border p-2 rounded-xl font-bold" min="1"/>
                    </div>
                    <div>
                      <label class="block font-bold mb-1 text-emerald-700">المبلغ الإجمالي المتفق عليه (ج.م)</label>
                      <input type="number" value={newOp.totalPrice} onChange={e=>setNewOp({...newOp, totalPrice: e.target.value})} class="w-full border p-2 rounded-xl font-black text-emerald-700 bg-emerald-50" required/>
                    </div>
                    <div>
                      <label class="block font-bold mb-1">المدفوع فوراً من العميل (تحصيل مقدم)</label>
                      <input type="number" value={newOp.paidAmount} onChange={e=>setNewOp({...newOp, paidAmount: e.target.value})} class="w-full border p-2 rounded-xl font-bold"/>
                    </div>
                    <div>
                      <label class="block font-bold mb-1 text-rose-700">مصاريف العمالة والسيارة</label>
                      <div class="grid grid-cols-2 gap-1">
                        <input type="number" placeholder="عمال" value={newOp.laborCost} onChange={e=>setNewOp({...newOp, laborCost: e.target.value})} class="border p-2 rounded-xl"/>
                        <input type="number" placeholder="سيارة" value={newOp.carCost} onChange={e=>setNewOp({...newOp, carCost: e.target.value})} class="border p-2 rounded-xl"/>
                      </div>
                    </div>
                    <div class="sm:col-span-4">
                      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-3 rounded-xl shadow transition">
                        حفظ العملية وتوزيع الأرباح آلياً
                      </button>
                    </div>
                  </form>
                </div>

                <div class="bg-white p-4 rounded-2xl border shadow-sm text-xs overflow-x-auto">
                  <h4 class="font-bold text-slate-800 mb-2">سجل العمليات المساحية:</h4>
                  <table class="w-full text-right border-collapse">
                    <thead>
                      <tr class="bg-slate-100 text-slate-700 border-b">
                        <th class="p-2">التاريخ</th>
                        <th class="p-2">العميل</th>
                        <th class="p-2">النوع</th>
                        <th class="p-2">المهندس</th>
                        <th class="p-2 text-center">الإجمالي</th>
                        <th class="p-2 text-center">أتعاب المهندس</th>
                        <th class="p-2 text-center">حصة الجهاز</th>
                        <th class="p-2 text-center">حصة المكتب</th>
                        {canEditOrDelete && <th class="p-2 text-center bg-slate-200 font-black sticky left-0 z-10 shadow-xs">إجراءات</th>}
                      </tr>
                    </thead>
                    <tbody>
                      {operations.map(op => {
                        const s = op.shares || calculateShares(op);
                        return (
                          <tr key={op.id} class="border-b hover:bg-slate-50">
                            <td class="p-2 text-slate-600 whitespace-nowrap">{op.date}</td>
                            <td class="p-2 font-bold">{op.clientName}</td>
                            <td class="p-2"><span class="px-2 py-0.5 rounded text-[10px] bg-indigo-50 text-indigo-700 font-bold">{op.opType}</span></td>
                            <td class="p-2">{op.engineerName}</td>
                            <td class="p-2 text-center font-black">{op.totalPrice.toLocaleString()}</td>
                            <td class="p-2 text-center text-blue-700 font-bold">{s.engFee?.toLocaleString()}</td>
                            <td class="p-2 text-center text-purple-700 font-bold">{s.deviceFee?.toLocaleString()}</td>
                            <td class="p-2 text-center text-emerald-700 font-bold">{Math.round(s.officeFee || 0).toLocaleString()}</td>
                            {canEditOrDelete && (
                              <td class="p-2 text-center whitespace-nowrap bg-slate-50 sticky left-0 z-10 shadow-xs">
                                <div class="flex items-center justify-center gap-1.5">
                                  <button onClick={()=>setEditItemData({ type: 'operation', data: { ...op } })} class="bg-blue-600 text-white hover:bg-blue-700 px-2 py-1 rounded font-bold text-[10px]">✏️ تعديل</button>
                                  <button onClick={()=>deleteItem('operations', op.id, operations, setOperations)} class="bg-rose-100 text-rose-700 hover:bg-rose-200 px-2 py-1 rounded font-bold text-[10px]">🗑️ حذف</button>
                                </div>
                              </td>
                            )}
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* 3. الخزينة والسيولة والتصفية */}
            {activeTab === 'cash' && (
              <div class="space-y-4">
                <div class="bg-slate-900 text-white p-5 rounded-3xl shadow-xl flex flex-col sm:flex-row justify-between items-center gap-4 text-xs">
                  <div>
                    <h3 class="text-sm font-black text-indigo-300">موقف تصفية الخزينة اللحظي</h3>
                    <p class="text-slate-400 mt-1">الرصيد الفعلي الموجود الآن في الدرج / الحسابات</p>
                  </div>
                  <div class="flex gap-4 items-center">
                    <div class="text-center"><span class="block text-slate-400 text-[10px]">إجمالي الوارد</span><strong class="text-emerald-400 text-sm font-black">{totalCashIn.toLocaleString()}</strong></div>
                    <div class="text-slate-600 text-lg">-</div>
                    <div class="text-center"><span class="block text-slate-400 text-[10px]">إجمالي المصاريف</span><strong class="text-rose-400 text-sm font-black">{totalCashOut.toLocaleString()}</strong></div>
                    <div class="text-slate-600 text-lg">=</div>
                    <div class="text-center bg-indigo-600/30 border border-indigo-500/40 p-2.5 rounded-2xl"><span class="block text-indigo-300 text-[10px]">الصافي في يدك</span><strong class="text-white text-base font-black">{currentVaultBalance.toLocaleString()} ج.م</strong></div>
                  </div>
                </div>

                <div class="bg-white p-4 rounded-2xl border shadow-sm text-xs">
                  <h4 class="font-bold text-slate-800 mb-3 border-b pb-2">💵 تسجيل إيراد / مصروف سريع في الخزينة:</h4>
                  <form onSubmit={handleAddTransaction} class="grid grid-cols-1 sm:grid-cols-5 gap-2.5">
                    <div>
                      <label class="block font-bold mb-1">النوع</label>
                      <select value={newTx.type} onChange={e=>setNewTx({...newTx, type: e.target.value})} class="w-full border p-2 rounded-xl font-bold">
                        <option value="income">📥 وارد (تحصيل من عميل)</option>
                        <option value="expense">📤 صادر (مصروف تشغيل)</option>
                      </select>
                    </div>
                    <div>
                      <label class="block font-bold mb-1">الجهة / العميل</label>
                      <input type="text" value={newTx.clientOrEntity} onChange={e=>setNewTx({...newTx, clientOrEntity: e.target.value})} placeholder="اسم العميل أو الجهة" class="w-full border p-2 rounded-xl" required/>
                    </div>
                    <div>
                      <label class="block font-bold mb-1">البند / التصنيف</label>
                      <input type="text" value={newTx.category} onChange={e=>setNewTx({...newTx, category: e.target.value})} placeholder="بنزين، تحصيل، بوفيه..." class="w-full border p-2 rounded-xl" required/>
                    </div>
                    <div>
                      <label class="block font-bold mb-1">المبلغ (ج.م)</label>
                      <input type="number" step="any" value={newTx.amount} onChange={e=>setNewTx({...newTx, amount: e.target.value})} class="w-full border p-2 rounded-xl font-black" required/>
                    </div>
                    <div>
                      <label class="block font-bold mb-1">طريقة المعاملة</label>
                      <select value={newTx.paymentMethod} onChange={e=>setNewTx({...newTx, paymentMethod: e.target.value})} class="w-full border p-2 rounded-xl">
                        <option value="كاش">كاش</option>
                        <option value="فودافون كاش">فودافون كاش</option>
                        <option value="إنستاباي">إنستاباي</option>
                        <option value="تحويل بنكي">تحويل بنكي</option>
                      </select>
                    </div>
                    <div class="sm:col-span-5">
                      <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 rounded-xl shadow">حفظ الحركة في الخزينة</button>
                    </div>
                  </form>
                </div>

                <div class="bg-white p-4 rounded-2xl border shadow-sm text-xs overflow-x-auto">
                  <h4 class="font-bold text-slate-800 mb-2">سجل حركات الخزينة والسيولة:</h4>
                  <table class="w-full text-right border-collapse">
                    <thead>
                      <tr class="bg-slate-100 text-slate-700 border-b">
                        <th class="p-2">التاريخ</th>
                        <th class="p-2">النوع</th>
                        <th class="p-2">الجهة</th>
                        <th class="p-2">البند</th>
                        <th class="p-2 text-center">المبلغ</th>
                        <th class="p-2">طريقة الدفع</th>
                        {canEditOrDelete && <th class="p-2 text-center bg-slate-200 font-bold sticky left-0 z-10 shadow-xs">إجراءات</th>}
                      </tr>
                    </thead>
                    <tbody>
                      {transactions.map(t => (
                        <tr key={t.id} class="border-b hover:bg-slate-50">
                          <td class="p-2 text-slate-600">{t.date}</td>
                          <td class="p-2 font-bold"><span class={`px-2 py-0.5 rounded text-[10px] ${t.type==='income'?'bg-emerald-100 text-emerald-800':'bg-rose-100 text-rose-800'}`}>{t.type==='income'?'وارد 📥':'صادر 📤'}</span></td>
                          <td class="p-2 font-bold">{t.clientOrEntity}</td>
                          <td class="p-2">{t.category}</td>
                          <td class={`p-2 text-center font-black ${t.type==='income'?'text-emerald-600':'text-rose-600'}`}>{parseNum(t.amount).toLocaleString()} ج.م</td>
                          <td class="p-2">{t.paymentMethod}</td>
                          {canEditOrDelete && (
                            <td class="p-2 text-center whitespace-nowrap bg-slate-50 sticky left-0 z-10 shadow-xs">
                              <div class="flex items-center justify-center gap-1.5">
                                <button onClick={()=>setEditItemData({ type: 'transaction', data: { ...t } })} class="bg-blue-600 text-white hover:bg-blue-700 px-2 py-1 rounded font-bold text-[10px]">✏️ تعديل</button>
                                <button onClick={()=>deleteItem('transactions', t.id, transactions, setTransactions)} class="bg-rose-100 text-rose-700 hover:bg-rose-200 px-2 py-1 rounded font-bold text-[10px]">🗑️ حذف</button>
                              </div>
                            </td>
                          )}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* 4. محفظة وحصص الشركاء */}
            {activeTab === 'partners' && (
              <div class="space-y-4">
                <div class="bg-white p-5 rounded-3xl border shadow-sm text-xs">
                  <h3 class="font-black text-slate-900 text-sm mb-4 border-b pb-2 flex items-center justify-between">
                    <span>🤝 محافظ وأرباح الشركاء المجمعة من كافة العمليات</span>
                    <span class="text-indigo-600 font-bold">محسوبة طبقاً لنسب الجهاز والمكتب</span>
                  </h3>

                  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">
                    <div class="p-4 rounded-2xl border border-indigo-200 bg-indigo-50/50">
                      <div class="flex justify-between items-center mb-2"><span class="font-black text-sm text-indigo-950">أ. مندور</span><span class="text-[10px] bg-indigo-200 px-2 py-0.5 rounded font-bold">50% من الجهاز</span></div>
                      <span class="text-slate-500 block text-[11px]">إجمالي الأرباح المستحقة:</span>
                      <strong class="text-xl font-black text-indigo-900">{Math.round(partnerWallets.mandour).toLocaleString()} ج.م</strong>
                    </div>

                    <div class="p-4 rounded-2xl border border-blue-200 bg-blue-50/50">
                      <div class="flex justify-between items-center mb-2"><span class="font-black text-sm text-blue-950">م. أحمد</span><span class="text-[10px] bg-blue-200 px-2 py-0.5 rounded font-bold">10% من المكتب</span></div>
                      <span class="text-slate-500 block text-[11px]">إجمالي الأرباح المستحقة:</span>
                      <strong class="text-xl font-black text-blue-900">{Math.round(partnerWallets.ahmed).toLocaleString()} ج.م</strong>
                    </div>

                    <div class="p-4 rounded-2xl border border-amber-200 bg-amber-50/50">
                      <div class="flex justify-between items-center mb-2"><span class="font-black text-sm text-amber-950">صندوق الخير 🤲</span><span class="text-[10px] bg-amber-200 px-2 py-0.5 rounded font-bold">10% لوجه الله</span></div>
                      <span class="text-slate-500 block text-[11px]">المبلغ المجمع للصدقات:</span>
                      <strong class="text-xl font-black text-amber-900">{Math.round(partnerWallets.charity).toLocaleString()} ج.م</strong>
                    </div>

                    <div class="p-4 rounded-2xl border border-emerald-200 bg-emerald-50/50">
                      <div class="flex justify-between items-center mb-2"><span class="font-black text-sm text-emerald-950">م. علاء</span><span class="text-[10px] bg-emerald-200 px-2 py-0.5 rounded font-bold">شريك</span></div>
                      <span class="text-slate-500 block text-[11px]">حصة الجهاز والمكتب:</span>
                      <strong class="text-xl font-black text-emerald-900">{Math.round(partnerWallets.alaa).toLocaleString()} ج.م</strong>
                    </div>

                    <div class="p-4 rounded-2xl border border-emerald-200 bg-emerald-50/50">
                      <div class="flex justify-between items-center mb-2"><span class="font-black text-sm text-emerald-950">م. أيمن</span><span class="text-[10px] bg-emerald-200 px-2 py-0.5 rounded font-bold">شريك</span></div>
                      <span class="text-slate-500 block text-[11px]">حصة الجهاز والمكتب:</span>
                      <strong class="text-xl font-black text-emerald-900">{Math.round(partnerWallets.ayman).toLocaleString()} ج.م</strong>
                    </div>

                    <div class="p-4 rounded-2xl border border-emerald-200 bg-emerald-50/50">
                      <div class="flex justify-between items-center mb-2"><span class="font-black text-sm text-emerald-950">م. أسامة</span><span class="text-[10px] bg-emerald-200 px-2 py-0.5 rounded font-bold">شريك</span></div>
                      <span class="text-slate-500 block text-[11px]">حصة الجهاز والمكتب:</span>
                      <strong class="text-xl font-black text-emerald-900">{Math.round(partnerWallets.osama).toLocaleString()} ج.م</strong>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* نافذة التعديل المنبثقة */}
          {editItemData && canEditOrDelete && (
            <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div class="bg-white rounded-3xl p-5 w-full max-w-lg shadow-2xl border text-xs max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-center border-b pb-3 mb-3">
                  <h3 class="font-bold text-sm text-slate-800">
                    ✏️ تعديل {editItemData.type === 'operation' ? 'العملية المساحية' : 'حركة الخزينة'}
                  </h3>
                  <button onClick={() => setEditItemData(null)} class="bg-slate-100 hover:bg-rose-100 text-slate-500 hover:text-rose-600 rounded-full w-8 h-8 flex items-center justify-center font-bold transition">✕</button>
                </div>

                <form onSubmit={handleSaveEditedItem} class="space-y-3">
                  {editItemData.type === 'operation' && (
                    <>
                      <div class="grid grid-cols-2 gap-2">
                        <div>
                          <label class="block font-bold mb-1">التاريخ</label>
                          <input type="date" value={editItemData.data.date} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, date: e.target.value}})} class="w-full border p-2 rounded-xl" required/>
                        </div>
                        <div>
                          <label class="block font-bold mb-1">اسم العميل</label>
                          <input type="text" value={editItemData.data.clientName} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, clientName: e.target.value}})} class="w-full border p-2 rounded-xl" required/>
                        </div>
                      </div>

                      <div class="grid grid-cols-2 gap-2">
                        <div>
                          <label class="block font-bold mb-1">نوع العمل</label>
                          <select value={editItemData.data.opType} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, opType: e.target.value}})} class="w-full border p-2 rounded-xl font-bold bg-indigo-50">
                            <option value="rtk_full">يوم جهاز RTK كامل</option>
                            <option value="rtk_half">نصف يوم جهاز RTK</option>
                            <option value="sketch_meas">قياس وكروكي</option>
                          </select>
                        </div>
                        <div>
                          <label class="block font-bold mb-1">المهندس</label>
                          <input type="text" value={editItemData.data.engineerName} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, engineerName: e.target.value}})} class="w-full border p-2 rounded-xl" required/>
                        </div>
                      </div>

                      <div class="grid grid-cols-2 gap-2">
                        <div>
                          <label class="block font-bold mb-1">المبلغ الإجمالي</label>
                          <input type="number" step="any" value={editItemData.data.totalPrice} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, totalPrice: e.target.value}})} class="w-full border p-2 rounded-xl font-black text-emerald-700" required/>
                        </div>
                        <div>
                          <label class="block font-bold mb-1">المدفوع من العميل</label>
                          <input type="number" step="any" value={editItemData.data.paidAmount} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, paidAmount: e.target.value}})} class="w-full border p-2 rounded-xl"/>
                        </div>
                      </div>

                      <div class="grid grid-cols-2 gap-2">
                        <div>
                          <label class="block font-bold mb-1">مصاريف العمالة</label>
                          <input type="number" step="any" value={editItemData.data.laborCost} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, laborCost: e.target.value}})} class="w-full border p-2 rounded-xl"/>
                        </div>
                        <div>
                          <label class="block font-bold mb-1">مصاريف السيارة</label>
                          <input type="number" step="any" value={editItemData.data.carCost} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, carCost: e.target.value}})} class="w-full border p-2 rounded-xl"/>
                        </div>
                      </div>
                    </>
                  )}

                  {editItemData.type === 'transaction' && (
                    <>
                      <div class="grid grid-cols-2 gap-2">
                        <div>
                          <label class="block font-bold mb-1">التاريخ</label>
                          <input type="date" value={editItemData.data.date} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, date: e.target.value}})} class="w-full border p-2 rounded-xl" required/>
                        </div>
                        <div>
                          <label class="block font-bold mb-1">النوع</label>
                          <select value={editItemData.data.type} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, type: e.target.value}})} class="w-full border p-2 rounded-xl font-bold">
                            <option value="income">وارد 📥</option>
                            <option value="expense">صادر 📤</option>
                          </select>
                        </div>
                      </div>

                      <div>
                        <label class="block font-bold mb-1">الجهة / العميل</label>
                        <input type="text" value={editItemData.data.clientOrEntity} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, clientOrEntity: e.target.value}})} class="w-full border p-2 rounded-xl" required/>
                      </div>

                      <div class="grid grid-cols-2 gap-2">
                        <div>
                          <label class="block font-bold mb-1">المبلغ</label>
                          <input type="number" step="any" value={editItemData.data.amount} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, amount: e.target.value}})} class="w-full border p-2 rounded-xl font-black text-emerald-600" required/>
                        </div>
                        <div>
                          <label class="block font-bold mb-1">طريقة الدفع</label>
                          <select value={editItemData.data.paymentMethod} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, paymentMethod: e.target.value}})} class="w-full border p-2 rounded-xl">
                            <option value="كاش">كاش</option>
                            <option value="فودافون كاش">فودافون كاش</option>
                            <option value="إنستاباي">إنستاباي</option>
                            <option value="تحويل بنكي">تحويل بنكي</option>
                          </select>
                        </div>
                      </div>
                    </>
                  )}

                  <div class="flex gap-2 pt-2 border-t mt-4">
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl shadow transition">تأكيد وحفظ التعديلات</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {toast.show && (
            <div class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-2 rounded-2xl text-xs font-bold shadow-2xl z-50">
              {toast.message}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
