<!DOCTYPE html>
<html lang="ar" dir="rtl" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام إدارة الأعمال المساحية - SURVEY ERP</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: { fontFamily: { sans: ['Cairo', 'sans-serif'] } }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-database-compat.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    @media print {
      body { background-color: white !important; font-size: 11px; }
      .print-hidden { display: none !important; }
      .print-area { box-shadow: none !important; border: none !important; width: 100% !important; margin: 0 !important; }
      .dark .print-area { color: black !important; background: white !important; }
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 antialiased transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyDHjQTNfAh3wQ8tSOXOIewJNXaDCHADrR8",
      authDomain: "mrmo-d8760.firebaseapp.com",
      databaseURL: "https://mrmo-d8760-default-rtdb.firebaseio.com",
      projectId: "mrmo-d8760",
      storageBucket: "mrmo-d8760.firebasestorage.app",
      messagingSenderId: "510855132508",
      appId: "1:510855132508:web:feee377429a2d88c277d99",
      measurementId: "G-N9DW5R28H0"
    };

    const SUPER_ADMIN_EMAIL = "mohamedmo686686@gmail.com";
    const ADMIN_EMAILS = [SUPER_ADMIN_EMAIL, "mohamedmohy676676@gmail.com", "+201095545982"];

    let db = null;
    let auth = null;
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      auth = firebase.auth();
      auth.languageCode = 'ar';
    } catch (e) { console.error(e); }

    const parseNum = (val) => {
      if (typeof val === "number") return isNaN(val) ? 0 : val;
      if (!val) return 0;
      const clean = String(val).replace(/,/g, '').replace(/،/g, '.').trim();
      const n = parseFloat(clean);
      return isNaN(n) ? 0 : n;
    };

    const openGeneralWhatsApp = (elementId, filename, textMessage) => {
      let targetPhone = window.prompt("أدخل رقم هاتف المستلم (أو اتركه فارغاً لاختيار المحادثة من واتساب مباشرة):", "");
      if (targetPhone === null) return;
      targetPhone = targetPhone.replace(/[^0-9]/g, '');
      if (targetPhone.startsWith('01')) targetPhone = '20' + targetPhone.substring(1);

      const element = document.getElementById(elementId);
      if (element && typeof html2pdf !== 'undefined') {
        const opt = {
          margin: [8, 8, 8, 8], filename: filename || 'مستخلص.pdf', image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save().then(() => {
          const url = targetPhone ? `https://wa.me/${targetPhone}?text=${encodeURIComponent(textMessage)}` : `https://wa.me/?text=${encodeURIComponent(textMessage)}`;
          window.open(url, '_blank');
        }).catch(() => {
          const url = targetPhone ? `https://wa.me/${targetPhone}?text=${encodeURIComponent(textMessage)}` : `https://wa.me/?text=${encodeURIComponent(textMessage)}`;
          window.open(url, '_blank');
        });
      } else {
        const url = targetPhone ? `https://wa.me/${targetPhone}?text=${encodeURIComponent(textMessage)}` : `https://wa.me/?text=${encodeURIComponent(textMessage)}`;
        window.open(url, '_blank');
      }
    };

    function App() {
      const [user, setUser] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);
      const [isSuperAdmin, setIsSuperAdmin] = useState(false);
      const [authLoading, setAuthLoading] = useState(true);

      const [activeTab, setActiveTab] = useState("dashboard");
      const [drawerOpen, setDrawerOpen] = useState(false);
      
      const [operations, setOperations] = useState([]);
      const [transactions, setTransactions] = useState([]);
      const [payments, setPayments] = useState([]);
      const [loginLogs, setLoginLogs] = useState([]);
      
      const [settings, setSettings] = useState({
        engineers: ["م أحمد نبيل", "م أيمن", "م علاء", "م أسامة"],
        opTypes: ["رفع شبكي", "تخطيط مساحي", "توقيع مساحي", "كروكي تقنين"],
        logo: "",
        theme: localStorage.getItem('theme') || 'light'
      });

      const todayDate = new Date().toISOString().split('T')[0];
      const currentMonthStr = todayDate.substring(0, 7);

      const [vaultMonth, setVaultMonth] = useState(currentMonthStr);
      const [opsFilterMonth, setOpsFilterMonth] = useState(currentMonthStr);
      const [toast, setToast] = useState({ show: false, message: "" });

      // نماذج الحسابات الميدانية
      const [newOp, setNewOp] = useState({
        date: todayDate, clientName: "", siteLocation: "الموقع العام", opType: "تخطيط مساحي", workDescription: "", engineer: "م أحمد نبيل",
        isFaddan: false, faddanQty: 1, faddanPrice: 250,
        isSketch: false, sketchesCount: 1,
        agreedAmount: 5000, paidNow: 0, laborCost: 0, carCost: 0,
        engDayType: "full", deviceDayType: "full"
      });

      const [newPayment, setNewPayment] = useState({ date: todayDate, clientName: "", siteLocation: "", amount: "", notes: "" });
      const [newTx, setNewTx] = useState({ date: todayDate, type: "income", category: "إيراد عام", amount: "", notes: "" });

      // حالة المستخلص الجديد
      const [extractClient, setExtractClient] = useState("");
      const [extractSite, setExtractSite] = useState("");
      const [extractNumber, setExtractNumber] = useState("1");
      const [extractEngineer, setExtractEngineer] = useState("م أحمد نبيل");
      const [extractItems, setExtractItems] = useState([]);

      useEffect(() => {
        if (settings.theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', settings.theme);
      }, [settings.theme]);

      const showToast = (message) => {
        setToast({ show: true, message });
        setTimeout(() => setToast({ show: false, message: "" }), 3000);
      };

      useEffect(() => {
        if (!auth) { setAuthLoading(false); return; }
        return auth.onAuthStateChanged((curr) => {
          if (curr) {
            const email = (curr.email || "").toLowerCase();
            setUser(curr);
            setIsSuperAdmin(email === SUPER_ADMIN_EMAIL.toLowerCase());
            setIsAdmin(ADMIN_EMAILS.some(e => email.includes(e.toLowerCase())));

            if (db && !sessionStorage.getItem('survey_log')) {
              db.ref('survey_data/login_logs').push({ name: curr.displayName||curr.email, email, date: new Date().toLocaleString('ar-EG') });
              sessionStorage.setItem('survey_log', 'true');
            }
          } else {
            setUser(null); setIsAdmin(false); setIsSuperAdmin(false);
          }
          setAuthLoading(false);
        });
      }, []);

      useEffect(() => {
        if (!db) return;
        const ref = db.ref('survey_data');
        ref.on('value', (snap) => {
          const d = snap.val() || {};
          const toArr = (v) => (v ? (Array.isArray(v) ? v : Object.values(v)) : []);
          setOperations(toArr(d.operations).reverse());
          setTransactions(toArr(d.transactions).reverse());
          setPayments(toArr(d.payments).reverse());
          setLoginLogs(toArr(d.login_logs).reverse());
          
          if (d.settings) {
            setSettings(prev => ({
              ...prev,
              engineers: d.settings.engineers || prev.engineers,
              opTypes: d.settings.opTypes || prev.opTypes,
              logo: d.settings.logo || prev.logo
            }));
          }
        });
      }, []);

      const updateSettingArray = (key, title) => {
        const val = prompt(`إضافة ${title} جديد:`);
        if (val && val.trim()) {
          const updated = [...settings[key], val.trim()];
          setSettings(p => ({ ...p, [key]: updated }));
          if(db) db.ref(`survey_data/settings/${key}`).set(updated);
        }
      };

      const calculateOperationShares = (op) => {
        const total = parseNum(op.agreedAmount);
        let engFee = 0, deviceFee = 0, officeFee = 0;

        if (op.engDayType === 'full') engFee = 2000;
        else if (op.engDayType === 'half') engFee = 1500;
        else if (op.engDayType === 'percent') engFee = total * 0.80;

        if (op.deviceDayType === 'full') deviceFee = 3500;
        else if (op.deviceDayType === 'half') deviceFee = 1750;
        else deviceFee = 0;

        if (op.engDayType === 'percent') {
          officeFee = total * 0.20; 
        } else {
          officeFee = Math.max(0, total - engFee - deviceFee - parseNum(op.laborCost) - parseNum(op.carCost));
        }

        return { engFee, deviceFee, officeFee };
      };

      const handleAddOperation = (e) => {
        e.preventDefault();
        const total = newOp.isFaddan ? parseNum(newOp.faddanQty) * parseNum(newOp.faddanPrice) : parseNum(newOp.agreedAmount);
        const finalOp = { ...newOp, agreedAmount: total };
        const shares = calculateOperationShares(finalOp);

        const opToSave = {
          id: Date.now(), ...finalOp, ...shares, createdBy: user.email
        };

        const updatedOps = [opToSave, ...operations];
        setOperations(updatedOps);
        if (db) db.ref('survey_data/operations').set(updatedOps);

        if (parseNum(newOp.paidNow) > 0) {
          const autoPay = { id: Date.now() + 1, date: newOp.date, clientName: newOp.clientName, siteLocation: newOp.siteLocation, amount: parseNum(newOp.paidNow), notes: `مقدم (${newOp.workDescription})` };
          const autoTx = { id: Date.now() + 2, date: newOp.date, type: "income", category: "تحصيل مساحة مقدم", clientOrEntity: `${newOp.clientName} - ${newOp.siteLocation}`, amount: parseNum(newOp.paidNow) };
          setPayments([autoPay, ...payments]);
          setTransactions([autoTx, ...transactions]);
          if(db){
            db.ref('survey_data/payments').set([autoPay, ...payments]);
            db.ref('survey_data/transactions').set([autoTx, ...transactions]);
          }
        }
        showToast("تم تسجيل العملية بنجاح! ✅");
      };

      const handleAddPayment = (e) => {
        e.preventDefault();
        const item = { id: Date.now(), ...newPayment, amount: parseNum(newPayment.amount) };
        const tx = { id: Date.now()+1, date: item.date, type: 'income', category: 'سداد دفعة مساحة', clientOrEntity: `${item.clientName} (${item.siteLocation||'عام'})`, amount: item.amount };
        
        const upPay = [item, ...payments];
        const upTx = [tx, ...transactions];
        setPayments(upPay); setTransactions(upTx);
        if (db) { db.ref('survey_data/payments').set(upPay); db.ref('survey_data/transactions').set(upTx); }
        setNewPayment({ date: todayDate, clientName: "", siteLocation: "", amount: "", notes: "" });
        showToast("تم قيد الدفعة بنجاح! 💰");
      };

      const handleAddTransaction = (e) => {
        e.preventDefault();
        const item = { id: Date.now(), ...newTx, amount: parseNum(newTx.amount) };
        const updated = [item, ...transactions];
        setTransactions(updated);
        if(db) db.ref('survey_data/transactions').set(updated);
        setNewTx({ date: todayDate, type: "income", category: "إيراد عام", amount: "", notes: "" });
        showToast("تم حفظ الحركة بالخزينة!");
      };

      const deleteItem = (path, id, list, setter) => {
        if (!isAdmin) { showToast("مرفوض. للإدارة فقط 🔒"); return; }
        if (window.confirm("تأكيد الحذف النهائي؟")) {
          const updated = list.filter(item => item.id !== id);
          setter(updated);
          if (db) db.ref(`survey_data/${path}`).set(updated);
          showToast("تم الحذف بنجاح!");
        }
      };

      // سحب الأعمال كمسودة وتعديلها
      const handleImportClientOps = () => {
        if (!extractClient) {
          alert("يرجى اختيار العميل أولاً!");
          return;
        }
        const filtered = operations.filter(o => 
          o.clientName === extractClient && 
          (!extractSite || o.siteLocation === extractSite)
        );

        if (filtered.length === 0) {
          alert("لا توجد أعمال مسجلة مطابقة لهذا العميل أو الموقع!");
          return;
        }

        const imported = filtered.map((o, idx) => ({
          id: Date.now() + idx,
          desc: o.workDescription || o.opType,
          qty: o.isFaddan ? parseNum(o.faddanQty) : 1,
          unitPrice: o.isFaddan ? parseNum(o.faddanPrice) : parseNum(o.agreedAmount),
          rate: 100
        }));

        setExtractItems(imported);
        showToast("تم سحب الأعمال كمسودة في الجدول! يمكنك تعديلها بحرية الآن 📥");
      };

      const handleAddEmptyExtractRow = () => {
        setExtractItems([
          ...extractItems,
          { id: Date.now(), desc: "بند أعمال مساحية", qty: 1, unitPrice: 1000, rate: 100 }
        ]);
      };

      const handleRemoveExtractRow = (id) => {
        setExtractItems(extractItems.filter(item => item.id !== id));
      };

      // حسابات المستخلص الحالية
      const extractTotalWork = extractItems.reduce((sum, item) => {
        const itemVal = parseNum(item.qty) * parseNum(item.unitPrice) * (parseNum(item.rate) / 100);
        return sum + itemVal;
      }, 0);

      // حصر كل ما سدده العميل
      const clientOpsForPayment = operations.filter(o => o.clientName === extractClient && (!extractSite || o.siteLocation === extractSite));
      const clientPaysForPayment = payments.filter(p => p.clientName === extractClient && (!extractSite || p.siteLocation === extractSite));
      const clientTotalPaid = clientOpsForPayment.reduce((s,o)=>s+parseNum(o.paidNow),0) + clientPaysForPayment.reduce((s,p)=>s+parseNum(p.amount),0);

      const extractRemainingBalance = extractTotalWork - clientTotalPaid;

      const clientNames = Array.from(new Set([...operations.map(o=>o.clientName), ...payments.map(p=>p.clientName)])).filter(Boolean);
      const siteLocationsList = Array.from(new Set(operations.map(o=>o.siteLocation).filter(Boolean)));

      // حسابات الخزينة
      const monthlyTx = transactions.filter(t => t.date && t.date.startsWith(vaultMonth));
      const mIn = monthlyTx.filter(t=>t.type==='income').reduce((s,t)=>s+parseNum(t.amount),0);
      const mOut = monthlyTx.filter(t=>t.type==='expense').reduce((s,t)=>s+parseNum(t.amount),0);
      const mNet = mIn - mOut;

      const cumulativeTx = transactions.filter(t => t.date && t.date.substring(0, 7) <= vaultMonth);
      const cumIn = cumulativeTx.filter(t=>t.type==='income').reduce((s,t)=>s+parseNum(t.amount),0);
      const cumOut = cumulativeTx.filter(t=>t.type==='expense').reduce((s,t)=>s+parseNum(t.amount),0);
      const cumNet = cumIn - cumOut;

      const filteredOpsByMonth = operations.filter(o => o.date && o.date.startsWith(opsFilterMonth));
      const monthOpsTotal = filteredOpsByMonth.reduce((s,o)=>s+parseNum(o.agreedAmount),0);

      const totalRtk = operations.reduce((s,o)=>s+(o.deviceFee||0),0);
      const totalOffice = operations.reduce((s,o)=>s+(o.officeFee||0),0);

      const navTabs = [
        { id: "dashboard", label: "لوحة التحكم", icon: "📊" },
        { id: "extracts", label: "المستخلصات", icon: "📄" },
        { id: "clients", label: "الأعمال والعملاء", icon: "👥" },
        { id: "vault", label: "الخزينة بالشهر", icon: "💵" },
        { id: "expenses", label: "مصاريف التشغيل", icon: "🚗" },
        { id: "engineers", label: "حساب المهندسين", icon: "👷" },
        { id: "rtk", label: "جهاز RTK", icon: "🛰️" },
        { id: "payments", label: "الدفعات", icon: "💰" },
        { id: "office", label: "أرباح المكتب", icon: "🏢" },
        ...(isSuperAdmin ? [{ id: "logs", label: "سجل الدخول", icon: "🛡️" }] : []),
        { id: "settings", label: "الإعدادات", icon: "⚙️" }
      ];

      if (authLoading) return <div class="min-h-screen flex items-center justify-center bg-slate-900 text-white font-bold">جاري التهيئة...</div>;

      if (!user) {
        return (
          <div class="min-h-screen flex items-center justify-center bg-slate-900 p-4">
            <div class="bg-white p-8 rounded-3xl max-w-sm w-full text-center shadow-2xl">
              <div class="text-5xl mb-4">📐</div>
              <h2 class="text-2xl font-black text-slate-800">نظام المساحة ERP</h2>
              <button onClick={() => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())} class="mt-6 w-full bg-slate-900 text-white py-3.5 rounded-2xl font-bold shadow-md">الدخول بحساب Google</button>
            </div>
          </div>
        );
      }

      return (
        <div class="min-h-screen flex flex-col bg-slate-50 dark:bg-slate-900 pb-20 md:pb-0">
          
          {/* Header */}
          <header class="bg-white dark:bg-slate-800 border-b dark:border-slate-700 px-4 py-3 flex justify-between items-center sticky top-0 z-30 shadow-xs">
            <div class="flex items-center gap-2">
              <span class="text-2xl p-1 bg-indigo-50 dark:bg-indigo-950/60 rounded-xl">📐</span>
              <div>
                <h1 class="text-sm font-black leading-tight text-indigo-700 dark:text-indigo-400">مساحة ERP</h1>
                <p class="text-[10px] text-slate-500 dark:text-slate-400 truncate max-w-[130px] sm:max-w-none">{navTabs.find(t=>t.id===activeTab)?.label}</p>
              </div>
            </div>

            <div class="flex items-center gap-2">
              <button onClick={() => setSettings(p=>({...p, theme: p.theme==='dark'?'light':'dark'}))} class="p-2 bg-slate-100 dark:bg-slate-700 rounded-xl text-base">
                {settings.theme === 'dark' ? '☀️' : '🌙'}
              </button>
              <a href="index.html" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-1 shadow-xs transition">
                <span>🏗️</span> <span class="hidden sm:inline">الإنشاءات</span>
              </a>
              <button onClick={()=>setDrawerOpen(true)} class="bg-slate-800 text-slate-200 p-2 rounded-xl text-xs font-bold md:hidden">
                ☰
              </button>
            </div>
          </header>

          <div class="flex-1 flex overflow-hidden">
            {/* Desktop Sidebar */}
            <aside class="hidden md:flex w-64 bg-slate-900 text-slate-300 flex-col justify-between shrink-0 border-l border-slate-800">
              <div class="p-3 overflow-y-auto space-y-1 text-xs font-bold">
                {navTabs.map(t => (
                  <button key={t.id} onClick={() => setActiveTab(t.id)} class={`w-full text-right flex items-center gap-2.5 p-3 rounded-xl transition ${activeTab===t.id ? 'bg-indigo-600 text-white shadow' : 'hover:bg-slate-800'}`}>
                    <span class="text-base">{t.icon}</span> <span>{t.label}</span>
                  </button>
                ))}
              </div>
              <div class="p-3 border-t border-slate-800 text-[11px]">
                <div class="truncate text-slate-400 mb-1">{user.email}</div>
                <button onClick={()=>auth.signOut()} class="w-full bg-rose-600/20 text-rose-400 py-2 rounded-xl font-bold">تسجيل الخروج</button>
              </div>
            </aside>

            {/* Mobile Drawer */}
            {drawerOpen && (
              <div class="fixed inset-0 z-50 flex md:hidden">
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs" onClick={()=>setDrawerOpen(false)}></div>
                <div class="relative w-72 max-w-[80%] bg-slate-900 text-white h-full shadow-2xl z-50 p-4 flex flex-col justify-between">
                  <div>
                    <div class="flex justify-between items-center pb-3 border-b border-slate-800 mb-3">
                      <span class="font-black text-sm">أقسام قطاع المساحة</span>
                      <button onClick={()=>setDrawerOpen(false)} class="text-slate-400 hover:text-white text-lg">✕</button>
                    </div>
                    <nav class="space-y-1 text-xs font-bold max-h-[70vh] overflow-y-auto scrollbar-hide">
                      {navTabs.map(t => (
                        <button key={t.id} onClick={() => { setActiveTab(t.id); setDrawerOpen(false); }} class={`w-full text-right flex items-center gap-2.5 p-3 rounded-xl ${activeTab===t.id ? 'bg-indigo-600 text-white font-black' : 'text-slate-300 hover:bg-slate-800'}`}>
                          <span>{t.icon}</span> <span>{t.label}</span>
                        </button>
                      ))}
                    </nav>
                  </div>
                  <div class="pt-3 border-t border-slate-800 text-xs">
                    <button onClick={()=>auth.signOut()} class="w-full bg-rose-600/20 text-rose-400 py-2.5 rounded-xl font-bold">تسجيل الخروج</button>
                  </div>
                </div>
              </div>
            )}

            {/* Main Workspace */}
            <main class="flex-1 overflow-y-auto p-3.5 sm:p-5 text-xs max-w-7xl mx-auto w-full">
              
              {/* 1. لوحة التحكم */}
              {activeTab === 'dashboard' && (
                <div class="space-y-4">
                  <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 sm:gap-3">

                  </div>

                      <div>
                        <label>الموقع بالمزرعة (اختياري):</label>

                        <label>رقم المستخلص:</label>

                      <div>
                        <label>المهندس المشرف:</label>
                        <select value={extractEngineer} onChange={e=>setExtractEngineer(e.target.value)} class="w-full border p-2.5 rounded-xl mt-1 dark:bg-slate-700">

                        </select>
                      </div>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-2 pt-2 border-t dark:border-slate-700">

                      </button>
                      <button onClick={handleAddEmptyExtractRow} class="w-full sm:w-auto bg-slate-800 hover:bg-black text-white px-4 py-2.5 rounded-xl flex items-center justify-center gap-1.5 transition">
                        ➕ إضافة بند يدوي
                      </button>
                    </div>
                  </div>

                  {/* الورقة الهندسية للمستخلص */}

                    {/* الترويسة */}

                          <span>التاريخ: {todayDate}</span>

                      </div>
                      <div class="flex items-center gap-3">

                          <span class="block text-xs text-slate-400">العميل / المالك:</span>

                      </div>
                    </div>

                            <th class="p-2.5 text-center w-24">الكمية / الفدان</th>
                            <th class="p-2.5 text-center w-28">الفئة (السعر)</th>

                          ) : (
                            extractItems.map((item, idx) => {
                              const net = parseNum(item.qty) * parseNum(item.unitPrice) * (parseNum(item.rate) / 100);

                                <tr key={item.id} class="hover:bg-slate-50/60">

                                    }} class="w-full bg-transparent font-bold outline-none text-slate-900"/>
                                  </td>
                                  <td class="p-2 text-center">
                                    <input type="number" step="any" value={item.qty} onChange={e=>{
                                      const up = extractItems.map(it=>it.id===item.id?{...it, qty: e.target.value}:it);

                                    }} class="w-full text-center bg-slate-50 border border-slate-200 rounded-lg p-1 font-bold outline-none"/>
                                  </td>
                                  <td class="p-2 text-center">
                                    <input type="number" step="any" value={item.unitPrice} onChange={e=>{

                                  <td class="p-2 text-center">
                                    <select value={item.rate} onChange={e=>{
                                      const up = extractItems.map(it=>it.id===item.id?{...it, rate: e.target.value}:it);

                        <strong class="text-xl font-black text-rose-600">{extractRemainingBalance.toLocaleString()} ج.م</strong>
                      </div>
                    </div>

                        <span>المهندس المشرف:</span>
                        <strong class="block text-sm text-slate-900 mt-1">{extractEngineer}</strong>
                      </div>
                      <div class="text-center">
                        <span>الاعتماد والختم:</span>
                        <span class="block mt-4 text-slate-300">............................................</span>
                      </div>

                    </button>

                      const summaryMessage = `🏢 *مكتب الاستشارات والأعمال المساحية*\n📄 *مستخلص أعمال رقم:* #${extractNumber}\n👤 *العميل:* ${extractClient || 'عام'}\n${extractSite ? `📍 *الموقع:* ${extractSite}\n` : ''}----------------------------------\n📊 *إجمالي الأعمال:* ${extractTotalWork.toLocaleString()} ج.م\n📥 *المسدد:* ${clientTotalPaid.toLocaleString()} ج.م\n⚠️ *المتبقي المستحق:* ${extractRemainingBalance.toLocaleString()} ج.م\n👷 *المهندس المشرف:* ${extractEngineer}\n----------------------------------\n🗓️ *التاريخ:* ${todayDate}`;
                      openGeneralWhatsApp('clean-extract-target', `مستخلص_${extractClient || 'أعمال'}.pdf`, summaryMessage);
                    }} class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-2xl font-black flex items-center justify-center gap-2 shadow-sm transition">
                      <span>📲</span> إرسال المستخلص عبر واتساب (PDF)
                    </button>
                  </div>
                </div>
              )}

              {/* 3. الأعمال والعملاء (دفتر العمليات والتكاليف الميدانية) */}

                <div class="space-y-4 font-bold">
                  <form onSubmit={handleAddOperation} class="bg-white dark:bg-slate-800 p-4 sm:p-5 rounded-2xl border dark:border-slate-700 shadow-xs grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                    <div>التاريخ <input type="date" value={newOp.date} onChange={e=>setNewOp({...newOp, date: e.target.value})} class="w-full border p-2.5 rounded-xl mt-1 dark:bg-slate-700 dark:border-slate-600" required/></div>
                    <div>اسم العميل / المالك <input type="text" value={newOp.clientName} onChange={e=>setNewOp({...newOp, clientName: e.target.value})} placeholder="الواحة البحرية..." class="w-full border p-2.5 rounded-xl mt-1 dark:bg-slate-700 dark:border-slate-600" required/></div>
                    <div>الموقع بالمزرعة <input type="text" value={newOp.siteLocation} onChange={e=>setNewOp({...newOp, siteLocation: e.target.value})} placeholder="موقع المحمية، خط 2400..." class="w-full border p-2.5 rounded-xl mt-1 dark:bg-slate-700 dark:border-slate-600 bg-amber-50 dark:bg-amber-950/40" required/></div>
                    
                    <div>نوع العمل 
                      <div class="flex gap-1 mt-1">
                        <select value={newOp.opType} onChange={e=>setNewOp({...newOp, opType: e.target.value})} class="w-full border p-2.5 rounded-xl dark:bg-slate-700 dark:border-slate-600">
                          {settings.opTypes.map(o=><option key={o}>{o}</option>)}
                        </select>
                        <button type="button" onClick={()=>updateSettingArray('opTypes','نوع عمل')} class="bg-slate-200 dark:bg-slate-700 px-3 rounded-xl font-black">+</button>
                      </div>
                    </div>
                    
                    <div class="sm:col-span-2">المهندس القائم بالعمل

                          {settings.engineers.map(e=><option key={e}>{e}</option>)}
                        </select>
                        <button type="button" onClick={()=>updateSettingArray('engineers','مهندس')} class="bg-slate-200 dark:bg-slate-700 px-3 rounded-xl font-black">+</button>
                      </div>
                    </div>

                    <div class="sm:col-span-2">بيان الأعمال <input type="text" value={newOp.workDescription} onChange={e=>setNewOp({...newOp, workDescription: e.target.value})} placeholder="تخطيط 80 فدان..." class="w-full border p-2.5 rounded-xl mt-1 dark:bg-slate-700 dark:border-slate-600" required/></div>
                    
                    <div class="sm:col-span-2 lg:col-span-4 flex gap-4 py-1">
                      <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" checked={newOp.isFaddan} onChange={e=>setNewOp({...newOp, isFaddan: e.target.checked})} class="w-4 h-4 rounded"/> حساب بالفدان</label>
                      <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" checked={newOp.isSketch} onChange={e=>setNewOp({...newOp, isSketch: e.target.checked})} class="w-4 h-4 rounded"/> كروكيات</label>

                    {newOp.isFaddan && <>
                      <div>كمية الفدان المنفذة <input type="number" step="any" value={newOp.faddanQty} onChange={e=>setNewOp({...newOp, faddanQty: e.target.value})} class="w-full border p-2.5 rounded-xl mt-1 dark:bg-slate-700 dark:border-slate-600 bg-amber-50 dark:bg-amber-950/40"/></div>
                      <div>سعر الفدان (الفئة) <input type="number" step="any" value={newOp.faddanPrice} onChange={e=>setNewOp({...newOp, faddanPrice: e.target.value})} class="w-full border p-2.5 rounded-xl mt-1 dark:bg-slate-700 dark:border-slate-600 bg-amber-50 dark:bg-amber-950/40"/></div>
                    </>}
                    
                    {newOp.isSketch && <div>عدد الكروكيات <input type="number" value={newOp.sketchesCount} onChange={e=>setNewOp({...newOp, sketchesCount: e.target.value})} class="w-full border p-2.5 rounded-xl mt-1 dark:bg-slate-700 dark:border-slate-600"/></div>}
                    {!newOp.isFaddan && <div>المبلغ المتفق عليه <input type="number" value={newOp.agreedAmount} onChange={e=>setNewOp({...newOp, agreedAmount: e.target.value})} class="w-full border p-2.5 rounded-xl mt-1 dark:bg-slate-700 dark:border-slate-600 text-indigo-700 dark:text-indigo-400" required/></div>}

                    <div>المحصل فوراً (مقدم) <input type="number" value={newOp.paidNow} onChange={e=>setNewOp({...newOp, paidNow: e.target.value})} class="w-full border p-2.5 rounded-xl mt-1 dark:bg-slate-700 dark:border-slate-600"/></div>

                    <div>مصاريف سيارة <input type="number" value={newOp.carCost} onChange={e=>setNewOp({...newOp, carCost: e.target.value})} class="w-full border p-2.5 rounded-xl mt-1 dark:bg-slate-700 dark:border-slate-600"/></div>

                    <div class="sm:col-span-2 lg:col-span-4 bg-slate-100 dark:bg-slate-700/60 p-3 rounded-2xl border dark:border-slate-600">
                      <label class="block mb-2 text-indigo-700 dark:text-indigo-300 font-bold">⚙ ضبط توزيعات العملية والمصروفات:</label>
                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <div>جهد المهندس: 
                          <select value={newOp.engDayType} onChange={e=>setNewOp({...newOp, engDayType: e.target.value})} class="w-full p-2.5 rounded-xl mt-1 bg-white dark:bg-slate-800 border dark:border-slate-600">
                            <option value="full">يوم كامل (2000)</option><option value="half">نصف يوم (1500)</option><option value="percent">نسبة (80%)</option>
                          </select>
                        </div>
                        <div>استخدام الجهاز: 
                          <select value={newOp.deviceDayType} onChange={e=>setNewOp({...newOp, deviceDayType: e.target.value})} class="w-full p-2.5 rounded-xl mt-1 bg-white dark:bg-slate-800 border dark:border-slate-600">

                          </tr>
                        ))}
                      </tbody></table>
                    </div>
                  </div>
                </div>
              )}

              {/* 4. الخزينة */}
              {activeTab === 'vault' && (
                <div class="space-y-4 font-bold">

                      </div>
                      <div class="p-3 bg-indigo-50/60 dark:bg-indigo-950/40 rounded-xl border border-indigo-200 dark:border-indigo-800">
                        <span class="block text-indigo-900 dark:text-indigo-200 mb-1">التراكمي حتى ({vaultMonth}):</span>
                        <div class="grid grid-cols-3 gap-1 text-center">
                          <div><span class="text-[9px] text-slate-500">وارد</span><strong class="text-emerald-700 block">{cumIn.toLocaleString()}</strong></div>
                          <div><span class="text-[9px] text-slate-500">منصرف</span><strong class="text-rose-700 block">{cumOut.toLocaleString()}</strong></div>
                          <div><span class="text-[9px] text-indigo-800">الصافي</span><strong class="text-indigo-700 dark:text-indigo-300 block">{cumNet.toLocaleString()}</strong></div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <form onSubmit={handleAddTransaction} class="bg-white dark:bg-slate-800 p-4 rounded-2xl border dark:border-slate-700 shadow-xs grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                    <div>النوع <select value={newTx.type} onChange={e=>setNewTx({...newTx, type: e.target.value})} class="w-full border p-2.5 rounded-xl mt-1 dark:bg-slate-700"><option value="income">وارد</option><option value="expense">صادر</option></select></div>
                    <div>البند <input type="text" value={newTx.category} onChange={e=>setNewTx({...newTx, category: e.target.value})} class="w-full border p-2.5 rounded-xl mt-1 dark:bg-slate-700" required/></div>
                    <div>المبلغ <input type="number" value={newTx.amount} onChange={e=>setNewTx({...newTx, amount: e.target.value})} class="w-full border p-2.5 rounded-xl mt-1 dark:bg-slate-700 text-emerald-600" required/></div>
                    <div class="sm:col-span-3"><button class="w-full bg-slate-800 dark:bg-indigo-600 text-white py-2.5 rounded-xl">حفظ بالخزينة</button></div>
                  </form>

                  <div class="bg-white dark:bg-slate-800 rounded-2xl border dark:border-slate-700 overflow-x-auto">
                    <table class="w-full text-right"><thead class="bg-slate-100 dark:bg-slate-700"><tr><th class="p-2">التاريخ</th><th class="p-2">البند</th><th class="p-2">المبلغ</th>{isAdmin && <th class="p-2 text-center">إجراء</th>}</tr></thead>
                    <tbody>
                      {monthlyTx.map(t=>(
                        <tr key={t.id} class="border-b dark:border-slate-700">
                          <td class="p-2 whitespace-nowrap">{t.date}</td>
                          <td class="p-2"><span class={t.type==='income'?'text-emerald-600':'text-rose-600'}>{t.type==='income'?'📥':'📤'} {t.category}</span></td>
                          <td class="p-2 font-black">{parseNum(t.amount).toLocaleString()}</td>
                          {isAdmin && <td class="p-2 text-center"><button onClick={()=>deleteItem('transactions',t.id,transactions,setTransactions)} class="text-rose-600 p-1">🗑️</button></td>}
                        </tr>
                      ))}
                    </tbody></table>
                  </div>
                </div>
              )}

              {/* 5. مصاريف التشغيل */}
              {activeTab === 'expenses' && (
                <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border dark:border-slate-700 overflow-x-auto font-bold">
                  <h3 class="mb-3">🚗 مصاريف العمالة والسيارة لكل عملية:</h3>
                  <table class="w-full text-right border"><thead class="bg-slate-100 dark:bg-slate-700"><tr><th class="p-2 border">العميل</th><th class="p-2 border">الموقع</th><th class="p-2 border text-center">عمالة</th><th class="p-2 border text-center">سيارة</th><th class="p-2 border text-center text-rose-600">الإجمالي</th></tr></thead>
                  <tbody>
                    {operations.map(o=>{
                      const t = parseNum(o.laborCost)+parseNum(o.carCost);
                      return t>0 && <tr key={o.id} class="border-b dark:border-slate-700"><td class="p-2 border whitespace-nowrap">{o.clientName}</td><td class="p-2 border text-amber-700 whitespace-nowrap">{o.siteLocation}</td><td class="p-2 border text-center">{o.laborCost}</td><td class="p-2 border text-center">{o.carCost}</td><td class="p-2 border text-center font-bold text-rose-600">{t}</td></tr>
                    })}
                  </tbody></table>
                </div>
              )}

              {/* 6. حساب المهندسين */}
              {activeTab === 'engineers' && (
                <div class="space-y-4 font-bold">
                  <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border shadow-xs">
                    <label class="mb-1 block">اختر المهندس:</label>
                    <select value={extractEngineer} onChange={e=>setExtractEngineer(e.target.value)} class="w-full sm:w-1/2 border p-2.5 rounded-xl dark:bg-slate-700">
                      {settings.engineers.map(e=><option key={e}>{e}</option>)}
                    </select>
                  </div>
                  {extractEngineer && (() => {
                    const engOps = operations.filter(o=>o.engineer === extractEngineer);
                    const totalEngDues = engOps.reduce((s,o)=>s+parseNum(o.engFee),0);
                    return (
                      <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border shadow-xs">
                        <div class="flex justify-between items-center mb-3"><h3>حساب: {extractEngineer}</h3><span class="bg-indigo-100 dark:bg-indigo-950 text-indigo-800 dark:text-indigo-300 px-3 py-1 rounded-xl">المستحق: {totalEngDues.toLocaleString()} ج.م</span></div>
                        <div class="overflow-x-auto">
                          <table class="w-full text-right border"><thead class="bg-slate-100 dark:bg-slate-700"><tr><th class="p-2 border">التاريخ</th><th class="p-2 border">العمل والموقع</th><th class="p-2 border text-center text-emerald-600">الأتعاب</th></tr></thead>
                          <tbody>{engOps.map(o=><tr key={o.id}><td class="p-2 border whitespace-nowrap">{o.date}</td><td class="p-2 border">{o.clientName} ({o.siteLocation})</td><td class="p-2 border text-center font-bold text-emerald-600">{parseNum(o.engFee).toLocaleString()}</td></tr>)}</tbody></table>
                        </div>
                      </div>
                    )
                  })()}
                </div>
              )}

              {/* 7. جهاز RTK */}
              {activeTab === 'rtk' && (
                <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border shadow-xs text-center font-bold space-y-4">
                  <h3 class="text-base text-indigo-700 dark:text-indigo-400">إيرادات جهاز RTK المجمعة</h3>
                  <div class="text-3xl font-black">{totalRtk.toLocaleString()} ج.م</div>
                  <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                    <div class="p-3 border rounded-2xl bg-indigo-50 dark:bg-slate-700">م. مندور (50%)<br/><strong class="text-base text-indigo-900 dark:text-indigo-300 mt-1 block">{(totalRtk*0.5).toLocaleString()}</strong></div>
                    <div class="p-3 border rounded-2xl">م. أسامة<br/><strong class="text-base mt-1 block">{((totalRtk*0.5)/3).toLocaleString()}</strong></div>
                    <div class="p-3 border rounded-2xl">م. أيمن<br/><strong class="text-base mt-1 block">{((totalRtk*0.5)/3).toLocaleString()}</strong></div>
                    <div class="p-3 border rounded-2xl">م. علاء<br/><strong class="text-base mt-1 block">{((totalRtk*0.5)/3).toLocaleString()}</strong></div>
                  </div>
                </div>
              )}

              {/* 8. الدفعات */}
              {activeTab === 'payments' && (
                <div class="space-y-4 font-bold">
                  <form onSubmit={handleAddPayment} class="bg-white dark:bg-slate-800 p-4 rounded-2xl border shadow-xs grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>العميل <select value={newPayment.clientName} onChange={e=>setNewPayment({...newPayment, clientName:e.target.value})} class="w-full border p-2.5 rounded-xl mt-1 dark:bg-slate-700" required><option value="">اختر</option>{clientNames.map(c=><option key={c}>{c}</option>)}</select></div>
                    <div>الموقع بالمزرعة <input type="text" value={newPayment.siteLocation} onChange={e=>setNewPayment({...newPayment, siteLocation:e.target.value})} placeholder="المحمية..." class="w-full border p-2.5 rounded-xl mt-1 dark:bg-slate-700"/></div>
                    <div>المبلغ <input type="number" value={newPayment.amount} onChange={e=>setNewPayment({...newPayment, amount:e.target.value})} class="w-full border p-2.5 rounded-xl mt-1 dark:bg-slate-700 text-emerald-600" required/></div>
                    <div>الملاحظات <input type="text" value={newPayment.notes} onChange={e=>setNewPayment({...newPayment, notes:e.target.value})} class="w-full border p-2.5 rounded-xl mt-1 dark:bg-slate-700"/></div>
                    <div class="sm:col-span-2"><button class="w-full bg-emerald-600 text-white py-3 rounded-2xl">تسجيل الدفعة</button></div>
                  </form>
                  <div class="bg-white dark:bg-slate-800 rounded-2xl border dark:border-slate-700 overflow-x-auto">
                    <table class="w-full text-right"><thead class="bg-slate-100 dark:bg-slate-700"><tr><th class="p-2">التاريخ</th><th class="p-2">العميل</th><th class="p-2">الموقع</th><th class="p-2 text-center">المبلغ</th>{isAdmin&&<th class="p-2 text-center">إجراء</th>}</tr></thead>
                    <tbody>{payments.map(p=><tr key={p.id} class="border-b dark:border-slate-700"><td class="p-2 whitespace-nowrap">{p.date}</td><td class="p-2">{p.clientName}</td><td class="p-2 text-amber-600">{p.siteLocation||'عام'}</td><td class="p-2 text-center text-emerald-600 font-black">{parseNum(p.amount).toLocaleString()}</td>{isAdmin&&<td class="p-2 text-center"><button onClick={()=>deleteItem('payments',p.id,payments,setPayments)} class="text-rose-600 p-1">🗑️</button></td>}</tr>)}</tbody></table>
                  </div>
                </div>
              )}

              {/* 9. أرباح المكتب */}
              {activeTab === 'office' && (
                <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border shadow-xs text-center font-bold space-y-4">
                  <h3 class="text-base">أرباح المكتب المجمعة</h3>
                  <div class="text-3xl font-black text-emerald-600">{Math.round(totalOffice).toLocaleString()} ج.م</div>
                  <div class="grid grid-cols-2 sm:grid-cols-5 gap-2.5">
                    <div class="p-3 border rounded-2xl bg-amber-50 dark:bg-slate-700">في سبيل الله (10%)<br/><strong class="text-base mt-1 block">{Math.round(totalOffice*0.1).toLocaleString()}</strong></div>
                    <div class="p-3 border rounded-2xl bg-blue-50 dark:bg-slate-700">م. أحمد نبيل (10%)<br/><strong class="text-base mt-1 block">{Math.round(totalOffice*0.1).toLocaleString()}</strong></div>
                    <div class="p-3 border rounded-2xl">م. أسامة<br/><strong class="text-base mt-1 block">{Math.round((totalOffice*0.8)/3).toLocaleString()}</strong></div>
                    <div class="p-3 border rounded-2xl">م. أيمن<br/><strong class="text-base mt-1 block">{Math.round((totalOffice*0.8)/3).toLocaleString()}</strong></div>
                    <div class="p-3 border rounded-2xl">م. علاء<br/><strong class="text-base mt-1 block">{Math.round((totalOffice*0.8)/3).toLocaleString()}</strong></div>
                  </div>
                </div>
              )}

              {/* 10. سجل الدخول للأدمن */}
              {activeTab === 'logs' && isSuperAdmin && (
                <div class="bg-white dark:bg-slate-800 rounded-2xl border dark:border-slate-700 overflow-x-auto">
                  <table class="w-full text-right"><thead class="bg-slate-100 dark:bg-slate-700"><tr><th class="p-2">الاسم</th><th class="p-2">الإيميل</th><th class="p-2">الوقت</th></tr></thead>
                  <tbody>{loginLogs.map((l,i)=><tr key={i} class="border-b dark:border-slate-700"><td class="p-2">{l.name}</td><td class="p-2">{l.email}</td><td class="p-2 whitespace-nowrap">{l.date}</td></tr>)}</tbody></table>
                </div>
              )}

              {/* 11. الإعدادات */}
              {activeTab === 'settings' && (
                <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border shadow-xs max-w-sm font-bold space-y-3">
                  <h3>🖼️ شعار الترويسة المعتمد:</h3>
                  <input type="file" accept="image/*" onChange={(e)=>{
                    if(!isAdmin) return;
                    const f = e.target.files[0]; if(!f) return;
                    const r = new FileReader(); r.onload = (evt) => {
                      setSettings(p=>({...p, logo: evt.target.result}));
                      if(db) db.ref('survey_data/settings/logo').set(evt.target.result);
                      showToast("تم تحديث الشعار!");
                    }; r.readAsDataURL(f);
                  }} class="w-full p-2 border rounded-xl dark:bg-slate-700"/>
                  {settings.logo && <img src={settings.logo} class="h-16 object-contain mt-2 border p-2 rounded-xl" />}
                </div>
              )}

            </main>
          </div>

          {/* Bottom Bar للهاتف */}
          <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-800 border-t dark:border-slate-700 px-2 py-1.5 flex justify-around items-center z-40 shadow-lg">
            <button onClick={()=>setActiveTab('dashboard')} class={`flex flex-col items-center py-1 px-2 rounded-xl transition ${activeTab==='dashboard'?'text-indigo-600 dark:text-indigo-400 font-black':'text-slate-500'}`}>
              <span class="text-base">📊</span>
              <span class="text-[9px] mt-0.5">الرئيسية</span>
            </button>
            <button onClick={()=>setActiveTab('extracts')} class={`flex flex-col items-center py-1 px-2 rounded-xl transition ${activeTab==='extracts'?'text-indigo-600 dark:text-indigo-400 font-black':'text-slate-500'}`}>
              <span class="text-base">📄</span>
              <span class="text-[9px] mt-0.5">المستخلص</span>
            </button>
            <button onClick={()=>setActiveTab('clients')} class={`flex flex-col items-center py-1 px-2 rounded-xl transition ${activeTab==='clients'?'text-indigo-600 dark:text-indigo-400 font-black':'text-slate-500'}`}>
              <span class="text-base">👥</span>
              <span class="text-[9px] mt-0.5">الأعمال</span>
            </button>
            <button onClick={()=>setActiveTab('vault')} class={`flex flex-col items-center py-1 px-2 rounded-xl transition ${activeTab==='vault'?'text-indigo-600 dark:text-indigo-400 font-black':'text-slate-500'}`}>
              <span class="text-base">💵</span>
              <span class="text-[9px] mt-0.5">الخزينة</span>
            </button>
            <button onClick={()=>setDrawerOpen(true)} class="flex flex-col items-center py-1 px-2 text-slate-500">
              <span class="text-base">☰</span>
              <span class="text-[9px] mt-0.5">المزيد</span>
            </button>
          </nav>

          {/* Toast */}
          {toast.show && <div class="fixed bottom-16 md:bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-2.5 rounded-2xl text-xs z-50 shadow-2xl font-bold">{toast.message}</div>}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
