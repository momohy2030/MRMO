<!DOCTYPE html>
<html lang="ar" dir="rtl" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام إدارة المساحة - Survey ERP Pro</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Cairo', 'sans-serif'] },
          colors: { brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' } }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-database-compat.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
    .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
    .dark .glass-card { background: rgba(30, 41, 59, 0.95); border: 1px solid rgba(255,255,255,0.05); }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    
    /* تصميم الفاتورة العصري للطباعة */
    @media print {
      body { background-color: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .print-hidden { display: none !important; }
      .invoice-box { box-shadow: none !important; border: none !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
    }
  </style>
</head>
<body class="text-slate-800 dark:text-slate-200 transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- إعدادات قاعدة البيانات ---
    const firebaseConfig = {
      apiKey: "AIzaSyDHjQTNfAh3wQ8tSOXOIewJNXaDCHADrR8",
      authDomain: "mrmo-d8760.firebaseapp.com",
      databaseURL: "https://mrmo-d8760-default-rtdb.firebaseio.com",
      projectId: "mrmo-d8760"
    };

    let db = null, auth = null;
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      auth = firebase.auth();
    }

    const parseNum = val => parseFloat(String(val).replace(/,/g, '')) || 0;

    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [activeModule, setActiveModule] = useState('dashboard');
      
      const [data, setData] = useState({ operations: [], transactions: [], settings: { logo: '' } });
      const [toast, setToast] = useState('');

      useEffect(() => {
        auth.onAuthStateChanged(u => { setUser(u); setLoading(false); });
        if (db) {
          db.ref('survey_pro').on('value', snap => {
            const val = snap.val() || {};
            setData({
              operations: Object.values(val.operations || {}).reverse(),
              transactions: Object.values(val.transactions || {}).reverse(),
              settings: val.settings || { logo: '' }
            });
          });
        }
      }, []);

      const showMsg = msg => { setToast(msg); setTimeout(() => setToast(''), 3000); };

      // --- واجهة المستخدم الرئيسية ---
      if (loading) return <div class="h-screen flex items-center justify-center font-bold text-brand-600">جاري التحميل...</div>;
      
      if (!user) return (
        <div class="h-screen flex items-center justify-center bg-slate-900 p-4">
          <div class="glass-card p-10 rounded-3xl w-full max-w-md text-center">
            <div class="w-20 h-20 bg-brand-600 text-white rounded-2xl flex items-center justify-center text-4xl mx-auto mb-6 shadow-lg shadow-brand-500/50">📐</div>
            <h1 class="text-3xl font-black text-slate-800 mb-2">مساحة Pro</h1>
            <p class="text-slate-500 mb-8 font-semibold">بوابة إدارة العمليات الهندسية</p>
            <button onClick={() => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())} class="w-full bg-slate-800 text-white py-4 rounded-xl font-bold text-lg hover:bg-black transition-all">
              تسجيل الدخول
            </button>
          </div>
        </div>
      );

      // حسابات سريعة (KPIs)
      const totalRevenue = data.operations.reduce((acc, op) => acc + parseNum(op.price), 0);
      const totalCollected = data.transactions.filter(t => t.type === 'in').reduce((acc, t) => acc + parseNum(t.amount), 0);
      const currentVault = totalCollected - data.transactions.filter(t => t.type === 'out').reduce((acc, t) => acc + parseNum(t.amount), 0);

      const navItems = [
        { id: 'dashboard', icon: '📊', label: 'نظرة عامة' },
        { id: 'operations', icon: '📋', label: 'أوامر الشغل' },
        { id: 'invoices', icon: '🧾', label: 'المستخلصات' },
        { id: 'finance', icon: '🏦', label: 'الخزينة والمالية' },
        { id: 'partners', icon: '🤝', label: 'أرباح الشركاء' }
      ];

      return (
        <div class="flex h-screen overflow-hidden bg-slate-100 dark:bg-slate-900">
          
          {/* القائمة الجانبية (Sidebar) - تصميم عصري */}
          <aside class="hidden md:flex flex-col w-72 bg-white dark:bg-slate-800 border-l border-slate-200 dark:border-slate-700 z-20">
            <div class="p-6 flex items-center gap-4 border-b border-slate-100 dark:border-slate-700">
              <div class="bg-brand-600 text-white w-10 h-10 rounded-xl flex items-center justify-center text-xl shadow-lg shadow-brand-500/30">📐</div>
              <div><h2 class="font-black text-lg text-slate-800 dark:text-white leading-none">مساحة Pro</h2><span class="text-[10px] text-slate-400 font-bold tracking-wider uppercase">Enterprise</span></div>
            </div>
            <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
              {navItems.map(item => (
                <button key={item.id} onClick={() => setActiveModule(item.id)} class={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl font-bold transition-all duration-200 ${activeModule === item.id ? 'bg-brand-50 dark:bg-brand-900/30 text-brand-600 dark:text-brand-400' : 'text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-700/50'}`}>
                  <span class="text-xl">{item.icon}</span> <span>{item.label}</span>
                </button>
              ))}
            </nav>
            <div class="p-4 border-t border-slate-100 dark:border-slate-700">
              <a href="index.html" class="flex items-center justify-center gap-2 w-full bg-slate-800 hover:bg-slate-900 text-white py-3 rounded-xl font-bold text-sm transition"><span>🏗️</span> العودة للإنشاءات</a>
            </div>
          </aside>

          {/* مساحة العمل الرئيسية (Main Workspace) */}
          <main class="flex-1 flex flex-col h-full overflow-hidden relative">
            <header class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 px-6 py-4 flex justify-between items-center z-10">
              <h2 class="text-xl font-black text-slate-800 dark:text-white">{navItems.find(i=>i.id===activeModule)?.label}</h2>
              <div class="flex items-center gap-4">
                <div class="text-xs font-bold text-slate-500 bg-slate-100 dark:bg-slate-700 px-3 py-1.5 rounded-full">{user.email}</div>
              </div>
            </header>

            <div class="flex-1 overflow-y-auto p-4 md:p-8">
              
              {/* --- 1. Dashboard --- */}
              {activeModule === 'dashboard' && (
                <div class="space-y-6 max-w-6xl mx-auto">
                  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="glass-card p-6 rounded-3xl border-l-4 border-brand-500">
                      <p class="text-sm font-bold text-slate-500 mb-1">إجمالي حجم الأعمال</p>
                      <h3 class="text-3xl font-black text-slate-800">{totalRevenue.toLocaleString()} <span class="text-sm font-bold text-slate-400">ج.م</span></h3>
                    </div>
                    <div class="glass-card p-6 rounded-3xl border-l-4 border-emerald-500">
                      <p class="text-sm font-bold text-slate-500 mb-1">التحصيلات النقدية</p>
                      <h3 class="text-3xl font-black text-emerald-600">{totalCollected.toLocaleString()} <span class="text-sm font-bold text-emerald-400">ج.م</span></h3>
                    </div>
                    <div class="glass-card p-6 rounded-3xl border-l-4 border-slate-800">
                      <p class="text-sm font-bold text-slate-500 mb-1">صافي الخزينة الحالي</p>
                      <h3 class="text-3xl font-black text-slate-800">{currentVault.toLocaleString()} <span class="text-sm font-bold text-slate-400">ج.م</span></h3>
                    </div>
                  </div>
                  
                  <div class="glass-card p-8 rounded-3xl text-center py-20">
                    <div class="text-6xl mb-4">✨</div>
                    <h2 class="text-2xl font-black text-slate-800 mb-2">مرحباً بك في النظام المطور</h2>
                    <p class="text-slate-500 font-semibold max-w-lg mx-auto">تم تصميم هذه الواجهة لتكون خالية من التعقيد، للتركيز فقط على إدخال أوامر الشغل واستخراج الفواتير بشكل آلي واحترافي.</p>
                  </div>
                </div>
              )}

              {/* --- 2. Operations (أوامر الشغل) --- */}
              {activeModule === 'operations' && (
                <div class="max-w-6xl mx-auto space-y-6">
                  <div class="glass-card p-6 rounded-3xl">
                    <h3 class="text-lg font-black text-slate-800 mb-4 flex items-center gap-2"><span>➕</span> إضافة أمر شغل جديد</h3>
                    <form onSubmit={e => {
                      e.preventDefault();
                      const fd = new FormData(e.target);
                      const op = {
                        id: Date.now(),
                        date: fd.get('date'),
                        client: fd.get('client'),
                        site: fd.get('site'),
                        desc: fd.get('desc'),
                        price: parseNum(fd.get('price')),
                        expenses: parseNum(fd.get('expenses')),
                        engineer: fd.get('engineer')
                      };
                      const newOps = [op, ...data.operations];
                      db.ref('survey_pro/operations').set(newOps);
                      e.target.reset();
                      showMsg('تم تسجيل أمر الشغل بنجاح!');
                    }} class="grid grid-cols-1 md:grid-cols-4 gap-4">
                      <div><label class="block text-xs font-bold text-slate-500 mb-1">التاريخ</label><input name="date" type="date" defaultValue={new Date().toISOString().split('T')[0]} class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-bold outline-none focus:border-brand-500 transition" required/></div>
                      <div><label class="block text-xs font-bold text-slate-500 mb-1">العميل</label><input name="client" type="text" placeholder="اسم العميل أو الشركة" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-bold outline-none focus:border-brand-500 transition" required/></div>
                      <div><label class="block text-xs font-bold text-slate-500 mb-1">الموقع / المشروع</label><input name="site" type="text" placeholder="مثال: محور 26 يوليو" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-bold outline-none focus:border-brand-500 transition" required/></div>
                      <div><label class="block text-xs font-bold text-slate-500 mb-1">المهندس المشرف</label><input name="engineer" type="text" defaultValue="م. أحمد نبيل" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-bold outline-none focus:border-brand-500 transition" required/></div>
                      
                      <div class="md:col-span-2"><label class="block text-xs font-bold text-slate-500 mb-1">وصف العمل الفني (يظهر في المستخلص)</label><input name="desc" type="text" placeholder="تخطيط 80 فدان ورفع شبكي..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-bold outline-none focus:border-brand-500 transition" required/></div>
                      <div><label class="block text-xs font-bold text-slate-500 mb-1">إجمالي قيمة العمل المتفق عليه</label><input name="price" type="number" placeholder="0" class="w-full bg-brand-50 border border-brand-200 text-brand-700 rounded-xl p-3 font-black outline-none focus:border-brand-500 transition" required/></div>
                      <div><label class="block text-xs font-bold text-slate-500 mb-1">مصاريف التشغيل (عمالة وسيارات)</label><input name="expenses" type="number" defaultValue="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-bold outline-none focus:border-brand-500 transition"/></div>
                      
                      <div class="md:col-span-4 mt-2"><button type="submit" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-3.5 rounded-xl shadow-lg transition">حفظ أمر الشغل</button></div>
                    </form>
                  </div>

                  <div class="glass-card rounded-3xl overflow-hidden">
                    <div class="p-6 border-b border-slate-100 bg-white"><h3 class="text-lg font-black text-slate-800">سجل الأعمال الميدانية</h3></div>
                    <div class="overflow-x-auto">
                      <table class="w-full text-right text-sm">
                        <thead class="bg-slate-50 text-slate-500 border-b border-slate-100">
                          <tr><th class="p-4 font-bold">التاريخ</th><th class="p-4 font-bold">العميل والموقع</th><th class="p-4 font-bold">البيان</th><th class="p-4 font-bold">المهندس</th><th class="p-4 font-bold text-center">القيمة</th><th class="p-4"></th></tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100 bg-white">
                          {data.operations.map(op => (
                            <tr key={op.id} class="hover:bg-slate-50 transition">
                              <td class="p-4 font-semibold text-slate-600 whitespace-nowrap">{op.date}</td>
                              <td class="p-4">
                                <span class="block font-black text-slate-800">{op.client}</span>
                                <span class="block text-xs text-slate-500">{op.site}</span>
                              </td>
                              <td class="p-4 font-semibold text-slate-700 max-w-[200px] truncate">{op.desc}</td>
                              <td class="p-4 font-semibold text-slate-600">{op.engineer}</td>
                              <td class="p-4 text-center font-black text-brand-600">{op.price.toLocaleString()}</td>
                              <td class="p-4 text-center">
                                <button onClick={() => { if(confirm('حذف؟')) db.ref('survey_pro/operations').set(data.operations.filter(o=>o.id!==op.id)); }} class="text-rose-400 hover:text-rose-600 p-2 bg-rose-50 rounded-lg">حذف</button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* --- 3. Invoices (المستخلصات الاحترافية) --- */}
              {activeModule === 'invoices' && (() => {
                const clients = Array.from(new Set(data.operations.map(o=>o.client)));
                const [selClient, setSelClient] = useState("");
                
                const clientOps = data.operations.filter(o => o.client === selClient);
                const clientPays = data.transactions.filter(t => t.type === 'in' && t.client === selClient);
                
                const totalBilled = clientOps.reduce((s,o)=>s+parseNum(o.price),0);
                const totalPaid = clientPays.reduce((s,t)=>s+parseNum(t.amount),0);
                const due = totalBilled - totalPaid;

                return (
                  <div class="max-w-5xl mx-auto space-y-6">
                    <div class="glass-card p-6 rounded-3xl flex flex-col md:flex-row gap-4 justify-between items-center print-hidden">
                      <div class="w-full md:w-1/2">
                        <label class="block text-xs font-bold text-slate-500 mb-2">استخراج مستخلص لعميل:</label>
                        <select value={selClient} onChange={e=>setSelClient(e.target.value)} class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-bold outline-none focus:border-brand-500">
                          <option value="">-- اختر العميل --</option>{clients.map(c=><option key={c}>{c}</option>)}
                        </select>
                      </div>
                      {selClient && (
                        <div class="flex gap-2 w-full md:w-auto">
                          <button onClick={()=>window.print()} class="flex-1 bg-slate-800 text-white px-6 py-3 rounded-xl font-bold flex items-center justify-center gap-2">🖨️ طباعة</button>
                          <button onClick={()=>{
                            const msg = `مستخلص أعمال مساحية\nالعميل: ${selClient}\nإجمالي الأعمال: ${totalBilled}\nالمدفوع: ${totalPaid}\nالمستحق: ${due}`;
                            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
                          }} class="flex-1 bg-emerald-500 text-white px-6 py-3 rounded-xl font-bold flex items-center justify-center gap-2">📲 إرسال</button>
                        </div>
                      )}
                    </div>

                    {selClient && (
                      <div class="bg-white p-8 md:p-12 rounded-[2rem] shadow-sm border border-slate-200 invoice-box mx-auto">
                        {/* Header الفاتورة */}
                        <div class="flex justify-between items-start border-b-2 border-slate-100 pb-8 mb-8">
                          <div>
                            <h1 class="text-3xl font-black text-slate-900 tracking-tight mb-2">مستخلص أعمال</h1>
                            <div class="text-slate-500 font-semibold text-sm">
                              <p>التاريخ: {new Date().toLocaleDateString('ar-EG')}</p>
                              <p>رقم المرجع: INV-{Math.floor(Math.random()*10000)}</p>
                            </div>
                          </div>
                          <div class="text-left">
                            <h2 class="text-xl font-black text-brand-600 mb-1">مكتب مساحة</h2>
                            <p class="text-sm text-slate-500 font-semibold">للاستشارات الهندسية والمقاولات</p>
                          </div>
                        </div>

                        {/* Customer Info */}
                        <div class="mb-8">
                          <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">فاتورة مقدمة إلى:</p>
                          <h3 class="text-xl font-black text-slate-800">{selClient}</h3>
                        </div>

                        {/* Table */}
                        <table class="w-full text-right mb-8">
                          <thead>
                            <tr class="text-slate-400 text-sm border-b-2 border-slate-100">
                              <th class="pb-3 font-bold w-12 text-center">م</th>
                              <th class="pb-3 font-bold">البيان والموقع</th>
                              <th class="pb-3 font-bold">التاريخ</th>
                              <th class="pb-3 font-bold text-left">المبلغ</th>
                            </tr>
                          </thead>
                          <tbody class="text-sm font-semibold text-slate-700">
                            {clientOps.map((o,i)=>(
                              <tr key={o.id} class="border-b border-slate-50">
                                <td class="py-4 text-center text-slate-400">{i+1}</td>
                                <td class="py-4"><strong class="text-slate-800 block">{o.desc}</strong><span class="text-xs text-slate-500">{o.site}</span></td>
                                <td class="py-4 text-slate-500">{o.date}</td>
                                <td class="py-4 text-left font-black text-slate-900">{parseNum(o.price).toLocaleString()}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>

                        {/* Totals */}
                        <div class="flex justify-end">
                          <div class="w-full md:w-1/2 space-y-3 text-sm">
                            <div class="flex justify-between items-center font-bold text-slate-600">
                              <span>إجمالي الأعمال المنفذة:</span>
                              <span>{totalBilled.toLocaleString()} ج.م</span>
                            </div>
                            <div class="flex justify-between items-center font-bold text-emerald-600 border-b border-slate-100 pb-3">
                              <span>دفعات محصلة مسبقاً:</span>
                              <span>- {totalPaid.toLocaleString()} ج.م</span>
                            </div>
                            <div class="flex justify-between items-center font-black text-xl text-slate-900 pt-2">
                              <span>الصافي المستحق:</span>
                              <span>{due.toLocaleString()} ج.م</span>
                            </div>
                          </div>
                        </div>

                        {/* Signatures */}
                        <div class="mt-20 flex justify-between text-center text-sm font-bold text-slate-500">
                          <div>
                            <p class="mb-8">اعتماد المكتب الهندسي</p>
                            <div class="w-40 border-b-2 border-slate-200 mx-auto"></div>
                          </div>
                          <div>
                            <p class="mb-8">توقيع المالك بالاستلام</p>
                            <div class="w-40 border-b-2 border-slate-200 mx-auto"></div>
                          </div>
                        </div>

                      </div>
                    )}
                  </div>
                );
              })()}

              {/* --- 4. Finance (المالية) --- */}
              {activeModule === 'finance' && (
                <div class="max-w-5xl mx-auto space-y-6">
                  <div class="glass-card p-6 rounded-3xl grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                    <div class="md:col-span-4"><h3 class="font-black text-slate-800 border-b pb-2">تسجيل حركة مالية بالخزينة</h3></div>
                    <div><label class="block text-xs font-bold text-slate-500 mb-1">التاريخ</label><input id="txDate" type="date" defaultValue={todayDate} class="w-full bg-slate-50 border rounded-xl p-3 font-bold"/></div>
                    <div><label class="block text-xs font-bold text-slate-500 mb-1">النوع</label><select id="txType" class="w-full bg-slate-50 border rounded-xl p-3 font-bold"><option value="in">وارد (تحصيل)</option><option value="out">صادر (مصروف)</option></select></div>
                    <div><label class="block text-xs font-bold text-slate-500 mb-1">العميل / البيان</label><input id="txClient" type="text" placeholder="اسم العميل أو وصف الصرف" class="w-full bg-slate-50 border rounded-xl p-3 font-bold"/></div>
                    <div><label class="block text-xs font-bold text-slate-500 mb-1">المبلغ</label>
                      <div class="flex gap-2">
                        <input id="txAmount" type="number" placeholder="0" class="w-full bg-slate-50 border rounded-xl p-3 font-bold"/>
                        <button onClick={()=>{
                          const date = document.getElementById('txDate').value;
                          const type = document.getElementById('txType').value;
                          const client = document.getElementById('txClient').value;
                          const amount = parseNum(document.getElementById('txAmount').value);
                          if(!client || !amount) return;
                          const t = { id: Date.now(), date, type, client, amount };
                          db.ref('survey_pro/transactions').set([t, ...data.transactions]);
                          document.getElementById('txAmount').value = '';
                          showMsg('تم حفظ الحركة!');
                        }} class="bg-brand-600 text-white px-4 rounded-xl font-bold">+</button>
                      </div>
                    </div>
                  </div>

                  <div class="glass-card rounded-3xl overflow-hidden">
                    <div class="p-6 border-b border-slate-100 bg-white"><h3 class="text-lg font-black text-slate-800">سجل الخزينة</h3></div>
                    <table class="w-full text-right text-sm">
                      <thead class="bg-slate-50 text-slate-500 border-b border-slate-100">
                        <tr><th class="p-4 font-bold">التاريخ</th><th class="p-4 font-bold">الحركة</th><th class="p-4 font-bold">البيان والعميل</th><th class="p-4 font-bold text-center">المبلغ</th></tr>
                      </thead>
                      <tbody class="divide-y divide-slate-100 bg-white">
                        {data.transactions.map(t => (
                          <tr key={t.id} class="hover:bg-slate-50">
                            <td class="p-4 font-semibold text-slate-500">{t.date}</td>
                            <td class="p-4 font-bold">{t.type==='in'?<span class="text-emerald-500 bg-emerald-50 px-2 py-1 rounded">وارد 📥</span>:<span class="text-rose-500 bg-rose-50 px-2 py-1 rounded">صادر 📤</span>}</td>
                            <td class="p-4 font-bold text-slate-800">{t.client}</td>
                            <td class={`p-4 text-center font-black ${t.type==='in'?'text-emerald-600':'text-rose-600'}`}>{t.amount.toLocaleString()}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* --- 5. Partners (حسابات الخلفية الآلية) --- */}
              {activeModule === 'partners' && (() => {
                // الحسابات الآلية (مثال مبسط وواضح)
                const totalDevice = data.operations.reduce((acc, op) => acc + (op.price * 0.40), 0); // افترضنا 40% للجهاز
                const totalOffice = data.operations.reduce((acc, op) => acc + (op.price * 0.20), 0); // 20% للمكتب

                return (
                  <div class="max-w-5xl mx-auto space-y-6">
                    <div class="glass-card p-10 rounded-3xl text-center bg-brand-900 text-white relative overflow-hidden">
                      <div class="absolute top-0 right-0 w-64 h-64 bg-white opacity-5 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2"></div>
                      <h2 class="text-2xl font-black mb-2 relative z-10">لوحة الشركاء والأرباح الآلية</h2>
                      <p class="text-brand-200 font-semibold mb-8 relative z-10">تُحسب هذه الأرقام تلقائياً بناءً على إجمالي الأعمال المسجلة، دون التأثير على شكل الفواتير أو الخزينة.</p>
                      
                      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 relative z-10">
                        <div class="bg-black/20 p-6 rounded-2xl border border-white/10">
                          <p class="text-brand-300 font-bold mb-1">إجمالي أرباح جهاز RTK</p>
                          <h3 class="text-4xl font-black text-white">{totalDevice.toLocaleString()}</h3>
                          <div class="mt-4 pt-4 border-t border-white/10 flex justify-between text-sm font-bold">
                            <span>أ. مندور: {(totalDevice*0.5).toLocaleString()}</span>
                            <span>الشركاء: {(totalDevice*0.5).toLocaleString()}</span>
                          </div>
                        </div>
                        <div class="bg-black/20 p-6 rounded-2xl border border-white/10">
                          <p class="text-brand-300 font-bold mb-1">إجمالي أرباح المكتب</p>
                          <h3 class="text-4xl font-black text-white">{totalOffice.toLocaleString()}</h3>
                          <div class="mt-4 pt-4 border-t border-white/10 flex justify-between text-sm font-bold">
                            <span>صندوق الخير: {(totalOffice*0.1).toLocaleString()}</span>
                            <span>الشركاء: {(totalOffice*0.9).toLocaleString()}</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                );
              })()}

            </div>
          </main>

          {/* Bottom Nav للموبايل */}
          <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200 flex justify-around p-2 z-50 shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
            {navItems.map(item => (
              <button key={item.id} onClick={() => setActiveModule(item.id)} class={`flex flex-col items-center p-2 rounded-xl transition ${activeModule === item.id ? 'text-brand-600 scale-110' : 'text-slate-400'}`}>
                <span class="text-xl mb-1">{item.icon}</span><span class="text-[9px] font-black tracking-wide">{item.label}</span>
              </button>
            ))}
          </nav>

          {/* Toast */}
          {toast && <div class="fixed top-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-2xl text-sm font-bold shadow-2xl z-50 animate-bounce">{toast}</div>}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
