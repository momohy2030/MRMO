<!DOCTYPE html>
<html lang="ar" dir="rtl" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام إدارة الأعمال المساحية - SURVEY ERP</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: { fontFamily: { sans: ['Cairo', 'sans-serif'] } }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-database-compat.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Cairo', sans-serif; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    @media print {
      body { background-color: white !important; font-size: 11px; }
      .print-hidden { display: none !important; }
      .print-area { box-shadow: none !important; border: none !important; width: 100% !important; margin: 0 !important; }
      .dark .print-area { color: black !important; background: white !important; }
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 antialiased transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyDHjQTNfAh3wQ8tSOXOIewJNXaDCHADrR8",
      authDomain: "mrmo-d8760.firebaseapp.com",
      databaseURL: "https://mrmo-d8760-default-rtdb.firebaseio.com",
      projectId: "mrmo-d8760",
      storageBucket: "mrmo-d8760.firebasestorage.app",
      messagingSenderId: "510855132508",
      appId: "1:510855132508:web:feee377429a2d88c277d99",
      measurementId: "G-N9DW5R28H0"
    };

    const SUPER_ADMIN_EMAIL = "mohamedmo686686@gmail.com";
    const ADMIN_EMAILS = [SUPER_ADMIN_EMAIL, "mohamedmohy676676@gmail.com", "+201095545982"];

    let db = null;
    let auth = null;
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      auth = firebase.auth();
      auth.languageCode = 'ar';
    } catch (e) { console.error(e); }

    const parseNum = (val) => {
      if (typeof val === "number") return isNaN(val) ? 0 : val;
      if (!val) return 0;
      const clean = String(val).replace(/,/g, '').replace(/،/g, '.').trim();
      const n = parseFloat(clean);
      return isNaN(n) ? 0 : n;
    };

    const generatePdfAndOpenWhatsApp = (elementId, filename, textMessage, targetPhone = "201095545982") => {
      const element = document.getElementById(elementId);
      if (!element) return;
      const opt = {
        margin: [6, 6, 6, 6], filename: filename, image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(element).save().then(() => {
        const cleanPhone = targetPhone.replace(/[^0-9]/g, '');
        window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(textMessage)}`, '_blank');
      });
    };

    function App() {
      const [user, setUser] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);
      const [isSuperAdmin, setIsSuperAdmin] = useState(false);
      const [authLoading, setAuthLoading] = useState(true);

      const [activeTab, setActiveTab] = useState("dashboard");
      const [sidebarOpen, setSidebarOpen] = useState(false);
      
      const [operations, setOperations] = useState([]);
      const [transactions, setTransactions] = useState([]);
      const [payments, setPayments] = useState([]);
      const [loginLogs, setLoginLogs] = useState([]);
      
      const [settings, setSettings] = useState({
        engineers: ["م أحمد نبيل", "م أيمن", "م علاء", "م أسامة"],
        opTypes: ["رفع شبكي", "توقيع مساحي", "كروكي تقنين", "حساب كميات"],
        logo: "",
        theme: localStorage.getItem('theme') || 'light'
      });

      const todayDate = new Date().toISOString().split('T')[0];
      const currentMonthStr = todayDate.substring(0, 7);

      const [vaultMonth, setVaultMonth] = useState(currentMonthStr);
      const [opsFilterMonth, setOpsFilterMonth] = useState(currentMonthStr);
      const [toast, setToast] = useState({ show: false, message: "" });
      
      // حالة المستخلص
      const [selectedClientForExtract, setSelectedClientForExtract] = useState("");
      const [extractRates, setExtractRates] = useState({});
      const [selectedExtractEng, setSelectedExtractEng] = useState("");

      const [selectedEngineerForStatement, setSelectedEngineerForStatement] = useState("");

      useEffect(() => {
        if (settings.theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', settings.theme);
      }, [settings.theme]);

      const showToast = (message) => {
        setToast({ show: true, message });
        setTimeout(() => setToast({ show: false, message: "" }), 3000);
      };

      const [newOp, setNewOp] = useState({
        date: todayDate, clientName: "", opType: "", workDescription: "", engineer: "م أحمد نبيل",
        isFaddan: false, faddanQty: 1, faddanPrice: 0,
        isSketch: false, sketchesCount: 1,
        agreedAmount: 0, paidNow: 0, laborCost: 0, carCost: 0,
        engDayType: "full",
        deviceDayType: "full"
      });

      const [newPayment, setNewPayment] = useState({ date: todayDate, clientName: "", amount: "", notes: "" });
      const [newTx, setNewTx] = useState({ date: todayDate, type: "income", category: "إيراد عام", amount: "", notes: "" });

      useEffect(() => {
        if (!auth) { setAuthLoading(false); return; }
        return auth.onAuthStateChanged((curr) => {
          if (curr) {
            const email = (curr.email || "").toLowerCase();
            setUser(curr);
            setIsSuperAdmin(email === SUPER_ADMIN_EMAIL.toLowerCase());
            setIsAdmin(ADMIN_EMAILS.some(e => email.includes(e.toLowerCase())));

            if (db && !sessionStorage.getItem('survey_log')) {
              db.ref('survey_data/login_logs').push({ name: curr.displayName||curr.email, email, date: new Date().toLocaleString('ar-EG') });
              sessionStorage.setItem('survey_log', 'true');
            }
          } else {
            setUser(null); setIsAdmin(false); setIsSuperAdmin(false);
          }
          setAuthLoading(false);
        });
      }, []);

      useEffect(() => {
        if (!db) return;
        const ref = db.ref('survey_data');
        ref.on('value', (snap) => {
          const d = snap.val() || {};
          const toArr = (v) => (v ? (Array.isArray(v) ? v : Object.values(v)) : []);
          setOperations(toArr(d.operations).reverse());
          setTransactions(toArr(d.transactions).reverse());
          setPayments(toArr(d.payments).reverse());
          setLoginLogs(toArr(d.login_logs).reverse());
          
          if (d.settings) {
            setSettings(prev => ({
              ...prev,
              engineers: d.settings.engineers || prev.engineers,
              opTypes: d.settings.opTypes || prev.opTypes,
              logo: d.settings.logo || prev.logo
            }));
          }
        });
      }, []);

      const updateSettingArray = (key, title) => {
        const val = prompt(`إضافة ${title} جديد:`);
        if (val && val.trim()) {
          const updated = [...settings[key], val.trim()];
          setSettings(p => ({ ...p, [key]: updated }));
          if(db) db.ref(`survey_data/settings/${key}`).set(updated);
        }
      };

      const calculateOperationShares = (op) => {
        const total = parseNum(op.agreedAmount);
        let engFee = 0, deviceFee = 0, officeFee = 0;

        if (op.engDayType === 'full') engFee = 2000;
        else if (op.engDayType === 'half') engFee = 1500;
        else if (op.engDayType === 'percent') engFee = total * 0.80;

        if (op.deviceDayType === 'full') deviceFee = 3500;
        else if (op.deviceDayType === 'half') deviceFee = 1750;
        else deviceFee = 0;

        if (op.engDayType === 'percent') {
          officeFee = total * 0.20; 
        } else {
          officeFee = Math.max(0, total - engFee - deviceFee - parseNum(op.laborCost) - parseNum(op.carCost));
        }

        return { engFee, deviceFee, officeFee };
      };

      const handleAddOperation = (e) => {
        e.preventDefault();
        const total = newOp.isFaddan ? parseNum(newOp.faddanQty) * parseNum(newOp.faddanPrice) : parseNum(newOp.agreedAmount);
        const finalOp = { ...newOp, agreedAmount: total };
        const shares = calculateOperationShares(finalOp);

        const opToSave = {
          id: Date.now(), ...finalOp, ...shares, createdBy: user.email
        };

        const updatedOps = [opToSave, ...operations];
        setOperations(updatedOps);
        if (db) db.ref('survey_data/operations').set(updatedOps);

        if (parseNum(newOp.paidNow) > 0) {
          const autoPay = { id: Date.now() + 1, date: newOp.date, clientName: newOp.clientName, amount: parseNum(newOp.paidNow), notes: `مقدم عملية (${newOp.workDescription})` };
          const autoTx = { id: Date.now() + 2, date: newOp.date, type: "income", category: "تحصيل مساحة مقدم", clientOrEntity: newOp.clientName, amount: parseNum(newOp.paidNow) };
          setPayments([autoPay, ...payments]);
          setTransactions([autoTx, ...transactions]);
          if(db){
            db.ref('survey_data/payments').set([autoPay, ...payments]);
            db.ref('survey_data/transactions').set([autoTx, ...transactions]);
          }
        }
        showToast("تم حفظ العملية بنجاح! ✅");
      };

      const handleAddPayment = (e) => {
        e.preventDefault();
        const item = { id: Date.now(), ...newPayment, amount: parseNum(newPayment.amount) };
        const tx = { id: Date.now()+1, date: item.date, type: 'income', category: 'سداد دفعة مساحة', clientOrEntity: item.clientName, amount: item.amount };
        
        const upPay = [item, ...payments];
        const upTx = [tx, ...transactions];
        setPayments(upPay); setTransactions(upTx);
        if (db) { db.ref('survey_data/payments').set(upPay); db.ref('survey_data/transactions').set(upTx); }
        setNewPayment({ date: todayDate, clientName: "", amount: "", notes: "" });
        showToast("تم قيد الدفعة للعميل وخصمها من الرصيد المستحق! 💰");
      };

      const handleAddTransaction = (e) => {
        e.preventDefault();
        const item = { id: Date.now(), ...newTx, amount: parseNum(newTx.amount) };
        const updated = [item, ...transactions];
        setTransactions(updated);
        if(db) db.ref('survey_data/transactions').set(updated);
        setNewTx({ date: todayDate, type: "income", category: "إيراد عام", amount: "", notes: "" });
        showToast("تم حفظ الحركة بالخزينة!");
      };

      const deleteItem = (path, id, list, setter) => {
        if (!isAdmin) { showToast("مرفوض. للإدارة فقط 🔒"); return; }
        if (window.confirm("تأكيد الحذف النهائي؟")) {
          const updated = list.filter(item => item.id !== id);
          setter(updated);
          if (db) db.ref(`survey_data/${path}`).set(updated);
          showToast("تم الحذف بنجاح!");
        }
      };

      const clientNames = Array.from(new Set([...operations.map(o=>o.clientName), ...payments.map(p=>p.clientName)])).filter(Boolean);
      
      // 1. حسابات الخزينة (الشهر المحدد + التراكمي حتى ذلك الشهر)
      const monthlyTx = transactions.filter(t => t.date && t.date.startsWith(vaultMonth));
      const mIn = monthlyTx.filter(t=>t.type==='income').reduce((s,t)=>s+parseNum(t.amount),0);
      const mOut = monthlyTx.filter(t=>t.type==='expense').reduce((s,t)=>s+parseNum(t.amount),0);
      const mNet = mIn - mOut;

      const cumulativeTx = transactions.filter(t => t.date && t.date.substring(0, 7) <= vaultMonth);
      const cumIn = cumulativeTx.filter(t=>t.type==='income').reduce((s,t)=>s+parseNum(t.amount),0);
      const cumOut = cumulativeTx.filter(t=>t.type==='expense').reduce((s,t)=>s+parseNum(t.amount),0);
      const cumNet = cumIn - cumOut;

      // 2. العمليات بالشهر
      const filteredOpsByMonth = operations.filter(o => o.date && o.date.startsWith(opsFilterMonth));
      const monthOpsTotal = filteredOpsByMonth.reduce((s,o)=>s+parseNum(o.agreedAmount),0);

      // 3. أرباح الجهاز والمكتب
      const totalRtk = operations.reduce((s,o)=>s+(o.deviceFee||0),0);
      const totalOffice = operations.reduce((s,o)=>s+(o.officeFee||0),0);

      const navTabs = [
        { id: "dashboard", label: "لوحة التحكم", icon: "📊" },
        { id: "vault", label: "الخزينة بالشهر", icon: "💵" },
        { id: "clients", label: "الأعمال والعملاء", icon: "👥" },
        { id: "expenses", label: "مصاريف التشغيل", icon: "🚗" },
        { id: "engineers", label: "حساب المهندسين", icon: "👷" },
        { id: "rtk", label: "جهاز RTK", icon: "🛰️" },
        { id: "payments", label: "الدفعات", icon: "💰" },
        { id: "extracts", label: "المستخلص الهندسي", icon: "📄" },
        { id: "office", label: "أرباح المكتب", icon: "🏢" },
        ...(isSuperAdmin ? [{ id: "logs", label: "سجل الدخول", icon: "🛡️" }] : []),
        { id: "settings", label: "الإعدادات", icon: "⚙️" }
      ];

      if (authLoading) return <div class="min-h-screen flex items-center justify-center bg-slate-900 text-white font-bold">جاري التهيئة...</div>;

      if (!user) {
        return (
          <div class="min-h-screen flex items-center justify-center bg-slate-900 p-4">
            <div class="bg-white p-8 rounded-3xl max-w-sm w-full text-center shadow-2xl">
              <div class="text-5xl mb-4">📐</div>
              <h2 class="text-2xl font-black text-slate-800">نظام المساحة ERP</h2>
              <button onClick={() => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())} class="mt-6 w-full bg-slate-900 text-white py-3 rounded-xl font-bold shadow-md">الدخول بحساب Google</button>
            </div>
          </div>
        );
      }

      return (
        <div class="flex h-screen overflow-hidden">
          {/* شريط جانبي (Sidebar) */}
          <aside class={`fixed md:relative z-40 w-64 h-full bg-slate-900 text-slate-300 flex flex-col transition-transform duration-300 ${sidebarOpen ? 'translate-x-0' : 'translate-x-full md:translate-x-0'}`}>
            <div class="p-4 border-b border-slate-800 flex justify-between items-center">
              <h1 class="font-black text-white text-lg flex items-center gap-2"><span>📐</span> مساحة ERP</h1>
              <button onClick={()=>setSidebarOpen(false)} class="md:hidden text-white text-xl">✕</button>
            </div>
            
            <div class="p-3 pb-0">
              <a href="index.html" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-2.5 rounded-xl font-bold flex items-center justify-center gap-2 text-xs shadow-md transition">
                <span>🏗️</span> العودة لبوابة الإنشاءات
              </a>
            </div>

            <nav class="flex-1 overflow-y-auto p-3 space-y-1 text-sm font-bold">
              {navTabs.map(t => (
                <button key={t.id} onClick={() => { setActiveTab(t.id); setSidebarOpen(false); }} class={`w-full text-right flex items-center gap-3 p-3 rounded-xl transition ${activeTab===t.id ? 'bg-indigo-600 text-white' : 'hover:bg-slate-800'}`}>
                  <span class="text-lg">{t.icon}</span> <span>{t.label}</span>
                </button>
              ))}
            </nav>
            <div class="p-4 border-t border-slate-800 text-xs">
              <div class="truncate text-slate-400 mb-2">{user.email}</div>
              <button onClick={()=>auth.signOut()} class="w-full bg-rose-600/20 text-rose-400 py-2 rounded-lg font-bold">تسجيل الخروج</button>
            </div>
          </aside>

          {/* محتوى الشاشة الرئيسي */}
          <main class="flex-1 flex flex-col h-full bg-slate-50 dark:bg-slate-900 relative">
            <header class="bg-white dark:bg-slate-800 border-b dark:border-slate-700 p-4 flex justify-between items-center shadow-sm">
              <div class="flex items-center gap-3">
                <button onClick={()=>setSidebarOpen(true)} class="md:hidden text-2xl dark:text-white">☰</button>
                <h2 class="font-black text-lg text-indigo-700 dark:text-indigo-400">{navTabs.find(t=>t.id===activeTab)?.label}</h2>
              </div>
              <div class="flex items-center gap-2">
                <button onClick={() => setSettings(p=>({...p, theme: p.theme==='dark'?'light':'dark'}))} class="p-2 bg-slate-100 dark:bg-slate-700 rounded-lg text-lg">
                  {settings.theme === 'dark' ? '☀️' : '🌙'}
                </button>
                <a href="index.html" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-bold text-xs flex items-center gap-1.5 shadow transition">
                  <span>🏗️</span> <span class="hidden sm:inline">قطاع الإنشاءات</span>
                </a>
              </div>
            </header>

            <div class="flex-1 overflow-y-auto p-4 md:p-6 pb-20">
              
              {/* 1. لوحة التحكم */}
              {activeTab === 'dashboard' && (
                <div class="space-y-6">
                  <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
                    <div class="bg-white dark:bg-slate-800 p-3.5 rounded-2xl border dark:border-slate-700 shadow-sm"><span class="text-slate-400 font-bold block text-[10px]">إجمالي الأعمال</span><strong class="text-indigo-600 text-base font-black">{operations.reduce((s,o)=>s+parseNum(o.agreedAmount),0).toLocaleString()} ج.م</strong></div>
                    <div class="bg-white dark:bg-slate-800 p-3.5 rounded-2xl border dark:border-slate-700 shadow-sm"><span class="text-slate-400 font-bold block text-[10px]">إجمالي التحصيلات</span><strong class="text-emerald-600 text-base font-black">{payments.reduce((s,p)=>s+parseNum(p.amount),0).toLocaleString()} ج.م</strong></div>
                    <div class="bg-white dark:bg-slate-800 p-3.5 rounded-2xl border dark:border-slate-700 shadow-sm"><span class="text-slate-400 font-bold block text-[10px]">مصاريف التشغيل</span><strong class="text-rose-600 text-base font-black">{operations.reduce((s,o)=>s+parseNum(o.laborCost)+parseNum(o.carCost),0).toLocaleString()} ج.م</strong></div>
                    <div class="bg-indigo-50 dark:bg-indigo-900/40 border border-indigo-200 dark:border-indigo-800 p-3.5 rounded-2xl shadow-sm"><span class="text-indigo-800 dark:text-indigo-300 font-bold block text-[10px]">صافي سيولة الخزينة التراكمية</span><strong class="text-indigo-900 dark:text-indigo-200 text-lg font-black">{cumNet.toLocaleString()} ج.م</strong></div>
                  </div>
                </div>
              )}

              {/* 2. الخزينة بالشهر + الإجمالي التراكمي */}
              {activeTab === 'vault' && (
                <div class="space-y-4">
                  <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border dark:border-slate-700 shadow-sm flex flex-col gap-4">
                    <div class="flex items-center gap-3">
                      <label class="font-bold text-xs">اختر الشهر للتصفية والعرض التراكمي:</label>
                      <input type="month" value={vaultMonth} onChange={e=>setVaultMonth(e.target.value)} class="border p-2 rounded-xl dark:bg-slate-700 dark:border-slate-600 text-xs font-bold"/>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {/* لوحة الشهر المحدد */}
                      <div class="p-3 bg-slate-50 dark:bg-slate-700/50 rounded-xl border border-slate-200 dark:border-slate-600">
                        <span class="block font-black text-xs text-indigo-700 dark:text-indigo-300 mb-2">📌 حركة شهر ({vaultMonth}) فقط:</span>
                        <div class="grid grid-cols-3 gap-2 text-center text-xs">
                          <div><span class="block text-slate-500 text-[10px]">وارد الشهر</span><strong class="text-emerald-600 text-base">{mIn.toLocaleString()}</strong></div>
                          <div><span class="block text-slate-500 text-[10px]">صادر الشهر</span><strong class="text-rose-600 text-base">{mOut.toLocaleString()}</strong></div>
                          <div class="bg-white dark:bg-slate-800 p-1 rounded-lg"><span class="block text-indigo-800 dark:text-indigo-300 text-[10px]">صافي الشهر</span><strong class="text-indigo-600 text-base font-black">{mNet.toLocaleString()}</strong></div>
                        </div>
                      </div>

                      {/* لوحة تراكمية حتى هذا الشهر */}
                      <div class="p-3 bg-indigo-50/60 dark:bg-indigo-950/40 rounded-xl border border-indigo-200 dark:border-indigo-800">
                        <span class="block font-black text-xs text-indigo-900 dark:text-indigo-200 mb-2">📈 الإجمالي التراكمي لجميع الشهور (حتى نهاية {vaultMonth}):</span>
                        <div class="grid grid-cols-3 gap-2 text-center text-xs">
                          <div><span class="block text-slate-500 text-[10px]">إجمالي الوارد</span><strong class="text-emerald-700 text-base">{cumIn.toLocaleString()}</strong></div>
                          <div><span class="block text-slate-500 text-[10px]">إجمالي المنصرف</span><strong class="text-rose-700 text-base">{cumOut.toLocaleString()}</strong></div>
                          <div class="bg-white dark:bg-slate-800 p-1 rounded-lg border border-indigo-300 dark:border-indigo-700"><span class="block text-indigo-900 dark:text-indigo-300 text-[10px]">الصافي باليد</span><strong class="text-indigo-700 dark:text-indigo-300 text-base font-black">{cumNet.toLocaleString()}</strong></div>
                        </div>
                      </div>
                    </div>
                  </div>

                        <table class="w-full text-right border"><thead class="bg-slate-100 dark:bg-slate-700"><tr><th class="p-2 border">التاريخ</th><th class="p-2 border">العميل والبيان</th><th class="p-2 border text-center">نوع الجهد</th><th class="p-2 border text-center text-emerald-600">الأتعاب المستحقة</th></tr></thead>

                    // حساب إجمالي الدفعات المسددة مسبقاً (مقدمات + دفعات مسجلة)
                    const totalPrepaid = cOps.reduce((s, o) => s + parseNum(o.paidNow), 0);
                    const totalRecordedPays = cPays.reduce((s, p) => s + parseNum(p.amount), 0);
                    const totalPaidDues = totalPrepaid + totalRecordedPays;

                    // حساب قيم كل بند حسب نسبة الإنجاز المحددة في الجدول

                          <div>تاريخ التقرير: <span>{todayDate}</span></div>
                        </div>

                          <thead class="bg-slate-200 text-slate-900 font-black">
                            <tr>
                              <th class="p-2 border border-slate-300 text-center w-8">م</th>
                              <th class="p-2 border border-slate-300">التاريخ</th>
                              <th class="p-2 border border-slate-300">بيان الأعمال (وصف العمل)</th>
                              <th class="p-2 border border-slate-300 text-center">القيمة في التسجيل</th>
                              <th class="p-2 border border-slate-300 text-center print-hidden">نسبة الإنجاز</th>
                              <th class="p-2 border border-slate-300 text-center">العمل المنجز</th>
                              <th class="p-2 border border-slate-300 text-center">الإجمالي</th>
                            </tr>
                          </thead>
                          <tbody>
                            {cOps.map((o, idx) => {
                              const rate = extractRates[o.id] !== undefined ? extractRates[o.id] : 100;
                              const baseAmt = parseNum(o.agreedAmount);
                              const itemCompleted = (baseAmt * rate) / 100;

                              return (
                                <tr key={o.id} class="border-b">
                                  <td class="p-2 border border-slate-300 text-center font-bold">{idx + 1}</td>
                                  <td class="p-2 border border-slate-300 whitespace-nowrap">{o.date}</td>
                                  <td class="p-2 border border-slate-300 font-bold">
                                    {o.workDescription}
                                    {o.isFaddan && <span class="block text-[10px] text-amber-700 font-normal">({o.faddanQty} فدان × {o.faddanPrice} ج.م)</span>}
                                    {o.isSketch && <span class="block text-[10px] text-indigo-700 font-normal">({o.sketchesCount} كروكي)</span>}
                                  </td>
                                  <td class="p-2 border border-slate-300 text-center font-bold">{baseAmt.toLocaleString()} ج.م</td>
                                  <td class="p-2 border border-slate-300 text-center print-hidden">
                                    <select 
                                      value={rate} 
                                      onChange={(e) => setExtractRates({ ...extractRates, [o.id]: parseInt(e.target.value) })}
                                      class="border rounded p-1 font-bold bg-white text-xs"
                                    >
                                      <option value="100">100%</option>
                                      <option value="90">90%</option>
                                      <option value="50">50%</option>
                                    </select>
                                  </td>
                                  <td class="p-2 border border-slate-300 text-center font-bold">
                                    {rate}% 
                                    {o.isFaddan && <span class="block text-[10px]">({(o.faddanQty * rate / 100).toFixed(2)} فدان منجز)</span>}
                                  </td>
                                  <td class="p-2 border border-slate-300 text-center font-black text-indigo-800">{itemCompleted.toLocaleString()} ج.م</td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>

                        {/* ملخص الإجماليات والمستحقات */}
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-center font-bold pt-2">
                          <div class="bg-slate-100 p-2.5 rounded-xl border border-slate-300">
                            <span class="text-slate-500 block text-[10px]">7. إجمالي الأعمال جميعاً:</span>
                            <span class="text-base text-slate-800 font-black">{totalCompletedWork.toLocaleString()} ج.م</span>
                          </div>
                          <div class="bg-emerald-50 p-2.5 rounded-xl border border-emerald-300">
                            <span class="text-emerald-800 block text-[10px]">8. المبلغ المدفوع (مقدمات ودفعات):</span>
                            <span class="text-base text-emerald-700 font-black">{totalPaidDues.toLocaleString()} ج.م</span>
                          </div>
                          <div class="bg-rose-50 p-2.5 rounded-xl border border-rose-300">
                            <span class="text-rose-800 block text-[10px]">9. الباقي المستحق:</span>
                            <span class="text-lg text-rose-700 font-black">{finalRemainingDue.toLocaleString()} ج.م</span>
                          </div>
                        </div>

                        {/* توقيع المهندس المسؤول المختار في آخر المستخلص */}
                        <div class="pt-6 border-t border-slate-300 flex justify-between items-end text-xs font-bold">
                          <div>
                            <span>المهندس المسؤول عن الأعمال:</span>
                            <strong class="block text-sm text-indigo-900 mt-1">{selectedExtractEng || '............................'}</strong>
                          </div>
                          <div class="text-center">
                            <span>التوقيع والاعتماد:</span>
                            <span class="block mt-4">........................................</span>
                          </div>
                        </div>

                        {/* أزرار الإجراءات والطباعة */}
                        <div class="mt-4 print-hidden flex justify-end gap-2 pt-2 border-t">
                          <button onClick={()=>window.print()} class="bg-slate-800 hover:bg-black text-white px-4 py-2 rounded-xl font-bold">🖨️ طباعة المستخلص</button>
                          <button onClick={()=>{
                            const msg = `🏢 *مكتب الاستشارات والأعمال المساحية*\n📄 *مستخلص أعمال للعميل:* ${selectedClientForExtract}\n----------------------------------\n💰 *إجمالي الأعمال المنجزة:* ${totalCompletedWork.toLocaleString()} ج.م\n📥 *المسدد:* ${totalPaidDues.toLocaleString()} ج.م\n⚠️️ *الباقي المستحق:* ${finalRemainingDue.toLocaleString()} ج.م\n👷 *المهندس المسؤول:* ${selectedExtractEng || '-'}\n🗓️ *التاريخ:* ${todayDate}`;
                            generatePdfAndOpenWhatsApp('extract-pdf-target', `مستخلص_${selectedClientForExtract}.pdf`, msg);
                          }} class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl font-bold">📲 PDF + واتساب</button>
                        </div>
                      </div>
                    );
                  })()}
                </div>
              )}

              {/* 9. أرباح المكتب */}
              {activeTab === 'office' && (
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border shadow-sm text-center">
                  <h3 class="font-black text-lg mb-2">أرباح المكتب المجمعة (20% من الأعمال)</h3>
                  <div class="text-4xl font-black mb-8 text-emerald-600">{Math.round(totalOffice).toLocaleString()} ج.م</div>
                  <div class="grid grid-cols-2 md:grid-cols-5 gap-4 text-xs font-bold">
                    <div class="p-4 border rounded-2xl bg-amber-50 dark:bg-slate-700">في سبيل الله (10%)<br/><strong class="text-lg mt-2 block">{Math.round(totalOffice*0.1).toLocaleString()}</strong></div>
                    <div class="p-4 border rounded-2xl bg-blue-50 dark:bg-slate-700">م. أحمد نبيل (10%)<br/><strong class="text-lg mt-2 block">{Math.round(totalOffice*0.1).toLocaleString()}</strong></div>
                    <div class="p-4 border rounded-2xl">م. أسامة<br/><strong class="text-lg mt-2 block">{Math.round((totalOffice*0.8)/3).toLocaleString()}</strong></div>
                    <div class="p-4 border rounded-2xl">م. أيمن<br/><strong class="text-lg mt-2 block">{Math.round((totalOffice*0.8)/3).toLocaleString()}</strong></div>
                    <div class="p-4 border rounded-2xl">م. علاء<br/><strong class="text-lg mt-2 block">{Math.round((totalOffice*0.8)/3).toLocaleString()}</strong></div>
                  </div>
                </div>
              )}

              {/* 10. سجل الدخول للأدمن */}
              {activeTab === 'logs' && isSuperAdmin && (
                <table class="w-full text-right bg-white dark:bg-slate-800 text-xs border rounded-2xl"><thead class="bg-slate-100 dark:bg-slate-700"><tr><th class="p-2">الاسم</th><th class="p-2">الإيميل</th><th class="p-2">الوقت</th></tr></thead>
                <tbody>{loginLogs.map((l,i)=><tr key={i} class="border-b dark:border-slate-700"><td class="p-2">{l.name}</td><td class="p-2">{l.email}</td><td class="p-2">{l.date}</td></tr>)}</tbody></table>
              )}

              {/* 11. الإعدادات واللوجو */}
              {activeTab === 'settings' && (
                <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border shadow-sm max-w-sm text-xs">
                  <h3 class="font-bold mb-2">🖼️ شعار الترويسة المعتمد:</h3>
                  <input type="file" accept="image/*" onChange={(e)=>{
                    if(!isAdmin) return;
                    const f = e.target.files[0]; if(!f) return;
                    const r = new FileReader(); r.onload = (evt) => {
                      setSettings(p=>({...p, logo: evt.target.result}));
                      if(db) db.ref('survey_data/settings/logo').set(evt.target.result);
                      showToast("تم تحديث الشعار!");
                    }; r.readAsDataURL(f);
                  }} class="w-full p-2 border rounded"/>
                  {settings.logo && <img src={settings.logo} class="h-16 object-contain mt-3 border p-2 rounded" />}
                </div>
              )}
            </div>
          </main>

          {toast.show && <div class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-2 rounded-xl text-xs z-50 shadow-xl">{toast.message}</div>}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
