<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام إدارة الأعمال المساحية - SURVEY ERP</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-database-compat.js"></script>

  <meta name="theme-color" content="#0f172a">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    @media print {
      body { background-color: white !important; font-size: 11px; }
      .print-hidden { display: none !important; }
      .print-area { box-shadow: none !important; border: none !important; width: 100% !important; margin: 0 !important; }
    }
  </style>
</head>
<body class="text-slate-800 antialiased select-none sm:select-auto">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyDHjQTNfAh3wQ8tSOXOIewJNXaDCHADrR8",
      authDomain: "mrmo-d8760.firebaseapp.com",
      databaseURL: "https://mrmo-d8760-default-rtdb.firebaseio.com",
      projectId: "mrmo-d8760",
      storageBucket: "mrmo-d8760.firebasestorage.app",
      messagingSenderId: "510855132508",
      appId: "1:510855132508:web:feee377429a2d88c277d99",
      measurementId: "G-N9DW5R28H0"
    };

    const SUPER_ADMIN_EMAIL = "mohamedmo686686@gmail.com";
    const ADMIN_EMAILS = [SUPER_ADMIN_EMAIL, "mohamedmohy676676@gmail.com", "+201095545982"];

    let db = null;
    let auth = null;
    try {
      if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
      db = firebase.database();
      auth = firebase.auth();
      auth.languageCode = 'ar';
    } catch (e) { console.error(e); }

    const parseNum = (val) => {
      if (typeof val === "number") return isNaN(val) ? 0 : val;
      if (!val) return 0;
      const clean = String(val).replace(/,/g, '').replace(/،/g, '.').trim();
      const n = parseFloat(clean);
      return isNaN(n) ? 0 : n;
    };

    function DashboardCharts({ totalWork, totalReceived, totalExpenses, opCounts }) {
      const chart1Ref = useRef(null);
      const chart2Ref = useRef(null);
      const chart1Instance = useRef(null);
      const chart2Instance = useRef(null);

      useEffect(() => {
        if (chart1Instance.current) chart1Instance.current.destroy();
        if (chart2Instance.current) chart2Instance.current.destroy();

        if (chart1Ref.current) {
          chart1Instance.current = new Chart(chart1Ref.current, {
            type: 'bar',
            data: {
              labels: ['قيمة الأعمال الإجمالية', 'التحصيلات الفعلية', 'مصاريف التشغيل الحقلية'],
              datasets: [{
                label: 'الموقف المالي العام',
                data: [totalWork, totalReceived, totalExpenses],
                backgroundColor: ['#4f46e5', '#10b981', '#f43f5e'],
                borderRadius: 8
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } }
            }
          });
        }

        if (chart2Ref.current) {
          chart2Instance.current = new Chart(chart2Ref.current, {
            type: 'doughnut',
            data: {
              labels: ['يوم RTK كامل', 'نصف يوم RTK', 'كروكيات وقياس', 'مساحات وأفدنة'],
              datasets: [{
                data: [opCounts.rtkFull || 0, opCounts.rtkHalf || 0, opCounts.sketch || 0, opCounts.faddan || 0],
                backgroundColor: ['#6366f1', '#06b6d4', '#f59e0b', '#10b981']
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: 'bottom', labels: { boxWidth: 10, padding: 8, font: { size: 10, family: 'Cairo' } } }
              }
            }
          });
        }

        return () => {
          if (chart1Instance.current) chart1Instance.current.destroy();
          if (chart2Instance.current) chart2Instance.current.destroy();
        };
      }, [totalWork, totalReceived, totalExpenses, JSON.stringify(opCounts)]);

      return (
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm h-72 flex flex-col">
            <h4 class="font-bold text-slate-700 mb-2 text-center text-xs">📈 المقارنة المالية لأعمال المساحة (ج.م)</h4>
            <div class="relative w-full flex-1 min-h-0"><canvas ref={chart1Ref}></canvas></div>
          </div>
          <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm h-72 flex flex-col">
            <h4 class="font-bold text-slate-700 mb-2 text-center text-xs">📊 توزيع حجم ونوع الأعمال المنفذة</h4>
            <div class="relative w-full flex-1 min-h-0"><canvas ref={chart2Ref}></canvas></div>
          </div>
        </div>
      );
    }

    function App() {
      const [user, setUser] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);
      const [isSuperAdmin, setIsSuperAdmin] = useState(false);
      const [authLoading, setAuthLoading] = useState(true);

      const [activeTab, setActiveTab] = useState("dashboard");
      const [operations, setOperations] = useState([]);
      const [transactions, setTransactions] = useState([]);
      const [payments, setPayments] = useState([]);
      const [extracts, setExtracts] = useState([]);
      const [pendingExtract, setPendingExtract] = useState(null);
      const [engineers, setEngineers] = useState(["م أحمد نبيل", "م أيمن", "م علاء"]);
      const [logo, setLogo] = useState("");
      const [loginLogs, setLoginLogs] = useState([]);
      const [toast, setToast] = useState({ show: false, message: "" });
      const [selectedClientForStatement, setSelectedClientForStatement] = useState("");

      const todayDate = new Date().toISOString().split('T')[0];

      const showToast = (message) => {
        setToast({ show: true, message });
        setTimeout(() => setToast({ show: false, message: "" }), 3000);
      };

      const nextCode = useMemo(() => {
        const nums = operations.map(o => {
          const m = String(o.clientCode || '').match(/^SRV-(\d+)$/i);
          return m ? parseInt(m[1], 10) : 0;
        });
        const max = nums.length > 0 ? Math.max(...nums) : 0;
        const nxt = max + 1;
        return `SRV-${nxt < 10 ? '0' + nxt : nxt}`;
      }, [operations]);

      // نماذج الإدخال
      const [newOp, setNewOp] = useState({
        date: todayDate,
        clientCode: "",
        clientName: "",
        opType: "rtk_full", // rtk_full, rtk_half, sketch, faddan
        workDescription: "",
        engineer: "م أحمد نبيل",
        sketchesCount: 1,
        totalPrice: 6500,
        paidNow: 0,
        laborCost: 0,
        carCost: 0,
        officeRate: 20
      });

      const [newPayment, setNewPayment] = useState({
        date: todayDate,
        clientName: "",
        amount: "",
        paymentMethod: "كاش",
        notes: ""
      });

      const [newExtractForm, setNewExtractForm] = useState({
        date: todayDate,
        clientName: "",
        workDescription: "",
        faddanCount: 1,
        pricePerFaddan: 1000,
        completionRate: 100
      });

      const [newTx, setNewTx] = useState({
        date: todayDate,
        type: "income",
        clientOrEntity: "",
        category: "تحصيل مساحة",
        amount: "",
        paymentMethod: "كاش",
        notes: ""
      });

      useEffect(() => {
        setNewOp(prev => ({ ...prev, clientCode: nextCode }));
      }, [nextCode]);

      useEffect(() => {
        if (!auth) { setAuthLoading(false); return; }
        return auth.onAuthStateChanged((curr) => {
          if (curr) {
            const email = (curr.email || "").toLowerCase();
            const isSuper = email === SUPER_ADMIN_EMAIL.toLowerCase();
            const isAdm = ADMIN_EMAILS.some(e => email.includes(e.toLowerCase()));
            setUser(curr);
            setIsSuperAdmin(isSuper);
            setIsAdmin(isAdm);

            if (db && !sessionStorage.getItem('survey_login_log')) {
              const logEntry = {
                name: curr.displayName || curr.email,
                email: curr.email,
                date: new Date().toLocaleString('ar-EG'),
                timestamp: Date.now()
              };
              db.ref('survey_data/login_logs').push(logEntry);
              sessionStorage.setItem('survey_login_log', 'true');
            }
          } else {
            setUser(null);
            setIsAdmin(false);
            setIsSuperAdmin(false);
          }
          setAuthLoading(false);
        });
      }, []);

      useEffect(() => {
        if (!db) return;
        const ref = db.ref('survey_data');
        ref.on('value', (snap) => {
          const d = snap.val() || {};
          const toArr = (v) => (v ? (Array.isArray(v) ? v : Object.values(v)) : []);
          setOperations(toArr(d.operations).reverse());
          setTransactions(toArr(d.transactions).reverse());
          setPayments(toArr(d.payments).reverse());
          setExtracts(toArr(d.extracts).reverse());
          setLoginLogs(toArr(d.login_logs).reverse());
          if (d.engineers && Array.isArray(d.engineers)) setEngineers(d.engineers);
          if (d.logo) setLogo(d.logo);
        });
      }, []);

      const handleAddEngineer = () => {
        const name = prompt("أدخل اسم المهندس الجديد:");
        if (name && name.trim()) {
          const updated = [...engineers, name.trim()];
          setEngineers(updated);
          if (db) db.ref('survey_data/engineers').set(updated);
          showToast(`تمت إضافة المهندس ${name} بنجاح!`);
        }
      };

      const handleAddOperation = (e) => {
        e.preventDefault();
        if (!newOp.clientName || parseNum(newOp.totalPrice) <= 0) return;
        const total = parseNum(newOp.totalPrice);
        const officeShare = (total * (parseNum(newOp.officeRate) || 20)) / 100;

        let rtkShare = 0;
        if (newOp.opType === "rtk_full") rtkShare = 3500;
        else if (newOp.opType === "rtk_half") rtkShare = 1750;

        const opToSave = {
          id: Date.now(),
          ...newOp,
          clientCode: newOp.clientCode || nextCode,
          totalPrice: total,
          paidNow: parseNum(newOp.paidNow),
          laborCost: parseNum(newOp.laborCost),
          carCost: parseNum(newOp.carCost),
          sketchesCount: newOp.opType === "sketch" ? parseInt(newOp.sketchesCount) || 1 : 0,
          officeShare,
          rtkShare,
          createdBy: user.displayName || user.email
        };

        const updatedOps = [opToSave, ...operations];
        setOperations(updatedOps);
        if (db) db.ref('survey_data/operations').set(updatedOps);

        // تسجيل الدفعة المقدمة في المدفوعات والخزينة إن وجدت
        if (parseNum(newOp.paidNow) > 0) {
          const autoPay = {
            id: Date.now() + 1,
            date: newOp.date,
            clientName: newOp.clientName,
            amount: parseNum(newOp.paidNow),
            paymentMethod: "كاش",
            notes: `دفعة مقدمة لعملية (${opToSave.clientCode})`
          };
          const updatedPays = [autoPay, ...payments];
          setPayments(updatedPays);
          if (db) db.ref('survey_data/payments').set(updatedPays);

          const autoTx = {
            id: Date.now() + 2,
            date: newOp.date,
            type: "income",
            clientOrEntity: newOp.clientName,
            category: "تحصيل دفعة مقدمة",
            amount: parseNum(newOp.paidNow),
            paymentMethod: "كاش",
            notes: `تحصيل مباشر لعملية ${opToSave.clientCode}`
          };
          const updatedTxs = [autoTx, ...transactions];
          setTransactions(updatedTxs);
          if (db) db.ref('survey_data/transactions').set(updatedTxs);
        }

        setNewOp({
          date: todayDate,
          clientCode: "",
          clientName: "",
          opType: "rtk_full",
          workDescription: "",
          engineer: engineers[0] || "م أحمد نبيل",
          sketchesCount: 1,
          totalPrice: 6500,
          paidNow: 0,
          laborCost: 0,
          carCost: 0,
          officeRate: 20
        });
        showToast("تم حفظ العملية وتوزيع النسب آلياً! 📐");
      };

      const handleAddPayment = (e) => {
        e.preventDefault();
        if (!newPayment.clientName || parseNum(newPayment.amount) <= 0) return;
        const item = {
          id: Date.now(),
          ...newPayment,
          amount: parseNum(newPayment.amount),
          createdBy: user.displayName || user.email
        };
        const updated = [item, ...payments];
        setPayments(updated);
        if (db) db.ref('survey_data/payments').set(updated);

        // إدخالها تلقائياً بالخزينة كوارد
        const txItem = {
          id: Date.now() + 1,
          date: newPayment.date,
          type: "income",
          clientOrEntity: newPayment.clientName,
          category: "تحصيل دفعة عميل",
          amount: parseNum(newPayment.amount),
          paymentMethod: newPayment.paymentMethod,
          notes: newPayment.notes || "سداد دفعة حساب"
        };
        const updatedTx = [txItem, ...transactions];
        setTransactions(updatedTx);
        if (db) db.ref('survey_data/transactions').set(updatedTx);

        setNewPayment({ date: todayDate, clientName: "", amount: "", paymentMethod: "كاش", notes: "" });
        showToast("تم قيد الدفعة وخصمها من حساب العميل وإضافتها للخزينة! 💰");
      };

      const handleAddTransaction = (e) => {
        e.preventDefault();
        if (parseNum(newTx.amount) <= 0) return;
        const item = {
          id: Date.now(),
          ...newTx,
          amount: parseNum(newTx.amount),
          createdBy: user.displayName || user.email
        };
        const updated = [item, ...transactions];
        setTransactions(updated);
        if (db) db.ref('survey_data/transactions').set(updated);
        setNewTx({ date: todayDate, type: "income", clientOrEntity: "", category: "تحصيل مساحة", amount: "", paymentMethod: "كاش", notes: "" });
        showToast("تم تسجيل الحركة بالخزينة! 💵");
      };

      // اعتماد المستخلص أولاً ثم ترحيله
      const handlePrepareExtract = (e) => {
        e.preventDefault();
        const fCount = parseNum(newExtractForm.faddanCount);
        const fPrice = parseNum(newExtractForm.pricePerFaddan);
        const rate = parseNum(newExtractForm.completionRate);
        const total = (fCount * fPrice * rate) / 100;

        setPendingExtract({
          id: Date.now(),
          ...newExtractForm,
          faddanCount: fCount,
          pricePerFaddan: fPrice,
          completionRate: rate,
          totalAmount: total,
          status: "قيد المراجعة"
        });
        showToast("تم تجهيز مسودة المستخلص! راجع البيانات ثم اضغط اعتماد 📄");
      };

      const handleConfirmExtract = () => {
        if (!pendingExtract) return;
        const confirmed = { ...pendingExtract, status: "معتمد رسمياً", approvedAt: new Date().toLocaleDateString('ar-EG') };
        const updated = [confirmed, ...extracts];
        setExtracts(updated);
        if (db) db.ref('survey_data/extracts').set(updated);
        setPendingExtract(null);
        setNewExtractForm({ date: todayDate, clientName: "", workDescription: "", faddanCount: 1, pricePerFaddan: 1000, completionRate: 100 });
        showToast("تم اعتماد المستخلص وترحيله بنجاح! ✅");
      };

      // العمليات الحسابية الشاملة
      const totalWorkValue = operations.reduce((s, o) => s + parseNum(o.totalPrice), 0);
      const totalReceivedValue = payments.reduce((s, p) => s + parseNum(p.amount), 0);
      const totalFieldExpenses = operations.reduce((s, o) => s + parseNum(o.laborCost) + parseNum(o.carCost), 0);

      const opTypeCounts = useMemo(() => {
        const c = { rtkFull: 0, rtkHalf: 0, sketch: 0, faddan: 0 };
        operations.forEach(o => {
          if (o.opType === 'rtk_full') c.rtkFull++;
          else if (o.opType === 'rtk_half') c.rtkHalf++;
          else if (o.opType === 'sketch') c.sketch++;
          else if (o.opType === 'faddan') c.faddan++;
        });
        return c;
      }, [operations]);

      // الخزينة اللحظية
      const vaultIn = transactions.filter(t => t.type === 'income').reduce((s, t) => s + parseNum(t.amount), 0);
      const vaultOut = transactions.filter(t => t.type === 'expense').reduce((s, t) => s + parseNum(t.amount), 0);
      const currentVaultNet = vaultIn - vaultOut;

      // حسابات جهاز RTK
      const rtkTotalFund = operations.reduce((s, o) => s + (parseNum(o.rtkShare) || 0), 0);
      const mandourShare = rtkTotalFund * 0.50;
      const rtkPartnersShare = (rtkTotalFund * 0.50) / 3; // أسامة، أيمن، علاء

      // حسابات أرباح المكتب
      const officeTotalFund = operations.reduce((s, o) => s + (parseNum(o.officeShare) || 0), 0);
      const charityShare = officeTotalFund * 0.10;
      const ahmedNabilShare = officeTotalFund * 0.10;
      const officePartnersShare = (officeTotalFund * 0.80) / 3; // أسامة، أيمن، علاء

      // قائمة العملاء الموحدة
      const clientNames = Array.from(new Set([
        ...operations.map(o => (o.clientName || '').trim()),
        ...payments.map(p => (p.clientName || '').trim())
      ])).filter(Boolean);

      if (authLoading) return <div class="min-h-screen flex items-center justify-center bg-slate-900 text-white font-bold">جاري تشغيل نظام المساحة... ⏳</div>;

      if (!user) {
        return (
          <div class="min-h-screen flex items-center justify-center bg-slate-900 p-4">
            <div class="bg-white p-8 rounded-3xl max-w-sm w-full text-center shadow-2xl">
              <div class="text-4xl mb-2">📐</div>
              <h2 class="text-xl font-black text-slate-800">نظام إدارة المساحة</h2>
              <p class="text-xs text-slate-500 mb-6">MOMOHY SURVEY ERP</p>
              <button onClick={() => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())} class="w-full bg-slate-900 hover:bg-black text-white py-3 rounded-2xl font-bold text-xs transition shadow-md">
                الدخول بحساب Google
              </button>
            </div>
          </div>
        );
      }

      return (
        <div class="min-h-screen pb-24">
          {/* Header */}
          <header class="bg-slate-900 text-white p-3.5 sticky top-0 z-30 shadow flex justify-between items-center text-xs">
            <div class="flex items-center gap-2">
              <span class="text-xl">📐</span>
              <div>
                <h1 class="font-black text-sm">مساحة ERP</h1>
                <span class="text-[10px] text-slate-400">{user.email}</span>
              </div>
            </div>
            <div class="flex items-center gap-1.5 overflow-x-auto scrollbar-hide">
              <a href="/" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-xl font-bold whitespace-nowrap">🏗️ الإنشاءات</a>
              <button onClick={()=>setActiveTab('dashboard')} class={`px-3 py-1.5 rounded-xl font-bold whitespace-nowrap ${activeTab==='dashboard'?'bg-indigo-600 text-white':'bg-slate-800 text-slate-300'}`}>📊 لوحة التحكم</button>
              <button onClick={()=>setActiveTab('vault')} class={`px-3 py-1.5 rounded-xl font-bold whitespace-nowrap ${activeTab==='vault'?'bg-indigo-600 text-white':'bg-slate-800 text-slate-300'}`}>💵 الخزينة</button>
              <button onClick={()=>setActiveTab('clients')} class={`px-3 py-1.5 rounded-xl font-bold whitespace-nowrap ${activeTab==='clients'?'bg-indigo-600 text-white':'bg-slate-800 text-slate-300'}`}>👥 تسجيل العملاء</button>
              <button onClick={()=>setActiveTab('expenses')} class={`px-3 py-1.5 rounded-xl font-bold whitespace-nowrap ${activeTab==='expenses'?'bg-indigo-600 text-white':'bg-slate-800 text-slate-300'}`}>🚗 مصاريف العمل</button>
              <button onClick={()=>setActiveTab('rtk')} class={`px-3 py-1.5 rounded-xl font-bold whitespace-nowrap ${activeTab==='rtk'?'bg-indigo-600 text-white':'bg-slate-800 text-slate-300'}`}>🛰️ جهاز RTK</button>
              <button onClick={()=>setActiveTab('payments')} class={`px-3 py-1.5 rounded-xl font-bold whitespace-nowrap ${activeTab==='payments'?'bg-indigo-600 text-white':'bg-slate-800 text-slate-300'}`}>💰 الدفعات</button>
              <button onClick={()=>setActiveTab('statement')} class={`px-3 py-1.5 rounded-xl font-bold whitespace-nowrap ${activeTab==='statement'?'bg-indigo-600 text-white':'bg-slate-800 text-slate-300'}`}>📑 كشف حساب</button>
              <button onClick={()=>setActiveTab('extracts')} class={`px-3 py-1.5 rounded-xl font-bold whitespace-nowrap ${activeTab==='extracts'?'bg-indigo-600 text-white':'bg-slate-800 text-slate-300'}`}>📄 المستخلصات</button>
              <button onClick={()=>setActiveTab('office')} class={`px-3 py-1.5 rounded-xl font-bold whitespace-nowrap ${activeTab==='office'?'bg-indigo-600 text-white':'bg-slate-800 text-slate-300'}`}>🏢 أرباح المكتب</button>
              {isSuperAdmin && <button onClick={()=>setActiveTab('logs')} class={`px-3 py-1.5 rounded-xl font-bold whitespace-nowrap ${activeTab==='logs'?'bg-indigo-600 text-white':'bg-slate-800 text-slate-300'}`}>🛡️ سجل الدخول</button>}
              <button onClick={()=>setActiveTab('settings')} class={`px-3 py-1.5 rounded-xl font-bold whitespace-nowrap ${activeTab==='settings'?'bg-indigo-600 text-white':'bg-slate-800 text-slate-300'}`}>⚙️ الإعدادات</button>
            </div>
          </header>

          <main class="max-w-7xl mx-auto px-4 mt-4 text-xs">
            {/* 1. لوحة التحكم */}

                    <div><label class="block font-bold mb-1 text-rose-700">مصاريف العمالة</label><input type="number" value={newOp.laborCost} onChange={e=>setNewOp({...newOp, laborCost: e.target.value})} class="w-full border p-2 rounded-xl"/></div>
                    <div><label class="block font-bold mb-1 text-rose-700">مصاريف السيارة</label><input type="number" value={newOp.carCost} onChange={e=>setNewOp({...newOp, carCost: e.target.value})} class="w-full border p-2 rounded-xl"/></div>
                    <div><label class="block font-bold mb-1 text-indigo-700">نسبة المكتب (%)</label><input type="number" value={newOp.officeRate} onChange={e=>setNewOp({...newOp, officeRate: e.target.value})} class="w-full border p-2 rounded-xl font-bold bg-indigo-50/50"/></div>

                  </form>

                      <tr class="bg-slate-100 border-b"><th class="p-2">الكود</th><th class="p-2">التاريخ</th><th class="p-2">العميل</th><th class="p-2">نوع العمل</th><th class="p-2">المهندس</th><th class="p-2 text-center">المتفق عليه</th><th class="p-2 text-center">المسدد مقدماً</th><th class="p-2 text-center">نسبة المكتب</th></tr>

              const clientPays = payments.filter(p => (p.clientName || '').trim() === targetClient);

                          window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');

                  {targetClient ? (
                    <div class="bg-white p-6 rounded-2xl border shadow-sm print-area space-y-4">
                      <div class="flex justify-between items-center border-b pb-3">
                        <div>
                          <h2 class="text-base font-black text-slate-900">كشف حساب تفصيلي: {targetClient}</h2>
                          <p class="text-[11px] text-slate-500">تاريخ التقرير: {todayDate}</p>
                        </div>
                        {logo && <img src={logo} class="h-12 object-contain" />}
                      </div>

                      <div class="grid grid-cols-3 gap-3 bg-slate-50 p-3 rounded-xl text-center border">
                        <div><span class="text-slate-500 block text-[10px]">إجمالي الأعمال:</span><strong class="text-sm font-black">{totalBilled.toLocaleString()} ج.م</strong></div>
                        <div><span class="text-slate-500 block text-[10px]">المسدد فعلياً:</span><strong class="text-sm font-black text-emerald-600">{totalPaid.toLocaleString()} ج.م</strong></div>
                        <div><span class="text-slate-500 block text-[10px]">المتبقي (مديونية):</span><strong class={`text-sm font-black ${remainingDue>0?'text-rose-600':'text-slate-700'}`}>{remainingDue.toLocaleString()} ج.م</strong></div>
                      </div>

                      <h4 class="font-bold border-b pb-1">1. سجل العمليات والطلعات المنفذة:</h4>
                      <table class="w-full text-right border">
                        <thead><tr class="bg-slate-100"><th class="p-1.5 border">الكود</th><th class="p-1.5 border">التاريخ</th><th class="p-1.5 border">النوع</th><th class="p-1.5 border">البيان</th><th class="p-1.5 border text-center">المبلغ</th></tr></thead>
                        <tbody>
                          {clientOps.map(o => (
                            <tr key={o.id}><td class="p-1.5 border font-mono">{o.clientCode}</td><td class="p-1.5 border">{o.date}</td><td class="p-1.5 border">{o.opType}</td><td class="p-1.5 border">{o.workDescription || '-'}</td><td class="p-1.5 border text-center font-bold">{parseNum(o.totalPrice).toLocaleString()} ج.م</td></tr>
                          ))}
                        </tbody>
                      </table>

                      <h4 class="font-bold border-b pb-1">2. سجل الدفعات المسددة من العميل:</h4>
                      <table class="w-full text-right border">
                        <thead><tr class="bg-slate-100"><th class="p-1.5 border">التاريخ</th><th class="p-1.5 border">الطريقة</th><th class="p-1.5 border">ملاحظات</th><th class="p-1.5 border text-center">المبلغ المسدد</th></tr></thead>
                        <tbody>
                          {clientPays.map(p => (
                            <tr key={p.id}><td class="p-1.5 border">{p.date}</td><td class="p-1.5 border">{p.paymentMethod}</td><td class="p-1.5 border">{p.notes || '-'}</td><td class="p-1.5 border text-center font-bold text-emerald-600">{parseNum(p.amount).toLocaleString()} ج.م</td></tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  ) : (
                    <div class="bg-white p-8 rounded-2xl text-center text-slate-400 font-bold border border-dashed">يرجى اختيار العميل لعرض كشف حسابه التفصيلي</div>
                  )}
                </div>
              );
            })()}

            {/* 8. المستخلصات الهندسية (بالفدان ونسب الإنجاز والاعتماد) */}
            {activeTab === 'extracts' && (
              <div class="space-y-4">
                <div class="bg-white p-5 rounded-2xl border shadow-sm">
                  <h3 class="font-black text-slate-800 text-sm mb-3 border-b pb-2">📄 إعداد مستخلص أعمال بالفدان ونسب الإنجاز:</h3>
                  <form onSubmit={handlePrepareExtract} class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div><label class="block font-bold mb-1">التاريخ</label><input type="date" value={newExtractForm.date} onChange={e=>setNewExtractForm({...newExtractForm, date: e.target.value})} class="w-full border p-2 rounded-xl" required/></div>
                    <div>
                      <label class="block font-bold mb-1">اسم العميل</label>
                      <input list="clients-list" value={newExtractForm.clientName} onChange={e=>setNewExtractForm({...newExtractForm, clientName: e.target.value})} class="w-full border p-2 rounded-xl font-bold" required/>
                    </div>
                    <div><label class="block font-bold mb-1">وصف العمل</label><input type="text" value={newExtractForm.workDescription} onChange={e=>setNewExtractForm({...newExtractForm, workDescription: e.target.value})} placeholder="رفع مساحي مزارع..." class="w-full border p-2 rounded-xl" required/></div>
                    <div><label class="block font-bold mb-1">عدد الأفدنة</label><input type="number" step="any" min="0" value={newExtractForm.faddanCount} onChange={e=>setNewExtractForm({...newExtractForm, faddanCount: e.target.value})} class="w-full border p-2 rounded-xl font-bold" required/></div>
                    <div><label class="block font-bold mb-1">سعر الفدان (ج.م)</label><input type="number" step="any" min="0" value={newExtractForm.pricePerFaddan} onChange={e=>setNewExtractForm({...newExtractForm, pricePerFaddan: e.target.value})} class="w-full border p-2 rounded-xl font-bold" required/></div>
                    <div>
                      <label class="block font-bold mb-1 text-indigo-700">نسبة الإنجاز (%)</label>
                      <select value={newExtractForm.completionRate} onChange={e=>setNewExtractForm({...newExtractForm, completionRate: e.target.value})} class="w-full border-2 border-indigo-200 p-2 rounded-xl font-black bg-indigo-50">
                        <option value="100">100% (إنجاز تام)</option>
                        <option value="90">90% (تسليم مسودة)</option>
                        <option value="50">50% (رفع أولي)</option>
                      </select>
                    </div>
                    <div class="sm:col-span-3 bg-indigo-50 p-3 rounded-xl border border-indigo-200 flex justify-between items-center">
                      <span class="font-bold text-indigo-900">القيمة التقديرية للمستخلص:</span>
                      <strong class="text-base font-black text-indigo-900">{((parseNum(newExtractForm.faddanCount) * parseNum(newExtractForm.pricePerFaddan) * parseNum(newExtractForm.completionRate)) / 100).toLocaleString()} ج.م</strong>
                    </div>
                    <div class="sm:col-span-3"><button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-black py-2.5 rounded-xl shadow">تجهيز ومراجعة المسودة</button></div>
                  </form>
                </div>

                {/* كارت الاعتماد المؤقت قبل الترحيل النهائي */}
                {pendingExtract && (
                  <div class="bg-amber-50 border-2 border-amber-300 p-4 rounded-2xl shadow-sm space-y-3">
                    <h4 class="font-black text-amber-900 text-sm">⚠️ مراجعة المستخلص قبل الاعتماد النهائي:</h4>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-[11px]">
                      <div>العميل: <strong>{pendingExtract.clientName}</strong></div>
                      <div>الأفدنة: <strong>{pendingExtract.faddanCount} فدان</strong></div>
                      <div>سعر الفدان: <strong>{pendingExtract.pricePerFaddan} ج.م</strong></div>
                      <div>نسبة الإنجاز: <strong>{pendingExtract.completionRate}%</strong></div>
                    </div>
                    <div class="flex gap-2">
                      <button onClick={handleConfirmExtract} class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-black py-2 rounded-xl shadow">✅ اعتماد المستخلص وترحيله الآن</button>
                      <button onClick={()=>setPendingExtract(null)} class="bg-rose-100 text-rose-700 font-bold px-4 py-2 rounded-xl">إلغاء التجهيز</button>
                    </div>
                  </div>
                )}

                <div class="bg-white p-4 rounded-2xl border shadow-sm overflow-x-auto">
                  <h4 class="font-bold text-slate-800 mb-2">سجل المستخلصات المعتمدة:</h4>
                  <table class="w-full text-right border-collapse">
                    <thead>
                      <tr class="bg-slate-100 border-b"><th class="p-2">التاريخ</th><th class="p-2">العميل</th><th class="p-2">البيان</th><th class="p-2 text-center">الأفدنة</th><th class="p-2 text-center">سعر الفدان</th><th class="p-2 text-center">الإنجاز</th><th class="p-2 text-center text-indigo-700">القيمة المعتمدة</th></tr>
                    </thead>
                    <tbody>
                      {extracts.map(ex => (
                        <tr key={ex.id} class="border-b hover:bg-slate-50">
                          <td class="p-2 text-slate-600">{ex.date}</td>
                          <td class="p-2 font-bold">{ex.clientName}</td>
                          <td class="p-2">{ex.workDescription}</td>
                          <td class="p-2 text-center font-bold">{ex.faddanCount}</td>
                          <td class="p-2 text-center">{ex.pricePerFaddan.toLocaleString()}</td>
                          <td class="p-2 text-center font-bold">{ex.completionRate}%</td>
                          <td class="p-2 text-center font-black text-indigo-700">{ex.totalAmount.toLocaleString()} ج.م</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* 9. أرباح المكتب وتوزيع الشركاء */}
            {activeTab === 'office' && (
              <div class="space-y-4">
                <div class="bg-slate-900 text-white p-5 rounded-3xl shadow flex justify-between items-center">
                  <div>
                    <h3 class="font-black text-sm text-indigo-300">🏢 صندوق ونسبة أرباح المكتب</h3>
                    <p class="text-[11px] text-slate-400">مجموع نسب المكتب المحصلة من كافة العمليات والكروكيات</p>
                  </div>
                  <div class="bg-indigo-800 p-3 rounded-2xl text-left border border-indigo-700">
                    <span class="text-[10px] text-indigo-300 block">إجمالي أرباح المكتب:</span>
                    <strong class="text-xl font-black text-white">{Math.round(officeTotalFund).toLocaleString()} ج.م</strong>
                  </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-5 gap-3">
                  <div class="bg-amber-50 border border-amber-200 p-4 rounded-2xl shadow-sm">
                    <span class="text-[11px] text-amber-800 font-bold block mb-1">🤲 في سبيل الله (10%)</span>
                    <strong class="text-lg font-black text-amber-900">{Math.round(charityShare).toLocaleString()} ج.م</strong>
                  </div>
                  <div class="bg-blue-50 border border-blue-200 p-4 rounded-2xl shadow-sm">
                    <span class="text-[11px] text-blue-800 font-bold block mb-1">م. أحمد نبيل (10%)</span>
                    <strong class="text-lg font-black text-blue-900">{Math.round(ahmedNabilShare).toLocaleString()} ج.م</strong>
                  </div>
                  <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl shadow-sm">
                    <span class="text-[11px] text-emerald-800 font-bold block mb-1">م. أسامة (شريك مكتب)</span>
                    <strong class="text-lg font-black text-emerald-900">{Math.round(officePartnersShare).toLocaleString()} ج.م</strong>
                  </div>
                  <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl shadow-sm">
                    <span class="text-[11px] text-emerald-800 font-bold block mb-1">م. أيمن (شريك مكتب)</span>
                    <strong class="text-lg font-black text-emerald-900">{Math.round(officePartnersShare).toLocaleString()} ج.م</strong>
                  </div>
                  <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl shadow-sm">
                    <span class="text-[11px] text-emerald-800 font-bold block mb-1">م. علاء (شريك مكتب)</span>
                    <strong class="text-lg font-black text-emerald-900">{Math.round(officePartnersShare).toLocaleString()} ج.م</strong>
                  </div>
                </div>
              </div>
            )}

            {/* 10. سجل الدخول (محمي للأدمن mohamedmo686686@gmail.com) */}
            {activeTab === 'logs' && isSuperAdmin && (
              <div class="space-y-4">
                <div class="bg-white p-4 rounded-2xl border shadow-sm">
                  <h3 class="font-black text-slate-800 text-sm mb-3 border-b pb-2">🛡️ سجل دخول المستخدمين السحابي (Admin Only):</h3>
                  <table class="w-full text-right border-collapse">
                    <thead>
                      <tr class="bg-slate-100 border-b"><th class="p-2">الاسم</th><th class="p-2">البريد الإلكتروني</th><th class="p-2">تاريخ وتوقيت الدخول</th></tr>
                    </thead>
                    <tbody>
                      {loginLogs.map((l, i) => (
                        <tr key={i} class="border-b hover:bg-slate-50">
                          <td class="p-2 font-bold">{l.name}</td>
                          <td class="p-2 font-mono text-slate-600">{l.email}</td>
                          <td class="p-2 text-slate-500 font-mono">{l.date}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* 11. الإعدادات واللوجو */}
            {activeTab === 'settings' && (
              <div class="space-y-4">
                <div class="bg-white p-5 rounded-2xl border shadow-sm max-w-lg">
                  <h3 class="font-black text-slate-800 text-sm mb-3 border-b pb-2">⚙️ شعار الشركة المعتمد للترويسات والطباعة:</h3>
                  <input type="file" accept="image/*" onChange={(e)=>{
                    const file = e.target.files && e.target.files[0];
                    if(!file) return;
                    const r = new FileReader();
                    r.onload = (evt) => {
                      const b64 = evt.target.result;
                      setLogo(b64);
                      if (db) db.ref('survey_data/logo').set(b64);
                      showToast("تم تحديث وحفظ لوجو المكتب بنجاح! 🖼️");
                    };
                    r.readAsDataURL(file);
                  }} class="w-full text-xs p-2 border rounded-xl" />
                  {logo && <div class="mt-4"><img src={logo} class="h-16 object-contain border p-2 rounded-xl" /></div>}
                </div>
              </div>
            )}
          </main>

          {/* Toast */}
          {toast.show && (
            <div class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-2 rounded-2xl text-xs font-bold shadow-2xl z-50">
              {toast.message}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
