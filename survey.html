    const parseNum = (val) => {
      if (typeof val === "number") return isNaN(val) ? 0 : val;
      if (!val) return 0;
      const clean = String(val).replace(/,/g, '').replace(/،/g, '.').trim();
      const n = parseFloat(clean);
      return isNaN(n) ? 0 : n;
    };

    const exportCleanPdfAndWhatsApp = (elementId, filename, textMessage) => {
      let targetPhone = window.prompt("أدخل رقم هاتف المستلم (أو اتركه فارغاً لاختيار المحادثة مباشرة في واتساب):", "");
      if (targetPhone === null) return;
      targetPhone = targetPhone.replace(/[^0-9]/g, '');
      if (targetPhone.startsWith('01')) targetPhone = '20' + targetPhone.substring(1);

      const element = document.getElementById(elementId);
      if (element && typeof html2pdf !== 'undefined') {
        const opt = {
          margin: [8, 8, 8, 8],
          filename: filename || 'مستند.pdf',
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true, logging: false },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save().then(() => {
          const url = targetPhone ? `https://wa.me/${targetPhone}?text=${encodeURIComponent(textMessage)}` : `https://wa.me/?text=${encodeURIComponent(textMessage)}`;
          window.open(url, '_blank');
        }).catch(() => {
          const url = targetPhone ? `https://wa.me/${targetPhone}?text=${encodeURIComponent(textMessage)}` : `https://wa.me/?text=${encodeURIComponent(textMessage)}`;
          window.open(url, '_blank');
        });
      } else {
        const url = targetPhone ? `https://wa.me/${targetPhone}?text=${encodeURIComponent(textMessage)}` : `https://wa.me/?text=${encodeURIComponent(textMessage)}`;
        window.open(url, '_blank');
      }
    };

    function DashboardCharts({ operations }) {
      const chart1Ref = useRef(null);
      const chart2Ref = useRef(null);
      const chart1Instance = useRef(null);
      const chart2Instance = useRef(null);

      const stats = useMemo(() => {
        let rtkCount = 0;
        let sketchCount = 0;
        let otherCount = 0;
        let monthlyRevenue = {};

        operations.forEach(o => {
          const t = String(o.opType || '');
          if (t.includes('RTK')) rtkCount++;
          else if (t.includes('كروكي') || t.includes('قياس')) sketchCount++;
          else otherCount++;

          const m = String(o.date || '').substring(0, 7) || 'غير محدد';
          monthlyRevenue[m] = (monthlyRevenue[m] || 0) + parseNum(o.agreedAmount);
        });

        const months = Object.keys(monthlyRevenue).sort().slice(-6);
        const revenues = months.map(m => monthlyRevenue[m]);

        return { rtkCount, sketchCount, otherCount, months, revenues };
      }, [operations]);

      useEffect(() => {
        if (chart1Instance.current) chart1Instance.current.destroy();
        if (chart2Instance.current) chart2Instance.current.destroy();

        if (chart1Ref.current) {
          chart1Instance.current = new Chart(chart1Ref.current, {
            type: 'bar',
            data: {
              labels: stats.months.length ? stats.months : ['لا توجد بيانات'],
              datasets: [{
                label: 'قيمة الأعمال الشهرية (ج.م)',
                data: stats.revenues.length ? stats.revenues : [0],
                backgroundColor: '#6366f1',
                borderRadius: 8
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } }
            }
          });
        }

        if (chart2Ref.current) {
          chart2Instance.current = new Chart(chart2Ref.current, {
            type: 'doughnut',
            data: {
              labels: ['أعمال جهاز RTK', 'قياس وكروكيات', 'أعمال مساحية أخرى'],
              datasets: [{
                data: [stats.rtkCount, stats.sketchCount, stats.otherCount],
                backgroundColor: ['#4f46e5', '#f59e0b', '#10b981']
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10, family: 'Cairo' } } }
              }
            }
          });
        }

        return () => {
          if (chart1Instance.current) chart1Instance.current.destroy();
          if (chart2Instance.current) chart2Instance.current.destroy();
        };
      }, [stats]);

      return (
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="bg-white dark:bg-slate-800 p-4 rounded-3xl border dark:border-slate-700 shadow-xs h-72 flex flex-col">
            <h4 class="font-bold text-xs text-slate-700 dark:text-slate-300 mb-2 text-center">📈 تطور قيمة الأعمال لآخر 6 شهور</h4>
            <div class="relative w-full flex-1 min-h-0"><canvas ref={chart1Ref}></canvas></div>
          </div>
          <div class="bg-white dark:bg-slate-800 p-4 rounded-3xl border dark:border-slate-700 shadow-xs h-72 flex flex-col">
            <h4 class="font-bold text-xs text-slate-700 dark:text-slate-300 mb-2 text-center">📊 نسبة وتوزيع الأعمال (RTK / كروكيات)</h4>
            <div class="relative w-full flex-1 min-h-0"><canvas ref={chart2Ref}></canvas></div>
          </div>
        </div>
      );

    function App() {
      const [user, setUser] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);
      const [isSuperAdmin, setIsSuperAdmin] = useState(false);
      const [authLoading, setAuthLoading] = useState(true);

      const [activeTab, setActiveTab] = useState("dashboard");
      const [drawerOpen, setDrawerOpen] = useState(false);
      const [opModalOpen, setOpModalOpen] = useState(false);
      const [payModalOpen, setPayModalOpen] = useState(false);
      const [editingOp, setEditingOp] = useState(null);

      const [operations, setOperations] = useState([]);
      const [transactions, setTransactions] = useState([]);
      const [payments, setPayments] = useState([]);
      const [loginLogs, setLoginLogs] = useState([]);
      
      const [settings, setSettings] = useState({
        engineers: ["م أحمد نبيل", "م أيمن", "م علاء", "م أسامة"],
        opTypes: ["يوم RTK", "1/2RTK (نصف يوم)", "قياس وكروكي", "تخطيط شبكة", "تخطيط جور"],
        logo: "",
        theme: localStorage.getItem('theme') || 'light'
      });

      const todayDate = new Date().toISOString().split('T')[0];
      const currentMonthStr = todayDate.substring(0, 7);

      const [vaultMonth, setVaultMonth] = useState(currentMonthStr);
      const [opsFilterMonth, setOpsFilterMonth] = useState(currentMonthStr);
      const [toast, setToast] = useState({ show: false, message: "" });

      // نماذج الإدخال
      const [newOp, setNewOp] = useState({
        date: todayDate, clientName: "", siteLocation: "الموقع العام", opType: "يوم RTK", workDescription: "", engineer: "م أحمد نبيل",
        isFaddan: false, faddanQty: 1, faddanPrice: 250,
        isSketch: false, sketchesCount: 1,
        agreedAmount: 5500, paidNow: 0, laborCost: 0, carCost: 0
      });

      const [newTx, setNewTx] = useState({
        date: todayDate, type: "income", category: "إيراد عام", clientOrEntity: "", amount: "", notes: ""
      });

      const [newPayment, setNewPayment] = useState({ date: todayDate, clientName: "", siteLocation: "", amount: "", notes: "سداد دفعة من المستخلص" });

      // المستخلص
      const [extractClient, setExtractClient] = useState("");
      const [extractSite, setExtractSite] = useState("");
      const [extractNumber, setExtractNumber] = useState("1");
      const [extractEngineer, setExtractEngineer] = useState("م أحمد نبيل");
      const [extractItems, setExtractItems] = useState([]);

      // كشف الحساب
      const [statementClient, setStatementClient] = useState("");

      useEffect(() => {
        if (settings.theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', settings.theme);
      }, [settings.theme]);

      const showToast = (message) => {
        setToast({ show: true, message });
        setTimeout(() => setToast({ show: false, message: "" }), 3000);
      };

      const logActivity = (actionText) => {
        if (!db || !user) return;
        const entry = {
          name: user.displayName || user.email,
          email: user.email,
          action: actionText,
          date: new Date().toLocaleString('ar-EG'),
          timestamp: Date.now()
        };
        db.ref('survey_data/login_logs').push(entry);
      };

      // التحقق الصارم والمرن من حساب مدير النظام
      useEffect(() => {
        if (!auth) { setAuthLoading(false); return; }
        return auth.onAuthStateChanged((curr) => {
          if (curr) {
            const cleanEmail = (curr.email || "").trim().toLowerCase();
            setUser(curr);

            const isSuper = cleanEmail === SUPER_ADMIN_EMAIL.toLowerCase() || 
                            cleanEmail.includes("mohamedmo686686") || 
                            cleanEmail.includes("686686");
            setIsSuperAdmin(isSuper);
            setIsAdmin(isSuper || ADMIN_EMAILS.some(e => cleanEmail.includes(e.toLowerCase())));

            if (db && !sessionStorage.getItem('survey_log_done')) {
              db.ref('survey_data/login_logs').push({
                name: curr.displayName || curr.email,
                email: curr.email,
                action: "تسجيل الدخول للنظام",
                date: new Date().toLocaleString('ar-EG'),
                timestamp: Date.now()
              });
              sessionStorage.setItem('survey_log_done', 'true');
            }
          } else {
            setUser(null); setIsAdmin(false); setIsSuperAdmin(false);
          }
          setAuthLoading(false);
        });
      }, []);

      useEffect(() => {
        if (!db) return;
        const ref = db.ref('survey_data');
        ref.on('value', (snap) => {
          const d = snap.val() || {};
          const toArr = (v) => (v ? (Array.isArray(v) ? v : Object.values(v)) : []);
          setOperations(toArr(d.operations).reverse());
          setTransactions(toArr(d.transactions).reverse());
          setPayments(toArr(d.payments).reverse());
          setLoginLogs(toArr(d.login_logs).reverse());
          
          if (d.settings) {
            setSettings(prev => ({
              ...prev,
              engineers: d.settings.engineers || prev.engineers,
              opTypes: d.settings.opTypes || prev.opTypes,
              logo: d.settings.logo || prev.logo
            }));
          }
        });
      }, []);

      const updateSettingArray = (key, title) => {
        const val = prompt(`إضافة ${title} جديد:`);
        if (val && val.trim()) {
          const updated = [...settings[key], val.trim()];
          setSettings(p => ({ ...p, [key]: updated }));
          if(db) db.ref(`survey_data/settings/${key}`).set(updated);
          logActivity(`إضافة ${title} جديد: ${val.trim()}`);
        }
      };

      // حساب التوزيع المالي الدقيق بنصف يوم RTK واليوم الكامل والكروكي
      const calculateOperationShares = (op) => {
        const total = parseNum(op.agreedAmount);
        const labor = parseNum(op.laborCost);
        const car = parseNum(op.carCost);
        const type = String(op.opType || '');
        let engFee = 0, deviceFee = 0, officeFee = 0;

        // فحص نصف يوم RTK بدقة
        if (type.includes('1/2') || type.includes('نص') || type.includes('نصف')) {
          engFee = 1500;
          deviceFee = 1750;
          officeFee = Math.max(0, total - engFee - deviceFee - labor - car);
        } 
        // فحص يوم كامل RTK
        else if (type.includes('RTK') || type.includes('يوم RTK')) {
          engFee = 2000;
          deviceFee = 3500;
          officeFee = Math.max(0, total - engFee - deviceFee - labor - car);
        } 
        // فحص قياس وكروكي
        else if (type.includes('كروكي') || type.includes('قياس')) {
          engFee = total * 0.80; // 80% للمهندس
          officeFee = total * 0.20; // 20% للمكتب
          deviceFee = 0;
        } 
        else {
          engFee = 2000;
          deviceFee = 0;
          officeFee = Math.max(0, total - engFee - deviceFee - labor - car);
        }

        return { engFee, deviceFee, officeFee };
      };

      const handleSaveOperation = (e) => {
        e.preventDefault();
        const total = newOp.isFaddan ? parseNum(newOp.faddanQty) * parseNum(newOp.faddanPrice) : parseNum(newOp.agreedAmount);
        const finalOp = { ...newOp, clientName: (newOp.clientName || '').trim(), siteLocation: (newOp.siteLocation || '').trim(), agreedAmount: total };
        const shares = calculateOperationShares(finalOp);

        if (editingOp) {
          const updatedOps = operations.map(o => o.id === editingOp.id ? { ...o, ...finalOp, ...shares } : o);
          setOperations(updatedOps);
          if (db) db.ref('survey_data/operations').set(updatedOps);
          logActivity(`تعديل طلعة للعميل: ${finalOp.clientName}`);
          showToast("تم تحديث الطلعة بنجاح! ✏️");
          setEditingOp(null);
        } else {
          const opToSave = {
            id: Date.now(), ...finalOp, ...shares, createdBy: user.email
          };
          const updatedOps = [opToSave, ...operations];
          setOperations(updatedOps);
          if (db) db.ref('survey_data/operations').set(updatedOps);

          if (parseNum(newOp.paidNow) > 0) {
            const autoPay = { id: Date.now() + 1, date: newOp.date, clientName: finalOp.clientName, siteLocation: finalOp.siteLocation, amount: parseNum(newOp.paidNow), notes: `دفعة مقدمة موقع (${finalOp.opType})` };
            const autoTx = { id: Date.now() + 2, date: newOp.date, type: "income", category: "تحصيل مساحة مقدم", clientOrEntity: `${finalOp.clientName}`, amount: parseNum(newOp.paidNow) };
            setPayments([autoPay, ...payments]);
            setTransactions([autoTx, ...transactions]);
            if(db){
              db.ref('survey_data/payments').set([autoPay, ...payments]);
              db.ref('survey_data/transactions').set([autoTx, ...transactions]);
            }
          }
          logActivity(`تسجيل طلعة جديدة: ${finalOp.clientName} (${finalOp.opType})`);
          showToast("تم حفظ الطلعة واحتساب حصص الشركاء! 📐");
        }
        setOpModalOpen(false);
      };

      const handleAddTransaction = (e) => {
        e.preventDefault();
        const amt = parseNum(newTx.amount);
        if (amt <= 0) {
          alert("يرجى كتابة مبلغ صالح!");
          return;
        }
        const item = { id: Date.now(), ...newTx, amount: amt };
        const updated = [item, ...transactions];
        setTransactions(updated);
        if (db) db.ref('survey_data/transactions').set(updated);
        logActivity(`قيد حركة بالخزينة: ${item.type === 'income' ? 'وارد' : 'صادر'} بمبلغ ${amt} ج.م (${item.category})`);
        setNewTx({ date: todayDate, type: "income", category: "إيراد عام", clientOrEntity: "", amount: "", notes: "" });
        showToast("تم تسجيل الحركة في الخزينة بنجاح! 💵");
      };

      const handleAddPayment = (e) => {
        e.preventDefault();
        const item = { id: Date.now(), ...newPayment, clientName: (newPayment.clientName||'').trim(), amount: parseNum(newPayment.amount) };
        const tx = { id: Date.now()+1, date: item.date, type: 'income', category: 'سداد دفعة مستخلص', clientOrEntity: item.clientName, amount: item.amount };
        
        const upPay = [item, ...payments];
        const upTx = [tx, ...transactions];
        setPayments(upPay); setTransactions(upTx);
        if (db) { db.ref('survey_data/payments').set(upPay); db.ref('survey_data/transactions').set(upTx); }
        logActivity(`قيد دفعة مستلمة من العميل: ${item.clientName} بقيمة ${item.amount} ج.م`);
        setPayModalOpen(false);
        setNewPayment({ date: todayDate, clientName: "", siteLocation: "", amount: "", notes: "سداد دفعة من المستخلص" });
        showToast("تم قيد الدفعة بنجاح! 💰");
      };

      const deleteItem = (path, id, list, setter, title) => {
        if (!isAdmin) { showToast("مرفوض. للإدارة فقط 🔒"); return; }
        if (window.confirm("تأكيد الحذف النهائي؟")) {
          const updated = list.filter(item => item.id !== id);
          setter(updated);
          if (db) db.ref(`survey_data/${path}`).set(updated);
          logActivity(`حذف ${title || 'عنصر'} من النظام`);
          showToast("تم الحذف بنجاح!");
        }
      };

      const loadClientOpsIntoExtract = (targetClient, targetSite) => {
        const cName = (targetClient || '').trim();
        const sName = (targetSite || '').trim();
        if (!cName) {
          setExtractItems([]);
          return;
        }

        const filtered = operations.filter(o => {
          const matchClient = (o.clientName || '').trim() === cName;
          const matchSite = !sName || (o.siteLocation || '').trim() === sName;
          return matchClient && matchSite;
        });

        const loaded = filtered.map((o, idx) => ({
          id: o.id || (Date.now() + idx),
          date: o.date,
          desc: o.workDescription ? o.workDescription : o.opType,
          qty: o.isFaddan ? parseNum(o.faddanQty) : 1,
          unitPrice: o.isFaddan ? parseNum(o.faddanPrice) : parseNum(o.agreedAmount),
          rate: 100
        }));

        setExtractItems(loaded);
        if (loaded.length > 0) {
          showToast(`تم تحميل ${loaded.length} أعمال بنجاح في المستخلص!`);
        } else {
          showToast(`لا توجد أعمال مسجلة مطابقة للعميل.`);
        }
      };

      useEffect(() => {
        if (extractClient) {
          loadClientOpsIntoExtract(extractClient, extractSite);
        } else {
          setExtractItems([]);
        }
      }, [extractClient, extractSite, operations]);

      const handleAddEmptyExtractRow = () => {
        setExtractItems([
          ...extractItems,
          { id: Date.now(), date: todayDate, desc: "بند أعمال مساحية", qty: 1, unitPrice: 1000, rate: 100 }
        ]);
      };

      const handleRemoveExtractRow = (id) => {
        setExtractItems(extractItems.filter(item => item.id !== id));
      };

      const extractTotalWork = extractItems.reduce((sum, item) => {
        return sum + (parseNum(item.qty) * parseNum(item.unitPrice) * (parseNum(item.rate) / 100));
      }, 0);

      const clientOpsForPayment = operations.filter(o => (o.clientName||'').trim() === (extractClient||'').trim() && (!extractSite || (o.siteLocation||'').trim() === extractSite.trim()));
      const clientPaysForPayment = payments.filter(p => (p.clientName||'').trim() === (extractClient||'').trim() && (!extractSite || (p.siteLocation||'').trim() === extractSite.trim()));
      const clientTotalPaid = clientOpsForPayment.reduce((s,o)=>s+parseNum(o.paidNow),0) + clientPaysForPayment.reduce((s,p)=>s+parseNum(p.amount),0);
      const extractRemainingBalance = extractTotalWork - clientTotalPaid;

      const clientNames = Array.from(new Set([
        ...operations.map(o => (o.clientName || '').trim()),
        ...payments.map(p => (p.clientName || '').trim())
      ])).filter(Boolean);

      const siteLocationsList = Array.from(new Set(operations.map(o => (o.siteLocation || '').trim()).filter(Boolean)));

      const monthlyTx = transactions.filter(t => t.date && t.date.startsWith(vaultMonth));
      const mIn = monthlyTx.filter(t=>t.type==='income').reduce((s,t)=>s+parseNum(t.amount),0);
      const mOut = monthlyTx.filter(t=>t.type==='expense').reduce((s,t)=>s+parseNum(t.amount),0);
      const mNet = mIn - mOut;

      const cumulativeTx = transactions.filter(t => t.date && t.date.substring(0, 7) <= vaultMonth);

                  <h3 class="text-base">أرباح المكتب المجمعة</h3>
                  <div class="text-3xl font-black text-emerald-600">{Math.round(totalOffice).toLocaleString()} ج.م</div>
                  <div class="grid grid-cols-2 sm:grid-cols-5 gap-2.5">
                    <div class="p-3 border rounded-2xl bg-amber-50 dark:bg-slate-700">في سبيل الله (10%)<br/><strong class="text-base mt-1 block">{Math.round(totalOffice*0.1).toLocaleString()}</strong></div>
                    <div class="p-3 border rounded-2xl bg-blue-50 dark:bg-slate-700">م. أحمد نبيل (10%)<br/><strong class="text-base mt-1 block">{Math.round(totalOffice*0.1).toLocaleString()}</strong></div>
                    <div class="p-3 border rounded-2xl">م. أسامة<br/><strong class="text-base mt-1 block">{Math.round((totalOffice*0.8)/3).toLocaleString()}</strong></div>
                    <div class="p-3 border rounded-2xl">م. أيمن<br/><strong class="text-base mt-1 block">{Math.round((totalOffice*0.8)/3).toLocaleString()}</strong></div>
                    <div class="p-3 border rounded-2xl">م. علاء<br/><strong class="text-base mt-1 block">{Math.round((totalOffice*0.8)/3).toLocaleString()}</strong></div>
                  </div>
                </div>
              )}

              {/* 12. سجل الدخول والنشاطات المعتمد لمدير النظام */}
              {activeTab === 'logs' && isSuperAdmin && (
                <div class="bg-white dark:bg-slate-800 rounded-2xl border dark:border-slate-700 overflow-x-auto p-4 space-y-3 font-bold">
                  <h3 class="text-sm font-black text-indigo-700 dark:text-indigo-400">🛡️ سجل نشاطات وحركات المستخدمين (خاص بمدير النظام):</h3>
                  <table class="w-full text-right"><thead class="bg-slate-100 dark:bg-slate-700"><tr><th class="p-2">الوقت</th><th class="p-2">المستخدم</th><th class="p-2">البريد</th><th class="p-2">النشاط والإجراء المنفذ</th></tr></thead>
                  <tbody>{loginLogs.map((l,i)=><tr key={i} class="border-b dark:border-slate-700">
                    <td class="p-2 whitespace-nowrap text-slate-500 font-mono text-[11px]">{l.date}</td>
                    <td class="p-2">{l.name}</td>
                    <td class="p-2 text-slate-400 font-mono text-[11px]">{l.email}</td>
                    <td class="p-2 text-indigo-600 dark:text-indigo-400 font-black">{l.action || 'زيارة وتسجيل الدخول'}</td>
                  </tr>)}</tbody></table>
                </div>
              )}

              {/* 13. الإعدادات */}
              {activeTab === 'settings' && (
                <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border shadow-xs max-w-sm font-bold space-y-3">
                  <h3>🖼️ شعار الترويسة المعتمد:</h3>
                  <input type="file" accept="image/*" onChange={(e)=>{
                    if(!isAdmin) return;
                    const f = e.target.files[0]; if(!f) return;
                    const r = new FileReader(); r.onload = (evt) => {
                      setSettings(p=>({...p, logo: evt.target.result}));
                      if(db) db.ref(`survey_data/settings/logo`).set(evt.target.result);
                      logActivity('تحديث شعار المكتب');
                      showToast("تم تحديث الشعار!");
                    }; r.readAsDataURL(f);
                  }} class="w-full p-2 border rounded-xl dark:bg-slate-700"/>
                  {settings.logo && <img src={settings.logo} class="h-16 object-contain mt-2 border p-2 rounded-xl" />}

                  {isSuperAdmin && (
                    <div class="pt-3 border-t dark:border-slate-700">
                      <button onClick={()=>setActiveTab('logs')} class="w-full bg-amber-600 hover:bg-amber-700 text-white p-2.5 rounded-xl text-xs font-black shadow-xs">
                        🛡️ فتح سجل النشاطات والمراقبة
                      </button>
                    </div>
                  )}
                </div>
              )}

            </main>
          </div>

          {/* النافذة السريعة للطلعة مع التوزيع الآلي الصريح لنصف يوم RTK */}
          {opModalOpen && (
            <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 print-hidden">
              <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs" onClick={()=>setOpModalOpen(false)}></div>
              <div class="relative bg-white dark:bg-slate-800 w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl z-50 max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-center border-b dark:border-slate-700 pb-3 mb-3">
                  <h3 class="font-black text-sm">{editingOp ? '✏️ تعديل طلعة مسجلة' : '➕ تسجيل طلعة يومية جديدة'}</h3>
                  <button onClick={()=>setOpModalOpen(false)} class="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
                </div>
                <form onSubmit={handleSaveOperation} class="space-y-3 text-xs font-bold">
                  <div class="grid grid-cols-2 gap-2">
                    <div>التاريخ <input type="date" value={newOp.date} onChange={e=>setNewOp({...newOp, date: e.target.value})} class="w-full border p-2.5 rounded-xl dark:bg-slate-700 mt-1" required/></div>
                    <div>اسم العميل <input type="text" value={newOp.clientName} onChange={e=>setNewOp({...newOp, clientName: e.target.value})} placeholder="الواحة البحرية..." class="w-full border p-2.5 rounded-xl dark:bg-slate-700 mt-1" required/></div>
                  </div>
                  <div class="grid grid-cols-2 gap-2">
                    <div>الموقع بالمزرعة <input type="text" value={newOp.siteLocation} onChange={e=>setNewOp({...newOp, siteLocation: e.target.value})} placeholder="المحمية، خط 2400..." class="w-full border p-2.5 rounded-xl dark:bg-slate-700 mt-1 bg-amber-50 dark:bg-amber-950/40" required/></div>
                    <div>نوع العمل 
                      <div class="flex gap-1 mt-1">
                        <select value={newOp.opType} onChange={e=>setNewOp({...newOp, opType: e.target.value})} class="w-full border p-2.5 rounded-xl dark:bg-slate-700">
                          {settings.opTypes.map(o=><option key={o}>{o}</option>)}
                        </select>
                        <button type="button" onClick={()=>updateSettingArray('opTypes','نوع عمل')} class="bg-slate-200 dark:bg-slate-700 px-2.5 rounded-xl font-black">+</button>
                      </div>
                    </div>
                  </div>
                  <div>المهندس المشرف
                    <div class="flex gap-1 mt-1">
                      <select value={newOp.engineer} onChange={e=>setNewOp({...newOp, engineer: e.target.value})} class="w-full border p-2.5 rounded-xl dark:bg-slate-700">
                        {settings.engineers.map(e=><option key={e}>{e}</option>)}
                      </select>
                      <button type="button" onClick={()=>updateSettingArray('engineers','مهندس')} class="bg-slate-200 dark:bg-slate-700 px-2.5 rounded-xl font-black">+</button>
                    </div>
                  </div>
                  <div>بيان الأعمال (الوصف الذي سيوضع في المستخلص) <input type="text" value={newOp.workDescription} onChange={e=>setNewOp({...newOp, workDescription: e.target.value})} placeholder="تخطيط 80 فدان موقع المحمية..." class="w-full border p-2.5 rounded-xl dark:bg-slate-700 mt-1" required/></div>
                  
                  <div class="flex gap-4 py-1">
                    <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" checked={newOp.isFaddan} onChange={e=>setNewOp({...newOp, isFaddan: e.target.checked})} class="w-4 h-4 rounded"/> حساب بالفدان</label>
                    <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" checked={newOp.isSketch} onChange={e=>setNewOp({...newOp, isSketch: e.target.checked})} class="w-4 h-4 rounded"/> كروكيات</label>
                  </div>

                  {newOp.isFaddan ? (
                    <div class="grid grid-cols-2 gap-2">
                      <div>عدد الأفدنة <input type="number" step="any" value={newOp.faddanQty} onChange={e=>setNewOp({...newOp, faddanQty: e.target.value})} class="w-full border p-2 rounded-xl dark:bg-slate-700 bg-amber-50"/></div>
                      <div>سعر الفدان <input type="number" step="any" value={newOp.faddanPrice} onChange={e=>setNewOp({...newOp, faddanPrice: e.target.value})} class="w-full border p-2 rounded-xl dark:bg-slate-700 bg-amber-50"/></div>
                    </div>
                  ) : (
                    <div>المبلغ الإجمالي المتفق عليه <input type="number" value={newOp.agreedAmount} onChange={e=>setNewOp({...newOp, agreedAmount: e.target.value})} class="w-full border p-2.5 rounded-xl dark:bg-slate-700 mt-1 text-indigo-700 font-black" required/></div>
                  )}

                  <div class="grid grid-cols-3 gap-2">
                    <div>المسدد فورا <input type="number" value={newOp.paidNow} onChange={e=>setNewOp({...newOp, paidNow: e.target.value})} class="w-full border p-2.5 rounded-xl dark:bg-slate-700"/></div>
                    <div>مصاريف عمالة <input type="number" value={newOp.laborCost} onChange={e=>setNewOp({...newOp, laborCost: e.target.value})} class="w-full border p-2.5 rounded-xl dark:bg-slate-700"/></div>
                    <div>مصاريف سيارة <input type="number" value={newOp.carCost} onChange={e=>setNewOp({...newOp, carCost: e.target.value})} class="w-full border p-2.5 rounded-xl dark:bg-slate-700"/></div>
                  </div>

                  {/* شريط المعاينة المباشر للحسابات للتأكد من الأرقام */}
                  <div class="p-2.5 bg-emerald-50 dark:bg-slate-700 border border-emerald-200 dark:border-slate-600 rounded-xl text-[11px] text-emerald-900 dark:text-emerald-300 font-bold space-y-0.5">
                    <div class="flex justify-between">
                      <span>👷 أتعاب المهندس: <strong>{livePreview.engFee.toLocaleString()} ج.م</strong></span>
                      <span>🛰 حصة الجهاز: <strong>{livePreview.deviceFee.toLocaleString()} ج.م</strong></span>
                    </div>
                    <div class="text-[10px] text-slate-500 dark:text-slate-400">
                      🏢 صافي أرباح المكتب المتوقعة: <strong>{livePreview.officeFee.toLocaleString()} ج.م</strong>
                    </div>
                  </div>

                  <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-2xl font-black mt-2 shadow-sm">
                    {editingOp ? 'حفظ التعديلات' : 'حفظ الطلعة اليومية'}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* نافذة تسجيل الدفعة السريعة */}
          {payModalOpen && (
            <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 print-hidden">
              <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs" onClick={()=>setPayModalOpen(false)}></div>
              <div class="relative bg-white dark:bg-slate-800 w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl z-50">
                <div class="flex justify-between items-center border-b dark:border-slate-700 pb-3 mb-3">
                  <h3 class="font-black text-sm">💰 تسجيل دفعة مسددة من العميل</h3>
                  <button onClick={()=>setPayModalOpen(false)} class="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
                </div>
                <form onSubmit={handleAddPayment} class="space-y-3 text-xs font-bold">
                  <div>التاريخ <input type="date" value={newPayment.date} onChange={e=>setNewPayment({...newPayment, date: e.target.value})} class="w-full border p-2.5 rounded-xl dark:bg-slate-700 mt-1" required/></div>
                  <div>العميل 
                    <select value={newPayment.clientName} onChange={e=>setNewPayment({...newPayment, clientName: e.target.value})} class="w-full border p-2.5 rounded-xl dark:bg-slate-700 mt-1" required>
                      <option value="">-- اختر العميل --</option>
                      {clientNames.map(c=><option key={c}>{c}</option>)}
                    </select>
                  </div>
                  <div>المبلغ المسدد <input type="number" value={newPayment.amount} onChange={e=>setNewPayment({...newPayment, amount: e.target.value})} class="w-full border p-2.5 rounded-xl dark:bg-slate-700 mt-1 text-emerald-600 font-black text-sm" required/></div>
                  <div>البيان / الملاحظات <input type="text" value={newPayment.notes} onChange={e=>setNewPayment({...newPayment, notes: e.target.value})} class="w-full border p-2.5 rounded-xl dark:bg-slate-700 mt-1"/></div>
                  <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-2xl font-black mt-2 shadow-sm">
                    قيد الدفعة في الحساب
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Bottom Bar للهاتف */}
          <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-800 border-t dark:border-slate-700 px-2 py-1.5 flex justify-around items-center z-40 shadow-lg print-hidden">
            <button onClick={()=>setActiveTab('dashboard')} class={`flex flex-col items-center py-1 px-2 rounded-xl transition ${activeTab==='dashboard'?'text-indigo-600 dark:text-indigo-400 font-black':'text-slate-500'}`}>
              <span class="text-base">📊</span>
              <span class="text-[9px] mt-0.5">الرئيسية</span>
            </button>
            <button onClick={()=>setActiveTab('extracts')} class={`flex flex-col items-center py-1 px-2 rounded-xl transition ${activeTab==='extracts'?'text-indigo-600 dark:text-indigo-400 font-black':'text-slate-500'}`}>
              <span class="text-base">📄</span>
              <span class="text-[9px] mt-0.5">المستخلص</span>
            </button>
            <button onClick={()=>setActiveTab('operations')} class={`flex flex-col items-center py-1 px-2 rounded-xl transition ${activeTab==='operations'?'text-indigo-600 dark:text-indigo-400 font-black':'text-slate-500'}`}>
              <span class="text-base">📐</span>
              <span class="text-[9px] mt-0.5">الطلعات</span>
            </button>
            <button onClick={()=>setActiveTab('vault')} class={`flex flex-col items-center py-1 px-2 rounded-xl transition ${activeTab==='vault'?'text-indigo-600 dark:text-indigo-400 font-black':'text-slate-500'}`}>
              <span class="text-base">💵</span>
              <span class="text-[9px] mt-0.5">الخزينة</span>
            </button>
            <button onClick={()=>setDrawerOpen(true)} class="flex flex-col items-center py-1 px-2 text-slate-500">
              <span class="text-base">☰</span>
              <span class="text-[9px] mt-0.5">المزيد</span>
            </button>
          </nav>

          {/* Toast */}
          {toast.show && <div class="fixed bottom-16 md:bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-2.5 rounded-2xl text-xs z-50 shadow-2xl font-bold print-hidden">{toast.message}</div>}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
