    const parseNum = (val) => {
      if (typeof val === "number") return isNaN(val) ? 0 : val;
      if (!val) return 0;
      const clean = String(val).replace(/,/g, '').replace(/،/g, '.').trim();
      const n = parseFloat(clean);
      return isNaN(n) ? 0 : n;
    };

    const toArr = (v) => (v ? (Array.isArray(v) ? v : Object.values(v)) : []);

    const offlineStorage = {
      get(key, fallback = []) {
        try {
          const item = localStorage.getItem(`survey_${key}`);
          return item ? JSON.parse(item) : fallback;
        } catch { return fallback; }
      },
      set(key, data) {
        try { localStorage.setItem(`survey_${key}`, JSON.stringify(data)); } catch (e) {}
      },
      addToQueue(path, data) {
        const queue = this.get('offline_sync_queue', []);
        queue.push({ id: Date.now(), path, data });
        this.set('offline_sync_queue', queue);
      },
      syncQueue(databaseInstance) {
        if (!navigator.onLine || !databaseInstance) return;
        const queue = this.get('offline_sync_queue', []);
        if (queue.length === 0) return;
        queue.forEach(item => databaseInstance.ref(item.path).set(item.data));
        localStorage.removeItem('survey_offline_sync_queue');
      }
    };

    const exportCleanPdfAndWhatsApp = (elementId, filename, textMessage) => {
      let targetPhone = window.prompt("أدخل رقم هاتف المستلم (أو اتركه فارغاً لاختيار المحادثة مباشرة في واتساب):", "");
      if (targetPhone === null) return;
      targetPhone = targetPhone.replace(/[^0-9]/g, '');
      if (targetPhone.startsWith('01')) targetPhone = '20' + targetPhone.substring(1);

      const element = document.getElementById(elementId);
      if (!element || typeof html2pdf === 'undefined') {
        const url = targetPhone ? `https://wa.me/${targetPhone}?text=${encodeURIComponent(textMessage)}` : `https://wa.me/?text=${encodeURIComponent(textMessage)}`;
        window.open(url, '_blank');
        return;
      }

      const prevWidth = element.style.width;
      const prevMaxWidth = element.style.maxWidth;
      const prevPadding = element.style.padding;

      element.style.width = '800px';
      element.style.maxWidth = '800px';
      element.style.padding = '24px';
      element.classList.add('pdf-render-mode');

      const opt = {
        margin: [8, 8, 8, 8],
        filename: filename || 'مستخلص.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { 
          scale: 2, 
          useCORS: true, 
          logging: false,
          windowWidth: 1200,
          scrollX: 0,
          scrollY: 0
        },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save().then(() => {
        element.style.width = prevWidth;
        element.style.maxWidth = prevMaxWidth;
        element.style.padding = prevPadding;
        element.classList.remove('pdf-render-mode');

        const url = targetPhone ? `https://wa.me/${targetPhone}?text=${encodeURIComponent(textMessage)}` : `https://wa.me/?text=${encodeURIComponent(textMessage)}`;
        window.open(url, '_blank');
      }).catch((err) => {
        element.style.width = prevWidth;
        element.style.maxWidth = prevMaxWidth;
        element.style.padding = prevPadding;
        element.classList.remove('pdf-render-mode');
        console.error(err);
        const url = targetPhone ? `https://wa.me/${targetPhone}?text=${encodeURIComponent(textMessage)}` : `https://wa.me/?text=${encodeURIComponent(textMessage)}`;
        window.open(url, '_blank');
      });
    };

    function DashboardCharts({ operations }) {
      const chart1Ref = useRef(null);
      const chart2Ref = useRef(null);
      const chart1Instance = useRef(null);
      const chart2Instance = useRef(null);

      const stats = useMemo(() => {
        let rtkCount = 0;
        let sketchCount = 0;
        let otherCount = 0;
        let monthlyRevenue = {};

        operations.forEach(o => {
          const t = String(o?.opType || '');
          if (t.includes('RTK')) rtkCount++;
          else if (t.includes('كروكي') || t.includes('قياس') || o?.isSketch) sketchCount++;
          else otherCount++;

          const m = String(o?.date || '').substring(0, 7) || 'غير محدد';
          monthlyRevenue[m] = (monthlyRevenue[m] || 0) + parseNum(o?.agreedAmount);
        });

        const months = Object.keys(monthlyRevenue).sort().slice(-6);
        const revenues = months.map(m => monthlyRevenue[m]);

        return { rtkCount, sketchCount, otherCount, months, revenues };
      }, [operations]);

      useEffect(() => {
        if (chart1Instance.current) chart1Instance.current.destroy();
        if (chart2Instance.current) chart2Instance.current.destroy();

        if (chart1Ref.current) {
          chart1Instance.current = new Chart(chart1Ref.current, {
            type: 'bar',
            data: {
              labels: stats.months.length ? stats.months : ['لا توجد بيانات'],
              datasets: [{
                label: 'قيمة الأعمال الشهرية (ج.م)',
                data: stats.revenues.length ? stats.revenues : [0],
                backgroundColor: '#6366f1',
                borderRadius: 8
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } }
            }
          });
        }

        if (chart2Ref.current) {
          chart2Instance.current = new Chart(chart2Ref.current, {
            type: 'doughnut',
            data: {
              labels: ['أعمال جهاز RTK', 'قياس وكروكيات', 'أعمال مساحية أخرى'],
              datasets: [{
                data: [stats.rtkCount, stats.sketchCount, stats.otherCount],
                backgroundColor: ['#4f46e5', '#f59e0b', '#10b981']
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10, family: 'Cairo' } } }
              }
            }
          });
        }

        return () => {
          if (chart1Instance.current) chart1Instance.current.destroy();
          if (chart2Instance.current) chart2Instance.current.destroy();
        };
      }, [stats]);

      return (
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="bg-white dark:bg-slate-800 p-4 rounded-3xl border dark:border-slate-700 shadow-xs h-72 flex flex-col">
            <h4 class="font-bold text-xs text-slate-700 dark:text-slate-300 mb-2 text-center">📈 تطور قيمة الأعمال لآخر 6 شهور</h4>
            <div class="relative w-full flex-1 min-h-0"><canvas ref={chart1Ref}></canvas></div>
          </div>
          <div class="bg-white dark:bg-slate-800 p-4 rounded-3xl border dark:border-slate-700 shadow-xs h-72 flex flex-col">
            <h4 class="font-bold text-xs text-slate-700 dark:text-slate-300 mb-2 text-center">📊 نسبة وتوزيع الأعمال (RTK / كروكيات)</h4>
            <div class="relative w-full flex-1 min-h-0"><canvas ref={chart2Ref}></canvas></div>

    function App() {

      useEffect(() => {
        if (!db) return;
        const ref = db.ref('survey_data');
        ref.on('value', (snap) => {
          const d = snap.val() || {};
          
          if (d.operations) {
            const arr = toArr(d.operations).reverse();
            setOperations(arr);
            offlineStorage.set('operations', arr);
          }
          if (d.transactions) {
            const arr = toArr(d.transactions).reverse();
            setTransactions(arr);
            offlineStorage.set('transactions', arr);
          }
          if (d.payments) {
            const arr = toArr(d.payments).reverse();
            setPayments(arr);
            offlineStorage.set('payments', arr);
          }
          if (d.login_logs) {
            const arr = toArr(d.login_logs).reverse();
            setLoginLogs(arr);
            offlineStorage.set('login_logs', arr);
          }
          if (d.settings) {
            setSettings(prev => {
              const updated = {
                ...prev,

      const saveListSafely = (path, storageKey, data) => {
        offlineStorage.set(storageKey, data);

      };

      const updateSettingArray = (key, title) => {
        const val = prompt(`إضافة ${title} جديد:`);
        if (val && val.trim()) {
          const updated = [...settings[key], val.trim()];
          const newSettings = { ...settings, [key]: updated };
          setSettings(newSettings);
          saveListSafely(`settings/${key}`, 'settings', newSettings);
          logActivity(`إضافة ${title} جديد: ${val.trim()}`);
        }
      };

      const calculateOperationShares = (op) => {
        const total = parseNum(op?.agreedAmount);
        const labor = parseNum(op?.laborCost);
        const car = parseNum(op?.carCost);
        const totalExpenses = labor + car;
        const type = String(op?.opType || '');
        const method = op?.engCalcMethod || 'auto';

        let engFee = 0, deviceFee = 0, officeFee = 0;

        const isEngDayDevHalf = method === 'engDay_devHalf' || type.includes('مهندس يوم + جهاز نصف يوم');
        const isHalfRtk = !isEngDayDevHalf && (type.includes('1/2') || type.includes('نص') || type.includes('نصف'));
        const isFullRtk = !isEngDayDevHalf && (type.includes('يوم RTK') || (type.includes('RTK') && !isHalfRtk));

        if (isEngDayDevHalf || isHalfRtk) deviceFee = 1750;
        else if (isFullRtk) deviceFee = 3500;
        else deviceFee = 0;

        if (isEngDayDevHalf) engFee = 2000;
        else if (method === 'percent80') engFee = total * 0.80;
        else if (method === 'percent70') engFee = total * 0.70;
        else if (method === 'customPercent') engFee = total * ((parseNum(op?.engCustomPercent) || 80) / 100);
        else if (method === 'customFixed') engFee = parseNum(op?.engCustomFixedAmount) || 0;
        else {
          if (isHalfRtk) engFee = 1500;
          else if (isFullRtk) engFee = 2000;
          else engFee = total * 0.80;
        }

        officeFee = Math.max(0, total - engFee - deviceFee - totalExpenses);

        return { 
          engFee: Number(engFee) || 0, 
          deviceFee: Number(deviceFee) || 0, 
          officeFee: Number(officeFee) || 0, 
          totalExpenses: Number(totalExpenses) || 0 
        };
      };

      const handleOpTypeChange = (selectedType) => {
        let defaultAmount = newOp.agreedAmount;
        let defaultMethod = "auto";

        if (selectedType === 'مهندس يوم + جهاز نصف يوم') {
          defaultAmount = 3750;
          defaultMethod = "engDay_devHalf";
        } else if (selectedType === 'يوم RTK') {
          defaultAmount = 5500;
          defaultMethod = "auto";
        } else if (selectedType.includes('1/2') || selectedType.includes('نص')) {
          defaultAmount = 3250;
          defaultMethod = "auto";
        } else {
          defaultMethod = "percent80";
        }
        
        setNewOp(prev => ({
          ...prev,
          opType: selectedType,
          engCalcMethod: defaultMethod,
          agreedAmount: prev.isFaddan ? (parseNum(prev.faddanQty) * parseNum(prev.faddanPrice)) : defaultAmount

        } else {
          const opToSave = { id: Date.now(), ...finalOp, ...shares, createdBy: user?.email || 'Admin' };
          const updatedOps = [opToSave, ...operations];
          setOperations(updatedOps);
          saveListSafely('operations', 'operations', updatedOps);

          if (parseNum(newOp.paidNow) > 0) {
            const autoPay = { id: Date.now() + 1, date: newOp.date, clientName: finalOp.clientName, siteLocation: finalOp.siteLocation, amount: parseNum(newOp.paidNow), notes: `دفعة مقدمة موقع (${finalOp.opType})` };
            const autoTx = { id: Date.now() + 2, date: newOp.date, type: "income", category: "تحصيل مساحة مقدم", clientOrEntity: `${finalOp.clientName}`, amount: parseNum(newOp.paidNow) };
            const upPayments = [autoPay, ...payments];
            const upTx = [autoTx, ...transactions];
            setPayments(upPayments);
            setTransactions(upTx);
            saveListSafely('payments', 'payments', upPayments);
            saveListSafely('transactions', 'transactions', upTx);
          }

          logActivity(`تسجيل طلعة جديدة: ${finalOp.clientName} بقيمة ${finalAgreed} ج.م`);
          showToast("تم حفظ الطلعة بنجاح! 📐");
        }
        setOpModalOpen(false);
      };

      const handleAddTransaction = (e) => {
        e.preventDefault();
        const amt = parseNum(newTx.amount);
        if (amt <= 0) return alert("يرجى كتابة مبلغ صالح!");
        const item = { id: Date.now(), ...newTx, amount: amt };
        const updated = [item, ...transactions];
        setTransactions(updated);
        saveListSafely('transactions', 'transactions', updated);
        setNewTx({ date: todayDate, type: "income", category: "إيراد عام", clientOrEntity: "", amount: "", notes: "" });
        showToast("تم قيد الحركة بنجاح! 💵");
      };

      const handleAddPayment = (e) => {
        e.preventDefault();
        const item = { id: Date.now(), ...newPayment, clientName: (newPayment.clientName||'').trim(), amount: parseNum(newPayment.amount) };
        const tx = { id: Date.now()+1, date: item.date, type: 'income', category: 'سداد دفعة مستخلص', clientOrEntity: item.clientName, amount: item.amount };
        const upPay = [item, ...payments];
        const upTx = [tx, ...transactions];
        setPayments(upPay); setTransactions(upTx);
        saveListSafely('payments', 'payments', upPay);
        saveListSafely('transactions', 'transactions', upTx);
        setPayModalOpen(false);
        setNewPayment({ date: todayDate, clientName: "", siteLocation: "", amount: "", notes: "سداد دفعة من المستخلص" });
        showToast("تم قيد الدفعة بنجاح! 💰");
      };

      const deleteItem = (path, id, list, setter, title) => {
        if (!isAdmin) { showToast("مرفوض. للإدارة فقط 🔒"); return; }
        if (window.confirm("تأكيد الحذف النهائي؟")) {
          const updated = list.filter(item => item.id !== id);
          setter(updated);
          saveListSafely(path, path, updated);
          logActivity(`حذف ${title || 'عنصر'} من النظام`);
          showToast("تم الحذف بنجاح!");
        }
      };

      const loadClientOpsIntoExtract = (targetClient, targetSite) => {
        const cName = (targetClient || '').trim();
        const sName = (targetSite || '').trim();
        if (!cName) return setExtractItems([]);

        const filtered = operations.filter(o => {
          const matchClient = (o?.clientName || '').trim() === cName;
          const matchSite = !sName || (o?.siteLocation || '').trim() === sName;
          return matchClient && matchSite;
        });

        const loaded = filtered.map((o, idx) => {
          let itemQty = 1;
          let itemPrice = parseNum(o?.agreedAmount);
          let itemDesc = o?.workDescription ? o.workDescription : (o?.opType || 'عمل مساحي');

          if (o?.isFaddan) {
            itemQty = parseNum(o.faddanQty) || 1;
            itemPrice = parseNum(o.faddanPrice) || (parseNum(o.agreedAmount) / itemQty);
            itemDesc = `${itemDesc} (${itemQty} فدان)`;
          } else if (o?.isSketch) {
            itemQty = parseNum(o.sketchesCount) || 1;
            itemPrice = parseNum(o.agreedAmount) / itemQty;
            itemDesc = `${itemDesc} (${itemQty} كروكي)`;
          }

          return {
            id: o?.id || (Date.now() + idx),
            date: o?.date || todayDate,
            desc: itemDesc,
            qty: itemQty,
            unitPrice: itemPrice,
            rate: 100
          };
        });

        setExtractItems(loaded);
        if (loaded.length > 0) showToast(`تم تحميل ${loaded.length} أعمال بنجاح!`);
        else showToast("لا توجد أعمال مطابقة.");
      };

      useEffect(() => {
        if (extractClient) loadClientOpsIntoExtract(extractClient, extractSite);
        else setExtractItems([]);
      }, [extractClient, extractSite, operations]);

      const handleAddEmptyExtractRow = () => {
        setExtractItems([
          ...extractItems,
          { id: Date.now(), date: todayDate, desc: "بند أعمال مساحية", qty: 1, unitPrice: 1000, rate: 100 }
        ]);
      };

      const handleRemoveExtractRow = (id) => {
        setExtractItems(extractItems.filter(item => item.id !== id));
      };

      const extractTotalWork = extractItems.reduce((sum, item) => sum + (parseNum(item.qty) * parseNum(item.unitPrice) * (parseNum(item.rate) / 100)), 0);
      const clientOpsForPayment = operations.filter(o => (o?.clientName||'').trim() === (extractClient||'').trim() && (!extractSite || (o?.siteLocation||'').trim() === extractSite.trim()));
      const clientPaysForPayment = payments.filter(p => (p?.clientName||'').trim() === (extractClient||'').trim() && (!extractSite || (p?.siteLocation||'').trim() === extractSite.trim()));
      const clientTotalPaid = clientOpsForPayment.reduce((s,o)=>s+parseNum(o?.paidNow),0) + clientPaysForPayment.reduce((s,p)=>s+parseNum(p?.amount),0);
      const extractRemainingBalance = extractTotalWork - clientTotalPaid;

      const clientNames = Array.from(new Set([
        ...operations.map(o => (o?.clientName || '').trim()),
        ...payments.map(p => (p?.clientName || '').trim())

      const siteLocationsList = Array.from(new Set(operations.map(o => (o?.siteLocation || '').trim()).filter(Boolean)));

      const monthlyTx = transactions.filter(t => t?.date && t.date.startsWith(vaultMonth));
      const mIn = monthlyTx.filter(t=>t?.type==='income').reduce((s,t)=>s+parseNum(t?.amount),0);
      const mOut = monthlyTx.filter(t=>t?.type==='expense').reduce((s,t)=>s+parseNum(t?.amount),0);
      const mNet = mIn - mOut;

      const cumulativeTx = transactions.filter(t => t?.date && t.date.substring(0, 7) <= vaultMonth);
      const cumIn = cumulativeTx.filter(t=>t?.type==='income').reduce((s,t)=>s+parseNum(t?.amount),0);
      const cumOut = cumulativeTx.filter(t=>t?.type==='expense').reduce((s,t)=>s+parseNum(t?.amount),0);
      const cumNet = cumIn - cumOut;

      const totalRtk = operations.reduce((s,o)=>s+(parseNum(o?.deviceFee)||0),0);
      const totalOffice = operations.reduce((s,o)=>s+(parseNum(o?.officeFee)||0),0);

      const navTabs = useMemo(() => [

        const car = parseNum(newOp?.carCost);
        const totalExp = labor + car;
        const agreed = parseNum(newOp?.agreedAmount);
        const netAfterExp = agreed > 0 ? Math.max(0, agreed - totalExp) : 0;
        return { labor, car, totalExp, netAfterExp };

              <div class="p-3 overflow-y-auto space-y-1 text-xs font-bold custom-scroll">
                {navTabs.map(t => (
                  <button key={t.id} onClick={() => setActiveTab(t.id)} class={`w-full text-right flex items-center gap-2.5 p-3 rounded-xl transition ${activeTab===t.id ? 'bg-indigo-600 text-white shadow' : 'hover:bg-slate-800'}`}>

                    <div class="bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-2xl border dark:border-slate-700 shadow-xs"><span class="text-slate-500 font-bold block text-[10px]">إجمالي التحصيلات</span><strong class="text-emerald-600 text-sm sm:text-base font-black">{payments.reduce((s,p)=>s+parseNum(p?.amount),0).toLocaleString()} ج.م</strong></div>
                    <div class="bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-2xl border dark:border-slate-700 shadow-xs"><span class="text-slate-500 font-bold block text-[10px]">مصاريف التشغيل</span><strong class="text-rose-600 text-sm sm:text-base font-black">{operations.reduce((s,o)=>s+parseNum(o?.laborCost)+parseNum(o?.carCost),0).toLocaleString()} ج.م</strong></div>
                    <div class="bg-indigo-50/80 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-800 p-3 sm:p-4 rounded-2xl shadow-xs"><span class="text-indigo-900 dark:text-indigo-200 font-bold block text-[10px]">سيولة الخزينة</span><strong class="text-indigo-700 dark:text-indigo-300 text-base sm:text-lg font-black">{cumNet.toLocaleString()} ج.م</strong></div>

              {activeTab === 'clients_list' && (
                <div class="space-y-4 font-bold">

                        const pays = payments.filter(p => (p?.clientName||'').trim() === c);
                        const totalBilled = ops.reduce((s,o)=>s+parseNum(o?.agreedAmount),0);
                        const totalPaid = pays.reduce((s,p)=>s+parseNum(p?.amount),0) + ops.reduce((s,o)=>s+parseNum(o?.paidNow),0);
                        const due = totalBilled - totalPaid;
                        return (
                          <div key={c} class="p-4 rounded-2xl border dark:border-slate-700 bg-slate-50 dark:bg-slate-800/60 space-y-2">

                              <h4 class="font-black text-sm text-slate-900 dark:text-white">{c}</h4>

              {activeTab === 'operations' && (
                <div class="space-y-4">
                  <div class="flex flex-col sm:flex-row gap-2 justify-between items-stretch sm:items-center bg-white dark:bg-slate-800 p-3 rounded-2xl border dark:border-slate-700 shadow-xs">

                      />
                    </div>

                      onClick={()=>{

                    </button>
                  </div>

                  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                    {operations
                      .filter(o => (!opsFilterMonth || (o?.date||'').startsWith(opsFilterMonth)))
                      .map(o => (
                        <div key={o.id} class="bg-white dark:bg-slate-800 p-4 rounded-2xl border dark:border-slate-700 shadow-xs space-y-2 relative">

                        class={`p-2 rounded-xl border font-bold text-center transition ${newOp.engCalcMethod === 'customFixed' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200'}`}
                      >
                        💵 مبلغ مقطوع ثابت
                      </button>
                    </div>

                    {newOp.engCalcMethod === 'customFixed' && (
                      <div class="pt-1">
                        <label class="block text-[10px] text-slate-600 dark:text-slate-300 mb-1">أدخل مبلغ أتعاب المهندس المقطوع (ج.م):</label>
                        <input 
                          type="number" 
                          step="any" 
                          value={newOp.engCustomFixedAmount} 
                          onChange={e=>setNewOp({...newOp, engCustomFixedAmount: e.target.value})} 
                          class="w-full border p-2 rounded-xl dark:bg-slate-800 bg-white font-bold text-emerald-600"
                        />
                      </div>
                    )}
                  </div>

                  <div class="grid grid-cols-2 gap-2 pt-1">
                    <div>مصاريف عمالة <input type="number" value={newOp.laborCost} onChange={e=>setNewOp({...newOp, laborCost: e.target.value})} class="w-full border p-2 rounded-xl dark:bg-slate-700"/></div>
                    <div>مصاريف سيارة <input type="number" value={newOp.carCost} onChange={e=>setNewOp({...newOp, carCost: e.target.value})} class="w-full border p-2 rounded-xl dark:bg-slate-700"/></div>
                  </div>

                  <div>المحصل فوراً في الموقع (إن وجد) <input type="number" value={newOp.paidNow} onChange={e=>setNewOp({...newOp, paidNow: e.target.value})} class="w-full border p-2 rounded-xl dark:bg-slate-700"/></div>

                  <div class="p-2.5 bg-emerald-50 dark:bg-slate-700 border border-emerald-200 dark:border-slate-600 rounded-xl text-[11px] text-emerald-900 dark:text-emerald-300 font-bold space-y-0.5">
                    <div class="flex justify-between">
                      <span>👷 أتعاب المهندس: <strong>{(livePreview.engFee || 0).toLocaleString()} ج.م</strong></span>
                      <span>🛰 حصة الجهاز: <strong>{(livePreview.deviceFee || 0).toLocaleString()} ج.م</strong></span>
                    </div>
                    <div class="flex justify-between text-rose-600 dark:text-rose-400 pt-1 border-t dark:border-slate-600">
                      <span>🚗 مصاريف الطلعة (عمالة + سيارة): <strong>{(liveExpenses.totalExp || 0).toLocaleString()} ج.م</strong></span>
                      <span>🏢 صافي المكتب: <strong>{(livePreview.officeFee || 0).toLocaleString()} ج.م</strong></span>
                    </div>
                  </div>

                  <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-2xl font-black mt-2 shadow-sm">
                    {editingOp ? 'حفظ التعديلات' : 'حفظ الطلعة اليومية'}
                  </button>
                </form>
              </div>
            </div>
          )}

          {payModalOpen && (
            <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 print-hidden">
              <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs" onClick={()=>setPayModalOpen(false)}></div>
              <div class="relative bg-white dark:bg-slate-800 w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl z-50">
                <div class="flex justify-between items-center border-b dark:border-slate-700 pb-3 mb-3">
                  <h3 class="font-black text-sm">💰 تسجيل دفعة مسددة من العميل</h3>
                  <button onClick={()=>setPayModalOpen(false)} class="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
                </div>
                <form onSubmit={handleAddPayment} class="space-y-3 text-xs font-bold">
                  <div>التاريخ <input type="date" value={newPayment.date} onChange={e=>setNewPayment({...newPayment, date: e.target.value})} class="w-full border p-2.5 rounded-xl dark:bg-slate-700 mt-1" required/></div>
                  <div>العميل 
                    <select value={newPayment.clientName} onChange={e=>setNewPayment({...newPayment, clientName: e.target.value})} class="w-full border p-2.5 rounded-xl dark:bg-slate-700 mt-1" required>
                      <option value="">-- اختر العميل --</option>
                      {clientNames.map(c=><option key={c}>{c}</option>)}
                    </select>
                  </div>
                  <div>المبلغ المسدد <input type="number" value={newPayment.amount} onChange={e=>setNewPayment({...newPayment, amount: e.target.value})} class="w-full border p-2.5 rounded-xl dark:bg-slate-700 mt-1 text-emerald-600 font-black text-sm" required/></div>
                  <div>البيان / الملاحظات <input type="text" value={newPayment.notes} onChange={e=>setNewPayment({...newPayment, notes: e.target.value})} class="w-full border p-2.5 rounded-xl dark:bg-slate-700 mt-1"/></div>
                  <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-2xl font-black mt-2 shadow-sm">
                    قيد الدفعة في الحساب
                  </button>
                </form>
              </div>
            </div>
          )}

          <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-800 border-t dark:border-slate-700 px-2 py-1.5 flex justify-around items-center z-40 shadow-lg print-hidden">
            <button onClick={()=>setActiveTab('dashboard')} class={`flex flex-col items-center py-1 px-2 rounded-xl transition ${activeTab==='dashboard'?'text-indigo-600 dark:text-indigo-400 font-black':'text-slate-500'}`}>
              <span class="text-base">📊</span>
              <span class="text-[9px] mt-0.5">الرئيسية</span>
            </button>
            <button onClick={()=>setActiveTab('extracts')} class={`flex flex-col items-center py-1 px-2 rounded-xl transition ${activeTab==='extracts'?'text-indigo-600 dark:text-indigo-400 font-black':'text-slate-500'}`}>
              <span class="text-base">📄</span>
              <span class="text-[9px] mt-0.5">المستخلص</span>
            </button>
            <button onClick={()=>setActiveTab('operations')} class={`flex flex-col items-center py-1 px-2 rounded-xl transition ${activeTab==='operations'?'text-indigo-600 dark:text-indigo-400 font-black':'text-slate-500'}`}>
              <span class="text-base">📐</span>
              <span class="text-[9px] mt-0.5">الطلعات</span>
            </button>
            <button onClick={()=>setActiveTab('vault')} class={`flex flex-col items-center py-1 px-2 rounded-xl transition ${activeTab==='vault'?'text-indigo-600 dark:text-indigo-400 font-black':'text-slate-500'}`}>
              <span class="text-base">💵</span>
              <span class="text-[9px] mt-0.5">الخزينة</span>
            </button>
            <button onClick={()=>setDrawerOpen(true)} class="flex flex-col items-center py-1 px-2 text-slate-500">
              <span class="text-base">☰</span>
              <span class="text-[9px] mt-0.5">المزيد</span>
            </button>
          </nav>

          {toast.show && <div class="fixed bottom-16 md:bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-2.5 rounded-2xl text-xs z-50 shadow-2xl font-bold print-hidden">{toast.message}</div>}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
