      if (typeof val === "number") return isNaN(val) ? 0 : val;
      if (!val || typeof val === "object") return 0;

    function sanitizeList(raw, fallback) {
      if (!raw) return fallback;
      let clean = [];
      try {
        const arr = Array.isArray(raw) ? raw : Object.values(raw);
        for (let i = 0; i < arr.length; i++) {
          const item = arr[i];
          if (item && typeof item !== 'object') {
            const str = String(item).trim();
            if (str !== '' && str !== '[object Object]') clean.push(str);
          }
        }
        return clean.length > 0 ? Array.from(new Set(clean)) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    const constructionStorage = {
      get(key, fallback = []) { 
        try { const item = localStorage.getItem(`construction_${key}`); return item ? JSON.parse(item) : fallback; } 
        catch { return fallback; } 
      },
      set(key, data) { 
        try { localStorage.setItem(`construction_${key}`, JSON.stringify(data)); } 
        catch (e) {} 
      },
      addToQueue(path, data) { 
        const queue = this.get('offline_sync_queue', []); queue.push({ id: Date.now(), path, data }); this.set('offline_sync_queue', queue); 
      },
      syncQueue(databaseInstance) {
        if (!navigator.onLine || !databaseInstance) return;
        const queue = this.get('offline_sync_queue', []);
        if (queue.length === 0) return;
        queue.forEach(item => databaseInstance.ref(item.path).set(item.data));
        localStorage.removeItem('construction_offline_sync_queue');
      }
    };

    const generatePdfAndOpenWhatsApp = (elementId, filename, textMessage, targetPhone = ADMIN_WHATSAPP_NUMBER) => {
      const element = document.getElementById(elementId);
      if (!element) return;
      const prevWidth = element.style.width; const prevMaxWidth = element.style.maxWidth; const prevPadding = element.style.padding;

      element.classList.add('pdf-render-mode');

      html2pdf().set(opt).from(element).save().then(() => {
        element.style.width = prevWidth; element.style.maxWidth = prevMaxWidth; element.style.padding = prevPadding; element.classList.remove('pdf-render-mode');

                      <div><label className="block font-bold mb-1">البيان</label><input type="text" value={editItemData.data.description || ''} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, description: e.target.value}})} className="w-full border dark:border-slate-700 p-2.5 rounded-xl dark:bg-slate-800"/></div>
                      <div className="grid grid-cols-2 gap-2">
                        <div><label className="block font-bold mb-1">الكمية</label><input type="number" step="any" value={editItemData.data.quantity} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, quantity: e.target.value}})} className="w-full border dark:border-slate-700 p-2.5 rounded-xl dark:bg-slate-800 font-bold" required/></div>
                        <div><label className="block font-bold mb-1">السعر</label><input type="number" step="any" value={editItemData.data.unitPrice} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, unitPrice: e.target.value}})} className="w-full border dark:border-slate-700 p-2.5 rounded-xl dark:bg-slate-800 font-bold" required/></div>
                      </div>
                    </>
                  )}
                  {editItemData.type === 'advance' && (
                    <div><label className="block font-bold mb-1">المبلغ</label><input type="number" step="any" value={editItemData.data.amount} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, amount: e.target.value}})} className="w-full border dark:border-slate-700 p-2.5 rounded-xl dark:bg-slate-800 font-bold text-emerald-600" required/></div>
                  )}
                  {editItemData.type === 'payment' && (
                    <div><label className="block font-bold mb-1">المبلغ</label><input type="number" step="any" value={editItemData.data.amount} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, amount: e.target.value}})} className="w-full border dark:border-slate-700 p-2.5 rounded-xl dark:bg-slate-800 font-bold text-emerald-600" required/></div>
                  )}
                  {editItemData.type === 'supp_payment' && (
                    <div><label className="block font-bold mb-1">المبلغ المسدد</label><input type="number" step="any" value={editItemData.data.amount} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, amount: e.target.value}})} className="w-full border dark:border-slate-700 p-2.5 rounded-xl dark:bg-slate-800 font-bold text-emerald-600" required/></div>
                  )}
                  <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-3 rounded-2xl shadow-xs transition mt-3">تأكيد وحفظ</button>
                </form>
              </div>
            </div>
          )}

          <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200/80 dark:border-slate-800 shadow-lg z-40 px-2 py-1 flex justify-around items-center">
            <button onClick={()=>setActiveTab('dashboard')} className={`flex flex-col items-center py-1 px-2 rounded-xl transition ${activeTab==='dashboard'?'text-amber-500 font-black':'text-slate-500'}`}><span className="text-base">📊</span><span className="text-[9px] mt-0.5">الرئيسية</span></button>
            <button onClick={()=>setActiveTab('projects')} className={`flex flex-col items-center py-1 px-2 rounded-xl transition ${activeTab==='projects'?'text-amber-500 font-black':'text-slate-500'}`}><span className="text-base">📁</span><span className="text-[9px] mt-0.5">المشاريع</span></button>
            <button onClick={()=>setActiveTab('add_data')} className={`flex flex-col items-center py-1 px-2 rounded-xl transition ${activeTab==='add_data'?'text-amber-500 font-black':'text-slate-500'}`}><span className="text-base">➕</span><span className="text-[9px] mt-0.5">فاتورة</span></button>
            <button onClick={()=>setActiveTab('expenses')} className={`flex flex-col items-center py-1 px-2 rounded-xl transition ${activeTab==='expenses'?'text-amber-500 font-black':'text-slate-500'}`}><span className="text-base">💸</span><span className="text-[9px] mt-0.5">المصاريف</span></button>
            <button onClick={()=>setDrawerOpen(true)} className="flex flex-col items-center py-1 px-2 text-slate-500"><span className="text-base">☰</span><span className="text-[9px] mt-0.5">المزيد</span></button>
          </nav>

          {toast.show && <div className="fixed bottom-16 md:bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 px-5 py-3 rounded-2xl text-xs z-50 shadow-2xl font-bold print-hidden toast-anim flex items-center gap-2"><span>{toast.type === 'error' ? '⚠️' : '✅'}</span><span>{toast.message}</span></div>}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
