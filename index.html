<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>إدارة المعاملات الإنشائية</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-database-compat.js"></script>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="icon-192.png">

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    @media print {
      body { background-color: white; }
      .print-hidden { display: none !important; }
      .print-area { box-shadow: none !important; border: none !important; margin: 0 !important; padding: 0 !important; width: 100% !important; }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .toast-anim { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="text-slate-800 antialiased select-none sm:select-auto">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyDHjQTNfAh3wQ8tSOXOIewJNXaDCHADrR8",
      authDomain: "mrmo-d8760.firebaseapp.com",
      databaseURL: "https://mrmo-d8760-default-rtdb.firebaseio.com",
      projectId: "mrmo-d8760",
      storageBucket: "mrmo-d8760.firebasestorage.app",
      messagingSenderId: "510855132508",
      appId: "1:510855132508:web:feee377429a2d88c277d99",
      measurementId: "G-N9DW5R28H0"
    };

    // حساب المدير العام صاحب الصلاحية المطلقة بما فيها سجل الدخول
    const DIRECTOR_EMAILS = [
      "mohamedmohy676676@gmail.com",
      "+201000000000"
    ];

    // حساب مهندس المشاريع (صلاحيات كاملة عدا سجل الدخول)
    const ENGINEER_EMAILS = [
      "mesahaforconsultant@gmail.com"
    ];

    let db = null;
    let auth = null;
    try {
      if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
      db = firebase.database();
      auth = firebase.auth();
      auth.languageCode = 'ar';
    } catch (e) { console.error("Firebase init error:", e); }

    const initialProjects = [
      {"id": "cons-01", "name": "مشروع رئيسي 01", "location": "الموقع العام", "budget": 500000, "startDate": "2026-01-01", "deliveryDate": "2026-12-31", "status": "جاري العمل", "createdBy": "النظام"}
    ];

    const initialSettings = {
      mainCategories: ["مباني", "صبة خرسانه", "كهرباء", "سباكة", "محارة", "نقاشة"],
      subCategories: ["طوب", "اسمنت", "رملة", "عمالة", "الاكل", "نجار", "حداد", "خلاطة"],
      costTypes: ["مصنعيات", "بضاعة/مواد", "أكل", "مواصلات", "إيجار معدات", "نثريات وإكراميات"],
      suppliers: ["مورد الأسمنت", "مورد الرمل", "مقاول النجارة", "مصنع الطوب"],
      employees: ["المهندس التنفيذي", "مشرف العمال"],
      logo: ""
    };

    const cleanId = (id) => (id ? String(id).trim().toLowerCase().replace(/[.#$\[\]\/]/g, "-") : "");

    function DashboardCharts({ allWork, allExp, allPay, projExpLabels, projExpData, projName }) {
      const chart1Ref = useRef(null);
      const chart2Ref = useRef(null);
      const chart1Instance = useRef(null);
      const chart2Instance = useRef(null);

      useEffect(() => {
        if (chart1Instance.current) chart1Instance.current.destroy();
        if (chart2Instance.current) chart2Instance.current.destroy();

        if (chart1Ref.current) {
          chart1Instance.current = new Chart(chart1Ref.current, {
            type: 'bar',
            data: {
              labels: ['قيمة الأعمال', 'المصروفات', 'التحصيلات'],
              datasets: [{ label: 'الموقف المالي', data: [allWork, allExp, allPay], backgroundColor: ['#4f46e5', '#e11d48', '#10b981'], borderRadius: 6 }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
          });
        }
        if (chart2Ref.current) {
          chart2Instance.current = new Chart(chart2Ref.current, {
            type: 'doughnut',
            data: {
              labels: projExpLabels.length ? projExpLabels : ['لا توجد مصروفات'],
              datasets: [{ data: projExpData.length ? projExpData : [1], backgroundColor: projExpData.length ? ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#64748b'] : ['#e2e8f0'] }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 8, padding: 6, font: { size: 9, family: 'Cairo' } } } } }
          });
        }
        return () => {
          if (chart1Instance.current) chart1Instance.current.destroy();
          if (chart2Instance.current) chart2Instance.current.destroy();
        };
      }, [allWork, allExp, allPay, projExpLabels.join(','), projExpData.join(',')]);

      return (
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
          <div class="bg-white p-4 rounded-2xl border border-slate-200/90 shadow-sm h-72 flex flex-col overflow-hidden">
            <h4 class="font-bold text-slate-700 mb-2 text-center text-xs">📈 الموقف المالي العام للشركة</h4>
            <div class="relative w-full flex-1 min-h-0"><canvas ref={chart1Ref}></canvas></div>
          </div>
          <div class="bg-white p-4 rounded-2xl border border-slate-200/90 shadow-sm h-72 flex flex-col overflow-hidden">
            <h4 class="font-bold text-slate-700 mb-2 text-center text-xs truncate px-2">📊 توزيع تكلفة ({projName})</h4>
            <div class="relative w-full flex-1 min-h-0"><canvas ref={chart2Ref}></canvas></div>
          </div>
        </div>
      );
    }

    function App() {
      const [user, setUser] = useState(null);
      const [userRole, setUserRole] = useState("Staff");
      const [isAdmin, setIsAdmin] = useState(false);
      const [isDirector, setIsDirector] = useState(false);
      const [isProjectEng, setIsProjectEng] = useState(false);
      const [authLoading, setAuthLoading] = useState(true);
      
      const [loginMethod, setLoginMethod] = useState("choose");
      const [phoneNumber, setPhoneNumber] = useState("");
      const [otpCode, setOtpCode] = useState("");
      const [verificationId, setVerificationId] = useState(null);
      const [loginError, setLoginError] = useState("");

      const [loading, setLoading] = useState(false);
      const [projects, setProjects] = useState(initialProjects);
      const [expenses, setExpenses] = useState([]);
      const [extracts, setExtracts] = useState([]);
      const [payments, setPayments] = useState([]);
      const [advances, setAdvances] = useState([]);
      const [loginLogs, setLoginLogs] = useState([]);
      const [settings, setSettings] = useState(initialSettings);
      
      const [selectedProjId, setSelectedProjId] = useState("cons-01");
      const [activeTab, setActiveTab] = useState("add_data");
      const [myEmpName, setMyEmpName] = useState(localStorage.getItem('myEmpName') || "");
      
      const [toast, setToast] = useState({ show: false, message: "", type: "success" });
      const [activeInvoiceModal, setActiveInvoiceModal] = useState(null);
      const [drawerOpen, setDrawerOpen] = useState(false);

      const [searchMainCat, setSearchMainCat] = useState("");
      const [searchSubCat, setSearchSubCat] = useState("");
      const [searchCostType, setSearchCostType] = useState("");

      const todayDate = new Date().toISOString().split('T')[0];

      const nextSuggestedProjectId = useMemo(() => {
        const consNumbers = projects.map(p => { const m = String(p.id).match(/^cons-(\d+)$/i); return m ? parseInt(m[1], 10) : 0; }).filter(n => n > 0);
        const maxNum = consNumbers.length > 0 ? Math.max(...consNumbers) : 0;
        const next = maxNum + 1;
        return `cons-${next < 10 ? '0' + next : next}`;
      }, [projects]);

      const [newProj, setNewProj] = useState({ id: "cons-01", name: "", location: "", budget: "", startDate: todayDate, deliveryDate: "", status: "جاري العمل" });
      const [newExp, setNewExp] = useState({ date: todayDate, mainCategory: "", subCategory: "", costType: "", supplier: "", quantity: 1, unitPrice: "", description: "", paymentMethod: "خصم من العهدة", custodyEmployee: "", receiptImg: "" });
      const [newPay, setNewPay] = useState({ date: todayDate, amount: "", paymentMethod: "كاش", notes: "" });
      const [newExt, setNewExt] = useState({ date: todayDate, extractNo: "", workDescription: "", quantity: 1, unitPrice: "", deductions: "" });
      const [newAdv, setNewAdv] = useState({ date: todayDate, employeeName: "", amount: "", notes: "" });

      useEffect(() => { setNewProj(prev => ({ ...prev, id: nextSuggestedProjectId })); }, [nextSuggestedProjectId]);
      useEffect(() => { if (userRole === "Staff" && myEmpName && !newExp.custodyEmployee) { setNewExp(prev => ({ ...prev, custodyEmployee: myEmpName })); } }, [userRole, myEmpName]);

      const showToast = (message, type = "success") => { setToast({ show: true, message, type }); setTimeout(() => setToast(prev => ({ ...prev, show: false })), 3500); };

      const recordLoginLog = (currentUser, roleName) => {
        if (!db) return;
        const now = new Date();
        const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const logEntry = { uid: currentUser.uid, name: currentUser.displayName || currentUser.email || currentUser.phoneNumber || "مستخدم", identifier: currentUser.email || currentUser.phoneNumber || "غير محدد", role: roleName, device: isMobile ? "📱 هاتف محمول" : "💻 كمبيوتر", timestamp: now.toISOString(), formattedDate: now.toLocaleDateString('ar-EG') + ' ' + now.toLocaleTimeString('ar-EG') };
        db.ref('login_logs').push(logEntry);
      };

      useEffect(() => {
        if (!auth) { setAuthLoading(false); return; }
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          if (currentUser) {
            const identifier = (currentUser.email || currentUser.phoneNumber || "").toLowerCase();
            
            // التفريق الدقيق بين المدير العام ومهندس المشاريع
            const isManager = DIRECTOR_EMAILS.some(id => identifier.includes(id.toLowerCase()));
            const isEng = ENGINEER_EMAILS.some(id => identifier.includes(id.toLowerCase()));
            const hasFullAccess = isManager || isEng;
            
            let detectedRole = "موظف (Staff)";

            if (isManager) {
              detectedRole = "مدير النظام (Admin)";
              setActiveTab("dashboard");
            } else if (isEng) {
              detectedRole = "مهندس المشاريع";
              setActiveTab("dashboard");
            } else {
              setActiveTab("add_data");
            }

            setUser({ uid: currentUser.uid, name: currentUser.displayName || currentUser.email || currentUser.phoneNumber || "مستخدم موثق", identifier: identifier });
            setIsAdmin(hasFullAccess);
            setIsDirector(isManager);
            setIsProjectEng(isEng);
            setUserRole(detectedRole);

            if (!sessionStorage.getItem('login_recorded')) { recordLoginLog(currentUser, detectedRole); sessionStorage.setItem('login_recorded', 'true'); }
          } else {
            setUser(null); setIsAdmin(false); setIsDirector(false); setIsProjectEng(false); setUserRole("Staff"); sessionStorage.removeItem('login_recorded');
          }
          setAuthLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        setLoading(true);
        if (!db) { setLoading(false); return; }

        const rootRef = db.ref('/');
        const handleValue = (snapshot) => {
          try {
            const data = snapshot.val() || {};
            const toArr = (v) => (v ? (Array.isArray(v) ? v : Object.values(v)) : []);

            const loadedProjects = toArr(data.projects);
            const finalProjects = loadedProjects.length > 0 ? loadedProjects : initialProjects;
            setProjects(finalProjects);

            setExpenses([...toArr(data.expenses)].reverse());
            setExtracts([...toArr(data.extracts)].reverse());
            setPayments([...toArr(data.payments)].reverse());
            setAdvances([...toArr(data.advances)].reverse());
            setLoginLogs([...toArr(data.login_logs)].reverse());

            const savedSettings = data.settings || {};
            setSettings({
              mainCategories: toArr(savedSettings.mainCategories).length ? toArr(savedSettings.mainCategories) : initialSettings.mainCategories,
              subCategories: toArr(savedSettings.subCategories).length ? toArr(savedSettings.subCategories) : initialSettings.subCategories,
              costTypes: toArr(savedSettings.costTypes).length ? toArr(savedSettings.costTypes) : initialSettings.costTypes,
              suppliers: toArr(savedSettings.suppliers).length ? toArr(savedSettings.suppliers) : initialSettings.suppliers,
              employees: toArr(savedSettings.employees).length ? toArr(savedSettings.employees) : initialSettings.employees,
              logo: savedSettings.logo || ""
            });

            setSelectedProjId(prev => {
              if (prev && finalProjects.some(p => cleanId(p.id) === cleanId(prev))) return prev;
              return finalProjects[0]?.id || "cons-01";
            });
          } catch (err) { console.error(err); } finally { setLoading(false); }
        };

        rootRef.on('value', handleValue, (error) => { console.error(error); setLoading(false); });
        return () => { rootRef.off('value', handleValue); };
      }, [user]);

      const handleAddNewSettingItem = (settingKey, currentArray, title) => {
        const newVal = window.prompt(`أدخل [${title}] جديد لإضافته فوراً للقائمة:` , "");
        if (newVal && newVal.trim() !== "") {
          const cleanVal = newVal.trim();
          if (currentArray.includes(cleanVal)) { showToast(`هذا البند موجود مسبقاً!`, "error"); return; }
          const updatedArray = [...currentArray, cleanVal];
          setSettings(prev => ({ ...prev, [settingKey]: updatedArray }));
          if (db) db.ref(`settings/${settingKey}`).set(updatedArray);
          
          if (settingKey === 'mainCategories') setNewExp(prev => ({...prev, mainCategory: cleanVal}));
          if (settingKey === 'subCategories') setNewExp(prev => ({...prev, subCategory: cleanVal}));
          if (settingKey === 'costTypes') setNewExp(prev => ({...prev, costType: cleanVal}));
          if (settingKey === 'suppliers') setNewExp(prev => ({...prev, supplier: cleanVal}));
          if (settingKey === 'employees') { setNewExp(prev => ({...prev, custodyEmployee: cleanVal})); setNewAdv(prev => ({...prev, employeeName: cleanVal})); }

          showToast(`تم إضافة "${cleanVal}" للقائمة بنجاح!`);
        }
      };

      const handleGoogleLogin = () => { setLoginError(""); const provider = new firebase.auth.GoogleAuthProvider(); auth.signInWithPopup(provider).catch((error) => { setLoginError("تعذر الدخول بجوجل: " + error.message); }); };
      const setupRecaptcha = () => { if (!window.recaptchaVerifier) { window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { 'size': 'invisible' }); } };
      const handleSendOtp = (e) => {
        e.preventDefault(); setLoginError(""); setupRecaptcha(); const appVerifier = window.recaptchaVerifier;
        let formattedPhone = phoneNumber; if (formattedPhone.startsWith("01")) { formattedPhone = "+20" + formattedPhone.substring(1); }
        auth.signInWithPhoneNumber(formattedPhone, appVerifier).then((confirmationResult) => { window.confirmationResult = confirmationResult; setVerificationId(true); showToast("تم إرسال كود التحقق 📩"); }).catch(() => { setLoginError("تعذر إرسال الرمز. يرجى مراجعة رقم الهاتف."); if(window.recaptchaVerifier) window.recaptchaVerifier.render().then(widgetId => grecaptcha.reset(widgetId)); });
      };
      const handleVerifyOtp = (e) => { e.preventDefault(); setLoginError(""); window.confirmationResult.confirm(otpCode).catch(() => { setLoginError("الرمز غير صحيح."); }); };
      const handleLogout = () => { auth.signOut(); setLoginMethod("choose"); setVerificationId(null); setDrawerOpen(false); };

      const handleReceiptUpload = (e) => {
        const file = e.target.files && e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => { setNewExp(prev => ({ ...prev, receiptImg: evt.target.result })); showToast("تم إرفاق صورة الفاتورة 📸"); };
        reader.readAsDataURL(file);
      };

      const deleteItem = (path, id, list) => {
        if (!isAdmin) { showToast("خاصية الحذف مصرحة للإدارة فقط 🔒", "error"); return; }
        if (window.confirm("هل أنت متأكد من الحذف نهائياً؟")) {
          const newList = list.filter(item => item.id !== id);
          if (db) db.ref(path).set(newList);
          if (path === 'expenses') setExpenses(newList); if (path === 'extracts') setExtracts(newList); if (path === 'payments') setPayments(newList); if (path === 'projects') setProjects(newList); if (path === 'advances') setAdvances(newList);
          showToast("تم الحذف بنجاح! 🗑");
        }
      };

      const exportToExcel = () => {
        const wb = XLSX.utils.book_new();
        const wsProjects = XLSX.utils.json_to_sheet(projects); XLSX.utils.book_append_sheet(wb, wsProjects, "المشاريع");
        const wsExpenses = XLSX.utils.json_to_sheet(expenses.map(e => ({ 'التاريخ': e.date, 'المشروع': e.projectId, 'البند': `${e.mainCategory} - ${e.subCategory}`, 'نوع التكلفة': e.costType, 'المورد': e.supplier, 'الكمية': e.quantity, 'سعر الوحدة': e.unitPrice, 'الإجمالي': e.amount, 'الوصف / ملاحظات': e.description || '-', 'طريقة الدفع': e.paymentMethod, 'عهدة الموظف': e.custodyEmployee || '-', 'بواسطة': e.createdBy }))); XLSX.utils.book_append_sheet(wb, wsExpenses, "المصروفات");
        const wsAdvances = XLSX.utils.json_to_sheet(advances.map(a => ({ 'التاريخ': a.date, 'المشروع': a.projectId, 'الموظف': a.employeeName, 'قيمة السلفة': a.amount, 'ملاحظات': a.notes, 'بواسطة': a.createdBy }))); XLSX.utils.book_append_sheet(wb, wsAdvances, "سجل العهد والسلف");
        const wsExtracts = XLSX.utils.json_to_sheet(extracts); XLSX.utils.book_append_sheet(wb, wsExtracts, "المستخلصات");
        const wsPayments = XLSX.utils.json_to_sheet(payments); XLSX.utils.book_append_sheet(wb, wsPayments, "الدفعات");
        XLSX.writeFile(wb, `MOMOHY_ERP_Report_${todayDate}.xlsx`); showToast("تم تحميل الإكسل بنجاح! 📥");
      };

      if (authLoading) return <div class="min-h-screen flex items-center justify-center bg-slate-900 text-white font-bold text-sm">جاري التحقق... 🔒</div>;

      if (!user) {
        return (
          <div class="min-h-screen flex items-center justify-center bg-slate-900 px-4">
            <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-2xl w-full max-w-sm text-center">
              <div class="bg-indigo-100 text-indigo-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl shadow-inner">🏗️</div>
              <h2 class="text-2xl font-black text-slate-800 mb-1">بوابة الدخول السحابية</h2>
              <p class="text-slate-500 text-xs mb-6 font-semibold">إدارة المعاملات الإنشائية - MOMOHY ERP</p>
              {loginError && <div class="bg-rose-100 text-rose-700 p-2.5 rounded-xl text-xs font-bold mb-4">{loginError}</div>}
              {loginMethod === "choose" && (
                <div class="space-y-3">
                  <button onClick={handleGoogleLogin} class="w-full flex items-center justify-center gap-2.5 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-bold py-3 rounded-2xl transition shadow-sm text-xs"><svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> الدخول عبر Google </button>
                  <button onClick={() => setLoginMethod("phone")} class="w-full flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-2xl transition shadow text-xs">📱 الدخول عبر الهاتف</button>
                </div>
              )}
              {loginMethod === "phone" && !verificationId && (
                <form onSubmit={handleSendOtp} class="space-y-3">
                  <input type="tel" value={phoneNumber} onChange={e=>setPhoneNumber(e.target.value)} placeholder="01xxxxxxxxx" class="w-full border p-3 rounded-xl text-center font-bold text-xs outline-none" dir="ltr" required />
                  <div id="recaptcha-container"></div>
                  <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-2xl text-xs shadow-md">إرسال كود التحقق</button>
                  <button type="button" onClick={() => setLoginMethod("choose")} class="w-full text-slate-500 text-xs">الرجوع</button>
                </form>
              )}
              {loginMethod === "phone" && verificationId && (
                <form onSubmit={handleVerifyOtp} class="space-y-3">
                  <input type="text" value={otpCode} onChange={e=>setOtpCode(e.target.value)} placeholder="کود التحقق (OTP)" class="w-full border p-3 rounded-xl text-center font-black tracking-widest text-sm outline-none" dir="ltr" required />
                  <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-2xl text-xs shadow-md">تأكيد ودخول</button>
                </form>
              )}
            </div>
          </div>
        );
      }

      if (loading) return <div class="min-h-screen flex flex-col items-center justify-center bg-slate-900 text-white"><div class="text-3xl animate-bounce mb-2">☁️</div><h1 class="text-base font-bold">جاري تحميل البيانات...</h1></div>;

      const currentProj = projects.find(p => cleanId(p.id) === cleanId(selectedProjId)) || projects[0] || {};
      const projExpenses = expenses.filter(e => cleanId(e.projectId) === cleanId(currentProj.id));
      const projExtracts = extracts.filter(e => cleanId(e.projectId) === cleanId(currentProj.id));
      const projPayments = payments.filter(p => cleanId(p.projectId) === cleanId(currentProj.id));
      const projAdvances = advances.filter(a => cleanId(a.projectId) === cleanId(currentProj.id));

      const totalWorkNet = projExtracts.reduce((sum, item) => sum + (Number(item.net) || 0), 0);
      const totalCost = projExpenses.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      const totalReceived = projPayments.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      const netProfit = totalWorkNet - totalCost;
      const clientDebt = totalWorkNet - totalReceived;
      const cashRemaining = totalReceived - totalCost;

      const projBudget = Number(currentProj.budget) || 0;
      const budgetConsumedPercent = projBudget > 0 ? Math.min(Math.round((totalCost / projBudget) * 100), 100) : 0;

      const allWork = extracts.reduce((sum, item) => sum + (Number(item.totalWork) || 0), 0);
      const allExp = expenses.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      const allPay = payments.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);

      const projExpMap = {};
      projExpenses.forEach(e => { const cat = e.mainCategory || 'غير محدد'; projExpMap[cat] = (projExpMap[cat] || 0) + (Number(e.amount) || 0); });
      const projExpLabels = Object.keys(projExpMap);
      const projExpData = Object.values(projExpMap);

      const filteredSearchExpenses = projExpenses.filter(e => { return (searchMainCat === "" || e.mainCategory === searchMainCat) && (searchSubCat === "" || e.subCategory === searchSubCat) && (searchCostType === "" || e.costType === searchCostType); });
      const filteredSearchTotal = filteredSearchExpenses.reduce((s, e) => s + (Number(e.amount) || 0), 0);

      const getCustodyStats = (empName) => {
        const empAdv = projAdvances.filter(a => a.employeeName === empName).reduce((sum, a) => sum + Number(a.amount), 0);
        const empExp = projExpenses.filter(e => e.paymentMethod === 'خصم من العهدة' && e.custodyEmployee === empName).reduce((sum, e) => sum + Number(e.amount), 0);
        return { received: empAdv, spent: empExp, balance: empAdv - empExp };
      };

      const activeEmployeesCustody = settings.employees.map(emp => ({ name: emp, ...getCustodyStats(emp) })).filter(s => s.received > 0 || s.spent > 0);

      // تبويبات التنقل: حجب سجل الدخول عن مهندس المشاريع وإتاحته للمدير العام فقط
      const getNavTabs = () => {
        const tabs = [];
        if (isAdmin) {
          tabs.push({ id: "dashboard", label: "لوحة التحكم", icon: "📊" });
        } else {
          tabs.push({ id: "my_custody", label: "لوحة عهدتي", icon: "💼" });
        }

        tabs.push(
          { id: "add_data", label: "إدخال", icon: "➕" },
          { id: "projects", label: "المشاريع", icon: "📁" },
          { id: "payments", label: "الدفعات", icon: "💰" },
          { id: "extracts", label: "المستخلصات", icon: "📄" },
          { id: "expenses", label: "المصروفات", icon: "💸" }
        );

        if (isAdmin) {
          tabs.push({ id: "statement", label: "كشف حساب", icon: "📑" });
        }

        // سجل الدخول (Audit Log) للمدير العام فقط دون مهندس المشاريع
        if (isDirector) {
          tabs.push({ id: "audit_log", label: "الدخول", icon: "🛡️" });
        }

        tabs.push({ id: "settings", label: "الإعدادات", icon: "⚙️" });
        return tabs;
      };
      const navTabs = getNavTabs();

      return (
        <div class="min-h-screen pb-24 md:pb-10">
          <header class="bg-slate-900 text-white shadow-md sticky top-0 z-30 print-hidden border-b border-slate-800">
            <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
              <div class="flex items-center gap-2.5">
                <span class="text-2xl p-1 bg-blue-600/30 rounded-xl">🏗️️</span>
                <div>
                  <h1 class="text-sm sm:text-base font-black leading-tight">إدارة المعاملات الإنشائية</h1>
                  <div class="text-[11px] text-slate-300 flex items-center gap-1.5 mt-0.5">
                    <span class="truncate max-w-[130px] sm:max-w-none">{user.name}</span>
                    
                    {isDirector ? (
                      <span class="bg-amber-500/20 text-amber-300 border border-amber-500/30 px-1.5 py-0.2 rounded font-bold text-[10px]">👑 مدير النظام</span>
                    ) : isProjectEng ? (
                      <span class="bg-blue-500/20 text-blue-300 border border-blue-500/30 px-1.5 py-0.2 rounded font-bold text-[10px]">📐 مهندس المشاريع</span>
                    ) : (
                      <span class="bg-slate-700/50 text-slate-300 px-1.5 py-0.2 rounded text-[10px]">موظف</span>
                    )}
                  </div>
                </div>
              </div>
              <div class="flex items-center gap-2">
                <button onClick={exportToExcel} class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-1.5 rounded-xl font-bold flex items-center gap-1 shadow-sm transition">📤 <span class="hidden sm:inline">تصدير</span></button>
                <button onClick={() => setDrawerOpen(true)} class="bg-slate-800 hover:bg-slate-700 p-2 rounded-xl text-slate-200 border border-slate-700 text-sm">☰</button>
              </div>
            </div>

            <div class="hidden md:flex bg-slate-800/90 border-t border-slate-700 px-4 py-1.5 overflow-x-auto scrollbar-hide gap-1 text-xs">
              {navTabs.map(t => (
                <button key={t.id} onClick={() => setActiveTab(t.id)} class={`px-3 py-1.5 rounded-lg font-bold whitespace-nowrap transition ${activeTab === t.id ? "bg-blue-600 text-white shadow" : "text-slate-300 hover:bg-slate-700"}`}>{t.icon} {t.label}</button>
              ))}
            </div>
          </header>

          {drawerOpen && (
            <div class="fixed inset-0 z-50 flex">
              <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs transition-opacity" onClick={() => setDrawerOpen(false)}></div>
              <div class="relative w-72 max-w-[80%] bg-slate-900 text-white h-full shadow-2xl z-50 p-5 flex flex-col justify-between">
                <div>
                  <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-4"><span class="font-black text-sm">قائمة النظام الإداري</span><button onClick={() => setDrawerOpen(false)} class="text-slate-400 hover:text-white text-lg">✕</button></div>
                  <nav class="space-y-1.5 text-xs font-bold">
                    {navTabs.map(item => (
                      <button key={item.id} onClick={() => { setActiveTab(item.id); setDrawerOpen(false); }} class={`w-full text-right p-3 rounded-xl transition flex items-center justify-between ${activeTab === item.id ? "bg-blue-600 text-white font-black" : "text-slate-300 hover:bg-slate-800"}`}><span>{item.icon} {item.label}</span>{activeTab === item.id && <span>•</span>}</button>
                    ))}
                  </nav>
                </div>
                <div class="pt-4 border-t border-slate-800"><button onClick={handleLogout} class="w-full bg-rose-600/20 text-rose-400 border border-rose-500/30 hover:bg-rose-600 hover:text-white py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2">🚪 تسجيل الخروج</button></div>
              </div>
            </div>
          )}

          {["dashboard", "add_data", "projects", "payments", "extracts", "statement", "my_custody"].includes(activeTab) && (

              <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200/90 flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3 text-xs">
                <div class="flex flex-col sm:flex-row sm:items-center gap-2">
                  <span class="font-extrabold text-slate-700 whitespace-nowrap">المشروع النشط:</span>

                    <select value={selectedProjId} onChange={(e) => setSelectedProjId(e.target.value)} class="w-full bg-slate-100 border border-slate-300 font-extrabold text-blue-900 rounded-xl px-3 py-2 outline-none appearance-none focus:ring-2 focus:ring-blue-500">
                      {projects.map(p => <option key={p.id} value={p.id}>{p.id} - {p.name}</option>)}

                    <div class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs">▼</div>

                  <div>العميل: <strong class="text-slate-900 block sm:inline font-bold">{currentProj.name || '-'}</strong></div>
                  <div>الموقع: <strong class="text-slate-900 block sm:inline font-bold">{currentProj.location || '-'}</strong></div>
                </div>
              </div>
            </div>

            {activeTab === "dashboard" && isAdmin && (
              <div class="space-y-4">
                {projBudget > 0 && (
                  <div class="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm text-xs">
                    <div class="flex justify-between items-center mb-1.5 font-bold">
                      <span class="text-slate-700">ميزانية المشروع: {(projBudget).toLocaleString()} ج.م</span>
                      <span class={budgetConsumedPercent > 90 ? "text-rose-600" : "text-blue-700"}>{budgetConsumedPercent}% مستهلك</span>
                    </div>
                    <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                      <div class={`h-2.5 rounded-full transition-all duration-500 ${budgetConsumedPercent > 90 ? "bg-rose-500" : "bg-blue-600"}`} style={{ width: `${budgetConsumedPercent}%` }}></div>
                    </div>
                  </div>
                )}

                <DashboardCharts allWork={allWork} allExp={allExp} allPay={allPay} projExpLabels={projExpLabels} projExpData={projExpData} projName={currentProj.name || 'المشروع'} />

                <div class="grid grid-cols-2 lg:grid-cols-5 gap-3 text-xs">
                  <div class="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm"><span class="text-[10px] text-slate-500 font-bold block">المستخلصات (الصافي)</span><div class="text-base font-black text-slate-800 mt-1">{totalWorkNet.toLocaleString()} ج.م</div></div>
                  <div class="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm"><span class="text-[10px] text-slate-500 font-bold block">إجمالي التحصيلات</span><div class="text-base font-black text-emerald-600 mt-1">{totalReceived.toLocaleString()} ج.م</div></div>
                  <div class="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm"><span class="text-[10px] text-slate-500 font-bold block">إجمالي المصروفات</span><div class="text-base font-black text-rose-600 mt-1">{totalCost.toLocaleString()} ج.م</div></div>
                  
                  <div class="bg-indigo-50/70 p-3.5 rounded-2xl border-2 border-indigo-200 shadow-sm col-span-2 sm:col-span-1">
                    <span class="text-[10px] text-indigo-800 font-extrabold block">💵 السيولة النقدية المتبقية</span>
                    <div class={`text-lg font-black mt-1 ${cashRemaining >= 0 ? 'text-indigo-700' : 'text-rose-600'}`}>{cashRemaining.toLocaleString()} ج.م</div>
                    <span class="text-[9px] text-indigo-500 font-semibold block mt-0.5">(التحصيلات - المصاريف)</span>
                  </div>

                  <div class="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm"><span class="text-[10px] text-slate-500 font-bold block">صافي الربح الفعلي</span><div class={`text-base font-black mt-1 ${netProfit >= 0 ? 'text-emerald-700' : 'text-rose-700'}`}>{netProfit.toLocaleString()} ج.م</div></div>
                </div>

                {activeEmployeesCustody.length > 0 && (
                  <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm text-xs">
                    <h3 class="font-bold text-slate-800 mb-3 flex items-center gap-1.5 border-b pb-2">💼 حالة العهد والسلف للموظفين (المشروع النشط)</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                      {activeEmployeesCustody.map(emp => (
                        <div key={emp.name} class="border rounded-xl p-3 bg-slate-50 flex flex-col gap-2">
                          <span class="font-black text-blue-900 border-b border-slate-200 pb-1">{emp.name}</span>
                          <div class="flex justify-between font-bold text-[10px] text-slate-500"><span>استلم: <span class="text-emerald-600">{emp.received.toLocaleString()}</span></span><span>صرف: <span class="text-rose-600">{emp.spent.toLocaleString()}</span></span></div>
                          <div class="bg-white border rounded p-1.5 text-center font-bold text-slate-700 shadow-sm">الرصيد لديه: <span class="font-black text-indigo-700 text-sm">{emp.balance.toLocaleString()} ج.م</span></div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* 2. لوحة العهدة الخاصة بالموظف */}
            {activeTab === "my_custody" && !isAdmin && (
              <div class="bg-indigo-50 border border-indigo-200 p-5 rounded-3xl shadow-sm">
                <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-5">
                  <div>
                    <h2 class="text-lg font-black text-indigo-900 flex items-center gap-2">💼 لوحة تحكم عهدة الموظف</h2>
                    <p class="text-xs font-bold text-indigo-600 mt-1">تابع إجمالي السلف المستلمة والمنصرف والرصيد المتبقي معك.</p>
                  </div>
                  <div class="w-full sm:w-64">
                    <label class="block font-bold text-xs mb-1 text-indigo-800">تأكيد اسمك (صاحب العهدة):</label>
                    <select value={myEmpName} onChange={(e) => { setMyEmpName(e.target.value); localStorage.setItem('myEmpName', e.target.value); }} class="w-full bg-white border border-indigo-300 font-extrabold text-indigo-900 rounded-xl px-3 py-2 outline-none shadow-sm">
                      <option value="">اختر اسمك من هنا...</option>
                      {settings.employees.map(emp => <option key={emp} value={emp}>{emp}</option>)}
                    </select>
                  </div>
                </div>

                {myEmpName ? (() => {
                  const myStats = getCustodyStats(myEmpName);
                  return (
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                      <div class="bg-white p-4 rounded-2xl shadow-sm border border-emerald-100 flex flex-col justify-center items-center text-center"><span class="text-xs text-slate-500 font-bold mb-1">إجمالي السلف المستلمة 📥</span><span class="text-2xl font-black text-emerald-600">{myStats.received.toLocaleString()} ج.م</span></div>
                      <div class="bg-white p-4 rounded-2xl shadow-sm border border-rose-100 flex flex-col justify-center items-center text-center"><span class="text-xs text-slate-500 font-bold mb-1">المنصرف من العهدة 📤</span><span class="text-2xl font-black text-rose-600">{myStats.spent.toLocaleString()} ج.م</span></div>
                      <div class="bg-indigo-600 p-4 rounded-2xl shadow-md flex flex-col justify-center items-center text-center"><span class="text-xs text-indigo-100 font-bold mb-1">الرصيد المتبقي في جيبك 💰</span><span class="text-3xl font-black text-white">{myStats.balance.toLocaleString()} ج.م</span></div>
                    </div>
                  )
                })() : (
                  <div class="bg-white p-6 rounded-2xl text-center border border-dashed border-indigo-300 font-bold text-slate-500">يرجى اختيار اسمك من القائمة العلوية لعرض رصيد عهدتك التفاعلي.</div>
                )}
              </div>
            )}

            {/* 3. إدخال البيانات */}
            {activeTab === "add_data" && (
              <div class="grid grid-cols-1 lg:grid-cols-2 gap-3.5">
                {isAdmin && (
                  <div class="bg-emerald-50 p-4 sm:p-5 rounded-2xl border border-emerald-200 shadow-sm lg:col-span-2">
                    <h3 class="font-bold text-emerald-900 mb-3 border-b border-emerald-200 pb-2 text-xs sm:text-sm">💵 تسليم عهدة مالية / سلفة لموظف</h3>
                    <form onSubmit={(e) => {
                      e.preventDefault();
                      if(!newAdv.employeeName || !newAdv.amount) return;
                      const targetProj = cleanId(selectedProjId);
                      const newItem = { id: Date.now(), projectId: targetProj, ...newAdv, amount: Number(newAdv.amount), createdBy: user.name };
                      const updated = [newItem, ...advances];
                      setAdvances(updated);
                      if(db) db.ref('advances').set(updated);
                      setNewAdv({ date: todayDate, employeeName: "", amount: "", notes: "" });
                      showToast(`تم تسجيل العهدة للموظف بنجاح!`);
                    }} class="grid grid-cols-1 sm:grid-cols-4 gap-2.5 text-xs">
                      <div><label class="block font-bold mb-1">التاريخ</label><input type="date" value={newAdv.date} onChange={e=>setNewAdv({...newAdv, date: e.target.value})} class="w-full border border-emerald-300 rounded-xl p-2 font-bold" required/></div>
                      <div class="sm:col-span-1">
                        <label class="block font-bold mb-1">اسم الموظف المستلم</label>
                        <div class="flex gap-1">
                          <select value={newAdv.employeeName} onChange={e=>setNewAdv({...newAdv, employeeName: e.target.value})} class="w-full border border-emerald-300 rounded-xl p-2 font-bold" required><option value="">اختر...</option>{settings.employees.map(c => <option key={c}>{c}</option>)}</select>
                          <button type="button" onClick={()=>handleAddNewSettingItem('employees', settings.employees, 'موظف مستلم')} class="bg-emerald-200 text-emerald-800 px-3 rounded-xl font-black text-lg hover:bg-emerald-300 transition">+</button>
                        </div>
                      </div>
                      <div><label class="block font-bold mb-1">المبلغ (ج.م)</label><input type="number" step="any" value={newAdv.amount} onChange={e=>setNewAdv({...newAdv, amount: e.target.value})} class="w-full border border-emerald-300 rounded-xl p-2 bg-white font-black text-emerald-700" required/></div>
                      <div><label class="block font-bold mb-1">البيان (اختياري)</label><input type="text" value={newAdv.notes} onChange={e=>setNewAdv({...newAdv, notes: e.target.value})} placeholder="عهدة لشراء خامات..." class="w-full border border-emerald-300 rounded-xl p-2"/></div>
                      <div class="sm:col-span-4"><button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl shadow transition">حفظ العهدة في حساب الموظف</button></div>
                    </form>
                  </div>
                )}

                <div class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200/90 shadow-sm">
                  <h3 class="font-bold text-slate-800 mb-3 border-b pb-2 text-xs sm:text-sm">💸 تسجيل مصروف جديد وفاتورة</h3>
                  <form onSubmit={(e) => {
                    e.preventDefault();
                    if(!newExp.unitPrice || !newExp.quantity) return;
                    if(newExp.paymentMethod === 'خصم من العهدة' && !newExp.custodyEmployee) { showToast("يجب اختيار اسم الموظف صاحب العهدة!", "error"); return; }
                    const totalAmt = Number(newExp.quantity) * Number(newExp.unitPrice);
                    const targetProj = cleanId(selectedProjId);
                    const newItem = { id: Date.now(), projectId: targetProj, ...newExp, amount: totalAmt, createdBy: user.name };

                    setNewExp({...newExp, quantity: 1, unitPrice: "", description: "", date: todayDate, receiptImg: ""});

                  }} class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-xs">

                      <label class="block font-bold mb-1">البند الرئيسي</label>

                      </div>
                    </div>

                      <label class="block font-bold mb-1">البند الفرعي</label>

                    {settings.logo && <img src={settings.logo} class="h-10 object-contain"/>}
                  </div>
                  
                  <div class="grid grid-cols-2 md:grid-cols-5 gap-2 bg-slate-50 p-3 rounded-xl text-center border">
                    <div><span class="text-slate-500 block text-[10px]">إجمالي المستخلصات:</span><strong class="text-indigo-700 text-sm">{totalWorkNet.toLocaleString()} ج.م</strong></div>
                    <div><span class="text-slate-500 block text-[10px]">إجمالي التحصيلات:</span><strong class="text-emerald-600 text-sm">{totalReceived.toLocaleString()} ج.م</strong></div>
                    <div><span class="text-slate-500 block text-[10px]">إجمالي المصروفات:</span><strong class="text-rose-600 text-sm">{totalCost.toLocaleString()} ج.م</strong></div>
                    <div><span class="text-slate-500 block text-[10px]">السيولة المتبقية (الخزينة):</span><strong class="text-indigo-700 text-sm">{cashRemaining.toLocaleString()} ج.م</strong></div>
                    <div><span class="text-slate-500 block text-[10px]">صافي الربح الفعلي:</span><strong class={`text-sm ${netProfit >= 0 ? 'text-emerald-700' : 'text-rose-700'}`}>{netProfit.toLocaleString()} ج.م</strong></div>
                  </div>
                </div>

                <div class="space-y-4">
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                      <h4 class="font-bold text-slate-700 mb-1.5 border-b pb-1">1. المستخلصات المعتمدة (مستحقات العقد)</h4>
                      <table class="w-full text-right border">
                        <thead><tr class="bg-slate-100"><th class="p-1.5 border">التاريخ</th><th class="p-1.5 border">رقم المستخلص</th><th class="p-1.5 border">البيان</th><th class="p-1.5 border text-center">الصافي</th></tr></thead>
                        <tbody>
                          {projExtracts.length === 0 ? <tr><td colSpan="4" class="text-center p-2 text-slate-400">لا يوجد مستخلصات</td></tr> :
                          projExtracts.map(ex => <tr key={ex.id}><td class="p-1.5 border">{ex.date}</td><td class="p-1.5 border font-bold">{ex.extractNo}</td><td class="p-1.5 border">{ex.workDescription}</td><td class="p-1.5 border text-center font-bold text-indigo-700">{Number(ex.net).toLocaleString()}</td></tr>)}
                        </tbody>
                      </table>
                    </div>

                    <div>
                      <h4 class="font-bold text-slate-700 mb-1.5 border-b pb-1">2. الدفعات المستلمة من العميل</h4>
                      <table class="w-full text-right border">
                        <thead><tr class="bg-slate-100"><th class="p-1.5 border">التاريخ</th><th class="p-1.5 border">البيان</th><th class="p-1.5 border text-center">المبلغ</th></tr></thead>
                        <tbody>
                          {projPayments.length === 0 ? <tr><td colSpan="3" class="text-center p-2 text-slate-400">لا يوجد دفعات</td></tr> :
                          projPayments.map(p => <tr key={p.id}><td class="p-1.5 border">{p.date}</td><td class="p-1.5 border">{p.notes || 'دفعة'}</td><td class="p-1.5 border text-center font-bold text-emerald-600">{Number(p.amount).toLocaleString()}</td></tr>)}
                        </tbody>
                      </table>
                    </div>
                  </div>

                  <div>
                    <h4 class="font-bold text-slate-700 mb-1.5 border-b pb-1">3. بيان تفصيلي بجميع المصروفات والفواتير المنفذة في الموقع</h4>
                    <div class="overflow-x-auto">
                      <table class="w-full text-right border border-slate-300">
                        <thead>
                          <tr class="bg-slate-100 text-slate-800">
                            <th class="p-1.5 border">التاريخ</th>
                            <th class="p-1.5 border">البند</th>
                            <th class="p-1.5 border">الوصف / ملاحظات الفاتورة</th>
                            <th class="p-1.5 border text-center">الكمية</th>
                            <th class="p-1.5 border text-center">الفئة</th>
                            <th class="p-1.5 border text-center">الإجمالي</th>
                            <th class="p-1.5 border">المورد</th>
                            <th class="p-1.5 border">طريقة السداد</th>
                          </tr>
                        </thead>
                        <tbody>
                          {projExpenses.length === 0 ? <tr><td colSpan="8" class="text-center p-3 text-slate-400">لا توجد مصروفات مسجلة</td></tr> :
                          projExpenses.map(e => (
                            <tr key={e.id} class="hover:bg-slate-50">
                              <td class="p-1.5 border text-slate-600">{e.date}</td>
                              <td class="p-1.5 border font-semibold">{e.mainCategory} - {e.subCategory}</td>
                              <td class="p-1.5 border text-slate-700">{e.description || '-'}</td>
                              <td class="p-1.5 border text-center font-bold">{e.quantity || 1}</td>
                              <td class="p-1.5 border text-center">{(Number(e.unitPrice) || Number(e.amount)).toLocaleString()}</td>
                              <td class="p-1.5 border text-center font-black text-rose-600">{(Number(e.amount) || 0).toLocaleString()}</td>
                              <td class="p-1.5 border text-slate-600">{e.supplier || '-'}</td>
                              <td class="p-1.5 border">{e.paymentMethod} {e.custodyEmployee && `(${e.custodyEmployee})`}</td>
                            </tr>
                          ))}
                        </tbody>
                        <tfoot>
                          <tr class="bg-slate-200 font-bold">
                            <td colSpan="5" class="p-1.5 text-left border">إجمالي المصروفات المنفذة للمشروع:</td>
                            <td class="p-1.5 text-center border font-black text-rose-700">{totalCost.toLocaleString()} ج.م</td>
                            <td colSpan="2" class="border"></td>
                          </tr>
                        </tfoot>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* 9. سجل الدخول (متاح للمدير العام فقط دون مهندس المشاريع) */}
            {activeTab === "audit_log" && isDirector && (
              <div class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200/90 shadow-sm text-xs">
                <h3 class="font-bold text-slate-800 mb-2.5 border-b pb-2">🛡️ سجل دخول المستخدمين (خاص بالمدير العام)</h3>
                <div class="overflow-x-auto">
                  <table class="w-full text-right">
                    <thead><tr class="bg-slate-100 text-slate-700 border-b"><th class="p-2.5">المستخدم</th><th class="p-2.5">المعرف</th><th class="p-2.5">الرتبة</th><th class="p-2.5">الجهاز</th><th class="p-2.5">الوقت</th></tr></thead>
                    <tbody>{loginLogs.map((log, i) => (
                      <tr key={i} class="border-b hover:bg-slate-50">
                        <td class="p-2.5 font-bold">{log.name}</td>
                        <td class="p-2.5 font-mono text-slate-600">{log.identifier}</td>
                        <td class="p-2.5">
                          <span class={`px-2 py-0.5 rounded-lg font-bold ${log.role.includes("Admin") ? "bg-amber-100 text-amber-800" : log.role.includes("مهندس") ? "bg-blue-100 text-blue-800" : "bg-slate-100 text-slate-700"}`}>
                            {log.role}
                          </span>
                        </td>
                        <td class="p-2.5">{log.device}</td>
                        <td class="p-2.5 text-slate-500 font-mono">{log.formattedDate}</td>
                      </tr>
                    ))}</tbody>
                  </table>
                </div>
              </div>
            )}

            {/* 10. الإعدادات */}
            {activeTab === "settings" && (
              <div class="bg-white p-5 rounded-2xl border border-slate-200/90 shadow-sm text-xs max-w-xl">
                <h3 class="font-bold mb-3 text-sm">🖼️ شعار الشركة المعتمد للمستندات والتقارير</h3>
                <input type="file" accept="image/*" onChange={(e)=>{
                  const file = e.target.files && e.target.files[0];
                  if(!file) return;
                  const reader = new FileReader();
                  reader.onload = (evt) => {
                    const base64 = evt.target.result;
                    if(db) db.ref('settings/logo').set(base64);
                    setSettings(prev=>({...prev, logo: base64}));
                    showToast("تم تحديث وحفظ اللوجو بنجاح! 🖼️");
                  };
                  reader.readAsDataURL(file);
                }} class="text-xs file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"/>
                {settings.logo && <div class="mt-4"><img src={settings.logo} class="h-20 object-contain border p-2 rounded-2xl" /></div>}
              </div>
            )}
          </main>

          {/* شريط التنقل السفلي للهواتف الذكية */}
          <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200/80 shadow-lg z-40 px-2 py-1.5 flex justify-around items-center">
            {navTabs.slice(0, 4).map(tab => (
              <button key={tab.id} onClick={() => setActiveTab(tab.id)} class={`flex flex-col items-center justify-center py-1 px-2.5 rounded-xl transition duration-200 ${activeTab === tab.id ? "text-blue-600 font-black scale-105" : "text-slate-400 hover:text-slate-600"}`}><span class="text-base">{tab.icon}</span><span class="text-[10px] mt-0.5">{tab.label}</span></button>
            ))}
            <button onClick={() => setDrawerOpen(true)} class="flex flex-col items-center justify-center py-1 px-2.5 text-slate-400 hover:text-slate-600"><span class="text-base">☰</span><span class="text-[10px] mt-0.5">المزيد</span></button>
          </nav>

          {/* نافذة التنبيهات المنبثقة التفاعلية */}
          {toast.show && (
            <div class="fixed bottom-20 md:bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none toast-anim">
              <div class={`px-4 py-2.5 rounded-2xl shadow-xl border flex items-center gap-2.5 text-xs font-bold text-white ${toast.type === 'error' ? 'bg-rose-600 border-rose-500' : 'bg-slate-900 border-slate-800'}`}>
                <span>{toast.type === 'error' ? '⚠️' : '✅'}</span><span>{toast.message}</span>
              </div>
            </div>
          )}

          {/* نافذة معاينة الفاتورة */}
          {activeInvoiceModal && (
            <div class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
              <div class="bg-white p-4 rounded-3xl max-w-lg w-full flex flex-col items-center shadow-2xl">
                <h4 class="font-bold mb-3 text-xs text-slate-800">صورة الفاتورة المرفقة</h4>
                <img src={activeInvoiceModal} class="max-h-[65vh] object-contain rounded-2xl border mb-4 w-full" />
                <button onClick={()=>setActiveInvoiceModal(null)} class="w-full bg-slate-900 hover:bg-black text-white font-bold py-2.5 rounded-2xl text-xs transition">إغلاق المعاينة</button>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
