  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body { 
      font-family: 'Cairo', sans-serif; 
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .custom-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .dark .custom-scroll::-webkit-scrollbar-thumb { background: #475569; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    
    @media print {
      body * { visibility: hidden !important; }
      #printable-area, #printable-area * { visibility: visible !important; }
      #printable-area {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 10mm !important;
        box-shadow: none !important;
        border: none !important;
        background: white !important;
        color: black !important;
      }
      .print-hidden { display: none !important; }
      .print-break-inside { page-break-inside: avoid; }
    }

    .pdf-render-mode { background: #ffffff !important; color: #0f172a !important; direction: rtl !important; font-family: 'Cairo', Arial, sans-serif !important; }
    .pdf-render-mode * { letter-spacing: 0 !important; word-spacing: normal !important; }
    .pdf-render-mode input, .pdf-render-mode select { border: none !important; background: transparent !important; box-shadow: none !important; appearance: none !important; -webkit-appearance: none !important; font-weight: 800 !important; padding: 0 !important; }
    .pdf-render-mode table { table-layout: fixed !important; width: 100% !important; }
    .pdf-num { direction: ltr !important; unicode-bidi: isolate !important; display: inline-block !important; font-family: Arial, sans-serif !important; white-space: nowrap !important; }

    @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .toast-anim { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    /* حركات دراجة التحميل (Bike Loader) */
    .bike-container { width: 150px; height: 150px; position: relative; margin: 0 auto; }
    .bike-svg { width: 100%; height: 100%; overflow: visible; }
    .wheel { transform-origin: center; transform-box: fill-box; animation: spin 1.2s linear infinite; }
    .pedal { transform-origin: center; transform-box: fill-box; animation: spin 1.2s linear infinite; }
    .body-bounce { animation: bounce 0.6s ease-in-out infinite alternate; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-4px); } }
    .loading-text { font-family: 'Courier New', Courier, monospace; font-weight: bold; letter-spacing: 2px; color: #6366f1; font-size: 1.2rem; margin-top: 15px; text-align: center; }
    .loading-text::after { content: '...'; animation: dots 1.5s steps(4, end) infinite; }
    @keyframes dots { 0%, 20% { content: ''; } 40% { content: '.'; } 60% { content: '..'; } 80%, 100% { content: '...'; } }
  </style>

</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyDHjQTNfAh3wQ8tSOXOIewJNXaDCHADrR8",
      authDomain: "mrmo-d8760.firebaseapp.com",
      databaseURL: "https://mrmo-d8760-default-rtdb.firebaseio.com",
      projectId: "mrmo-d8760",
      storageBucket: "mrmo-d8760.firebasestorage.app",
      messagingSenderId: "510855132508",
      appId: "1:510855132508:web:feee377429a2d88c277d99",
      measurementId: "G-N9DW5R28H0"
    };

    const ADMIN_WHATSAPP_NUMBER = "201095545982";
    const SUPER_ADMIN_EMAIL = "mohamedmohy676676@gmail.com";
    const EXECUTIVE_DIRECTOR_EMAIL = "aymanmousawahat@gmail.com";
    const PROJECT_MANAGER_EMAILS = ["alaayousef1698@gmail.com"];
    const DIRECTOR_EMAILS = [SUPER_ADMIN_EMAIL, EXECUTIVE_DIRECTOR_EMAIL, ...PROJECT_MANAGER_EMAILS, "+201000000000", "+201095545982"];
    const ENGINEER_EMAILS = ["mesahaforconsultant@gmail.com"];
    const BLOCKED_CONSTRUCTION_EMAILS = ["ahmnab23@gmail.com"];

    let db = null;
    let auth = null;
    try {
      if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
      db = firebase.database();
      auth = firebase.auth();
      auth.languageCode = 'ar';
    } catch (e) { console.error("Firebase init error:", e); }

    const initialProjects = [
      { id: "cons-01", name: "مشروع رئيسي 01", location: "الموقع العام", budget: 500000, consultant: "مكتب الاستشارات الهندسية", startDate: "2026-01-01", deliveryDate: "2026-12-31", status: "جاري العمل", createdBy: "النظام" }
    ];

    const initialSettings = {
      mainCategories: ["مباني", "صبة خرسانه", "كهرباء", "سباكة", "محارة", "نقاشة"],
      subCategories: ["طوب", "اسمنت", "رملة", "عمالة", "الاكل", "نجار", "حداد", "خلاطة"],
      costTypes: ["مصنعيات", "بضاعة/مواد", "أكل", "مواصلات", "إيجار معدات", "نثريات وإكراميات"],
      suppliers: ["مورد الأسمنت", "مورد الرمل", "مقاول النجارة", "مصنع الطوب"],
      employees: ["المهندس التنفيذي", "مشرف العمال"],
      logo: ""
    };

    const cleanId = (id) => (id ? String(id).trim().toLowerCase().replace(/[.#$\[\]\/]/g, "-") : "");
    const parseNum = (val) => {
      if (typeof val === "number") return isNaN(val) ? 0 : val;
      if (!val) return 0;
      const clean = String(val).replace(/,/g, '').replace(/،/g, '.').trim();
      const n = parseFloat(clean);
      return isNaN(n) ? 0 : n;
    };
    const ensureArr = (data) => Array.isArray(data) ? data : (data ? Object.values(data) : []);

    const constructionStorage = {
      get(key, fallback = []) { try { const item = localStorage.getItem(`construction_${key}`); return item ? JSON.parse(item) : fallback; } catch { return fallback; } },
      set(key, data) { try { localStorage.setItem(`construction_${key}`, JSON.stringify(data)); } catch (e) {} },
      addToQueue(path, data) { const queue = this.get('offline_sync_queue', []); queue.push({ id: Date.now(), path, data }); this.set('offline_sync_queue', queue); },
      syncQueue(databaseInstance) {
        if (!navigator.onLine || !databaseInstance) return;
        const queue = this.get('offline_sync_queue', []);
        if (queue.length === 0) return;
        queue.forEach(item => databaseInstance.ref(item.path).set(item.data));
        localStorage.removeItem('construction_offline_sync_queue');
      }
    };

    function DashboardCharts({ allWork, allExp, allPay, projExpLabels, projExpData, projName }) {
      const chart1Ref = useRef(null); const chart2Ref = useRef(null); const chart1Instance = useRef(null); const chart2Instance = useRef(null);
      useEffect(() => {
        if (typeof Chart === 'undefined') return;
        if (chart1Instance.current) chart1Instance.current.destroy(); if (chart2Instance.current) chart2Instance.current.destroy();
        if (chart1Ref.current) {
          chart1Instance.current = new Chart(chart1Ref.current, {
            type: 'bar',
            data: { labels: ['قيمة الأعمال', 'المصروفات', 'التحصيلات'], datasets: [{ label: 'الموقف المالي العام', data: [allWork, allExp, allPay], backgroundColor: ['#4f46e5', '#f43f5e', '#10b981'], borderRadius: 8 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
          });
        }
        if (chart2Ref.current) {
          chart2Instance.current = new Chart(chart2Ref.current, {
            type: 'doughnut',
            data: { labels: projExpLabels.length ? projExpLabels : ['لا توجد مصروفات'], datasets: [{ data: projExpData.length ? projExpData : [1], backgroundColor: projExpData.length ? ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#64748b'] : ['#e2e8f0'] }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, padding: 8, font: { size: 10, family: 'Cairo' } } } } }
          });
        }
        return () => { if (chart1Instance.current) chart1Instance.current.destroy(); if (chart2Instance.current) chart2Instance.current.destroy(); };
      }, [allWork, allExp, allPay, projExpLabels.length, projExpData.length]);

      return (
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
          <div className="bg-white dark:bg-slate-900 p-4 sm:p-5 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm h-72 flex flex-col">
            <h4 className="font-extrabold text-slate-700 dark:text-slate-200 mb-2 text-center text-xs">📈 الموقف المالي العام للشركة</h4>
            <div className="relative w-full flex-1 min-h-0"><canvas ref={chart1Ref}></canvas></div>
          </div>
          <div className="bg-white dark:bg-slate-900 p-4 sm:p-5 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm h-72 flex flex-col">
            <h4 className="font-extrabold text-slate-700 dark:text-slate-200 mb-2 text-center text-xs truncate px-2">📊 توزيع تكلفة ({projName})</h4>
            <div className="relative w-full flex-1 min-h-0"><canvas ref={chart2Ref}></canvas></div>
          </div>
        </div>
      );
    }

    function App() {
      // ==========================================
      // 1. تعريف المتغيرات والحالات (STATE HOOKS)
      // ==========================================
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [theme, setTheme] = useState(() => localStorage.getItem('theme') || 'light');
      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const [accessDeniedMessage, setAccessDeniedMessage] = useState("");
      
      const [isLampOn, setIsLampOn] = useState(false);
      const [loginEmail, setLoginEmail] = useState("");
      const [loginPassword, setLoginPassword] = useState("");

      const [projects, setProjects] = useState(() => ensureArr(constructionStorage.get('projects', initialProjects)));
      const [expenses, setExpenses] = useState(() => ensureArr(constructionStorage.get('expenses', [])));
      const [extracts, setExtracts] = useState(() => ensureArr(constructionStorage.get('extracts', [])));
      const [payments, setPayments] = useState(() => ensureArr(constructionStorage.get('payments', [])));
      const [advances, setAdvances] = useState(() => ensureArr(constructionStorage.get('advances', [])));
      const [supplierPayments, setSupplierPayments] = useState(() => ensureArr(constructionStorage.get('supplier_payments', [])));
      const [loginLogs, setLoginLogs] = useState(() => ensureArr(constructionStorage.get('login_logs', [])));
      
      const [settings, setSettings] = useState(() => {
        const saved = constructionStorage.get('settings', {});
        return {
          mainCategories: ensureArr(saved.mainCategories || initialSettings.mainCategories),
          subCategories: ensureArr(saved.subCategories || initialSettings.subCategories),
          costTypes: ensureArr(saved.costTypes || initialSettings.costTypes),
          suppliers: ensureArr(saved.suppliers || initialSettings.suppliers),
          employees: ensureArr(saved.employees || initialSettings.employees),
          logo: saved.logo || ""
        };
      });

      const [userRolesMap, setUserRolesMap] = useState(() => constructionStorage.get('roles', {}));
      const [selectedProjId, setSelectedProjId] = useState("cons-01");
      const [activeTab, setActiveTab] = useState("dashboard");
      const [myEmpName, setMyEmpName] = useState(() => localStorage.getItem('myEmpName') || "");
      const [suppScope, setSuppScope] = useState("project");
      
      const [toast, setToast] = useState({ show: false, message: "", type: "success" });
      const [activeInvoiceModal, setActiveInvoiceModal] = useState(null);
      const [selectedSupplierDetail, setSelectedSupplierDetail] = useState(null);
      const [drawerOpen, setDrawerOpen] = useState(false);
      const [editItemData, setEditItemData] = useState(null);

      const [searchMainCat, setSearchMainCat] = useState("");
      const [searchSubCat, setSearchSubCat] = useState("");
      const [searchCostType, setSearchCostType] = useState("");
      const [newRoleInput, setNewRoleInput] = useState({ email: "", role: "engineer" });

      const todayDate = new Date().toISOString().split('T')[0];

      const [newProj, setNewProj] = useState({ id: "cons-01", name: "", location: "", budget: "", consultant: "", startDate: todayDate, deliveryDate: "", status: "جاري العمل" });
      const [newExp, setNewExp] = useState({ date: todayDate, mainCategory: "", subCategory: "", costType: "", supplier: "", billStatus: "مدفوعة", quantity: 1, unitPrice: "", description: "", paymentMethod: "خصم من العهدة", custodyEmployee: "", receiptImg: "" });
      const [newPay, setNewPay] = useState({ date: todayDate, amount: "", paymentMethod: "تحويل بنكي", notes: "" });
      const [newExt, setNewExt] = useState({ date: todayDate, extractNo: "", workDescription: "", quantity: 1, unitPrice: "", deductions: "" });
      const [newAdv, setNewAdv] = useState({ date: todayDate, employeeName: "", amount: "", notes: "" });
      const [newSuppPay, setNewSuppPay] = useState({ date: todayDate, supplier: "", amount: "", notes: "" });


      // ==========================================
      // 2. الحسابات الأساسية والصلاحيات (MEMOS)
      // ==========================================
      const currentUserEmail = (user?.email || user?.identifier || "").trim().toLowerCase();
      const sanitizedEmailKey = currentUserEmail.replace(/\./g, '_');

      const isSuperAdminHardcoded = currentUserEmail === SUPER_ADMIN_EMAIL.toLowerCase() || currentUserEmail.includes("mohamedmohy676676");
      const isExecutiveHardcoded = currentUserEmail === EXECUTIVE_DIRECTOR_EMAIL.toLowerCase() || currentUserEmail.includes("aymanmousawahat");
      const isPMHardcoded = PROJECT_MANAGER_EMAILS.some(e => currentUserEmail.includes(e.toLowerCase().trim()));

      const userRoleKey = useMemo(() => {
        if (!currentUserEmail) return 'guest';
        if (isSuperAdminHardcoded) return 'superadmin';
        if (isExecutiveHardcoded) return 'executive';
        if (isPMHardcoded) return 'pm';
        if (userRolesMap[sanitizedEmailKey]) return userRolesMap[sanitizedEmailKey];
        if (DIRECTOR_EMAILS.some(id => currentUserEmail.includes(id.toLowerCase()))) return 'admin';
        if (ENGINEER_EMAILS.some(id => currentUserEmail.includes(id.toLowerCase()))) return 'engineer';
        return 'engineer';
      }, [currentUserEmail, userRolesMap, isSuperAdminHardcoded, isExecutiveHardcoded, isPMHardcoded, sanitizedEmailKey]);

      const isAdmin = ['superadmin', 'executive', 'pm', 'admin'].includes(userRoleKey);
      const isAccountant = userRoleKey === 'accountant';
      const isEngineer = userRoleKey === 'engineer';
      const isSuperAdminExact = userRoleKey === 'superadmin';
      const canEditOrDelete = isAdmin || isAccountant || isEngineer;

      const userRoleTitle = useMemo(() => {
        if (userRoleKey === 'superadmin') return "مدير النظام (Admin)";
        if (userRoleKey === 'executive') return "المدير التنفيذي (CEO)";
        if (userRoleKey === 'pm') return "مدير مشاريع (PM)";
        if (userRoleKey === 'admin') return "إدارة (Admin)";
        if (userRoleKey === 'accountant') return "محاسب (Accountant)";
        return "مهندس الموقع (Site Engineer)";
      }, [userRoleKey]);

      const nextSuggestedProjectId = useMemo(() => {
        const consNumbers = projects.map(p => { 
          const m = String(p?.id || '').match(/^cons-(\d+)$/i); 
          return m ? parseInt(m[1], 10) : 0; 
        }).filter(n => n > 0);
        const maxNum = consNumbers.length > 0 ? Math.max(...consNumbers) : 0;
        const next = maxNum + 1;
        return `cons-${next < 10 ? '0' + next : next}`;
      }, [projects]);


      // ==========================================
      // 3. الخطافات (USE EFFECTS)
      // ==========================================
      useEffect(() => {
        const handleOnline = () => { setIsOnline(true); showToast("تم استعادة الاتصال بالإنترنت ومزامنة السجلات 🟢"); if (db) constructionStorage.syncQueue(db); };
        const handleOffline = () => { setIsOnline(false); showToast("أنت تعمل بدون إنترنت (حفظ محلي) 📡", "error"); };
        window.addEventListener('online', handleOnline); window.addEventListener('offline', handleOffline);
        return () => { window.removeEventListener('online', handleOnline); window.removeEventListener('offline', handleOffline); };
      }, []);

      useEffect(() => {
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', theme);
      }, [theme]);

      useEffect(() => {
        if (!auth) { setAuthLoading(false); return; }
        const safetyTimer = setTimeout(() => { setAuthLoading(false); }, 6000); // 6 ثواني كحد أقصى للتحميل

        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          clearTimeout(safetyTimer);
          if (currentUser) {
            const identifier = (currentUser.email || currentUser.phoneNumber || "").toLowerCase().trim();
            if (BLOCKED_CONSTRUCTION_EMAILS.some(b => identifier.includes(b.toLowerCase()))) {
              setAccessDeniedMessage("عفواً، حسابك مصرح له بالدخول لقطاع المساحة فقط.");
              auth.signOut(); setUser(null); setAuthLoading(false); return;
            }
            setAccessDeniedMessage("");
            setUser({ 
              uid: currentUser.uid, 
              name: currentUser.displayName || currentUser.email || currentUser.phoneNumber || "مستخدم موثق",
              email: currentUser.email || currentUser.phoneNumber || "",
              identifier 
            });
            localStorage.setItem('last_const_user_email', identifier);
            localStorage.setItem('last_const_user_name', currentUser.displayName || identifier);
          } else {
            const savedEmail = localStorage.getItem('last_const_user_email');
            if (savedEmail && !navigator.onLine) {
              setUser({ identifier: savedEmail, email: savedEmail, name: localStorage.getItem('last_const_user_name') || savedEmail });
            } else {
              setUser(null);
            }
          }
          setAuthLoading(false);
        });

        return () => { clearTimeout(safetyTimer); unsubscribe(); };
      }, []);

      useEffect(() => {
        if (!db) return;
        const rootRef = db.ref('/');
        const handleValue = (snapshot) => {
          try {
            const data = snapshot.val() || {};
            const loadedProjects = ensureArr(data.projects);
            const finalProjects = loadedProjects.length > 0 ? loadedProjects : initialProjects;
            setProjects(finalProjects); constructionStorage.set('projects', finalProjects);

            if (data.expenses) { const l = ensureArr(data.expenses).reverse(); setExpenses(l); constructionStorage.set('expenses', l); }
            if (data.extracts) { const l = ensureArr(data.extracts).reverse(); setExtracts(l); constructionStorage.set('extracts', l); }
            if (data.payments) { const l = ensureArr(data.payments).reverse(); setPayments(l); constructionStorage.set('payments', l); }
            if (data.advances) { const l = ensureArr(data.advances).reverse(); setAdvances(l); constructionStorage.set('advances', l); }
            if (data.supplier_payments) { const l = ensureArr(data.supplier_payments).reverse(); setSupplierPayments(l); constructionStorage.set('supplier_payments', l); }
            if (data.login_logs) { const l = ensureArr(data.login_logs).reverse(); setLoginLogs(l); constructionStorage.set('login_logs', l); }
            if (data.roles) { setUserRolesMap(data.roles); constructionStorage.set('roles', data.roles); }

            const savedSettings = data.settings || {};
            const finalSettings = {
              mainCategories: ensureArr(savedSettings.mainCategories).length ? ensureArr(savedSettings.mainCategories) : initialSettings.mainCategories,
              subCategories: ensureArr(savedSettings.subCategories).length ? ensureArr(savedSettings.subCategories) : initialSettings.subCategories,
              costTypes: ensureArr(savedSettings.costTypes).length ? ensureArr(savedSettings.costTypes) : initialSettings.costTypes,
              suppliers: ensureArr(savedSettings.suppliers).length ? ensureArr(savedSettings.suppliers) : initialSettings.suppliers,
              employees: ensureArr(savedSettings.employees).length ? ensureArr(savedSettings.employees) : initialSettings.employees,
              logo: savedSettings.logo || ""
            };
            setSettings(finalSettings); constructionStorage.set('settings', finalSettings);

            setSelectedProjId(prev => {
              if (prev && finalProjects.some(p => cleanId(p.id) === cleanId(prev))) return prev;
              return finalProjects[0]?.id || "cons-01";
            });
          } catch (err) { console.error(err); }
        };
        rootRef.on('value', handleValue);
        return () => { rootRef.off('value', handleValue); };
      }, [user]);

      useEffect(() => { if (!isAdmin && activeTab === 'dashboard') setActiveTab('projects'); }, [isAdmin, activeTab]);

      useEffect(() => {
        if (user && !sessionStorage.getItem('login_recorded')) {
          recordLoginLog(user, userRoleTitle); sessionStorage.setItem('login_recorded', 'true');
        }
      }, [user, userRoleTitle]);

      useEffect(() => { setNewProj(prev => ({ ...prev, id: nextSuggestedProjectId })); }, [nextSuggestedProjectId]);
      
      useEffect(() => { 
        if (myEmpName) {
          if (!newExp.custodyEmployee) setNewExp(prev => ({ ...prev, custodyEmployee: myEmpName }));
          if (!newAdv.employeeName) setNewAdv(prev => ({ ...prev, employeeName: myEmpName }));
        }
      }, [myEmpName]);


      // ==========================================
      // 4. الدوال والوظائف (HANDLERS)
      // ==========================================
      const showToast = (message, type = "success") => { 
        setToast({ show: true, message, type }); setTimeout(() => setToast(prev => ({ ...prev, show: false })), 3200); 
      };

      const recordLoginLog = (currentUser, roleName) => {
        if (!currentUser) return;

      const currentProj = projects.find(p => cleanId(p?.id) === cleanId(selectedProjId)) || projects[0] || {};
      const projExpenses = expenses.filter(e => cleanId(e?.projectId) === cleanId(currentProj?.id));
      const projExtracts = extracts.filter(e => cleanId(e?.projectId) === cleanId(currentProj?.id));
      const projPayments = payments.filter(p => cleanId(p?.projectId) === cleanId(currentProj?.id));
      const projAdvances = advances.filter(a => cleanId(a?.projectId) === cleanId(currentProj?.id));
      const projSuppPayments = supplierPayments.filter(p => cleanId(p?.projectId) === cleanId(currentProj?.id));

      const totalWorkNet = projExtracts.reduce((sum, item) => sum + parseNum(item?.net), 0);
      const totalCost = projExpenses.reduce((sum, item) => sum + parseNum(item?.amount), 0);
      const totalReceived = projPayments.reduce((sum, item) => sum + parseNum(item?.amount), 0);
      const netProfit = totalWorkNet - totalCost;

      const projDirectCashExp = projExpenses.filter(e => e?.paymentMethod !== 'خصم من العهدة' && (e?.billStatus || 'مدفوعة') === 'مدفوعة').reduce((sum, e) => sum + parseNum(e?.amount), 0);
      const projTotalAdvancesGiven = projAdvances.reduce((sum, a) => sum + parseNum(a?.amount), 0);
      const projTotalSuppPaid = projSuppPayments.reduce((sum, p) => sum + parseNum(p?.amount), 0);
      const centralCashRemaining = totalReceived - projDirectCashExp - projTotalAdvancesGiven - projTotalSuppPaid;

      const allEmpCustodyBalance = (settings?.employees || []).reduce((acc, emp) => {
        const adv = projAdvances.filter(a => a?.employeeName === emp).reduce((sum, a) => sum + parseNum(a?.amount), 0);
        const spent = projExpenses.filter(e => e?.paymentMethod === 'خصم من العهدة' && e?.custodyEmployee === emp).reduce((sum, e) => sum + parseNum(e?.amount), 0);
        return acc + Math.max(0, adv - spent);
      }, 0);

      const projBudget = parseNum(currentProj?.budget);
      const budgetConsumedPercent = projBudget > 0 ? Math.min(Math.round((totalCost / projBudget) * 100), 100) : 0;

      const allWork = extracts.reduce((sum, item) => sum + parseNum(item?.totalWork), 0);
      const allExp = expenses.reduce((sum, item) => sum + parseNum(item?.amount), 0);
      const allPay = payments.reduce((sum, item) => sum + parseNum(item?.amount), 0);

      const projExpMap = {};
      projExpenses.forEach(e => { const cat = e?.mainCategory || 'غير محدد'; projExpMap[cat] = (projExpMap[cat] || 0) + parseNum(e?.amount); });
      const projExpLabels = Object.keys(projExpMap);
      const projExpData = Object.values(projExpMap);

      const filteredSearchExpenses = projExpenses.filter(e => { return (searchMainCat === "" || e?.mainCategory === searchMainCat) && (searchSubCat === "" || e?.subCategory === searchSubCat) && (searchCostType === "" || e?.costType === searchCostType); });
      const filteredSearchTotal = filteredSearchExpenses.reduce((s, e) => s + parseNum(e?.amount), 0);

      const allSupplierNames = Array.from(new Set([...(settings?.suppliers || []), ...expenses.map(e => e?.supplier).filter(Boolean), ...supplierPayments.map(p => p?.supplier).filter(Boolean)])).map(s => String(s || '').trim()).filter(Boolean);
      const cleanSuppliersList = Array.from(new Set(allSupplierNames));

      const suppliersLedger = cleanSuppliersList.map(supp => {
        const targetExp = suppScope === "project" ? projExpenses : expenses; const targetSuppPay = suppScope === "project" ? projSuppPayments : supplierPayments;
        const allInvoices = targetExp.filter(e => String(e?.supplier || '').trim() === supp);
        const totalPurchases = allInvoices.reduce((sum, e) => sum + parseNum(e?.amount), 0);
        const creditPurchases = allInvoices.filter(e => (e?.billStatus || 'مدفوعة') === 'آجلة').reduce((sum, e) => sum + parseNum(e?.amount), 0);
        const paidPurchases = totalPurchases - creditPurchases;
        const totalPaidToCreditor = targetSuppPay.filter(p => String(p?.supplier || '').trim() === supp).reduce((sum, p) => sum + parseNum(p?.amount), 0);
        const balance = totalPaidToCreditor - creditPurchases;
        return { name: supp, totalPurchases, creditPurchases, paidPurchases, totalPaid: totalPaidToCreditor, balance };
      }).filter(s => s.totalPurchases > 0 || s.totalPaid > 0);

      const getCustodyStats = (empName) => {

                    </div>
                    {newOp.engCalcMethod === 'customFixed' && (
                      <div className="pt-1"><label className="block text-[10px] text-slate-600 dark:text-slate-300 mb-1">أدخل مبلغ أتعاب المهندس المقطوع (ج.م):</label><input type="number" step="any" value={newOp.engCustomFixedAmount} onChange={e=>setNewOp({...newOp, engCustomFixedAmount: e.target.value})} className="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-800 bg-white font-bold text-emerald-600" /></div>
                    )}
                  </div>

                  <div className="grid grid-cols-2 gap-2 pt-1">
                    <div>مصاريف عمالة <input type="number" value={newOp.laborCost} onChange={e=>setNewOp({...newOp, laborCost: e.target.value})} className="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-700"/></div>
                    <div>مصاريف سيارة <input type="number" value={newOp.carCost} onChange={e=>setNewOp({...newOp, carCost: e.target.value})} className="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-700"/></div>
                  </div>

                  <div>المحصل فوراً في الموقع (إن وجد) <input type="number" value={newOp.paidNow} onChange={e=>setNewOp({...newOp, paidNow: e.target.value})} className="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-700"/></div>

                  <div className="p-2.5 bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-800 rounded-xl text-[11px] text-emerald-900 dark:text-emerald-300 font-bold space-y-0.5">
                    <div className="flex justify-between"><span>👷 أتعاب المهندس: <strong>{(livePreview.engFee || 0).toLocaleString()} ج.م</strong></span><span>🛰 حصة الجهاز: <strong>{(livePreview.deviceFee || 0).toLocaleString()} ج.م</strong></span></div>
                    <div className="flex justify-between text-rose-600 dark:text-rose-400 pt-1 border-t border-emerald-200 dark:border-emerald-800/50 mt-1"><span>🚗 مصاريف (عمالة+سيارة): <strong>{(liveExpenses.totalExp || 0).toLocaleString()} ج.م</strong></span><span>🏢 صافي المكتب: <strong>{(livePreview.officeFee || 0).toLocaleString()} ج.م</strong></span></div>
                  </div>
                  <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-2xl font-black mt-2 shadow-sm">{editingOp ? 'حفظ التعديلات' : 'حفظ الطلعة اليومية'}</button>
                </form>
              </div>
            </div>
          )}

          {payModalOpen && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 print-hidden">
              <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs" onClick={()=>setPayModalOpen(false)}></div>
              <div className="relative bg-white dark:bg-slate-800 w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl z-50">
                <div className="flex justify-between items-center border-b dark:border-slate-700 pb-3 mb-3">
                  <h3 className="font-black text-sm">💰 تسجيل دفعة مسددة من العميل</h3>
                  <button onClick={()=>setPayModalOpen(false)} className="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
                </div>
                <form onSubmit={handleAddPayment} className="space-y-3 text-xs font-bold">
                  <div>التاريخ <input type="date" value={newPayment.date} onChange={e=>setNewPayment({...newPayment, date: e.target.value})} className="w-full border dark:border-slate-600 p-2.5 rounded-xl dark:bg-slate-700 mt-1" required/></div>
                  <div>العميل 
                    <select value={newPayment.clientName} onChange={e=>setNewPayment({...newPayment, clientName: e.target.value})} className="w-full border dark:border-slate-600 p-2.5 rounded-xl dark:bg-slate-700 mt-1" required>
                      <option value="">-- اختر العميل --</option>
                      {clientNames.map(c=><option key={c}>{c}</option>)}
                    </select>
                  </div>
                  <div>المبلغ المسدد <input type="number" value={newPayment.amount} onChange={e=>setNewPayment({...newPayment, amount: e.target.value})} className="w-full border dark:border-slate-600 p-2.5 rounded-xl dark:bg-slate-700 mt-1 text-emerald-600 font-black text-sm" required/></div>
                  <div>البيان / الملاحظات <input type="text" value={newPayment.notes} onChange={e=>setNewPayment({...newPayment, notes: e.target.value})} className="w-full border dark:border-slate-600 p-2.5 rounded-xl dark:bg-slate-700 mt-1"/></div>
                  <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-2xl font-black mt-2 shadow-sm">قيد الدفعة في الحساب</button>
                </form>
              </div>
            </div>
          )}

          <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-800 border-t dark:border-slate-700 px-2 py-1.5 flex justify-around items-center z-40 shadow-lg print-hidden">
            <button onClick={()=>setActiveTab('dashboard')} className={`flex flex-col items-center py-1 px-2 rounded-xl transition ${activeTab==='dashboard'?'text-indigo-600 dark:text-indigo-400 font-black':'text-slate-500'}`}><span className="text-base">📊</span><span className="text-[9px] mt-0.5">الرئيسية</span></button>
            <button onClick={()=>setActiveTab('extracts')} className={`flex flex-col items-center py-1 px-2 rounded-xl transition ${activeTab==='extracts'?'text-indigo-600 dark:text-indigo-400 font-black':'text-slate-500'}`}><span className="text-base">📄</span><span className="text-[9px] mt-0.5">المستخلص</span></button>
            <button onClick={()=>setActiveTab('operations')} className={`flex flex-col items-center py-1 px-2 rounded-xl transition ${activeTab==='operations'?'text-indigo-600 dark:text-indigo-400 font-black':'text-slate-500'}`}><span className="text-base">📐</span><span className="text-[9px] mt-0.5">الطلعات</span></button>
            <button onClick={()=>setActiveTab('vault')} className={`flex flex-col items-center py-1 px-2 rounded-xl transition ${activeTab==='vault'?'text-indigo-600 dark:text-indigo-400 font-black':'text-slate-500'}`}><span className="text-base">💵</span><span className="text-[9px] mt-0.5">الخزينة</span></button>
            <button onClick={()=>setDrawerOpen(true)} className="flex flex-col items-center py-1 px-2 text-slate-500"><span className="text-base">☰</span><span className="text-[9px] mt-0.5">المزيد</span></button>
          </nav>

          {toast.show && <div className="fixed bottom-16 md:bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 px-5 py-3 rounded-2xl text-xs z-50 shadow-2xl font-bold print-hidden toast-anim flex items-center gap-2">
            <span>{toast.type === 'error' ? '⚠️' : '✅'}</span>
            <span>{toast.message}</span>
          </div>}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
