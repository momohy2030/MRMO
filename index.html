<!DOCTYPE html>
<html lang="ar" dir="rtl" class="light">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <script src="https://cdn.tailwindcss.com"></script>

    tailwind.config = {
      darkMode: 'class',

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-database-compat.js"></script>

  <meta name="theme-color" content="#0f172a">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body { 
      font-family: 'Cairo', sans-serif; 
      -webkit-tap-highlight-color: transparent;
    }
    .scrollbar-hide::-webkit-scrollbar { 
      display: none; 
    }
    .scrollbar-hide { 
      -ms-overflow-style: none; 
      scrollbar-width: none; 
    }
    @media print {
      body { 
        background-color: white !important; 
        font-size: 11px; 
      }
      .print-hidden { 
        display: none !important; 
      }
      .print-area { 
        box-shadow: none !important; 
        border: none !important; 
        margin: 0 !important; 
        padding: 0 !important; 
        width: 100% !important; 
      }
      .print-break-inside { 
        page-break-inside: avoid; 
      }
    }
    @keyframes slideUp { 
      from { transform: translateY(100%); opacity: 0; } 
      to { transform: translateY(0); opacity: 1; } 
    }
    .toast-anim { 
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 antialiased select-none sm:select-auto transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyDHjQTNfAh3wQ8tSOXOIewJNXaDCHADrR8",
      authDomain: "mrmo-d8760.firebaseapp.com",
      databaseURL: "https://mrmo-d8760-default-rtdb.firebaseio.com",
      projectId: "mrmo-d8760",
      storageBucket: "mrmo-d8760.firebasestorage.app",
      messagingSenderId: "510855132508",
      appId: "1:510855132508:web:feee377429a2d88c277d99",
      measurementId: "G-N9DW5R28H0"
    };

    const ADMIN_WHATSAPP_NUMBER = "201095545982";
    const SUPER_ADMIN_EMAIL = "mohamedmohy676676@gmail.com";
    const DIRECTOR_EMAILS = [SUPER_ADMIN_EMAIL, "+201000000000", "+201095545982"];
    const ENGINEER_EMAILS = ["mesahaforconsultant@gmail.com", "ahmnab23@gmail.com"];

    let db = null;
    let auth = null;
    try {
      if (!firebase.apps.length) { 
        firebase.initializeApp(firebaseConfig); 
      }
      db = firebase.database();
      auth = firebase.auth();
      auth.languageCode = 'ar';
    } catch (e) { 
      console.error("Firebase init error:", e); 
    }

    const initialProjects = [
      {
        "id": "cons-01", 
        "name": "مشروع رئيسي 01", 
        "location": "الموقع العام", 
        "budget": 500000, 
        "consultant": "مكتب الاستشارات الهندسية", 
        "startDate": "2026-01-01", 
        "deliveryDate": "2026-12-31", 
        "status": "جاري العمل", 
        "createdBy": "النظام"
      }
    ];

    const initialSettings = {
      mainCategories: ["مباني", "صبة خرسانه", "كهرباء", "سباكة", "محارة", "نقاشة"],
      subCategories: ["طوب", "اسمنت", "رملة", "عمالة", "الاكل", "نجار", "حداد", "خلاطة"],
      costTypes: ["مصنعيات", "بضاعة/مواد", "أكل", "مواصلات", "إيجار معدات", "نثريات وإكراميات"],
      suppliers: ["مورد الأسمنت", "مورد الرمل", "مقاول النجارة", "مصنع الطوب"],
      employees: ["المهندس التنفيذي", "مشرف العمال"],
      logo: ""
    };

    const cleanId = (id) => (id ? String(id).trim().toLowerCase().replace(/[.#$\[\]\/]/g, "-") : "");
    const parseNum = (val) => {
      if (typeof val === "number") return isNaN(val) ? 0 : val;
      if (!val) return 0;
      const clean = String(val).replace(/,/g, '').replace(/،/g, '.').trim();
      const n = parseFloat(clean);
      return isNaN(n) ? 0 : n;
    };

    const generatePdfAndOpenWhatsApp = (elementId, filename, textMessage, targetPhone = ADMIN_WHATSAPP_NUMBER) => {
      const element = document.getElementById(elementId);
      if (!element) {
        alert("تعذر العثور على العنصر لإنشاء الـ PDF");
        return;
      }

      const opt = {
        margin: [8, 8, 8, 8],
        filename: filename || 'document.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save().then(() => {
        const cleanPhone = targetPhone.replace(/[^0-9]/g, '');
        const url = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(textMessage + "\n\n📎 (تم استخراج ملف الـ PDF وتحميله بجهازك، برجاء إرفاقه هنا)")}`;
        window.open(url, '_blank');
      }).catch(err => {
        console.error("PDF generation failed:", err);
        const url = `https://wa.me/${targetPhone}?text=${encodeURIComponent(textMessage)}`;
        window.open(url, '_blank');
      });
    };

    function DashboardCharts({ allWork, allExp, allPay, projExpLabels, projExpData, projName }) {
      const chart1Ref = useRef(null);
      const chart2Ref = useRef(null);
      const chart1Instance = useRef(null);
      const chart2Instance = useRef(null);

      useEffect(() => {
        if (chart1Instance.current) chart1Instance.current.destroy();
        if (chart2Instance.current) chart2Instance.current.destroy();

        if (chart1Ref.current) {
          chart1Instance.current = new Chart(chart1Ref.current, {
            type: 'bar',
            data: {
              labels: ['قيمة الأعمال', 'المصروفات', 'التحصيلات'],
              datasets: [{ 
                label: 'الموقف المالي العام', 
                data: [allWork, allExp, allPay], 
                backgroundColor: ['#4f46e5', '#e11d48', '#10b981'], 
                borderRadius: 6 
              }]
            },
            options: { 
              responsive: true, 
              maintainAspectRatio: false, 
              plugins: { legend: { display: false } } 
            }
          });
        }
        
        if (chart2Ref.current) {
          chart2Instance.current = new Chart(chart2Ref.current, {
            type: 'doughnut',
            data: {
              labels: projExpLabels.length ? projExpLabels : ['لا توجد مصروفات'],
              datasets: [{ 
                data: projExpData.length ? projExpData : [1], 
                backgroundColor: projExpData.length ? ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#64748b'] : ['#e2e8f0'] 
              }]
            },
            options: { 
              responsive: true, 
              maintainAspectRatio: false, 
              plugins: { 
                legend: { 
                  position: 'bottom', 
                  labels: { boxWidth: 8, padding: 6, font: { size: 9, family: 'Cairo' } } 
                } 
              } 
            }
          });
        }
        
        return () => {
          if (chart1Instance.current) chart1Instance.current.destroy();
          if (chart2Instance.current) chart2Instance.current.destroy();
        };
      }, [allWork, allExp, allPay, projExpLabels.join(','), projExpData.join(',')]);

      return (
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
          <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200/90 dark:border-slate-700 shadow-sm h-72 flex flex-col overflow-hidden">
            <h4 class="font-bold text-slate-700 dark:text-slate-300 mb-2 text-center text-xs">📈 الموقف المالي العام للشركة</h4>
            <div class="relative w-full flex-1 min-h-0"><canvas ref={chart1Ref}></canvas></div>
          </div>
          <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200/90 dark:border-slate-700 shadow-sm h-72 flex flex-col overflow-hidden">
            <h4 class="font-bold text-slate-700 dark:text-slate-300 mb-2 text-center text-xs truncate px-2">📊 توزيع تكلفة ({projName})</h4>
            <div class="relative w-full flex-1 min-h-0"><canvas ref={chart2Ref}></canvas></div>
          </div>
        </div>
      );
    }

    function App() {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [theme, setTheme] = useState(localStorage.getItem('theme') || 'light');

      const [loginMethod, setLoginMethod] = useState("choose");
      const [phoneNumber, setPhoneNumber] = useState("");
      const [otpCode, setOtpCode] = useState("");
      const [verificationId, setVerificationId] = useState(null);
      const [loginError, setLoginError] = useState("");

      const [loading, setLoading] = useState(false);
      const [projects, setProjects] = useState(initialProjects);
      const [expenses, setExpenses] = useState([]);
      const [extracts, setExtracts] = useState([]);
      const [payments, setPayments] = useState([]);
      const [advances, setAdvances] = useState([]);
      const [supplierPayments, setSupplierPayments] = useState([]);
      const [loginLogs, setLoginLogs] = useState([]);
      const [settings, setSettings] = useState(initialSettings);
      
      // مصفوفة الصلاحيات المحفوظة سحابياً
      const [userRolesMap, setUserRolesMap] = useState({});

      const [selectedProjId, setSelectedProjId] = useState("cons-01");
      const [activeTab, setActiveTab] = useState("dashboard");
      const [myEmpName, setMyEmpName] = useState(localStorage.getItem('myEmpName') || "");
      const [suppScope, setSuppScope] = useState("project");
      
      const [toast, setToast] = useState({ show: false, message: "", type: "success" });
      const [activeInvoiceModal, setActiveInvoiceModal] = useState(null);
      const [selectedSupplierDetail, setSelectedSupplierDetail] = useState(null);
      const [drawerOpen, setDrawerOpen] = useState(false);
      const [editItemData, setEditItemData] = useState(null);

      const [searchMainCat, setSearchMainCat] = useState("");
      const [searchSubCat, setSearchSubCat] = useState("");
      const [searchCostType, setSearchCostType] = useState("");

      const todayDate = new Date().toISOString().split('T')[0];

      // ضبط الوضع الليلي
      useEffect(() => {
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        localStorage.setItem('theme', theme);
      }, [theme]);

      const toggleTheme = () => setTheme(prev => prev === 'dark' ? 'light' : 'dark');

      const showToast = (message, type = "success") => { 
        setToast({ show: true, message, type }); 
        setTimeout(() => setToast(prev => ({ ...prev, show: false })), 3500); 
      };

      const recordLoginLog = (currentUser, roleName) => {
        if (!db) return;
        const now = new Date();
        const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const logEntry = { 
          uid: currentUser.uid, 
          name: currentUser.displayName || currentUser.email || currentUser.phoneNumber || "مستخدم", 
          identifier: currentUser.email || currentUser.phoneNumber || "غير محدد", 
          role: roleName, 
          device: isMobile ? "📱 هاتف محمول" : "💻 كمبيوتر", 
          timestamp: now.toISOString(), 
          formattedDate: now.toLocaleDateString('ar-EG') + ' ' + now.toLocaleTimeString('ar-EG') 
        };
        db.ref('login_logs').push(logEntry);
      };

      // التحقق من الحساب والدور
      useEffect(() => {
        if (!auth) { 
          setAuthLoading(false); 
          return; 
        }
        
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          if (currentUser) {
            const identifier = (currentUser.email || currentUser.phoneNumber || "").toLowerCase();
            setUser({ 
              uid: currentUser.uid, 
              name: currentUser.displayName || currentUser.email || currentUser.phoneNumber || "مستخدم موثق", 
              identifier 
            });
          } else {
            setUser(null);
          }
          setAuthLoading(false);
        });
        
        return () => unsubscribe();
      }, []);

      // جلب البيانات من Firebase
      useEffect(() => {
        if (!user || !db) return;
        setLoading(true);

        const rootRef = db.ref('/');
        const handleValue = (snapshot) => {
          try {
            const data = snapshot.val() || {};
            const toArr = (v) => (v ? (Array.isArray(v) ? v : Object.values(v)) : []);
            
            const loadedProjects = toArr(data.projects);
            const finalProjects = loadedProjects.length > 0 ? loadedProjects : initialProjects;
            setProjects(finalProjects);

            setExpenses([...toArr(data.expenses)].reverse());
            setExtracts([...toArr(data.extracts)].reverse());
            setPayments([...toArr(data.payments)].reverse());
            setAdvances([...toArr(data.advances)].reverse());
            setSupplierPayments([...toArr(data.supplier_payments)].reverse());
            setLoginLogs([...toArr(data.login_logs)].reverse());
            setUserRolesMap(data.roles || {});

            const savedSettings = data.settings || {};
            setSettings({
              mainCategories: toArr(savedSettings.mainCategories).length ? toArr(savedSettings.mainCategories) : initialSettings.mainCategories,
              subCategories: toArr(savedSettings.subCategories).length ? toArr(savedSettings.subCategories) : initialSettings.subCategories,
              costTypes: toArr(savedSettings.costTypes).length ? toArr(savedSettings.costTypes) : initialSettings.costTypes,
              suppliers: toArr(savedSettings.suppliers).length ? toArr(savedSettings.suppliers) : initialSettings.suppliers,
              employees: toArr(savedSettings.employees).length ? toArr(savedSettings.employees) : initialSettings.employees,
              logo: savedSettings.logo || ""
            });

            setSelectedProjId(prev => {
              if (prev && finalProjects.some(p => cleanId(p.id) === cleanId(prev))) return prev;
              return finalProjects[0]?.id || "cons-01";
            });
          } catch (err) {
            console.error(err);
          } finally { 
            setLoading(false); 
          }
        };

        rootRef.on('value', handleValue);
        return () => { rootRef.off('value', handleValue); };
      }, [user]);

      // تحديد الدور البرمجي الدقيق
      const currentUserEmail = (user?.identifier || "").trim().toLowerCase();
      const sanitizedEmailKey = currentUserEmail.replace(/\./g, '_');

      const userRoleKey = useMemo(() => {
        if (!currentUserEmail) return 'guest';
        if (DIRECTOR_EMAILS.some(id => currentUserEmail.includes(id.toLowerCase()))) return 'admin';
        if (userRolesMap[sanitizedEmailKey]) return userRolesMap[sanitizedEmailKey];
        if (ENGINEER_EMAILS.some(id => currentUserEmail.includes(id.toLowerCase()))) return 'engineer';
        return 'engineer'; // الافتراضي مهندس
      }, [currentUserEmail, userRolesMap]);

      const isAdmin = userRoleKey === 'admin';
      const isAccountant = userRoleKey === 'accountant';
      const isEngineer = userRoleKey === 'engineer';
      const canEditOrDelete = isAdmin || isAccountant || isEngineer;

      const userRoleTitle = useMemo(() => {
        if (isAdmin) return "مدير النظام (Admin)";
        if (isAccountant) return "المحاسب (Accountant)";
        return "مهندس الموقع (Site Engineer)";
      }, [isAdmin, isAccountant]);

      useEffect(() => {
        if (user && !sessionStorage.getItem('login_recorded')) {
          recordLoginLog(user, userRoleTitle);
          sessionStorage.setItem('login_recorded', 'true');
        }
      }, [user, userRoleTitle]);

      const nextSuggestedProjectId = useMemo(() => {
        const consNumbers = projects.map(p => { 
          const m = String(p.id).match(/^cons-(\d+)$/i); 
          return m ? parseInt(m[1], 10) : 0; 
        }).filter(n => n > 0);
        const maxNum = consNumbers.length > 0 ? Math.max(...consNumbers) : 0;
        const next = maxNum + 1;
        return `cons-${next < 10 ? '0' + next : next}`;
      }, [projects]);

      const [newProj, setNewProj] = useState({ id: "cons-01", name: "", location: "", budget: "", consultant: "", startDate: todayDate, deliveryDate: "", status: "جاري العمل" });
      const [newExp, setNewExp] = useState({ date: todayDate, mainCategory: "", subCategory: "", costType: "", supplier: "", billStatus: "مدفوعة", quantity: 1, unitPrice: "", description: "", paymentMethod: "خصم من العهدة", custodyEmployee: "", receiptImg: "" });
      const [newPay, setNewPay] = useState({ date: todayDate, amount: "", paymentMethod: "تحويل بنكي", notes: "" });
      const [newExt, setNewExt] = useState({ date: todayDate, extractNo: "", workDescription: "", quantity: 1, unitPrice: "", deductions: "" });
      const [newAdv, setNewAdv] = useState({ date: todayDate, employeeName: "", amount: "", notes: "" });
      const [newSuppPay, setNewSuppPay] = useState({ date: todayDate, supplier: "", amount: "", notes: "" });

      useEffect(() => { setNewProj(prev => ({ ...prev, id: nextSuggestedProjectId })); }, [nextSuggestedProjectId]);
      useEffect(() => { 
        if (myEmpName) {
          if (!newExp.custodyEmployee) setNewExp(prev => ({ ...prev, custodyEmployee: myEmpName }));
          if (!newAdv.employeeName) setNewAdv(prev => ({ ...prev, employeeName: myEmpName }));
        }
      }, [myEmpName]);

      const handleAddNewSettingItem = (settingKey, currentArray, title) => {
        if (!canEditOrDelete) {
          showToast("خاصية الإضافة وتعديل الإعدادات للإدارة والمهندس فقط 🔒", "error");
          return;
        }
        const newVal = window.prompt(`أدخل [${title}] جديد لإضافته فوراً للقائمة:`, "");
        if (newVal && newVal.trim() !== "") {
          const cleanVal = newVal.trim();
          if (currentArray.includes(cleanVal)) { 
            showToast(`هذا البند موجود مسبقاً!`, "error"); 
            return; 
          }
          const updatedArray = [...currentArray, cleanVal];
          setSettings(prev => ({ ...prev, [settingKey]: updatedArray }));
          if (db) db.ref(`settings/${settingKey}`).set(updatedArray);
          showToast(`تم إضافة "${cleanVal}" للقائمة بنجاح!`);
        }
      };

      const handleGoogleLogin = () => { 
        setLoginError(""); 
        const provider = new firebase.auth.GoogleAuthProvider(); 
        auth.signInWithPopup(provider).catch((error) => { setLoginError("تعذر الدخول بجوجل: " + error.message); }); 
      };

      const setupRecaptcha = () => { 
        if (!window.recaptchaVerifier) { 
          window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { 'size': 'invisible' }); 
        } 
      };

      const handleSendOtp = (e) => {
        e.preventDefault(); 
        setLoginError(""); 
        setupRecaptcha(); 
        const appVerifier = window.recaptchaVerifier;
        let formattedPhone = phoneNumber; 
        if (formattedPhone.startsWith("01")) { formattedPhone = "+20" + formattedPhone.substring(1); }
        auth.signInWithPhoneNumber(formattedPhone, appVerifier)
          .then((confirmationResult) => { 
            window.confirmationResult = confirmationResult; 
            setVerificationId(true); 
            showToast("تم إرسال كود التحقق 📩"); 
          })
          .catch(() => { 
            setLoginError("تعذر إرسال الرمز. يرجى مراجعة رقم الهاتف."); 
            if(window.recaptchaVerifier) { window.recaptchaVerifier.render().then(widgetId => grecaptcha.reset(widgetId)); }
          });
      };

      const handleVerifyOtp = (e) => { 
        e.preventDefault(); 
        setLoginError(""); 
        window.confirmationResult.confirm(otpCode).catch(() => { setLoginError("الرمز غير صحيح."); }); 
      };

      const handleLogout = () => { 
        auth.signOut(); 
        setLoginMethod("choose"); 
        setVerificationId(null); 
        setDrawerOpen(false); 
      };

      const handleReceiptUpload = (e) => {
        const file = e.target.files && e.target.files[0]; 
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => { 
          setNewExp(prev => ({ ...prev, receiptImg: evt.target.result })); 
          showToast("تم إرفاق صورة الفاتورة 📸"); 
        };
        reader.readAsDataURL(file);
      };

      const deleteItem = (path, id, list) => {
        if (!isAdmin && !isAccountant) {
          showToast("الحذف مصرح لمدير النظام والمحاسب فقط 🔒", "error");
          return;
        }
        if (window.confirm("هل أنت متأكد من الحذف نهائياً؟")) {
          const newList = list.filter(item => item.id !== id);
          if (db) db.ref(path).set(newList);
          if (path === 'expenses') setExpenses(newList); 
          if (path === 'extracts') setExtracts(newList); 
          if (path === 'payments') setPayments(newList); 
          if (path === 'projects') setProjects(newList); 
          if (path === 'advances') setAdvances(newList); 
          if (path === 'supplier_payments') setSupplierPayments(newList);
          showToast("تم الحذف بنجاح! 🗑");
        }
      };

      const handleSaveEditedItem = (e) => {
        e.preventDefault();
        if (!canEditOrDelete) {
          showToast("التعديل غير مصرح 🔒", "error");
          return;
        }
        if (!editItemData) return;
        const { type, data } = editItemData;
        let path = '';
        let list = [];

        if (type === 'expense') {
          path = 'expenses';
          const qty = parseNum(data.quantity);
          const price = parseNum(data.unitPrice);
          const updatedItem = { ...data, quantity: qty, unitPrice: price, amount: qty * price };
          list = expenses.map(item => item.id === data.id ? updatedItem : item);
          setExpenses(list);
        } else if (type === 'advance') {
          path = 'advances';
          const updatedItem = { ...data, amount: parseNum(data.amount) };
          list = advances.map(item => item.id === data.id ? updatedItem : item);
          setAdvances(list);
        } else if (type === 'extract') {
          path = 'extracts';
          const qty = parseNum(data.quantity);
          const price = parseNum(data.unitPrice);
          const ded = parseNum(data.deductions);
          const totalWork = qty * price;
          const updatedItem = { ...data, quantity: qty, unitPrice: price, deductions: ded, totalWork, net: totalWork - ded };
          list = extracts.map(item => item.id === data.id ? updatedItem : item);
          setExtracts(list);
        } else if (type === 'payment') {
          path = 'payments';
          const updatedItem = { ...data, amount: parseNum(data.amount) };
          list = payments.map(item => item.id === data.id ? updatedItem : item);
          setPayments(list);
        } else if (type === 'supp_payment') {
          path = 'supplier_payments';
          const updatedItem = { ...data, amount: parseNum(data.amount) };
          list = supplierPayments.map(item => item.id === data.id ? updatedItem : item);
          setSupplierPayments(list);
        } else if (type === 'project') {
          path = 'projects';
          const updatedItem = { ...data, budget: parseNum(data.budget) };
          list = projects.map(item => item.id === data.id ? updatedItem : item);
          setProjects(list);
        }

        if (db && path) db.ref(path).set(list);
        setEditItemData(null);
        showToast("تم حفظ التعديلات بنجاح! ✏️");
      };

      // 1. تصدير Excel
      const exportToExcel = () => {
        const wb = XLSX.utils.book_new();
        const wsProjects = XLSX.utils.json_to_sheet(projects); 
        XLSX.utils.book_append_sheet(wb, wsProjects, "المشاريع");
        
        const expensesData = expenses.map(e => ({ 
          'التاريخ': e.date, 'المشروع': e.projectId, 'البند': `${e.mainCategory} - ${e.subCategory}`, 
          'نوع التكلفة': e.costType, 'المورد': e.supplier, 'حالة الفاتورة': e.billStatus || 'مدفوعة', 
          'الكمية': e.quantity, 'سعر الوحدة': e.unitPrice, 'الإجمالي': e.amount, 
          'الوصف': e.description || '-', 'طريقة الدفع': e.paymentMethod, 
          'عهدة الموظف': e.custodyEmployee || '-', 'بواسطة': e.createdBy 
        }));
        const wsExpenses = XLSX.utils.json_to_sheet(expensesData); 
        XLSX.utils.book_append_sheet(wb, wsExpenses, "المصروفات");
        
        const advancesData = advances.map(a => ({ 
          'التاريخ': a.date, 'المشروع': a.projectId, 'الموظف': a.employeeName, 
          'المبلغ': a.amount, 'ملاحظات': a.notes, 'بواسطة': a.createdBy 
        }));
        const wsAdvances = XLSX.utils.json_to_sheet(advancesData); 
        XLSX.utils.book_append_sheet(wb, wsAdvances, "سجل العهد");
        
        const wsExtracts = XLSX.utils.json_to_sheet(extracts); 
        XLSX.utils.book_append_sheet(wb, wsExtracts, "المستخلصات");
        
        const wsPayments = XLSX.utils.json_to_sheet(payments); 
        XLSX.utils.book_append_sheet(wb, wsPayments, "تحصيلات العملاء");
        
        const wsSupplierPay = XLSX.utils.json_to_sheet(supplierPayments); 
        XLSX.utils.book_append_sheet(wb, wsSupplierPay, "دفعات الموردين");
        
        XLSX.writeFile(wb, `MOMOHY_ERP_${todayDate}.xlsx`); 
        showToast("تم تحميل الإكسل بنجاح! 📥");
      };

      // 2. تصدير النسخة الاحتياطية الشاملة JSON
      const exportJsonBackup = () => {
        const fullBackup = {
          projects,
          expenses,
          extracts,
          payments,
          advances,
          supplier_payments: supplierPayments,
          settings,
          roles: userRolesMap,
          exportDate: new Date().toISOString()
        };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(fullBackup, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `Construction_FullBackup_${todayDate}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showToast("تم تحميل ملف النسخة الاحتياطية الكامل (JSON) بنجاح! 💾");
      };

      // 3. استيراد بيانات سابقة (JSON أو Excel)
      const handleImportData = (e) => {
        if (!isAdmin) {
          showToast("استيراد البيانات مقتصر على مدير النظام فقط 🔒", "error");
          return;
        }
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        if (file.name.endsWith('.json')) {
          reader.onload = (evt) => {
            try {
              const parsed = JSON.parse(evt.target.result);
              if (window.confirm("هل أنت متأكد من استيراد ودمج هذه البيانات؟")) {
                if (parsed.projects) setProjects(parsed.projects);
                if (parsed.expenses) setExpenses(parsed.expenses);
                if (parsed.extracts) setExtracts(parsed.extracts);
                if (parsed.payments) setPayments(parsed.payments);
                if (parsed.advances) setAdvances(parsed.advances);
                if (parsed.supplier_payments) setSupplierPayments(parsed.supplier_payments);
                if (parsed.settings) setSettings(parsed.settings);
                if (db) db.ref('/').update(parsed);
                showToast("تم استيراد قاعدة البيانات بنجاح! 📥");
              }
            } catch (err) {
              alert("خطأ في تنسيق ملف الـ JSON!");
            }
          };
          reader.readAsText(file);
        } else if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls') || file.name.endsWith('.csv')) {
          reader.onload = (evt) => {
            try {
              const data = new Uint8Array(evt.target.result);
              const workbook = XLSX.read(data, { type: 'array' });
              const sheetName = workbook.SheetNames[0];
              const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);

              if (rows.length > 0 && window.confirm(`تم العثور على ${rows.length} سجل، هل ترغب بإضافتها للمصروفات؟`)) {
                const mapped = rows.map((r, i) => ({
                  id: Date.now() + i,
                  projectId: cleanId(selectedProjId),
                  date: r['التاريخ'] || r.date || todayDate,
                  mainCategory: r['البند الرئيسي'] || r.mainCategory || 'عام',
                  subCategory: r['البند الفرعي'] || r.subCategory || 'عام',
                  costType: r['نوع التكلفة'] || r.costType || 'مصنعيات',
                  supplier: r['المورد'] || r.supplier || '',
                  quantity: parseNum(r['الكمية'] || r.quantity || 1),
                  unitPrice: parseNum(r['سعر الوحدة'] || r.unitPrice || 0),
                  amount: parseNum(r['الإجمالي'] || r.amount || 0),
                  billStatus: r['حالة الفاتورة'] || 'مدفوعة',
                  paymentMethod: r['طريقة الدفع'] || 'كاش',
                  description: r['الوصف'] || r.description || 'مستورد من إكسيل',
                  createdBy: user.name
                }));
                const updated = [...mapped, ...expenses];
                setExpenses(updated);
                if (db) db.ref('expenses').set(updated);
                showToast(`تم استيراد ${rows.length} حركة مصروفات بنجاح! 📥`);
              }
            } catch (err) {
              alert("تعذر قراءة ملف الإكسيل!");
            }
          };
          reader.readAsArrayBuffer(file);
        }
      };

      // إدارة الأدوار والصلاحيات
      const [newRoleInput, setNewRoleInput] = useState({ email: "", role: "engineer" });
      const handleSaveRole = (e) => {
        e.preventDefault();
        if (!isAdmin) return;
        const cleanEmail = newRoleInput.email.trim().toLowerCase();
        if (!cleanEmail) return;
        const key = cleanEmail.replace(/\./g, '_');
        const updated = { ...userRolesMap, [key]: newRoleInput.role };
        setUserRolesMap(updated);
        if (db) db.ref('roles').set(updated);
        setNewRoleInput({ email: "", role: "engineer" });
        showToast(`تم تعيين صلاحية (${newRoleInput.role}) بنجاح! 🛡️`);
      };

      if (loading) {
        return (
          <div class="min-h-screen flex flex-col items-center justify-center bg-slate-900 text-white">
            <div class="text-3xl animate-bounce mb-2">☁️</div>
            <h1 class="text-base font-bold">جاري تحميل البيانات...</h1>
          </div>
        );
      }

      const currentProj = projects.find(p => cleanId(p.id) === cleanId(selectedProjId)) || projects[0] || {};
      const projExpenses = expenses.filter(e => cleanId(e.projectId) === cleanId(currentProj.id));
      const projExtracts = extracts.filter(e => cleanId(e.projectId) === cleanId(currentProj.id));
      const projPayments = payments.filter(p => cleanId(p.projectId) === cleanId(currentProj.id));
      const projAdvances = advances.filter(a => cleanId(a.projectId) === cleanId(currentProj.id));
      const projSuppPayments = supplierPayments.filter(p => cleanId(p.projectId) === cleanId(currentProj.id));

      const totalWorkNet = projExtracts.reduce((sum, item) => sum + parseNum(item.net), 0);
      const totalCost = projExpenses.reduce((sum, item) => sum + parseNum(item.amount), 0);
      const totalReceived = projPayments.reduce((sum, item) => sum + parseNum(item.amount), 0);
      const netProfit = totalWorkNet - totalCost;

      const projDirectCashExp = projExpenses.filter(e => e.paymentMethod !== 'خصم من العهدة' && (e.billStatus || 'مدفوعة') === 'مدفوعة').reduce((sum, e) => sum + parseNum(e.amount), 0);
      const projTotalAdvancesGiven = projAdvances.reduce((sum, a) => sum + parseNum(a.amount), 0);
      const projTotalSuppPaid = projSuppPayments.reduce((sum, p) => sum + parseNum(p.amount), 0);
      const centralCashRemaining = totalReceived - projDirectCashExp - projTotalAdvancesGiven - projTotalSuppPaid;

      const allEmpCustodyBalance = settings.employees.reduce((acc, emp) => {
        const adv = projAdvances.filter(a => a.employeeName === emp).reduce((sum, a) => sum + parseNum(a.amount), 0);
        const spent = projExpenses.filter(e => e.paymentMethod === 'خصم من العهدة' && e.custodyEmployee === emp).reduce((sum, e) => sum + parseNum(e.amount), 0);
        return acc + Math.max(0, adv - spent);
      }, 0);

      const projBudget = parseNum(currentProj.budget);
      const budgetConsumedPercent = projBudget > 0 ? Math.min(Math.round((totalCost / projBudget) * 100), 100) : 0;

      const allWork = extracts.reduce((sum, item) => sum + parseNum(item.totalWork), 0);
      const allExp = expenses.reduce((sum, item) => sum + parseNum(item.amount), 0);
      const allPay = payments.reduce((sum, item) => sum + parseNum(item.amount), 0);

      const projExpMap = {};
      projExpenses.forEach(e => { 
        const cat = e.mainCategory || 'غير محدد'; 
        projExpMap[cat] = (projExpMap[cat] || 0) + parseNum(e.amount); 
      });
      const projExpLabels = Object.keys(projExpMap);
      const projExpData = Object.values(projExpMap);

      const filteredSearchExpenses = projExpenses.filter(e => { 
        return (searchMainCat === "" || e.mainCategory === searchMainCat) && 
               (searchSubCat === "" || e.subCategory === searchSubCat) && 
               (searchCostType === "" || e.costType === searchCostType); 
      });
      const filteredSearchTotal = filteredSearchExpenses.reduce((s, e) => s + parseNum(e.amount), 0);

      const allSupplierNames = Array.from(new Set([
        ...settings.suppliers,
        ...expenses.map(e => e.supplier).filter(Boolean),
        ...supplierPayments.map(p => p.supplier).filter(Boolean)
      ])).map(s => s.trim()).filter(Boolean);

      const cleanSuppliersList = Array.from(new Set(allSupplierNames));

      const suppliersLedger = cleanSuppliersList.map(supp => {
        const targetExp = suppScope === "project" ? projExpenses : expenses;
        const targetSuppPay = suppScope === "project" ? projSuppPayments : supplierPayments;

        const allInvoices = targetExp.filter(e => (e.supplier || '').trim() === supp);
        const totalPurchases = allInvoices.reduce((sum, e) => sum + parseNum(e.amount), 0);

        const creditPurchases = allInvoices
          .filter(e => (e.billStatus || 'مدفوعة') === 'آجلة')
          .reduce((sum, e) => sum + parseNum(e.amount), 0);

        const paidPurchases = totalPurchases - creditPurchases;
        const totalPaidToCreditor = targetSuppPay
          .filter(p => (p.supplier || '').trim() === supp)
          .reduce((sum, p) => sum + parseNum(p.amount), 0);

        const balance = totalPaidToCreditor - creditPurchases;

        return { 
          name: supp, 
          totalPurchases, 
          creditPurchases, 
          paidPurchases, 
          totalPaid: totalPaidToCreditor, 
          balance 
        };
      }).filter(s => s.totalPurchases > 0 || s.totalPaid > 0);

      const getCustodyStats = (empName) => {
        const empAdv = projAdvances.filter(a => a.employeeName === empName).reduce((sum, a) => sum + parseNum(a.amount), 0);
        const empExp = projExpenses.filter(e => e.paymentMethod === 'خصم من العهدة' && e.custodyEmployee === empName).reduce((sum, e) => sum + parseNum(e.amount), 0);
        return { received: empAdv, spent: empExp, balance: empAdv - empExp };
      };

      const activeEmployeesCustody = settings.employees.map(emp => ({ name: emp, ...getCustodyStats(emp) })).filter(s => s.received > 0 || s.spent > 0);

      // التبويبات المتاحة حسب الصلاحية
      const navTabs = [
        ...(isAdmin ? [{ id: "dashboard", label: "لوحة التحكم", icon: "📊" }] : [{ id: "my_custody", label: "لوحة عهدتي", icon: "💼" }]),
        { id: "projects", label: "المشاريع", icon: "📁" },
        { id: "advances", label: "العهدة", icon: "💵" },
        { id: "add_data", label: "إدخال", icon: "➕" },
        ...(isAdmin || isAccountant ? [{ id: "payments", label: "الدفعات", icon: "💰" }] : []),
        { id: "expenses", label: "المصاريف", icon: "💸" },
        ...(isAdmin || isAccountant ? [{ id: "suppliers", label: "حساب الموردين", icon: "🚚" }] : []),
        ...(isAdmin ? [{ id: "statement", label: "كشف الحساب", icon: "📑" }] : []),
        ...(isAdmin || isAccountant ? [{ id: "extracts", label: "المستخلصات", icon: "📄" }] : []),
        ...(isAdmin ? [{ id: "audit_log", label: "الدخول", icon: "🛡️" }] : []),
        { id: "settings", label: "الإعدادات", icon: "⚙️" }
      ];

      return (
        <div class="min-h-screen pb-24 md:pb-10">
          <header class="bg-slate-900 text-white shadow-md sticky top-0 z-30 print-hidden border-b border-slate-800">
            <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
              <div class="flex items-center gap-2.5">
                <span class="text-2xl p-1 bg-blue-600/30 rounded-xl">🏗️</span>
                <div>
                  <h1 class="text-sm sm:text-base font-black leading-tight">إدارة المعاملات الإنشائية</h1>
                  <div class="text-[11px] text-slate-300 flex items-center gap-1.5 mt-0.5">
                    <span class="truncate max-w-[130px] sm:max-w-none">{user.name}</span>
                    <span class={`border px-1.5 py-0.2 rounded font-bold text-[10px] ${
                      isAdmin ? 'bg-amber-500/20 text-amber-300 border-amber-500/30' :
                      isAccountant ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30' :
                      'bg-blue-500/20 text-blue-300 border-blue-500/30'
                    }`}>
                      {userRoleTitle}
                    </span>
                  </div>
                </div>
              </div>
              <div class="flex items-center gap-2">
                <button onClick={toggleTheme} class="p-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs border border-slate-700 transition" title="تبديل الوضع الليلي">
                  {theme === 'dark' ? '☀️' : '🌙'}
                </button>
                <a href="/survey.html" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded-xl font-bold flex items-center gap-1 shadow-sm transition">
                  📐 <span class="hidden sm:inline">قطاع المساحة</span>
                </a>
                <button onClick={exportToExcel} class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-1.5 rounded-xl font-bold flex items-center gap-1 shadow-sm transition">
                  📤 <span class="hidden sm:inline">تصدير</span>
                </button>
                <button onClick={() => setDrawerOpen(true)} class="bg-slate-800 hover:bg-slate-700 p-2 rounded-xl text-slate-200 border border-slate-700 text-sm">
                  ☰
                </button>
              </div>
            </div>

            <div class="hidden md:flex bg-slate-800/90 border-t border-slate-700 px-4 py-1.5 overflow-x-auto scrollbar-hide gap-1 text-xs">
              {navTabs.map(t => (
                <button 
                  key={t.id} 
                  onClick={() => setActiveTab(t.id)} 
                  class={`px-3 py-1.5 rounded-lg font-bold whitespace-nowrap transition ${activeTab === t.id ? "bg-blue-600 text-white shadow" : "text-slate-300 hover:bg-slate-700"}`}
                >
                  {t.icon} {t.label}
                </button>
              ))}
            </div>
          </header>

          {drawerOpen && (
            <div class="fixed inset-0 z-50 flex">
              <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs transition-opacity" onClick={() => setDrawerOpen(false)}></div>
              <div class="relative w-72 max-w-[80%] bg-slate-900 text-white h-full shadow-2xl z-50 p-5 flex flex-col justify-between">
                <div>
                  <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-4">
                    <span class="font-black text-sm">قائمة النظام الإداري</span>
                    <button onClick={() => setDrawerOpen(false)} class="text-slate-400 hover:text-white text-lg">✕</button>
                  </div>
                  <nav class="space-y-1.5 text-xs font-bold">
                    {navTabs.map(item => (
                      <button 
                        key={item.id} 
                        onClick={() => { setActiveTab(item.id); setDrawerOpen(false); }} 
                        class={`w-full text-right p-3 rounded-xl transition flex items-center justify-between ${activeTab === item.id ? "bg-blue-600 text-white font-black" : "text-slate-300 hover:bg-slate-800"}`}
                      >
                        <span>{item.icon} {item.label}</span>
                        {activeTab === item.id && <span>•</span>}
                      </button>
                    ))}
                  </nav>
                </div>
                <div class="pt-4 border-t border-slate-800">
                  <button onClick={handleLogout} class="w-full bg-rose-600/20 text-rose-400 border border-rose-500/30 hover:bg-rose-600 hover:text-white py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2">
                    🚪 تسجيل الخروج
                  </button>
                </div>
              </div>
            </div>
          )}

          {["dashboard", "projects", "advances", "add_data", "payments", "expenses", "suppliers", "statement", "extracts", "my_custody"].includes(activeTab) && (
            <div class="print-hidden max-w-7xl mx-auto px-4 mt-3.5">
              <div class="bg-white dark:bg-slate-800 p-3.5 rounded-2xl shadow-sm border border-slate-200/90 dark:border-slate-700 flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3 text-xs">
                <div class="flex flex-col sm:flex-row sm:items-center gap-2">
                  <span class="font-extrabold text-slate-700 dark:text-slate-300 whitespace-nowrap">المشروع النشط:</span>
                  <div class="relative w-full sm:w-64">
                    <select 
                      value={selectedProjId} 
                      onChange={(e) => setSelectedProjId(e.target.value)} 
                      class="w-full bg-slate-100 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 font-extrabold text-blue-900 dark:text-blue-300 rounded-xl px-3 py-2 outline-none appearance-none focus:ring-2 focus:ring-blue-500"
                    >
                      {projects.map(p => <option key={p.id} value={p.id}>{p.id} - {p.name}</option>)}
                    </select>
                    <div class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs">▼</div>
                  </div>
                </div>
                <div class="grid grid-cols-2 sm:flex sm:items-center gap-2 sm:gap-4 bg-slate-50 dark:bg-slate-700/50 md:bg-transparent p-2.5 md:p-0 rounded-xl text-slate-600 dark:text-slate-300 text-[11px] sm:text-xs">
                  <div>العميل: <strong class="text-slate-900 dark:text-white block sm:inline font-bold">{currentProj.name || '-'}</strong></div>
                  <div>الموقع: <strong class="text-slate-900 dark:text-white block sm:inline font-bold">{currentProj.location || '-'}</strong></div>
                </div>
              </div>
            </div>
          )}

          <main class="max-w-7xl mx-auto px-4 mt-3.5">
            {/* 1. لوحة التحكم (خاصة بالإدارة) */}
            {activeTab === "dashboard" && isAdmin && (
              <div class="space-y-4">
                {projBudget > 0 && (
                  <div class="bg-white dark:bg-slate-800 p-3.5 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm text-xs">
                    <div class="flex justify-between items-center mb-1.5 font-bold">
                      <span class="text-slate-700 dark:text-slate-300">ميزانية المشروع: {(projBudget).toLocaleString()} ج.م</span>
                      <span class={budgetConsumedPercent > 90 ? "text-rose-600" : "text-blue-700 dark:text-blue-400"}>{budgetConsumedPercent}% مستهلك</span>
                    </div>
                    <div class="w-full bg-slate-100 dark:bg-slate-700 rounded-full h-2.5 overflow-hidden">
                      <div class={`h-2.5 rounded-full transition-all duration-500 ${budgetConsumedPercent > 90 ? "bg-rose-500" : "bg-blue-600"}`} style={{ width: `${budgetConsumedPercent}%` }}></div>
                    </div>
                  </div>
                )}

                <DashboardCharts allWork={allWork} allExp={allExp} allPay={allPay} projExpLabels={projExpLabels} projExpData={projExpData} projName={currentProj.name || 'المشروع'} />

                <div class="grid grid-cols-2 lg:grid-cols-6 gap-3 text-xs">
                  <div class="bg-white dark:bg-slate-800 p-3 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                    <span class="text-[10px] text-slate-500 dark:text-slate-400 font-bold block">المستخلصات (الصافي)</span>
                    <div class="text-sm font-black text-slate-800 dark:text-white mt-1">{totalWorkNet.toLocaleString()} ج.م</div>
                  </div>
                  <div class="bg-white dark:bg-slate-800 p-3 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                    <span class="text-[10px] text-slate-500 dark:text-slate-400 font-bold block">إجمالي التحصيلات</span>
                    <div class="text-sm font-black text-emerald-600 mt-1">{totalReceived.toLocaleString()} ج.م</div>
                  </div>
                  <div class="bg-white dark:bg-slate-800 p-3 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                    <span class="text-[10px] text-slate-500 dark:text-slate-400 font-bold block">المصروفات الفعلية</span>

            </div>
          )}

          {/* نافذة التعديل المنبثقة الموحدة */}
          {editItemData && canEditOrDelete && (
            <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div class="bg-white dark:bg-slate-800 rounded-3xl p-5 w-full max-w-lg shadow-2xl border dark:border-slate-700 text-xs max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-center border-b dark:border-slate-700 pb-3 mb-3">
                  <h3 class="font-bold text-sm text-slate-800 dark:text-white">
                    ✏️ تعديل {
                      editItemData.type === 'expense' ? 'فاتورة مصروف' : 
                      editItemData.type === 'advance' ? 'سلفة / عهدة' : 
                      editItemData.type === 'extract' ? 'مستخلص أعمال' : 
                      editItemData.type === 'payment' ? 'تحصيل دفعة عميل' :
                      editItemData.type === 'project' ? 'بيانات المشروع' :
                      'دفعة مورد'
                    }
                  </h3>
                  <button onClick={() => setEditItemData(null)} class="bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 rounded-full w-8 h-8 flex items-center justify-center font-bold transition">✕</button>
                </div>

                <form onSubmit={handleSaveEditedItem} class="space-y-3">
                  {editItemData.type === 'expense' && (
                    <>
                      <div class="grid grid-cols-2 gap-2">
                        <div>
                          <label class="block font-bold mb-1">التاريخ</label>
                          <input type="date" value={editItemData.data.date} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, date: e.target.value}})} class="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-700" required/>
                        </div>
                        <div>
                          <label class="block font-bold mb-1">المورد</label>
                          <select value={editItemData.data.supplier} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, supplier: e.target.value}})} class="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-700">
                            <option value="">اختر...</option>
                            {settings.suppliers.map(s=><option key={s}>{s}</option>)}
                          </select>
                        </div>
                      </div>

                      <div class="grid grid-cols-2 gap-2">
                        <div>
                          <label class="block font-bold mb-1 text-indigo-700 dark:text-indigo-400">حالة الفاتورة</label>
                          <select value={editItemData.data.billStatus || 'مدفوعة'} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, billStatus: e.target.value}})} class="w-full border-2 border-indigo-200 dark:border-slate-600 bg-indigo-50 dark:bg-slate-700 p-2 rounded-xl font-bold">
                            <option value="مدفوعة">✅ مسددة (لا دين)</option>
                            <option value="آجلة">⏳ آجلة (مديونية)</option>
                          </select>
                        </div>
                        <div>
                          <label class="block font-bold mb-1">طريقة الدفع</label>
                          <select value={editItemData.data.paymentMethod} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, paymentMethod: e.target.value}})} class="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-700">
                            <option value="خصم من العهدة">خصم من العهدة</option>
                            <option value="كاش">كاش</option>
                            <option value="تحويل بنكي">تحويل بنكي</option>
                          </select>
                        </div>
                      </div>

                      <div class="grid grid-cols-2 gap-2">
                        <div>
                          <label class="block font-bold mb-1">الكمية</label>
                          <input type="number" step="any" value={editItemData.data.quantity} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, quantity: e.target.value}})} class="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-700" required/>
                        </div>
                        <div>
                          <label class="block font-bold mb-1">سعر الوحدة</label>
                          <input type="number" step="any" value={editItemData.data.unitPrice} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, unitPrice: e.target.value}})} class="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-700" required/>
                        </div>
                      </div>

                      <div>
                        <label class="block font-bold mb-1">البيان / الوصف</label>
                        <input type="text" value={editItemData.data.description || ''} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, description: e.target.value}})} class="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-700"/>
                      </div>
                    </>
                  )}

                  {editItemData.type === 'advance' && (
                    <>
                      <div>
                        <label class="block font-bold mb-1">التاريخ</label>
                        <input type="date" value={editItemData.data.date} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, date: e.target.value}})} class="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-700" required/>
                      </div>
                      <div>
                        <label class="block font-bold mb-1">اسم الموظف</label>
                        <select value={editItemData.data.employeeName} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, employeeName: e.target.value}})} class="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-700" required>
                          <option value="">اختر...</option>
                          {settings.employees.map(c => <option key={c}>{c}</option>)}
                        </select>
                      </div>
                      <div>
                        <label class="block font-bold mb-1">المبلغ (ج.م)</label>
                        <input type="number" step="any" value={editItemData.data.amount} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, amount: e.target.value}})} class="w-full border dark:border-slate-600 p-2 rounded-xl font-bold text-emerald-700 dark:bg-slate-700" required/>
                      </div>
                      <div>
                        <label class="block font-bold mb-1">البيان / ملاحظات</label>
                        <input type="text" value={editItemData.data.notes || ''} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, notes: e.target.value}})} class="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-700"/>
                      </div>
                    </>
                  )}

                  {editItemData.type === 'extract' && (
                    <>
                      <div class="grid grid-cols-2 gap-2">
                        <div>
                          <label class="block font-bold mb-1">التاريخ</label>
                          <input type="date" value={editItemData.data.date} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, date: e.target.value}})} class="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-700" required/>
                        </div>
                        <div>
                          <label class="block font-bold mb-1">رقم المستخلص</label>
                          <input type="text" value={editItemData.data.extractNo} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, extractNo: e.target.value}})} class="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-700" required/>
                        </div>
                      </div>
                      <div>
                        <label class="block font-bold mb-1">توصيف الأعمال</label>
                        <input type="text" value={editItemData.data.workDescription} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, workDescription: e.target.value}})} class="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-700" required/>
                      </div>
                      <div class="grid grid-cols-2 gap-2">
                        <div>
                          <label class="block font-bold mb-1">الكمية</label>
                          <input type="number" step="any" value={editItemData.data.quantity} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, quantity: e.target.value}})} class="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-700" required/>
                        </div>
                        <div>
                          <label class="block font-bold mb-1">الفئة (السعر)</label>
                          <input type="number" step="any" value={editItemData.data.unitPrice} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, unitPrice: e.target.value}})} class="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-700" required/>
                        </div>
                      </div>
                      <div>
                        <label class="block font-bold mb-1">الاستقطاعات (ج.م)</label>
                        <input type="number" step="any" value={editItemData.data.deductions} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, deductions: e.target.value}})} class="w-full border dark:border-slate-600 p-2 rounded-xl text-rose-600 dark:bg-slate-700"/>
                      </div>
                    </>
                  )}

                  {editItemData.type === 'payment' && (
                    <>
                      <div>
                        <label class="block font-bold mb-1">التاريخ</label>
                        <input type="date" value={editItemData.data.date} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, date: e.target.value}})} class="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-700" required/>
                      </div>
                      <div>
                        <label class="block font-bold mb-1">المبلغ (ج.م)</label>
                        <input type="number" step="any" value={editItemData.data.amount} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, amount: e.target.value}})} class="w-full border dark:border-slate-600 p-2 rounded-xl font-bold text-emerald-600 dark:bg-slate-700" required/>
                      </div>
                      <div>
                        <label class="block font-bold mb-1">البيان / الملاحظات</label>
                        <input type="text" value={editItemData.data.notes || ''} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, notes: e.target.value}})} class="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-700"/>
                      </div>
                    </>
                  )}

                  {editItemData.type === 'supp_payment' && (
                    <>
                      <div>
                        <label class="block font-bold mb-1">التاريخ</label>
                        <input type="date" value={editItemData.data.date} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, date: e.target.value}})} class="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-700" required/>
                      </div>
                      <div>
                        <label class="block font-bold mb-1">المورد</label>
                        <select value={editItemData.data.supplier} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, supplier: e.target.value}})} class="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-700" required>
                          <option value="">اختر...</option>
                          {settings.suppliers.map(s => <option key={s}>{s}</option>)}
                        </select>
                      </div>
                      <div>
                        <label class="block font-bold mb-1">المبلغ المسدد (ج.م)</label>
                        <input type="number" step="any" value={editItemData.data.amount} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, amount: e.target.value}})} class="w-full border dark:border-slate-600 p-2 rounded-xl font-bold text-emerald-600 dark:bg-slate-700" required/>
                      </div>
                      <div>
                        <label class="block font-bold mb-1">البيان / الإيصال</label>
                        <input type="text" value={editItemData.data.notes || ''} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, notes: e.target.value}})} class="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-700"/>
                      </div>
                    </>
                  )}

                  {editItemData.type === 'project' && (
                    <>
                      <div>
                        <label class="block font-bold mb-1">اسم المالك / العميل</label>
                        <input type="text" value={editItemData.data.name} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, name: e.target.value}})} class="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-700" required/>
                      </div>
                      <div class="grid grid-cols-2 gap-2">
                        <div>
                          <label class="block font-bold mb-1">المكتب الاستشاري</label>
                          <input type="text" value={editItemData.data.consultant || ''} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, consultant: e.target.value}})} class="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-700"/>
                        </div>
                        <div>
                          <label class="block font-bold mb-1">الموقع</label>
                          <input type="text" value={editItemData.data.location || ''} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, location: e.target.value}})} class="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-700"/>
                        </div>
                      </div>
                      <div class="grid grid-cols-2 gap-2">
                        <div>
                          <label class="block font-bold mb-1">الميزانية التقديرية</label>
                          <input type="number" step="any" value={editItemData.data.budget} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, budget: e.target.value}})} class="w-full border dark:border-slate-600 p-2 rounded-xl font-bold text-blue-700 dark:bg-slate-700"/>
                        </div>
                        <div>
                          <label class="block font-bold mb-1">الحالة</label>
                          <select value={editItemData.data.status || 'جاري العمل'} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, status: e.target.value}})} class="w-full border dark:border-slate-600 p-2 rounded-xl dark:bg-slate-700">
                            <option value="جاري العمل">جاري العمل</option>
                            <option value="تم التسليم">تم التسليم</option>
                            <option value="متوقف">متوقف</option>
                          </select>
                        </div>
                      </div>
                    </>
                  )}

                  <div class="flex gap-2 pt-2 border-t dark:border-slate-700 mt-4">
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl shadow transition">تأكيد وحفظ التعديلات</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* شريط التنقل السفلي للهواتف الذكية */}
          <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white/95 dark:bg-slate-800/95 backdrop-blur-md border-t border-slate-200/80 dark:border-slate-700 shadow-lg z-40 px-2 py-1.5 flex justify-around items-center">
            {navTabs.slice(0, 4).map(tab => (
              <button 
                key={tab.id} 
                onClick={() => setActiveTab(tab.id)} 
                class={`flex flex-col items-center justify-center py-1 px-2.5 rounded-xl transition duration-200 ${activeTab === tab.id ? "text-blue-600 dark:text-blue-400 font-black scale-105" : "text-slate-400 hover:text-slate-600"}`}
              >
                <span class="text-base">{tab.icon}</span>
                <span class="text-[10px] mt-0.5">{tab.label}</span>
              </button>
            ))}
            <button 
              onClick={() => setDrawerOpen(true)} 
              class="flex flex-col items-center justify-center py-1 px-2.5 text-slate-400 hover:text-slate-600"
            >
              <span class="text-base">☰</span>
              <span class="text-[10px] mt-0.5">المزيد</span>
            </button>
          </nav>

          {/* نافذة التنبيهات التفاعلية */}
          {toast.show && (
            <div class="fixed bottom-20 md:bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none toast-anim">
              <div class={`px-4 py-2.5 rounded-2xl shadow-xl border flex items-center gap-2.5 text-xs font-bold text-white ${toast.type === 'error' ? 'bg-rose-600 border-rose-500' : 'bg-slate-900 border-slate-800'}`}>
                <span>{toast.type === 'error' ? '⚠️' : '✅'}</span>
                <span>{toast.message}</span>
              </div>
            </div>
          )}

          {/* نافذة معاينة الفاتورة */}
          {activeInvoiceModal && (
            <div class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
              <div class="bg-white dark:bg-slate-800 p-4 rounded-3xl max-w-lg w-full flex flex-col items-center shadow-2xl">
                <h4 class="font-bold mb-3 text-xs text-slate-800 dark:text-white">صورة الفاتورة المرفقة</h4>
                <img src={activeInvoiceModal} class="max-h-[65vh] object-contain rounded-2xl border dark:border-slate-700 mb-4 w-full" />
                <button onClick={()=>setActiveInvoiceModal(null)} class="w-full bg-slate-900 dark:bg-slate-700 hover:bg-black text-white font-bold py-2.5 rounded-2xl text-xs transition">إغلاق المعاينة</button>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
