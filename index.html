  <!-- Service Worker مدمج وآمن بالكامل لمنع ظهور شاشة You're offline ولضمان العمل بدون إنترنت -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          const CACHE_NAME = 'construction-erp-v5';
          self.addEventListener('install', (e) => { self.skipWaiting(); });
          self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });
          self.addEventListener('fetch', (e) => {
            if (e.request.method !== 'GET') return;
            e.respondWith(
              caches.match(e.request).then((cachedResponse) => {
                if (cachedResponse) return cachedResponse;
                return fetch(e.request).then((networkResponse) => {
                  if (networkResponse && networkResponse.status === 200) {
                    const responseClone = networkResponse.clone();
                    caches.open(CACHE_NAME).then((cache) => cache.put(e.request, responseClone));
                  }
                  return networkResponse;
                }).catch(() => caches.match(e.request));
              })
            );
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch((err) => console.log('SW init error:', err));
      });
    }
  </script>

        const queue = this.get('offline_sync_queue', []);
        queue.push({ id: Date.now(), path, data });
        this.set('offline_sync_queue', queue);
      },
      syncQueue(databaseInstance) {
        if (!navigator.onLine || !databaseInstance) return;
        const queue = this.get('offline_sync_queue', []);

        localStorage.removeItem('construction_offline_sync_queue');

        if (!isAdmin) return showToast("خاصية الإضافة وتعديل الإعدادات لمدير النظام فقط 🔒", "error");
        const newVal = window.prompt(`أدخل [${title}] جديد لإضافته فوراً للقائمة:`, "");
        if (newVal && newVal.trim() !== "") {
          const cleanVal = newVal.trim();
          if (currentArray.includes(cleanVal)) return showToast(`هذا البند موجود مسبقاً!`, "error");
          const updatedArray = [...currentArray, cleanVal];
          const newSettings = { ...settings, [settingKey]: updatedArray };
          setSettings(newSettings);
          saveSafeConstructionData(`settings/${settingKey}`, 'settings', newSettings);
          showToast(`تم إضافة "${cleanVal}" للقائمة بنجاح!`);
        }
      };

      const handleGoogleLogin = () => { 
        setLoginError(""); 
        const provider = new firebase.auth.GoogleAuthProvider(); 
        auth.signInWithPopup(provider).catch((error) => { setLoginError("تعذر الدخول بجوجل: " + error.message); }); 
      };

      const setupRecaptcha = () => { 
        if (!window.recaptchaVerifier) window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { 'size': 'invisible' }); 
      };

      const handleSendOtp = (e) => {
        e.preventDefault(); 
        setLoginError(""); 
        setupRecaptcha(); 
        let formattedPhone = phoneNumber; 
        if (formattedPhone.startsWith("01")) formattedPhone = "+20" + formattedPhone.substring(1);
        auth.signInWithPhoneNumber(formattedPhone, window.recaptchaVerifier)
          .then((confirmationResult) => { window.confirmationResult = confirmationResult; setVerificationId(true); showToast("تم إرسال كود التحقق 📩"); })
          .catch(() => { setLoginError("تعذر إرسال الرمز. يرجى مراجعة رقم الهاتف."); if(window.recaptchaVerifier) window.recaptchaVerifier.render().then(id => grecaptcha.reset(id)); });
      };

      const handleVerifyOtp = (e) => { 
        e.preventDefault(); 
        setLoginError(""); 
        window.confirmationResult.confirm(otpCode).catch(() => { setLoginError("الرمز غير صحيح."); }); 
      };

      const handleLogout = () => { 
        auth.signOut(); 
        setLoginMethod("choose"); 
        setVerificationId(null); 
        setDrawerOpen(false); 
      };

      const handleReceiptUpload = (e) => {
        const file = e.target.files && e.target.files[0]; 
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => { setNewExp(prev => ({ ...prev, receiptImg: evt.target.result })); showToast("تم إرفاق صورة الفاتورة 📸"); };
        reader.readAsDataURL(file);
      };

      const deleteItem = (path, id, list) => {
        if (!isAdmin && !isAccountant) return showToast("الحذف مصرح لمدير النظام والمحاسب فقط 🔒", "error");
        if (window.confirm("هل أنت متأكد من الحذف نهائياً؟")) {
          const newList = list.filter(item => item.id !== id);
          saveSafeConstructionData(path, path, newList);
          if (path === 'expenses') setExpenses(newList); 
          if (path === 'extracts') setExtracts(newList); 
          if (path === 'payments') setPayments(newList); 
          if (path === 'projects') setProjects(newList); 
          if (path === 'advances') setAdvances(newList); 
          if (path === 'supplier_payments') setSupplierPayments(newList);
          showToast("تم الحذف بنجاح! 🗑");
        }
      };

      const handleSaveEditedItem = (e) => {
        e.preventDefault();
        if (!canEditOrDelete) return showToast("التعديل غير مصرح 🔒", "error");
        if (!editItemData) return;
        const { type, data } = editItemData;
        let path = ''; let list = [];

        if (type === 'expense') {
          path = 'expenses';
          const qty = parseNum(data.quantity); const price = parseNum(data.unitPrice);
          const updatedItem = { ...data, quantity: qty, unitPrice: price, amount: qty * price };
          list = expenses.map(item => item.id === data.id ? updatedItem : item);
          setExpenses(list);
        } else if (type === 'advance') {
          path = 'advances';
          const updatedItem = { ...data, amount: parseNum(data.amount) };
          list = advances.map(item => item.id === data.id ? updatedItem : item);
          setAdvances(list);
        } else if (type === 'extract') {
          path = 'extracts';
          const qty = parseNum(data.quantity); const price = parseNum(data.unitPrice); const ded = parseNum(data.deductions);
          const totalWork = qty * price;
          const updatedItem = { ...data, quantity: qty, unitPrice: price, deductions: ded, totalWork, net: totalWork - ded };
          list = extracts.map(item => item.id === data.id ? updatedItem : item);
          setExtracts(list);
        } else if (type === 'payment') {
          path = 'payments';
          const updatedItem = { ...data, amount: parseNum(data.amount) };
          list = payments.map(item => item.id === data.id ? updatedItem : item);
          setPayments(list);
        } else if (type === 'supp_payment') {
          path = 'supplier_payments';
          const updatedItem = { ...data, amount: parseNum(data.amount) };
          list = supplierPayments.map(item => item.id === data.id ? updatedItem : item);
          setSupplierPayments(list);
        } else if (type === 'project') {
          path = 'projects';
          const updatedItem = { ...data, budget: parseNum(data.budget) };
          list = projects.map(item => item.id === data.id ? updatedItem : item);
          setProjects(list);
        }

        if (path) saveSafeConstructionData(path, path, list);
        setEditItemData(null);
        showToast("تم حفظ التعديلات بنجاح! ✏️");
      };

      const exportToExcel = () => {
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(projects), "المشاريع");
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(expenses.map(e => ({ 'التاريخ': e.date, 'المشروع': e.projectId, 'البند': `${e.mainCategory} - ${e.subCategory}`, 'الإجمالي': e.amount, 'الحالة': e.billStatus || 'مدفوعة' }))), "المصروفات");
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(extracts), "المستخلصات");
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(payments), "التحصيلات");
        XLSX.writeFile(wb, `MOMOHY_ERP_${todayDate}.xlsx`); 
        showToast("تم تحميل الإكسل بنجاح! 📥");
      };

      const exportJsonBackup = () => {
        const fullBackup = { projects, expenses, extracts, payments, advances, supplier_payments: supplierPayments, settings, roles: userRolesMap, exportDate: new Date().toISOString() };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(fullBackup, null, 2));
        const a = document.createElement('a'); a.setAttribute("href", dataStr); a.setAttribute("download", `Construction_FullBackup_${todayDate}.json`);
        document.body.appendChild(a); a.click(); a.remove();
        showToast("تم تحميل النسخة الاحتياطية الكاملة (JSON) بنجاح! 💾");
      };

      const handleImportData = (e) => {
        if (!isAdmin) return showToast("استيراد البيانات مقتصر على مدير النظام فقط 🔒", "error");
        const file = e.target.files && e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        if (file.name.endsWith('.json')) {
          reader.onload = (evt) => {
            try {
              const parsed = JSON.parse(evt.target.result);
              if (window.confirm("هل أنت متأكد من استيراد ودمج هذه البيانات؟")) {
                if (parsed.projects) setProjects(parsed.projects);
                if (parsed.expenses) setExpenses(parsed.expenses);
                if (parsed.extracts) setExtracts(parsed.extracts);
                if (parsed.payments) setPayments(parsed.payments);
                if (db && navigator.onLine) db.ref('/').update(parsed);
                showToast("تم استيراد قاعدة البيانات بنجاح! 📥");
              }
            } catch (err) { alert("خطأ في تنسيق ملف الـ JSON!"); }
          };
          reader.readAsText(file);
        }
      };

      const [newRoleInput, setNewRoleInput] = useState({ email: "", role: "engineer" });
      const handleSaveRole = (e) => {
        e.preventDefault();
        if (!isAdmin) return;
        const cleanEmail = newRoleInput.email.trim().toLowerCase();
        if (!cleanEmail) return;
        const key = cleanEmail.replace(/\./g, '_');
        const updated = { ...userRolesMap, [key]: newRoleInput.role };
        setUserRolesMap(updated);
        saveSafeConstructionData('roles', 'roles', updated);
        setNewRoleInput({ email: "", role: "engineer" });
        showToast(`تم تعيين صلاحية (${newRoleInput.role}) بنجاح! 🛡️`);
      };

      if (loading) {
        return (
          <div class="min-h-screen flex flex-col items-center justify-center bg-slate-900 text-white">
            <div class="text-3xl animate-bounce mb-2">☁️</div>
            <h1 class="text-base font-bold">جاري تحميل البيانات...</h1>
          </div>
        );
      }

      const currentProj = projects.find(p => cleanId(p?.id) === cleanId(selectedProjId)) || projects[0] || {};
      const projExpenses = expenses.filter(e => cleanId(e?.projectId) === cleanId(currentProj?.id));
      const projExtracts = extracts.filter(e => cleanId(e?.projectId) === cleanId(currentProj?.id));
      const projPayments = payments.filter(p => cleanId(p?.projectId) === cleanId(currentProj?.id));
      const projAdvances = advances.filter(a => cleanId(a?.projectId) === cleanId(currentProj?.id));
      const projSuppPayments = supplierPayments.filter(p => cleanId(p?.projectId) === cleanId(currentProj?.id));

      const totalWorkNet = projExtracts.reduce((sum, item) => sum + parseNum(item?.net), 0);
      const totalCost = projExpenses.reduce((sum, item) => sum + parseNum(item?.amount), 0);
      const totalReceived = projPayments.reduce((sum, item) => sum + parseNum(item?.amount), 0);
      const netProfit = totalWorkNet - totalCost;

      const projDirectCashExp = projExpenses.filter(e => e?.paymentMethod !== 'خصم من العهدة' && (e?.billStatus || 'مدفوعة') === 'مدفوعة').reduce((sum, e) => sum + parseNum(e?.amount), 0);
      const projTotalAdvancesGiven = projAdvances.reduce((sum, a) => sum + parseNum(a?.amount), 0);
      const projTotalSuppPaid = projSuppPayments.reduce((sum, p) => sum + parseNum(p?.amount), 0);
      const centralCashRemaining = totalReceived - projDirectCashExp - projTotalAdvancesGiven - projTotalSuppPaid;

      const allEmpCustodyBalance = (settings?.employees || []).reduce((acc, emp) => {
        const adv = projAdvances.filter(a => a?.employeeName === emp).reduce((sum, a) => sum + parseNum(a?.amount), 0);
        const spent = projExpenses.filter(e => e?.paymentMethod === 'خصم من العهدة' && e?.custodyEmployee === emp).reduce((sum, e) => sum + parseNum(e?.amount), 0);
        return acc + Math.max(0, adv - spent);
      }, 0);

      const projBudget = parseNum(currentProj?.budget);
      const budgetConsumedPercent = projBudget > 0 ? Math.min(Math.round((totalCost / projBudget) * 100), 100) : 0;

      const allWork = extracts.reduce((sum, item) => sum + parseNum(item?.totalWork), 0);
      const allExp = expenses.reduce((sum, item) => sum + parseNum(item?.amount), 0);
      const allPay = payments.reduce((sum, item) => sum + parseNum(item?.amount), 0);

      const projExpMap = {};
      projExpenses.forEach(e => { 
        const cat = e?.mainCategory || 'غير محدد'; 
        projExpMap[cat] = (projExpMap[cat] || 0) + parseNum(e?.amount); 
      });
      const projExpLabels = Object.keys(projExpMap);
      const projExpData = Object.values(projExpMap);

      const filteredSearchExpenses = projExpenses.filter(e => { 
        return (searchMainCat === "" || e?.mainCategory === searchMainCat) && 
               (searchSubCat === "" || e?.subCategory === searchSubCat) && 
               (searchCostType === "" || e?.costType === searchCostType); 
      });
      const filteredSearchTotal = filteredSearchExpenses.reduce((s, e) => s + parseNum(e?.amount), 0);

      const allSupplierNames = Array.from(new Set([
        ...(settings?.suppliers || []),
        ...expenses.map(e => e?.supplier).filter(Boolean),
        ...supplierPayments.map(p => p?.supplier).filter(Boolean)
      ])).map(s => String(s || '').trim()).filter(Boolean);

      const cleanSuppliersList = Array.from(new Set(allSupplierNames));

      const suppliersLedger = cleanSuppliersList.map(supp => {
        const targetExp = suppScope === "project" ? projExpenses : expenses;
        const targetSuppPay = suppScope === "project" ? projSuppPayments : supplierPayments;
        const allInvoices = targetExp.filter(e => String(e?.supplier || '').trim() === supp);
        const totalPurchases = allInvoices.reduce((sum, e) => sum + parseNum(e?.amount), 0);
        const creditPurchases = allInvoices.filter(e => (e?.billStatus || 'مدفوعة') === 'آجلة').reduce((sum, e) => sum + parseNum(e?.amount), 0);
        const totalPaidToCreditor = targetSuppPay.filter(p => String(p?.supplier || '').trim() === supp).reduce((sum, p) => sum + parseNum(p?.amount), 0);
        const balance = totalPaidToCreditor - creditPurchases;
        return { name: supp, totalPurchases, creditPurchases, paidPurchases: totalPurchases - creditPurchases, totalPaid: totalPaidToCreditor, balance };
      }).filter(s => s.totalPurchases > 0 || s.totalPaid > 0);

      const getCustodyStats = (empName) => {
        const empAdv = projAdvances.filter(a => a?.employeeName === empName).reduce((sum, a) => sum + parseNum(a?.amount), 0);
        const empExp = projExpenses.filter(e => e?.paymentMethod === 'خصم من العهدة' && e?.custodyEmployee === empName).reduce((sum, e) => sum + parseNum(e?.amount), 0);
        return { received: empAdv, spent: empExp, balance: empAdv - empExp };
      };

      const activeEmployeesCustody = (settings?.employees || []).map(emp => ({ name: emp, ...getCustodyStats(emp) })).filter(s => s.received > 0 || s.spent > 0);

      const navTabs = [
        ...(isAdmin ? [{ id: "dashboard", label: "لوحة التحكم", icon: "📊" }] : [{ id: "my_custody", label: "لوحة عهدتي", icon: "💼" }]),
        { id: "projects", label: "المشاريع", icon: "📁" },
        { id: "advances", label: "العهدة", icon: "💵" },
        { id: "add_data", label: "إدخال", icon: "➕" },
        ...(isAdmin || isAccountant ? [{ id: "payments", label: "الدفعات", icon: "💰" }] : []),
        { id: "expenses", label: "المصاريف", icon: "💸" },
        ...(isAdmin || isAccountant ? [{ id: "suppliers", label: "حساب الموردين", icon: "🚚" }] : []),
        ...(isAdmin ? [{ id: "statement", label: "كشف الحساب", icon: "📑" }] : []),
        ...(isAdmin || isAccountant ? [{ id: "extracts", label: "المستخلصات", icon: "📄" }] : []),
        ...(isAdmin ? [{ id: "audit_log", label: "الدخول", icon: "🛡️" }] : []),
        ...(isAdmin ? [{ id: "settings", label: "الإعدادات", icon: "⚙️" }] : [])
      ];

      if (authLoading) {
        return <div class="min-h-screen flex items-center justify-center bg-slate-900 text-white font-bold text-sm">جاري التحقق... 🔒</div>;
      }

      if (!user) {
        return (
          <div class="min-h-screen flex items-center justify-center bg-slate-900 px-4">
            <div class="bg-white dark:bg-slate-800 p-6 sm:p-8 rounded-3xl shadow-2xl w-full max-w-sm text-center">
              <div class="bg-indigo-100 text-indigo-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl shadow-inner">🏗</div>
              <h2 class="text-2xl font-black text-slate-800 dark:text-white mb-1">MOMOHY ERP</h2>
              <p class="text-slate-500 dark:text-slate-400 text-xs mb-6 font-semibold">بوابة الدخول السحابية</p>
              
              {accessDeniedMessage ? (
                <div class="space-y-4">
                  <div class="bg-rose-100 border border-rose-300 text-rose-800 p-3 rounded-2xl text-xs font-bold leading-relaxed">⚠️ {accessDeniedMessage}</div>
                  <a href="/survey.html" class="w-full inline-flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-2xl transition shadow text-xs">📐 الانتقال إلى قطاع المساحة</a>
                </div>
              ) : (
                <>
                  {loginError && <div class="bg-rose-100 text-rose-700 p-2.5 rounded-xl text-xs font-bold mb-4">{loginError}</div>}
                  {loginMethod === "choose" && (
                    <div class="space-y-3">
                      <button onClick={handleGoogleLogin} class="w-full flex items-center justify-center gap-2.5 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-bold py-3 rounded-2xl transition shadow-sm text-xs">
                        <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> الدخول عبر Google 
                      </button>
                      <button onClick={() => setLoginMethod("phone")} class="w-full flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-2xl transition shadow text-xs">📱 الدخول عبر الهاتف</button>
                    </div>
                  )}
                  {loginMethod === "phone" && !verificationId && (
                    <form onSubmit={handleSendOtp} class="space-y-3">
                      <input type="tel" value={phoneNumber} onChange={e=>setPhoneNumber(e.target.value)} placeholder="01xxxxxxxxx" class="w-full border p-3 rounded-xl text-center font-bold text-xs outline-none dark:bg-slate-700" dir="ltr" required />
                      <div id="recaptcha-container"></div>
                      <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-2xl text-xs shadow-md">إرسال كود التحقق</button>
                      <button type="button" onClick={() => setLoginMethod("choose")} class="w-full text-slate-500 text-xs">الرجوع</button>
                    </form>
                  )}
                  {loginMethod === "phone" && verificationId && (
                    <form onSubmit={handleVerifyOtp} class="space-y-3">
                      <input type="text" value={otpCode} onChange={e=>setOtpCode(e.target.value)} placeholder="كود التحقق (OTP)" class="w-full border p-3 rounded-xl text-center font-black tracking-widest text-sm outline-none dark:bg-slate-700" dir="ltr" required />
                      <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-2xl text-xs shadow-md">تأكيد ودخول</button>
                    </form>
                  )}
                </>
              )}
            </div>
          </div>
        );
      }

      return (
        <div class="min-h-screen pb-24 md:pb-10">
          {!isOnline && (
            <div class="bg-amber-600 text-white text-[11px] font-bold text-center py-1.5 px-3 flex items-center justify-center gap-1.5 sticky top-0 z-40 shadow-xs">
              <span>📡</span>
              <span>أنت تعمل الآن بدون إنترنت في قطاع الإنشاءات. يتم حفظ العمليات محلياً على جهازك وسترفع تلقائياً فور توفر الشبكة.</span>
            </div>
          )}

          <header class="bg-slate-900 text-white shadow-md sticky top-0 z-30 print-hidden border-b border-slate-800">
            <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
              <div class="flex items-center gap-2.5">
                <span class="text-2xl p-1 bg-blue-600/30 rounded-xl">🏗️</span>
                <div>
                  <h1 class="text-sm sm:text-base font-black leading-tight">إدارة المعاملات الإنشائية</h1>
                  <div class="text-[11px] text-slate-300 flex items-center gap-1.5 mt-0.5">
                    <span class="truncate max-w-[130px] sm:max-w-none">{user.name}</span>
                    <span class={`border px-1.5 py-0.2 rounded font-bold text-[10px] ${isAdmin ? 'bg-amber-500/20 text-amber-300 border-amber-500/30' : isAccountant ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30' : 'bg-blue-500/20 text-blue-300 border-blue-500/30'}`}>
                      {userRoleTitle}
                    </span>
                  </div>
                </div>
              </div>
              <div class="flex items-center gap-2">
                <button onClick={toggleTheme} class="p-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs border border-slate-700 transition" title="تبديل الوضع الليلي">
                  {theme === 'dark' ? '☀️' : '🌙'}
                </button>
                <a href="/survey.html" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded-xl font-bold flex items-center gap-1 shadow-sm transition">
                  📐 <span class="hidden sm:inline">قطاع المساحة</span>
                </a>
                <button onClick={exportToExcel} class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-1.5 rounded-xl font-bold flex items-center gap-1 shadow-sm transition">
                  📤 <span class="hidden sm:inline">تصدير</span>
                </button>
                <button onClick={() => setDrawerOpen(true)} class="bg-slate-800 hover:bg-slate-700 p-2 rounded-xl text-slate-200 border border-slate-700 text-sm">☰</button>
              </div>
            </div>

            <div class="hidden md:flex bg-slate-800/90 border-t border-slate-700 px-4 py-1.5 overflow-x-auto scrollbar-hide gap-1 text-xs">
              {navTabs.map(t => (
                <button key={t.id} onClick={() => setActiveTab(t.id)} class={`px-3 py-1.5 rounded-lg font-bold whitespace-nowrap transition ${activeTab === t.id ? "bg-blue-600 text-white shadow" : "text-slate-300 hover:bg-slate-700"}`}>
                  {t.icon} {t.label}
                </button>
              ))}
            </div>
          </header>

          {drawerOpen && (
            <div class="fixed inset-0 z-50 flex">
              <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs transition-opacity" onClick={() => setDrawerOpen(false)}></div>
              <div class="relative w-72 max-w-[80%] bg-slate-900 text-white h-full shadow-2xl z-50 p-5 flex flex-col justify-between">
                <div>

                    <div class="flex gap-1"><select value={newExp.supplier} onChange={e=>setNewExp({...newExp, supplier: e.target.value})} class="w-full border dark:border-slate-600 rounded-xl p-2 dark:bg-slate-700"><option value="">اختر...</option>{settings.suppliers.map(c => <option key={c}>{c}</option>)}</select>{isAdmin && <button type="button" onClick={()=>handleAddNewSettingItem('suppliers', settings.suppliers, 'مورد')} class="bg-blue-50 dark:bg-slate-700 text-blue-700 dark:text-blue-300 px-3 rounded-xl font-black text-lg">+</button>}</div>
                  </div>
                  <div><label class="block font-bold mb-1">طريقة السداد</label><select value={newExp.paymentMethod} onChange={e=>setNewExp({...newExp, paymentMethod: e.target.value})} class="w-full border dark:border-slate-600 rounded-xl p-2 font-bold text-slate-700 dark:text-slate-300 dark:bg-slate-700"><option value="خصم من العهدة">خصم من العهدة (موقع)</option><option value="كاش">كاش من الخزينة</option><option value="تحويل بنكي">تحويل بنكي مركزي</option></select></div>
                  <div><label class="block font-bold mb-1 text-indigo-700 dark:text-indigo-400">حالة الفاتورة</label><select value={newExp.billStatus} onChange={e=>setNewExp({...newExp, billStatus: e.target.value})} class="w-full border-2 border-indigo-200 dark:border-slate-600 p-2 rounded-xl font-bold bg-indigo-50/40 dark:bg-slate-700"><option value="مدفوعة">✅ مسددة فوراً</option><option value="آجلة">⏳ آجلة (مديونية)</option></select></div>
                  {newExp.paymentMethod === 'خصم من العهدة' && (
                    <div><label class="block font-bold mb-1 text-rose-600">خصم من عهدة:</label><select value={newExp.custodyEmployee || ""} onChange={e=>setNewExp({...newExp, custodyEmployee: e.target.value})} class="w-full border border-rose-300 dark:border-slate-600 bg-rose-50 dark:bg-slate-700 rounded-xl p-2 font-bold" required><option value="">اختر الموظف...</option>{settings.employees.map(c => <option key={c}>{c}</option>)}</select></div>
                  )}
                  <div><label class="block font-bold mb-1">الكمية</label><input type="number" step="any" value={newExp.quantity} onChange={e=>setNewExp({...newExp, quantity: e.target.value})} class="w-full border dark:border-slate-600 rounded-xl p-2 bg-amber-50 dark:bg-slate-700 font-bold" required/></div>
                  <div><label class="block font-bold mb-1">سعر الوحدة</label><input type="number" step="any" value={newExp.unitPrice} onChange={e=>setNewExp({...newExp, unitPrice: e.target.value})} class="w-full border dark:border-slate-600 rounded-xl p-2 bg-amber-50 dark:bg-slate-700 font-bold" required/></div>
                  <div class="sm:col-span-2"><label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">الوصف / ملاحظات</label><input type="text" value={newExp.description} onChange={e=>setNewExp({...newExp, description: e.target.value})} placeholder="رقم الفاتورة..." class="w-full border dark:border-slate-600 rounded-xl p-2 bg-slate-50 dark:bg-slate-700"/></div>
                  <div class="sm:col-span-4 bg-rose-50 dark:bg-slate-700 border border-rose-200 dark:border-slate-600 p-2.5 rounded-xl flex justify-between items-center"><span class="font-bold text-rose-900 dark:text-rose-300">إجمالي الفاتورة:</span><span class="text-sm font-black text-rose-600 dark:text-rose-400">{(parseNum(newExp.quantity) * parseNum(newExp.unitPrice)).toLocaleString()} ج.م</span></div>
                  <div class="sm:col-span-4"><button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl shadow transition">حفظ المصروف والفاتورة</button></div>
                </form>
              </div>
            )}

            {activeTab === "expenses" && (
              <div class="space-y-4">
                <div class="bg-white dark:bg-slate-800 rounded-2xl border dark:border-slate-700 shadow-sm overflow-x-auto p-4 text-xs">
                  <table class="w-full text-right border-collapse">
                    <thead>
                      <tr class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 border-b">
                        <th class="p-2.5">التاريخ</th>
                        <th class="p-2.5">المشروع</th>
                        <th class="p-2.5">البند</th>
                        <th class="p-2.5">المورد</th>
                        <th class="p-2.5 text-center">الإجمالي</th>
                        <th class="p-2.5">الحالة</th>
                        {canEditOrDelete && <th class="p-2.5 text-center bg-slate-200 dark:bg-slate-600 text-slate-800 dark:text-slate-200 font-black sticky left-0 z-10 shadow-xs">إجراءات</th>}
                      </tr>
                    </thead>
                    <tbody>
                      {expenses.map((e) => (
                        <tr key={e.id} class="border-b dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-750">
                          <td class="p-2.5 text-slate-600 dark:text-slate-400 whitespace-nowrap">{e.date}</td>
                          <td class="p-2.5 font-bold text-blue-700 dark:text-blue-400 font-mono">{e.projectId}</td>
                          <td class="p-2.5 font-semibold">{e.mainCategory} - {e.subCategory}</td>
                          <td class="p-2.5 text-slate-600 dark:text-slate-400">{e.supplier || '-'}</td>
                          <td class="p-2.5 text-center font-black text-rose-600 font-mono">{parseNum(e.amount).toLocaleString()} ج.م</td>
                          <td class="p-2.5"><span class={`px-2 py-0.5 rounded-lg text-[10px] font-bold ${e.billStatus === 'آجلة' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}`}>{e.billStatus || 'مدفوعة'}</span></td>
                          {canEditOrDelete && (
                            <td class="p-2.5 text-center whitespace-nowrap bg-slate-50 dark:bg-slate-800 sticky left-0 z-10 shadow-xs">
                              <div class="flex items-center justify-center gap-1.5">
                                <button onClick={() => setEditItemData({ type: 'expense', data: { ...e } })} class="bg-blue-600 text-white hover:bg-blue-700 px-2.5 py-1 rounded-lg font-bold shadow-xs">✏ تعديل</button>
                                {isAdmin && <button onClick={() => deleteItem('expenses', e.id, expenses)} class="bg-rose-100 text-rose-700 hover:bg-rose-200 px-2 py-1 rounded-lg font-bold">🗑 حذف</button>}
                              </div>
                            </td>
                          )}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {activeTab === "settings" && isAdmin && (
              <div class="space-y-4 text-xs font-bold">
                <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200/90 dark:border-slate-700 shadow-sm space-y-3">
                  <div class="flex items-center gap-2 border-b dark:border-slate-700 pb-2">
                    <span class="text-lg">💾</span>
                    <div>
                      <h3 class="text-sm font-black text-slate-900 dark:text-white">النسخ الاحتياطي وتصدير البيانات (Backup & Data Portability)</h3>
                      <p class="text-[11px] text-slate-400 font-normal">حفظ واسترجاع كافة بيانات العمليات والمستخلصات لضمان أمان السجلات</p>
                    </div>
                  </div>
                  <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2">
                    <button onClick={exportJsonBackup} class="p-3 bg-slate-50 dark:bg-slate-700 rounded-xl border dark:border-slate-600 flex items-center justify-between hover:bg-slate-100 transition"><div class="text-right"><span class="block text-xs font-black">تحميل نسخة شاملة (JSON)</span></div><span class="text-xl">💾</span></button>
                    <button onClick={exportToExcel} class="p-3 bg-slate-50 dark:bg-slate-700 rounded-xl border dark:border-slate-600 flex items-center justify-between hover:bg-slate-100 transition"><div class="text-right"><span class="block text-xs font-black">تصدير شيت إكسيل (Excel)</span></div><span class="text-xl">📊</span></button>
                    <div class="p-3 bg-blue-50/60 dark:bg-blue-950/30 rounded-xl border border-dashed border-blue-400 flex items-center justify-between"><label class="cursor-pointer w-full flex items-center justify-between"><div class="text-right"><span class="block text-xs font-black text-blue-700 dark:text-blue-300">استيراد بيانات</span></div><span class="text-xl">📥</span><input type="file" accept=".json,.xlsx,.xls,.csv" onChange={handleImportData} class="hidden"/></label></div>
                  </div>
                </div>

                <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200/90 dark:border-slate-700 shadow-sm space-y-3">
                  <div class="flex items-center gap-2 border-b dark:border-slate-700 pb-2"><span class="text-lg">🛡️</span><div><h3 class="text-sm font-black text-slate-900 dark:text-white">إدارة الصلاحيات والمستخدمين</h3></div></div>
                  <form onSubmit={handleSaveRole} class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 pt-1">
                    <input type="email" placeholder="البريد الإلكتروني..." value={newRoleInput.email} onChange={e=>setNewRoleInput({...newRoleInput, email: e.target.value})} class="border dark:border-slate-600 p-2.5 rounded-xl dark:bg-slate-700 text-xs" required/>
                    <select value={newRoleInput.role} onChange={e=>setNewRoleInput({...newRoleInput, role: e.target.value})} class="border dark:border-slate-600 p-2.5 rounded-xl dark:bg-slate-700 text-xs font-bold"><option value="engineer">👷 مهندس موقع</option><option value="accountant">💼 محاسب</option><option value="admin">👑 مدير نظام</option></select>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-black py-2.5">حفظ الصلاحية</button>
                  </form>
                </div>
              </div>
            )}
          </main>

          <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white/95 dark:bg-slate-800/95 backdrop-blur-md border-t border-slate-200/80 dark:border-slate-700 shadow-lg z-40 px-2 py-1.5 flex justify-around items-center">
            {navTabs.slice(0, 4).map(tab => (
              <button key={tab.id} onClick={() => setActiveTab(tab.id)} class={`flex flex-col items-center justify-center py-1 px-2.5 rounded-xl transition duration-200 ${activeTab === tab.id ? "text-blue-600 dark:text-blue-400 font-black scale-105" : "text-slate-400"}`}>
                <span class="text-base">{tab.icon}</span><span class="text-[10px] mt-0.5">{tab.label}</span>
              </button>
            ))}
            <button onClick={() => setDrawerOpen(true)} class="flex flex-col items-center justify-center py-1 px-2.5 text-slate-400"><span class="text-base">☰</span><span class="text-[10px] mt-0.5">المزيد</span></button>
          </nav>

          {toast.show && <div class="fixed bottom-20 md:bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none toast-anim"><div class={`px-4 py-2.5 rounded-2xl shadow-xl border flex items-center gap-2.5 text-xs font-bold text-white ${toast.type === 'error' ? 'bg-rose-600 border-rose-500' : 'bg-slate-900 border-slate-800'}`}><span>{toast.type === 'error' ? '⚠️' : '✅'}</span><span>{toast.message}</span></div></div>}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
