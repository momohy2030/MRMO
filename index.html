<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة المعاملات الإنشائية</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- SheetJS -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-database-compat.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    @media print {
      body { background-color: white; }
      .print-hidden { display: none !important; }
      .print-area { box-shadow: none !important; border: none !important; margin: 0 !important; padding: 0 !important; }
    }
  </style>
</head>
<body class="text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- إعدادات ربط Firebase ---
    const firebaseConfig = {
      apiKey: "AIzaSyDHjQTNfAh3wQ8tSOXOIewJNXaDCHADrR8",
      authDomain: "mrmo-d8760.firebaseapp.com",
      databaseURL: "https://mrmo-d8760-default-rtdb.firebaseio.com",
      projectId: "mrmo-d8760",
      storageBucket: "mrmo-d8760.firebasestorage.app",
      messagingSenderId: "510855132508",
      appId: "1:510855132508:web:feee377429a2d88c277d99",
      measurementId: "G-N9DW5R28H0"
    };

    // --- قائمة المدراء المعتمدين ("mohamedmohy676676@gmail.com") ---
    const ADMIN_IDENTIFIERS = [
      "mohamedmohy676676@gmail.com", // استبدله ببريدك المستخدم في الدخول إن كان مختلفاً
      "+201000000000"         // أو رقم هاتفك بصيغة الكود الدولي
    ];

    let db = null;
    let auth = null;
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      db = firebase.database();
      auth = firebase.auth();
      auth.languageCode = 'ar';
    } catch (e) { console.error("Firebase init error:", e); }

    const initialProjects = [{"id": "PRJ-01", "name": "مشروع تجريبي", "location": "الموقع", "startDate": "2026-01-01", "deliveryDate": "2026-12-31", "status": "جاري العمل", "createdBy": "النظام"}];
    const initialSettings = {
      mainCategories: ["مباني", "صبة خرسانه", "كهرباء", "سباكة", "محارة", "نقاشة"],
      subCategories: ["طوب", "اسمنت", "رملة", "عمالة", "الاكل", "نجار", "حداد", "خلاطة"],
      costTypes: ["مصنعيات", "بضاعة/مواد", "أكل", "مواصلات", "إيجار معدات", "نثريات وإكراميات"],
      suppliers: ["مورد الأسمنت", "مورد الرمل", "مقاول النجارة", "مصنع الطوب"],
      logo: ""
    };

    function DashboardCharts({ allWork, allExp, allPay, projExpLabels, projExpData, projName }) {
      const chart1Ref = useRef(null);
      const chart2Ref = useRef(null);
      const chart1Instance = useRef(null);
      const chart2Instance = useRef(null);

      useEffect(() => {
        if (chart1Instance.current) chart1Instance.current.destroy();
        if (chart2Instance.current) chart2Instance.current.destroy();

        if (chart1Ref.current) {
          chart1Instance.current = new Chart(chart1Ref.current, {
            type: 'bar',
            data: {
              labels: ['قيمة الأعمال (مستخلصات)', 'إجمالي المصروفات', 'إجمالي التحصيلات'],
              datasets: [{ label: 'الموقف المالي العام (ج.م)', data: [allWork, allExp, allPay], backgroundColor: ['#4f46e5', '#e11d48', '#10b981'], borderRadius: 6 }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
          });
        }
        if (chart2Ref.current) {
          chart2Instance.current = new Chart(chart2Ref.current, {
            type: 'doughnut',
            data: {
              labels: projExpLabels.length ? projExpLabels : ['لا توجد مصروفات'],
              datasets: [{ data: projExpData.length ? projExpData : [1], backgroundColor: projExpData.length ? ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#64748b'] : ['#e2e8f0'] }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: {font: {family: 'Cairo'}} } } }
          });
        }
        return () => { if (chart1Instance.current) chart1Instance.current.destroy(); if (chart2Instance.current) chart2Instance.current.destroy(); };
      }, [allWork, allExp, allPay, projExpLabels.join(','), projExpData.join(',')]);

      return (
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
          <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm h-72 flex flex-col"><h4 class="font-bold text-slate-700 mb-2 text-center text-sm">📈 معدل الأعمال العام للشركة</h4><div class="flex-1 relative w-full"><canvas ref={chart1Ref}></canvas></div></div>
          <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm h-72 flex flex-col"><h4 class="font-bold text-slate-700 mb-2 text-center text-sm">📊 توزيع مصروفات المشروع ({projName})</h4><div class="flex-1 relative w-full"><canvas ref={chart2Ref}></canvas></div></div>
        </div>
      );
    }

    function App() {
      const [user, setUser] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);
      const [authLoading, setAuthLoading] = useState(true);
      const [loginMethod, setLoginMethod] = useState("choose");
      const [phoneNumber, setPhoneNumber] = useState("");
      const [otpCode, setOtpCode] = useState("");
      const [verificationId, setVerificationId] = useState(null);
      const [loginError, setLoginError] = useState("");

      const [loading, setLoading] = useState(false);
      const [projects, setProjects] = useState(initialProjects);
      const [expenses, setExpenses] = useState([]);
      const [extracts, setExtracts] = useState([]);
      const [payments, setPayments] = useState([]);
      const [loginLogs, setLoginLogs] = useState([]);
      const [settings, setSettings] = useState(initialSettings);
      
      const [selectedProjId, setSelectedProjId] = useState("PRJ-01");
      const [activeTab, setActiveTab] = useState("dashboard");
      const [alertMsg, setAlertMsg] = useState("");

      const [searchMainCat, setSearchMainCat] = useState("");
      const [searchSubCat, setSearchSubCat] = useState("");
      const [searchCostType, setSearchCostType] = useState("");

      const todayDate = new Date().toISOString().split('T')[0];

      const [newProj, setNewProj] = useState({ id: "", name: "", location: "", startDate: todayDate, deliveryDate: "", status: "جاري العمل" });
      const [newExp, setNewExp] = useState({ date: todayDate, mainCategory: "", subCategory: "", costType: "", supplier: "", quantity: 1, unitPrice: "", paymentMethod: "كاش" });
      const [newPay, setNewPay] = useState({ date: todayDate, amount: "", paymentMethod: "كاش", notes: "" });
      const [newExt, setNewExt] = useState({ date: todayDate, extractNo: "", workDescription: "", quantity: 1, unitPrice: "", deductions: "" });

      // تسجيل حركة الدخول في السيرفر تلقائياً
      const recordLoginLog = (currentUser, adminStatus) => {
        if (!db) return;
        const now = new Date();
        const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const logEntry = {
          uid: currentUser.uid,
          name: currentUser.displayName || currentUser.email || currentUser.phoneNumber || "مستخدم",
          identifier: currentUser.email || currentUser.phoneNumber || "غير محدد",
          role: adminStatus ? "مدير النظام (Admin)" : "موظف (Staff)",
          device: isMobile ? "📱 هاتف محمول" : "💻 جهاز كمبيوتر",
          timestamp: now.toISOString(),
          formattedDate: now.toLocaleDateString('ar-EG') + ' - ' + now.toLocaleTimeString('ar-EG')
        };
        db.ref('login_logs').push(logEntry);
      };

      // التحقق من الحساب والأدمن
      useEffect(() => {
        if (!auth) { setAuthLoading(false); return; }
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          if (currentUser) {
            const identifier = currentUser.email || currentUser.phoneNumber || "";
            const adminCheck = ADMIN_IDENTIFIERS.some(id => identifier.toLowerCase().includes(id.toLowerCase())) || currentUser.email === "momohy2030@gmail.com";
            
            setUser({
              uid: currentUser.uid,
              name: currentUser.displayName || currentUser.email || currentUser.phoneNumber || "مستخدم موثق",
              identifier: identifier
            });
            setIsAdmin(adminCheck);

            // تدوين الدخول إذا لم يسجل مسبقاً في هذه الجلسة
            if (!sessionStorage.getItem('login_recorded')) {
              recordLoginLog(currentUser, adminCheck);
              sessionStorage.setItem('login_recorded', 'true');
            }
          } else {
            setUser(null);
            setIsAdmin(false);
            sessionStorage.removeItem('login_recorded');
          }
          setAuthLoading(false);
        });
        return () => unsubscribe();
      }, []);

      // مزامنة البيانات وسجل الدخول اللحظي
      useEffect(() => {
        if (!user) return;
        setLoading(true);
        if (!db) { setLoading(false); return; }

        const rootRef = db.ref('/');
        const handleValue = (snapshot) => {
          try {
            const data = snapshot.val() || {};
            const toArr = (v) => (v ? (Array.isArray(v) ? v : Object.values(v)) : []);

            const loadedProjects = toArr(data.projects);
            const finalProjects = loadedProjects.length > 0 ? loadedProjects : initialProjects;
            setProjects(finalProjects);

            setExpenses([...toArr(data.expenses)].reverse());
            setExtracts([...toArr(data.extracts)].reverse());
            setPayments([...toArr(data.payments)].reverse());
            setLoginLogs([...toArr(data.login_logs)].reverse());

            const savedSettings = data.settings || {};
            setSettings({
              mainCategories: toArr(savedSettings.mainCategories).length ? toArr(savedSettings.mainCategories) : initialSettings.mainCategories,
              subCategories: toArr(savedSettings.subCategories).length ? toArr(savedSettings.subCategories) : initialSettings.subCategories,
              costTypes: toArr(savedSettings.costTypes).length ? toArr(savedSettings.costTypes) : initialSettings.costTypes,
              suppliers: toArr(savedSettings.suppliers).length ? toArr(savedSettings.suppliers) : initialSettings.suppliers,
              logo: savedSettings.logo || ""
            });
            setSelectedProjId(prev => prev || (finalProjects[0]?.id || "PRJ-01"));
          } catch (err) { console.error(err); } finally { setLoading(false); }
        };

        rootRef.on('value', handleValue, (error) => { console.error(error); setLoading(false); });
        return () => { rootRef.off('value', handleValue); };
      }, [user]);

      const handleGoogleLogin = () => {
        setLoginError("");
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch((error) => {
          setLoginError("حدث خطأ أثناء تسجيل الدخول بجوجل: " + error.message);
        });
      };

      const setupRecaptcha = () => {
        if (!window.recaptchaVerifier) {
          window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { 'size': 'invisible' });
        }
      };

      const handleSendOtp = (e) => {
        e.preventDefault();
        setLoginError("");
        setupRecaptcha();
        const appVerifier = window.recaptchaVerifier;
        let formattedPhone = phoneNumber;
        if (formattedPhone.startsWith("01")) { formattedPhone = "+20" + formattedPhone.substring(1); }
        
        auth.signInWithPhoneNumber(formattedPhone, appVerifier)
          .then((confirmationResult) => {
            window.confirmationResult = confirmationResult;
            setVerificationId(true);
          }).catch((error) => {
            setLoginError("حدث خطأ في إرسال الرمز. تأكد من تفعيل مزود الهاتف في Firebase.");
            if(window.recaptchaVerifier) window.recaptchaVerifier.render().then(widgetId => grecaptcha.reset(widgetId));
          });
      };

      const handleVerifyOtp = (e) => {
        e.preventDefault();
        setLoginError("");
        window.confirmationResult.confirm(otpCode).catch(() => {
          setLoginError("الرمز غير صحيح، يرجى المحاولة مرة أخرى.");
        });
      };

      const handleLogout = () => {
        auth.signOut();
        setLoginMethod("choose");
        setVerificationId(null);
      };

      const showAlert = (msg) => { setAlertMsg(msg); setTimeout(() => setAlertMsg(""), 4000); };

      const deleteItem = (path, id, list) => {
        if (!isAdmin) {
          alert("عذراً، خاصية الحذف مصرحة لمدير النظام (Admin) فقط.");
          return;
        }
        if (window.confirm("هل أنت متأكد من حذف هذا السجل نهائياً؟")) {
          const newList = list.filter(item => item.id !== id);
          if (db) db.ref(path).set(newList);
          if (path === 'expenses') setExpenses(newList);
          if (path === 'extracts') setExtracts(newList);
          if (path === 'payments') setPayments(newList);
          if (path === 'projects') setProjects(newList);
          showAlert("تم الحذف بنجاح! 🗑");
        }
      };

      const exportToExcel = () => {
        const wb = XLSX.utils.book_new();
        const wsProjects = XLSX.utils.json_to_sheet(projects.map(p => ({ 'كود المشروع': p.id, 'اسم العميل': p.name, 'موقع العمل': p.location, 'تاريخ البدء': p.startDate, 'تاريخ التسليم المتوقع': p.deliveryDate, 'حالة المشروع': p.status, 'بواسطة': p.createdBy || 'مجهول' }))); XLSX.utils.book_append_sheet(wb, wsProjects, "دليل المشاريع");
        const wsExpenses = XLSX.utils.json_to_sheet(expenses.map(e => ({ 'التاريخ': e.date, 'كود المشروع': e.projectId, 'البند الرئيسي': e.mainCategory, 'البند الفرعي': e.subCategory, 'نوع التكلفة': e.costType, 'الوصف/المورد': e.supplier, 'الكمية': e.quantity || 1, 'سعر الوحدة': e.unitPrice || e.amount, 'الإجمالي': e.amount, 'طريقة الدفع': e.paymentMethod, 'بواسطة': e.createdBy || 'مجهول' }))); XLSX.utils.book_append_sheet(wb, wsExpenses, "المصروفات والتكاليف");
        const wsExtracts = XLSX.utils.json_to_sheet(extracts.map(ex => ({ 'التاريخ': ex.date || '-', 'كود المشروع': ex.projectId, 'رقم المستخلص': ex.extractNo, 'بيان الأعمال': ex.workDescription || 'أعمال منفذة', 'الكمية': ex.quantity || 1, 'الفئة (السعر)': ex.unitPrice || ex.totalWork, 'قيمة الأعمال': ex.totalWork, 'الاستقطاعات': ex.deductions, 'الصافي (المستحق)': ex.net, 'بواسطة': ex.createdBy || 'مجهول' }))); XLSX.utils.book_append_sheet(wb, wsExtracts, "المستخلصات وقيمة الأعمال");
        const wsPayments = XLSX.utils.json_to_sheet(payments.map(p => ({ 'التاريخ': p.date, 'كود المشروع': p.projectId, 'المبلغ المستلم': p.amount, 'طريقة الدفع': p.paymentMethod, 'البيان': p.notes, 'بواسطة': p.createdBy || 'مجهول' }))); XLSX.utils.book_append_sheet(wb, wsPayments, "دفعات العملاء");
        const fileName = `MOMOHY_ERP_Export_${new Date().toISOString().split('T')[0]}.xlsx`;
        XLSX.writeFile(wb, fileName);
        showAlert("تم تصدير البيانات إلى ملف إكسل بنجاح! 📥");
      };

      if (authLoading) {
        return <div class="min-h-screen flex items-center justify-center bg-slate-900 text-white font-bold text-xl">جاري التحقق من الهوية... 🔒</div>;
      }

      if (!user) {
        return (
          <div class="min-h-screen flex items-center justify-center bg-slate-900 px-4">
            <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md text-center">
              <div class="bg-indigo-100 text-indigo-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">🏗️</div>
              <h2 class="text-2xl font-black text-slate-800 mb-1">بوابة الدخول السحابية</h2>
              <p class="text-slate-500 text-xs mb-6 font-semibold">إدارة المعاملات الإنشائية - MOMOHY ERP</p>

              {loginError && <div class="bg-rose-100 text-rose-700 p-3 rounded-lg text-xs font-bold mb-4">{loginError}</div>}

              {loginMethod === "choose" && (
                <div class="space-y-3">
                  <button onClick={handleGoogleLogin} class="w-full flex items-center justify-center gap-3 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-bold py-3 rounded-xl transition shadow-sm text-sm">
                    <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                    الدخول بحساب Google
                  </button>
                  <button onClick={() => setLoginMethod("phone")} class="w-full flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-xl transition shadow text-sm">
                    📱 الدخول برقم الهاتف
                  </button>
                </div>
              )}

              {loginMethod === "phone" && !verificationId && (
                <form onSubmit={handleSendOtp} class="space-y-3">
                  <input type="tel" value={phoneNumber} onChange={e=>setPhoneNumber(e.target.value)} placeholder="رقم الهاتف (01xxxxxxxxx)" class="w-full border p-3 rounded-lg text-center font-bold outline-none text-sm" dir="ltr" required />
                  <div id="recaptcha-container"></div>
                  <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-sm">إرسال كود التحقق</button>
                  <button type="button" onClick={() => setLoginMethod("choose")} class="w-full text-slate-500 text-xs font-bold">الرجوع</button>
                </form>
              )}

              {loginMethod === "phone" && verificationId && (
                <form onSubmit={handleVerifyOtp} class="space-y-3">
                  <input type="text" value={otpCode} onChange={e=>setOtpCode(e.target.value)} placeholder="کود التحقق (OTP)" class="w-full border p-3 rounded-lg text-center font-black tracking-widest outline-none" dir="ltr" required />
                  <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-sm">تأكيد والدخول</button>
                </form>
              )}
            </div>
          </div>
        );
      }

      if (loading) {
        return <div class="min-h-screen flex flex-col items-center justify-center bg-slate-900 text-white"><div class="text-3xl animate-bounce mb-3">☁️</div><h1 class="text-xl font-bold">جاري تحميل البيانات...</h1></div>;
      }

      const currentProj = projects.find(p => p.id === selectedProjId) || projects[0] || {};
      const projExpenses = expenses.filter(e => e.projectId === selectedProjId);
      const projExtracts = extracts.filter(e => e.projectId === selectedProjId);
      const projPayments = payments.filter(p => p.projectId === selectedProjId);

      const totalWorkNet = projExtracts.reduce((sum, item) => sum + (Number(item.net) || 0), 0);
      const totalCost = projExpenses.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      const totalReceived = projPayments.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      const netProfit = totalWorkNet - totalCost;
      const clientDebt = totalWorkNet - totalReceived;

      const allWork = extracts.reduce((sum, item) => sum + (Number(item.totalWork) || 0), 0);
      const allExp = expenses.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      const allPay = payments.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);

      const projExpMap = {};
      projExpenses.forEach(e => { const cat = e.mainCategory || 'غير محدد'; projExpMap[cat] = (projExpMap[cat] || 0) + (Number(e.amount) || 0); });
      const projExpLabels = Object.keys(projExpMap);
      const projExpData = Object.values(projExpMap);

      const filteredSearchExpenses = projExpenses.filter(e => {
        return (searchMainCat === "" || e.mainCategory === searchMainCat) && (searchSubCat === "" || e.subCategory === searchSubCat) && (searchCostType === "" || e.costType === searchCostType);
      });
      const filteredSearchTotal = filteredSearchExpenses.reduce((s, e) => s + (Number(e.amount) || 0), 0);

      return (
        <div class="min-h-screen pb-12">
          {/* Header محسن للتجاوب مع الهواتف */}
          <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-30 print-hidden">
            <div class="max-w-7xl mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <span class="text-2xl">🏗️</span>
                <div>
                  <h1 class="text-base sm:text-lg font-black leading-tight">إدارة المعاملات الإنشائية</h1>
                  <div class="text-[11px] text-slate-300 flex items-center gap-1.5 flex-wrap">
                    <span>{user.name}</span>
                    {isAdmin ? (

                    {expenses.map((e) => (
                      <tr key={e.id} class="border-t hover:bg-slate-50">
                        <td class="p-2.5 text-slate-600 font-semibold">{e.date}</td><td class="p-2.5 font-bold text-blue-700">{e.projectId}</td><td class="p-2.5">{e.mainCategory} - {e.subCategory}</td><td class="p-2.5">{e.supplier}</td>
                        <td class="p-2.5">{e.quantity || 1}</td><td class="p-2.5">{(e.unitPrice || e.amount).toLocaleString()}</td>
                        <td class="p-2.5 font-bold text-rose-600">{(e.amount || 0).toLocaleString()}</td>
                        <td class="p-2.5 text-slate-500">{e.createdBy || '-'}</td>
                        {isAdmin && (
                          <td class="p-2.5"><button onClick={() => deleteItem('expenses', e.id, expenses)} class="text-rose-500 hover:text-rose-700">🗑</button></td>
                        )}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {/* الدفعات */}
            {activeTab === "payments" && (
              <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-x-auto p-4">
                <table class="w-full text-right text-xs">
                  <thead><tr class="bg-slate-100 text-slate-600"><th class="p-2.5">التاريخ</th><th class="p-2.5">المشروع</th><th class="p-2.5">المبلغ</th><th class="p-2.5">البيان</th><th class="p-2.5">بواسطة</th>{isAdmin && <th class="p-2.5">حذف</th>}</tr></thead>
                  <tbody>{payments.map((p) => (
                    <tr key={p.id} class="border-b hover:bg-slate-50">
                      <td class="p-2.5 text-slate-600 font-semibold">{p.date}</td><td class="p-2.5 font-bold text-blue-700">{p.projectId}</td><td class="p-2.5 text-emerald-600 font-bold">{(p.amount || 0).toLocaleString()}</td><td class="p-2.5">{p.notes}</td><td class="p-2.5 text-slate-500">{p.createdBy || '-'}</td>
                      {isAdmin && (
                        <td class="p-2.5"><button onClick={()=>deleteItem('payments',p.id,payments)} class="text-rose-500 hover:text-rose-700">🗑️</button></td>
                      )}
                    </tr>
                  ))}</tbody>
                </table>
              </div>
            )}

            {/* المستخلصات للطباعة */}
            {activeTab === "extracts" && (
              <div class="bg-white p-6 sm:p-8 rounded-xl border border-slate-200 shadow-sm overflow-x-auto print-area">
                <div class="flex justify-between items-center mb-6 print-hidden">
                  <h3 class="font-bold text-slate-800 text-sm sm:text-base">سجل المستخلصات المعتمدة (للطباعة للعميل)</h3>
                  <button onClick={() => window.print()} class="bg-slate-800 hover:bg-black text-white px-4 py-2 rounded-lg font-bold shadow text-xs">🖨️ طباعة كـ PDF</button>
                </div>
                <div class="flex justify-between items-center border-b-2 border-slate-800 pb-4 mb-4">
                  <div>
                    <h2 class="text-2xl font-black text-slate-900">مستخلص أعمال تنفيذي</h2>
                    <div class="mt-1.5 text-slate-600 font-bold space-y-0.5 text-xs">
                      <p>اسم العميل: <span class="text-blue-700">{currentProj.name || 'الكل'}</span></p>
                      <p>المشروع / الموقع: {selectedProjId} - {currentProj.location || '-'}</p>
                      <p>تاريخ الطباعة: {new Date().toLocaleDateString('ar-EG')}</p>
                    </div>
                  </div>
                  {settings.logo ? (
                    <img src={settings.logo} alt="شعار الشركة" class="h-20 w-auto object-contain" />
                  ) : (
                    <div class="h-20 w-20 bg-slate-100 border border-dashed border-slate-300 flex items-center justify-center text-[10px] text-slate-400 print-hidden">بدون شعار</div>
                  )}
                </div>

                <table class="w-full text-right text-xs border-collapse border border-slate-300">
                  <thead>
                    <tr class="bg-slate-200 text-slate-800 border-y-2 border-slate-400">
                      <th class="p-2 border border-slate-300">التاريخ</th>
                      <th class="p-2 border border-slate-300">رقم المستخلص</th>
                      <th class="p-2 border border-slate-300">بيان الأعمال</th>
                      <th class="p-2 border border-slate-300 text-center">الكمية</th>
                      <th class="p-2 border border-slate-300 text-center">الفئة</th>
                      <th class="p-2 border border-slate-300 text-center">إجمالي الأعمال</th>
                      <th class="p-2 border border-slate-300 text-center">الاستقطاع</th>
                      <th class="p-2 border border-slate-300 text-center">الصافي المستحق</th>
                      {isAdmin && <th class="p-2 print-hidden border border-slate-300">حذف</th>}
                    </tr>
                  </thead>
                  <tbody>
                    {projExtracts.length === 0 ? (
                      <tr><td colSpan="9" class="text-center py-6 text-slate-400 font-bold">لا توجد أعمال مسجلة لهذا المشروع.</td></tr>
                    ) : (
                      projExtracts.map((ex, i) => (
                        <tr key={ex.id} class="hover:bg-slate-50">
                          <td class="p-2 border border-slate-300 text-slate-600">{ex.date || '-'}</td>
                          <td class="p-2 border border-slate-300 font-bold">{ex.extractNo}</td>
                          <td class="p-2 border border-slate-300 font-semibold">{ex.workDescription || 'أعمال منفذة حسب العقد'}</td>
                          <td class="p-2 border border-slate-300 text-center">{ex.quantity || 1}</td>
                          <td class="p-2 border border-slate-300 text-center">{(ex.unitPrice || ex.totalWork).toLocaleString()}</td>
                          <td class="p-2 border border-slate-300 text-center font-bold">{(ex.totalWork || 0).toLocaleString()}</td>
                          <td class="p-2 border border-slate-300 text-center text-rose-600">{(ex.deductions || 0).toLocaleString()}</td>
                          <td class="p-2 border border-slate-300 text-center font-black text-indigo-700 bg-indigo-50">{(ex.net || 0).toLocaleString()}</td>
                          {isAdmin && (
                            <td class="p-2 print-hidden border border-slate-300 text-center"><button onClick={() => deleteItem('extracts', ex.id, extracts)} class="text-rose-500">🗑️</button></td>
                          )}
                        </tr>
                      ))
                    )}
                  </tbody>
                  {projExtracts.length > 0 && (
                    <tfoot>
                      <tr class="bg-slate-800 text-white font-bold border-t-2 border-black">
                        <td class="p-2.5 text-left text-sm" colSpan={isAdmin ? 7 : 7}>الإجمالي النهائي المستحق للمشروع (ج.م):</td>
                        <td class="p-2.5 text-center text-base" colSpan={isAdmin ? 2 : 1}>{totalWorkNet.toLocaleString()}</td>
                      </tr>
                    </tfoot>
                  )}
                </table>
              </div>
            )}

            {/* الإعدادات */}
            {activeTab === "settings" && (
              <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h3 class="font-bold text-sm mb-3">🖼️ شعار الشركة المعتمد</h3>
                <label class="cursor-pointer bg-blue-100 hover:bg-blue-200 text-blue-700 font-bold py-2 px-3 rounded-lg text-xs transition inline-block">
                  اختر صورة اللوجو
                  <input type="file" accept="image/*" class="hidden" onChange={(e)=>{
                    const file = e.target.files && e.target.files[0];
                    if(!file) return;
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                      const base64 = evt.target.result;
                      if(db) db.ref('settings/logo').set(base64);
                      setSettings(prev=>({...prev, logo: base64}));
                      showAlert("تم حفظ الشعار بنجاح!");
                    };
                    reader.readAsDataURL(file);
                  }}/>
                </label>
                {settings.logo && <div class="mt-4"><img src={settings.logo} class="h-20 object-contain border p-2 rounded" /></div>}
              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
