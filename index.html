<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام إدارة المعاملات الإنشائية - MOMOHY ERP</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-database-compat.js"></script>

  <meta name="theme-color" content="#0f172a">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    @media print {
      body { background-color: white !important; font-size: 11px; }
      .print-hidden { display: none !important; }
      .print-area { box-shadow: none !important; border: none !important; margin: 0 !important; padding: 0 !important; width: 100% !important; }
    }
  </style>
</head>
<body class="text-slate-800 antialiased select-none sm:select-auto">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyDHjQTNfAh3wQ8tSOXOIewJNXaDCHADrR8",
      authDomain: "mrmo-d8760.firebaseapp.com",
      databaseURL: "https://mrmo-d8760-default-rtdb.firebaseio.com",
      projectId: "mrmo-d8760",
      storageBucket: "mrmo-d8760.firebasestorage.app",
      messagingSenderId: "510855132508",
      appId: "1:510855132508:web:feee377429a2d88c277d99",
      measurementId: "G-N9DW5R28H0"
    };

    let db = null;
    let auth = null;
    try {
      if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
      db = firebase.database();
      auth = firebase.auth();
      auth.languageCode = 'ar';
    } catch (e) { console.error("Firebase init error:", e); }

    const initialProjects = [
      {"id": "cons-01", "name": "مشروع رئيسي 01", "location": "الموقع العام", "budget": 500000, "consultant": "مكتب الاستشارات الهندسية", "startDate": "2026-01-01", "status": "جاري العمل"}
    ];

    const initialSettings = {
      mainCategories: ["مباني", "صبة خرسانه", "كهرباء", "سباكة", "محارة", "نقاشة"],
      subCategories: ["طوب", "اسمنت", "رملة", "عمالة", "الاكل", "نجار", "حداد", "خلاطة"],
      costTypes: ["مصنعيات", "بضاعة/مواد", "أكل", "مواصلات", "إيجار معدات", "نثريات وإكراميات"],
      suppliers: ["مورد الأسمنت", "مورد الرمل", "مقاول النجارة", "مصنع الطوب"],
      employees: ["المهندس التنفيذي", "مشرف العمال"]
    };

    const cleanId = (id) => (id ? String(id).trim().toLowerCase().replace(/[.#$\[\]\/]/g, "-") : "");
    const parseNum = (val) => {
      if (typeof val === "number") return isNaN(val) ? 0 : val;
      if (!val) return 0;
      const clean = String(val).replace(/,/g, '').replace(/،/g, '.').trim();
      const n = parseFloat(clean);
      return isNaN(n) ? 0 : n;
    };

    function App() {
      const [user, setUser] = useState({ uid: "admin", name: "مدير النظام" });
      const [projects, setProjects] = useState(initialProjects);
      const [expenses, setExpenses] = useState([]);
      const [extracts, setExtracts] = useState([]);
      const [payments, setPayments] = useState([]);
      const [advances, setAdvances] = useState([]);
      const [supplierPayments, setSupplierPayments] = useState([]);
      const [settings, setSettings] = useState(initialSettings);
      
      const [selectedProjId, setSelectedProjId] = useState("cons-01");
      const [activeTab, setActiveTab] = useState("advances"); // يبدأ في تبويب العهد والسلف مباشرة
      const [toast, setToast] = useState({ show: false, message: "" });
      
      // نافذة التعديل
      const [editItemData, setEditItemData] = useState(null);

      const todayDate = new Date().toISOString().split('T')[0];

      const [newExp, setNewExp] = useState({ date: todayDate, mainCategory: "", subCategory: "", supplier: "", billStatus: "مدفوعة", quantity: 1, unitPrice: "", description: "", paymentMethod: "خصم من العهدة", custodyEmployee: "" });
      const [newAdv, setNewAdv] = useState({ date: todayDate, employeeName: "", amount: "", notes: "" });
      const [newSuppPay, setNewSuppPay] = useState({ date: todayDate, supplier: "", amount: "", notes: "" });

      const showToast = (message) => { 
        setToast({ show: true, message }); 
        setTimeout(() => setToast({ show: false, message: "" }), 3000); 
      };

      useEffect(() => {
        if (!db) return;
        const rootRef = db.ref('/');
        rootRef.on('value', (snapshot) => {
          const data = snapshot.val() || {};
          const toArr = (v) => (v ? (Array.isArray(v) ? v : Object.values(v)) : []);
          if (data.projects) setProjects(toArr(data.projects));
          if (data.expenses) setExpenses([...toArr(data.expenses)].reverse());
          if (data.extracts) setExtracts([...toArr(data.extracts)].reverse());
          if (data.payments) setPayments([...toArr(data.payments)].reverse());
          if (data.advances) setAdvances([...toArr(data.advances)].reverse());
          if (data.supplier_payments) setSupplierPayments([...toArr(data.supplier_payments)].reverse());
          if (data.settings) setSettings(prev => ({ ...prev, ...data.settings }));
        });
      }, []);

      const deleteItem = (path, id, list) => {
        if (window.confirm("هل أنت متأكد من الحذف نهائياً؟")) {
          const newList = list.filter(item => item.id !== id);
          if (db) db.ref(path).set(newList);
          if (path === 'expenses') setExpenses(newList);
          if (path === 'advances') setAdvances(newList);
          if (path === 'supplier_payments') setSupplierPayments(newList);
          showToast("تم الحذف بنجاح! 🗑️");
        }
      };

      const handleSaveEditedItem = (e) => {
        e.preventDefault();
        if (!editItemData) return;
        const { type, data } = editItemData;
        let path = '';
        let list = [];

        if (type === 'expense') {
          path = 'expenses';
          const qty = parseNum(data.quantity);
          const price = parseNum(data.unitPrice);
          const updated = { ...data, quantity: qty, unitPrice: price, amount: qty * price };
          list = expenses.map(it => it.id === data.id ? updated : it);
          setExpenses(list);
        } else if (type === 'advance') {
          path = 'advances';
          const updated = { ...data, amount: parseNum(data.amount) };
          list = advances.map(it => it.id === data.id ? updated : it);
          setAdvances(list);
        } else if (type === 'supp_payment') {
          path = 'supplier_payments';
          const updated = { ...data, amount: parseNum(data.amount) };
          list = supplierPayments.map(it => it.id === data.id ? updated : it);
          setSupplierPayments(list);
        }

        if (db && path) db.ref(path).set(list);
        setEditItemData(null);
        showToast("تم حفظ التعديلات بنجاح! ✏️");
      };

      const currentProj = projects.find(p => cleanId(p.id) === cleanId(selectedProjId)) || projects[0] || {};
      const projExpenses = expenses.filter(e => cleanId(e.projectId) === cleanId(currentProj.id));
      const projAdvances = advances.filter(a => cleanId(a.projectId) === cleanId(currentProj.id));
      const projSuppPayments = supplierPayments.filter(p => cleanId(p.projectId) === cleanId(currentProj.id));

      const navTabs = [
        { id: "advances", label: "💼 العهد والسلف", icon: "💼" },
        { id: "add_expense", label: "➕ إضافة مصروف", icon: "➕" },
        { id: "expenses", label: "💸 سجل المصروفات", icon: "💸" },
        { id: "suppliers", label: "🚚 حساب الموردين", icon: "🚚" }
      ];

      return (
        <div class="min-h-screen pb-20">
          <header class="bg-slate-900 text-white p-3 sticky top-0 z-30 shadow flex justify-between items-center text-xs">
            <span class="font-black text-sm">🏗 MOMOHY ERP - الإصدار الخفيف</span>
            <div class="flex gap-1 overflow-x-auto scrollbar-hide">
              {navTabs.map(t => (
                <button key={t.id} onClick={() => setActiveTab(t.id)} class={`px-3 py-1.5 rounded-xl font-bold whitespace-nowrap transition ${activeTab === t.id ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-300'}`}>
                  {t.label}
                </button>
              ))}
            </div>
          </header>

          <div class="max-w-7xl mx-auto px-4 mt-3">
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between text-xs">
              <span class="font-bold">المشروع النشط:</span>
              <select value={selectedProjId} onChange={(e) => setSelectedProjId(e.target.value)} class="bg-slate-100 border p-1.5 rounded-xl font-bold text-blue-900 outline-none">
                {projects.map(p => <option key={p.id} value={p.id}>{p.id} - {p.name}</option>)}
              </select>
            </div>
          </div>

          <main class="max-w-7xl mx-auto px-4 mt-4">
            {/* 1. تبويب العهد والسلف المستقل */}
            {activeTab === 'advances' && (
              <div class="space-y-4">
                <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-300 shadow-sm text-xs">
                  <h3 class="font-black text-emerald-900 text-sm mb-3 border-b border-emerald-200 pb-2">💵 تسجيل استلام / تسليم عهدة مالية أو سلفة</h3>
                  <form onSubmit={(e) => {
                    e.preventDefault();
                    if(!newAdv.employeeName || parseNum(newAdv.amount) <= 0) return;
                    const newItem = { id: Date.now(), projectId: cleanId(selectedProjId), ...newAdv, amount: parseNum(newAdv.amount), createdBy: user.name };
                    const updated = [newItem, ...advances];
                    setAdvances(updated);
                    if(db) db.ref('advances').set(updated);
                    setNewAdv({ date: todayDate, employeeName: "", amount: "", notes: "" });
                    showToast("تم تسجيل العهدة بنجاح!");
                  }} class="grid grid-cols-1 sm:grid-cols-4 gap-2.5 mb-4">
                    <div><label class="block font-bold mb-1">التاريخ</label><input type="date" value={newAdv.date} onChange={e=>setNewAdv({...newAdv, date: e.target.value})} class="w-full border p-2 rounded-xl bg-white" required/></div>
                    <div>
                      <label class="block font-bold mb-1">اسم الموظف</label>
                      <select value={newAdv.employeeName} onChange={e=>setNewAdv({...newAdv, employeeName: e.target.value})} class="w-full border p-2 rounded-xl bg-white font-bold" required>
                        <option value="">اختر موظف...</option>
                        {settings.employees.map(c => <option key={c}>{c}</option>)}
                      </select>
                    </div>
                    <div><label class="block font-bold mb-1">المبلغ (ج.م)</label><input type="number" step="any" value={newAdv.amount} onChange={e=>setNewAdv({...newAdv, amount: e.target.value})} class="w-full border p-2 rounded-xl bg-white font-black text-emerald-700" placeholder="5000" required/></div>
                    <div><label class="block font-bold mb-1">البيان / ملاحظات</label><input type="text" value={newAdv.notes} onChange={e=>setNewAdv({...newAdv, notes: e.target.value})} placeholder="بيان العهدة..." class="w-full border p-2 rounded-xl bg-white"/></div>
                    <div class="sm:col-span-4"><button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-2.5 rounded-xl shadow">حفظ العهدة في حساب الموظف</button></div>
                  </form>

                  {/* جدول العهد - زر التعديل والحذف في آخر عمود أقصى اليسار */}
                  <div class="mt-4 pt-3 border-t border-emerald-300">
                    <h4 class="font-black text-emerald-950 mb-2 text-xs">سجل العهد والسلف للمشروع ({currentProj.name}):</h4>
                    <div class="overflow-x-auto bg-white rounded-xl border border-emerald-200 shadow-xs">
                      <table class="w-full text-right text-xs border-collapse">
                        <thead>
                          <tr class="bg-emerald-100 text-emerald-950 border-b">
                            <th class="p-2.5">التاريخ</th>
                            <th class="p-2.5">اسم الموظف</th>
                            <th class="p-2.5 text-center">المبلغ</th>
                            <th class="p-2.5">البيان</th>
                            <th class="p-2.5">بواسطة</th>
                            <th class="p-2.5 text-center bg-emerald-200 font-black">إجراءات</th>
                          </tr>
                        </thead>
                        <tbody>
                          {projAdvances.length === 0 ? (
                            <tr><td colSpan="6" class="p-4 text-center text-slate-400 font-bold">لا توجد عهد مسجلة لهذا المشروع</td></tr>
                          ) : (
                            projAdvances.map(a => (
                              <tr key={a.id} class="border-b hover:bg-emerald-50/50">
                                <td class="p-2.5 text-slate-600">{a.date}</td>
                                <td class="p-2.5 font-bold text-emerald-950">{a.employeeName}</td>
                                <td class="p-2.5 text-center font-black text-emerald-700 font-mono">{parseNum(a.amount).toLocaleString()} ج.م</td>
                                <td class="p-2.5 text-slate-600">{a.notes || '-'}</td>
                                <td class="p-2.5 text-slate-500">{a.createdBy || '-'}</td>
                                <td class="p-2.5 text-center whitespace-nowrap bg-emerald-50">
                                  <div class="flex items-center justify-center gap-1.5">
                                    <button onClick={() => setEditItemData({ type: 'advance', data: { ...a } })} class="bg-blue-600 text-white hover:bg-blue-700 px-3 py-1 rounded-lg font-bold">✏️ تعديل</button>
                                    <button onClick={() => deleteItem('advances', a.id, advances)} class="bg-rose-100 text-rose-700 hover:bg-rose-200 px-2 py-1 rounded-lg font-bold">🗑️ حذف</button>
                                  </div>
                                </td>
                              </tr>
                            ))
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* 2. إضافة مصروف */}
            {activeTab === 'add_expense' && (
              <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm text-xs">
                <h3 class="font-black text-slate-800 text-sm mb-3 border-b pb-2">💸 تسجيل مصروف وفاتورة جديدة</h3>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  if(parseNum(newExp.unitPrice) <= 0 || parseNum(newExp.quantity) <= 0) return;
                  const totalAmt = parseNum(newExp.quantity) * parseNum(newExp.unitPrice);
                  const newItem = { id: Date.now(), projectId: cleanId(selectedProjId), ...newExp, amount: totalAmt, createdBy: user.name };
                  const updated = [newItem, ...expenses];
                  setExpenses(updated);
                  if (db) db.ref('expenses').set(updated);
                  setNewExp({ ...newExp, unitPrice: "", description: "" });
                  showToast("تم حفظ المصروف بنجاح!");
                }} class="grid grid-cols-1 sm:grid-cols-4 gap-2.5">
                  <div><label class="block font-bold mb-1">التاريخ</label><input type="date" value={newExp.date} onChange={e=>setNewExp({...newExp, date: e.target.value})} class="w-full border p-2 rounded-xl" required/></div>
                  <div><label class="block font-bold mb-1">البند الرئيسي</label><select value={newExp.mainCategory} onChange={e=>setNewExp({...newExp, mainCategory: e.target.value})} class="w-full border p-2 rounded-xl" required><option value="">اختر...</option>{settings.mainCategories.map(c=><option key={c}>{c}</option>)}</select></div>
                  <div><label class="block font-bold mb-1">البند الفرعي</label><select value={newExp.subCategory} onChange={e=>setNewExp({...newExp, subCategory: e.target.value})} class="w-full border p-2 rounded-xl" required><option value="">اختر...</option>{settings.subCategories.map(c=><option key={c}>{c}</option>)}</select></div>
                  <div><label class="block font-bold mb-1">المورد</label><select value={newExp.supplier} onChange={e=>setNewExp({...newExp, supplier: e.target.value})} class="w-full border p-2 rounded-xl"><option value="">اختر...</option>{settings.suppliers.map(c=><option key={c}>{c}</option>)}</select></div>
                  <div>
                    <label class="block font-bold mb-1 text-indigo-700">حالة الفاتورة</label>
                    <select value={newExp.billStatus} onChange={e=>setNewExp({...newExp, billStatus: e.target.value})} class="w-full border p-2 rounded-xl font-bold bg-indigo-50">
                      <option value="مدفوعة">مسددة (لا دين)</option>
                      <option value="آجلة">آجلة (مديونية)</option>
                    </select>
                  </div>
                  <div><label class="block font-bold mb-1">طريقة السداد</label><select value={newExp.paymentMethod} onChange={e=>setNewExp({...newExp, paymentMethod: e.target.value})} class="w-full border p-2 rounded-xl"><option value="خصم من العهدة">خصم من العهدة</option><option value="كاش">كاش</option><option value="تحويل بنكي">تحويل بنكي</option></select></div>
                  <div><label class="block font-bold mb-1">الكمية</label><input type="number" step="any" value={newExp.quantity} onChange={e=>setNewExp({...newExp, quantity: e.target.value})} class="w-full border p-2 rounded-xl" required/></div>
                  <div><label class="block font-bold mb-1">سعر الوحدة</label><input type="number" step="any" value={newExp.unitPrice} onChange={e=>setNewExp({...newExp, unitPrice: e.target.value})} class="w-full border p-2 rounded-xl" required/></div>
                  <div class="sm:col-span-3"><label class="block font-bold mb-1">البيان</label><input type="text" value={newExp.description} onChange={e=>setNewExp({...newExp, description: e.target.value})} class="w-full border p-2 rounded-xl"/></div>
                  <div class="sm:col-span-1 flex items-end"><button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black p-2.5 rounded-xl shadow">حفظ الفاتورة</button></div>
                </form>
              </div>
            )}

            {/* 3. سجل المصروفات (الإجراءات في آخر عمود أقصى اليسار) */}
            {activeTab === 'expenses' && (
              <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm text-xs">
                <h3 class="font-black text-slate-800 text-sm mb-3 border-b pb-2">سجل المصروفات وفواتير التوريد</h3>
                <div class="overflow-x-auto">
                  <table class="w-full text-right border-collapse">
                    <thead>
                      <tr class="bg-slate-100 text-slate-700 border-b">
                        <th class="p-2.5">التاريخ</th>
                        <th class="p-2.5">المورد</th>
                        <th class="p-2.5">البند</th>
                        <th class="p-2.5 text-center">الكمية</th>
                        <th class="p-2.5 text-center">السعر</th>
                        <th class="p-2.5 text-center">الإجمالي</th>
                        <th class="p-2.5">حالة الفاتورة</th>
                        <th class="p-2.5">السداد</th>
                        <th class="p-2.5">البيان</th>
                        <th class="p-2.5 text-center bg-slate-200 text-slate-800 font-black">إجراءات</th>
                      </tr>
                    </thead>
                    <tbody>
                      {projExpenses.map(e => (
                        <tr key={e.id} class="border-b hover:bg-slate-50">
                          <td class="p-2.5 whitespace-nowrap text-slate-600">{e.date}</td>
                          <td class="p-2.5 font-bold text-slate-900">{e.supplier || '-'}</td>
                          <td class="p-2.5">{e.mainCategory} - {e.subCategory}</td>
                          <td class="p-2.5 text-center font-bold">{parseNum(e.quantity)}</td>
                          <td class="p-2.5 text-center">{parseNum(e.unitPrice).toLocaleString()}</td>
                          <td class="p-2.5 text-center font-black text-rose-600">{parseNum(e.amount).toLocaleString()}</td>
                          <td class="p-2.5">
                            <span class={`px-2 py-0.5 rounded font-bold text-[10px] ${e.billStatus === 'آجلة' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}`}>
                              {e.billStatus || 'مدفوعة'}
                            </span>
                          </td>
                          <td class="p-2.5 text-slate-500">{e.paymentMethod}</td>
                          <td class="p-2.5 text-slate-600 max-w-[150px] truncate">{e.description || '-'}</td>
                          <td class="p-2.5 text-center whitespace-nowrap bg-slate-50">
                            <div class="flex items-center justify-center gap-1.5">
                              <button onClick={() => setEditItemData({ type: 'expense', data: { ...e } })} class="bg-blue-600 text-white hover:bg-blue-700 px-3 py-1 rounded-lg font-bold">✏️ تعديل</button>
                              <button onClick={() => deleteItem('expenses', e.id, expenses)} class="bg-rose-100 text-rose-700 hover:bg-rose-200 px-2 py-1 rounded-lg font-bold">🗑️ حذف</button>
                            </div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* 4. حسابات الموردين */}
            {activeTab === 'suppliers' && (
              <div class="space-y-4">
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm text-xs">
                  <h3 class="font-black text-slate-800 text-sm mb-3 border-b pb-2">سجل دفعات سداد الموردين</h3>
                  <div class="overflow-x-auto">
                    <table class="w-full text-right border-collapse">
                      <thead>
                        <tr class="bg-slate-100 text-slate-700 border-b">
                          <th class="p-2.5">التاريخ</th>
                          <th class="p-2.5">المورد</th>
                          <th class="p-2.5 text-center">المبلغ المسدد</th>
                          <th class="p-2.5">البيان</th>
                          <th class="p-2.5 text-center bg-slate-200 text-slate-800 font-black">إجراءات</th>
                        </tr>
                      </thead>
                      <tbody>
                        {projSuppPayments.map(p => (
                          <tr key={p.id} class="border-b hover:bg-slate-50">
                            <td class="p-2.5 whitespace-nowrap">{p.date}</td>
                            <td class="p-2.5 font-bold text-slate-900">{p.supplier}</td>
                            <td class="p-2.5 text-center font-black text-emerald-600">{parseNum(p.amount).toLocaleString()} ج.م</td>
                            <td class="p-2.5 text-slate-600">{p.notes || '-'}</td>
                            <td class="p-2.5 text-center whitespace-nowrap bg-slate-50">
                              <div class="flex items-center justify-center gap-1.5">
                                <button onClick={() => setEditItemData({ type: 'supp_payment', data: { ...p } })} class="bg-blue-600 text-white hover:bg-blue-700 px-3 py-1 rounded-lg font-bold">✏️ تعديل</button>
                                <button onClick={() => deleteItem('supplier_payments', p.id, supplierPayments)} class="bg-rose-100 text-rose-700 hover:bg-rose-200 px-2 py-1 rounded-lg font-bold">🗑️ حذف</button>
                              </div>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* نافذة التعديل المنبثقة */}
          {editItemData && (
            <div class="fixed inset-0 bg-slate-900/70 z-50 flex items-center justify-center p-4">
              <div class="bg-white rounded-3xl p-5 w-full max-w-md shadow-2xl text-xs">
                <div class="flex justify-between items-center border-b pb-2 mb-3">
                  <h3 class="font-black text-sm text-slate-800">✏️ تعديل بيانات البند</h3>
                  <button onClick={() => setEditItemData(null)} class="text-slate-400 hover:text-slate-800 text-lg font-bold">✕</button>
                </div>

                <form onSubmit={handleSaveEditedItem} class="space-y-3">
                  {editItemData.type === 'expense' && (
                    <>
                      <div><label class="block font-bold mb-1">التاريخ</label><input type="date" value={editItemData.data.date} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, date: e.target.value}})} class="w-full border p-2 rounded-xl" required/></div>
                      <div><label class="block font-bold mb-1">المورد</label><select value={editItemData.data.supplier} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, supplier: e.target.value}})} class="w-full border p-2 rounded-xl"><option value="">اختر...</option>{settings.suppliers.map(s=><option key={s}>{s}</option>)}</select></div>
                      <div class="grid grid-cols-2 gap-2">
                        <div><label class="block font-bold mb-1">الكمية</label><input type="number" step="any" value={editItemData.data.quantity} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, quantity: e.target.value}})} class="w-full border p-2 rounded-xl" required/></div>
                        <div><label class="block font-bold mb-1">السعر</label><input type="number" step="any" value={editItemData.data.unitPrice} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, unitPrice: e.target.value}})} class="w-full border p-2 rounded-xl" required/></div>
                      </div>
                      <div>
                        <label class="block font-bold mb-1">حالة الفاتورة</label>
                        <select value={editItemData.data.billStatus || 'مدفوعة'} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, billStatus: e.target.value}})} class="w-full border p-2 rounded-xl font-bold bg-indigo-50">
                          <option value="مدفوعة">مسددة (لا دين)</option>
                          <option value="آجلة">آجلة (مديونية)</option>
                        </select>
                      </div>
                    </>
                  )}

                  {editItemData.type === 'advance' && (
                    <>
                      <div><label class="block font-bold mb-1">التاريخ</label><input type="date" value={editItemData.data.date} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, date: e.target.value}})} class="w-full border p-2 rounded-xl" required/></div>
                      <div><label class="block font-bold mb-1">اسم الموظف</label><select value={editItemData.data.employeeName} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, employeeName: e.target.value}})} class="w-full border p-2 rounded-xl" required>{settings.employees.map(c => <option key={c}>{c}</option>)}</select></div>
                      <div><label class="block font-bold mb-1">المبلغ</label><input type="number" step="any" value={editItemData.data.amount} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, amount: e.target.value}})} class="w-full border p-2 rounded-xl font-black text-emerald-600" required/></div>
                    </>
                  )}

                  {editItemData.type === 'supp_payment' && (
                    <>
                      <div><label class="block font-bold mb-1">التاريخ</label><input type="date" value={editItemData.data.date} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, date: e.target.value}})} class="w-full border p-2 rounded-xl" required/></div>
                      <div><label class="block font-bold mb-1">المبلغ</label><input type="number" step="any" value={editItemData.data.amount} onChange={e=>setEditItemData({...editItemData, data: {...editItemData.data, amount: e.target.value}})} class="w-full border p-2 rounded-xl font-black text-emerald-600" required/></div>
                    </>
                  )}

                  <div class="flex gap-2 pt-2">
                    <button type="submit" class="flex-1 bg-blue-600 text-white font-black py-2.5 rounded-xl shadow">حفظ التعديل</button>
                    <button type="button" onClick={() => setEditItemData(null)} class="bg-slate-100 text-slate-700 font-bold px-4 py-2.5 rounded-xl">إلغاء</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {toast.show && (
            <div class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-lg z-50">
              {toast.message}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
