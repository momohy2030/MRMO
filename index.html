    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

    const cleanId = (id) => (id ? String(id).trim().toLowerCase().replace(/[.#$\[\]\/]/g, "-") : "");
    const parseNum = (val) => {
      if (typeof val === "number") return isNaN(val) ? 0 : val;
      if (!val) return 0;
      const clean = String(val).replace(/,/g, '').replace(/،/g, '.').trim();
      const n = parseFloat(clean);
      return isNaN(n) ? 0 : n;
    };

    const ensureArr = (data) => Array.isArray(data) ? data : (data ? Object.values(data) : []);

    const constructionStorage = {
      get(key, fallback = []) {
        try {
          const item = localStorage.getItem(`construction_${key}`);
          return item ? JSON.parse(item) : fallback;
        } catch { return fallback; }
      },
      set(key, data) {
        try { localStorage.setItem(`construction_${key}`, JSON.stringify(data)); } catch (e) {}
      },
      addToQueue(path, data) {
        const queue = this.get('offline_sync_queue', []);
        queue.push({ id: Date.now(), path, data });
        this.set('offline_sync_queue', queue);
      },
      syncQueue(databaseInstance) {
        if (!navigator.onLine || !databaseInstance) return;
        const queue = this.get('offline_sync_queue', []);
        if (queue.length === 0) return;
        queue.forEach(item => databaseInstance.ref(item.path).set(item.data));
        localStorage.removeItem('construction_offline_sync_queue');
      }
    };

    const generatePdfAndOpenWhatsApp = (elementId, filename, textMessage, targetPhone = ADMIN_WHATSAPP_NUMBER) => {
      const element = document.getElementById(elementId);
      if (!element) { alert("تعذر العثور على العنصر لإنشاء الـ PDF"); return; }
      
      const prevWidth = element.style.width;
      const prevMaxWidth = element.style.maxWidth;
      const prevPadding = element.style.padding;

      element.style.width = '800px';
      element.style.maxWidth = '800px';
      element.style.padding = '24px';
      element.classList.add('pdf-render-mode');

      const opt = {
        margin: [8, 8, 8, 8],
        filename: filename || 'document.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, windowWidth: 1200, scrollX: 0, scrollY: 0 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };
      
      html2pdf().set(opt).from(element).save().then(() => {
        element.style.width = prevWidth;
        element.style.maxWidth = prevMaxWidth;
        element.style.padding = prevPadding;
        element.classList.remove('pdf-render-mode');
        
        const cleanPhone = targetPhone.replace(/[^0-9]/g, '');
        window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(textMessage + "\n\n📎 (تم استخراج ملف الـ PDF)")}`, '_blank');
      }).catch(err => {
        element.style.width = prevWidth;
        element.style.maxWidth = prevMaxWidth;
        element.style.padding = prevPadding;
        element.classList.remove('pdf-render-mode');
        window.open(`https://wa.me/${targetPhone}?text=${encodeURIComponent(textMessage)}`, '_blank');
      });
    };

    function DashboardCharts({ allWork, allExp, allPay, projExpLabels, projExpData, projName }) {
      const chart1Ref = useRef(null);
      const chart2Ref = useRef(null);
      const chart1Instance = useRef(null);
      const chart2Instance = useRef(null);

      useEffect(() => {
        if (chart1Instance.current) chart1Instance.current.destroy();
        if (chart2Instance.current) chart2Instance.current.destroy();

        if (chart1Ref.current) {
          chart1Instance.current = new Chart(chart1Ref.current, {
            type: 'bar',
            data: {
              labels: ['قيمة الأعمال', 'المصروفات', 'التحصيلات'],
              datasets: [{ 
                label: 'الموقف المالي العام', 
                data: [allWork, allExp, allPay], 
                backgroundColor: ['#4f46e5', '#f43f5e', '#10b981'], 
                borderRadius: 8
              }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
          });
        }
        
        if (chart2Ref.current) {
          chart2Instance.current = new Chart(chart2Ref.current, {
            type: 'doughnut',
            data: {
              labels: projExpLabels.length ? projExpLabels : ['لا توجد مصروفات'],
              datasets: [{ 
                data: projExpData.length ? projExpData : [1], 
                backgroundColor: projExpData.length ? ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#64748b'] : ['#e2e8f0'] 
              }]
            },
            options: { 
              responsive: true, 
              maintainAspectRatio: false, 
              plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, padding: 8, font: { size: 10, family: 'Cairo' } } } } 
            }
          });
        }
        return () => {
          if (chart1Instance.current) chart1Instance.current.destroy();
          if (chart2Instance.current) chart2Instance.current.destroy();
        };
      }, [allWork, allExp, allPay, projExpLabels.length, projExpData.length]);

      return (
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
          <div class="bg-white dark:bg-slate-900 p-4 sm:p-5 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm h-72 flex flex-col">
            <h4 class="font-extrabold text-slate-700 dark:text-slate-200 mb-2 text-center text-xs">📈 الموقف المالي العام للشركة</h4>
            <div class="relative w-full flex-1 min-h-0"><canvas ref={chart1Ref}></canvas></div>
          </div>
          <div class="bg-white dark:bg-slate-900 p-4 sm:p-5 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm h-72 flex flex-col">
            <h4 class="font-extrabold text-slate-700 dark:text-slate-200 mb-2 text-center text-xs truncate px-2">📊 توزيع تكلفة ({projName})</h4>
            <div class="relative w-full flex-1 min-h-0"><canvas ref={chart2Ref}></canvas></div>
          </div>
        </div>
      );
    }

    function App() {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [theme, setTheme] = useState(() => localStorage.getItem('theme') || 'light');
      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const [accessDeniedMessage, setAccessDeniedMessage] = useState("");
      const [isLampOn, setIsLampOn] = useState(false);

      const [projects, setProjects] = useState(() => ensureArr(constructionStorage.get('projects', initialProjects)));
      const [expenses, setExpenses] = useState(() => ensureArr(constructionStorage.get('expenses', [])));
      const [extracts, setExtracts] = useState(() => ensureArr(constructionStorage.get('extracts', [])));
      const [payments, setPayments] = useState(() => ensureArr(constructionStorage.get('payments', [])));
      const [advances, setAdvances] = useState(() => ensureArr(constructionStorage.get('advances', [])));

      const [activeTab, setActiveTab] = useState("dashboard");
      const [myEmpName, setMyEmpName] = useState(() => localStorage.getItem('myEmpName') || "");
      const [suppScope, setSuppScope] = useState("project");

      const [editItemData, setEditItemData] = useState(null);

      const [searchSubCat, setSearchSubCat] = useState("");
      const [searchCostType, setSearchCostType] = useState("");

      const todayDate = new Date().toISOString().split('T')[0];

      useEffect(() => {

        window.addEventListener('offline', handleOffline);

        };
      }, []);

      useEffect(() => {
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', theme);
      }, [theme]);

      const toggleTheme = () => setTheme(prev => prev === 'dark' ? 'light' : 'dark');

      const showToast = (message, type = "success") => { 
        setToast({ show: true, message, type }); 
        setTimeout(() => setToast(prev => ({ ...prev, show: false })), 3200); 
      };

      const recordLoginLog = (currentUser, roleName) => {
        if (!currentUser) return;
        const now = new Date();
        const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const logEntry = { 
          uid: currentUser.uid || 'offline-user', 
          name: currentUser.name || currentUser.identifier || "مستخدم", 
          identifier: currentUser.identifier || currentUser.email || "غير محدد", 
          role: roleName, 
          device: isMobile ? "📱 هاتف محمول" : "💻 كمبيوتر", 
          timestamp: now.toISOString(), 
          formattedDate: now.toLocaleDateString('ar-EG') + ' ' + now.toLocaleTimeString('ar-EG') 
        };
        if (navigator.onLine && db) db.ref('login_logs').push(logEntry);
      };

      useEffect(() => {
        if (!auth) { setAuthLoading(false); return; }
        return auth.onAuthStateChanged((currentUser) => {
          if (currentUser) {
            const identifier = (currentUser.email || currentUser.phoneNumber || "").toLowerCase().trim();
            if (BLOCKED_CONSTRUCTION_EMAILS.some(b => identifier.includes(b.toLowerCase()))) {
              setAccessDeniedMessage("عفواً، حسابك مصرح له بالدخول لقطاع المساحة فقط.");
              auth.signOut();
              setUser(null);
              setAuthLoading(false);
              return;
            }
            setAccessDeniedMessage("");
            setUser({ 
              uid: currentUser.uid, 
              name: currentUser.displayName || currentUser.email || currentUser.phoneNumber || "مستخدم موثق",
              email: currentUser.email || currentUser.phoneNumber || "",
              identifier 
            });
            localStorage.setItem('last_const_user_email', identifier);
            localStorage.setItem('last_const_user_name', currentUser.displayName || identifier);
          } else {
            const savedEmail = localStorage.getItem('last_const_user_email');
            if (savedEmail && !navigator.onLine) {
              setUser({ identifier: savedEmail, email: savedEmail, name: localStorage.getItem('last_const_user_name') || savedEmail });
            } else {
              setUser(null);
            }
          }
          setAuthLoading(false);
        });
      }, []);

      useEffect(() => {
        if (!db) return;
        const rootRef = db.ref('/');
        const handleValue = (snapshot) => {
          try {
            const data = snapshot.val() || {};
            
            const loadedProjects = ensureArr(data.projects);
            const finalProjects = loadedProjects.length > 0 ? loadedProjects : initialProjects;
            setProjects(finalProjects);
            constructionStorage.set('projects', finalProjects);

            if (data.expenses) { const l = ensureArr(data.expenses).reverse(); setExpenses(l); constructionStorage.set('expenses', l); }
            if (data.extracts) { const l = ensureArr(data.extracts).reverse(); setExtracts(l); constructionStorage.set('extracts', l); }
            if (data.payments) { const l = ensureArr(data.payments).reverse(); setPayments(l); constructionStorage.set('payments', l); }
            if (data.advances) { const l = ensureArr(data.advances).reverse(); setAdvances(l); constructionStorage.set('advances', l); }
            if (data.supplier_payments) { const l = ensureArr(data.supplier_payments).reverse(); setSupplierPayments(l); constructionStorage.set('supplier_payments', l); }
            if (data.login_logs) { const l = ensureArr(data.login_logs).reverse(); setLoginLogs(l); constructionStorage.set('login_logs', l); }
            if (data.roles) { setUserRolesMap(data.roles); constructionStorage.set('roles', data.roles); }

            const savedSettings = data.settings || {};
            const finalSettings = {
              mainCategories: ensureArr(savedSettings.mainCategories).length ? ensureArr(savedSettings.mainCategories) : initialSettings.mainCategories,
              subCategories: ensureArr(savedSettings.subCategories).length ? ensureArr(savedSettings.subCategories) : initialSettings.subCategories,
              costTypes: ensureArr(savedSettings.costTypes).length ? ensureArr(savedSettings.costTypes) : initialSettings.costTypes,
              suppliers: ensureArr(savedSettings.suppliers).length ? ensureArr(savedSettings.suppliers) : initialSettings.suppliers,
              employees: ensureArr(savedSettings.employees).length ? ensureArr(savedSettings.employees) : initialSettings.employees,
              logo: savedSettings.logo || ""
            };
            setSettings(finalSettings);
            constructionStorage.set('settings', finalSettings);

            setSelectedProjId(prev => {
              if (prev && finalProjects.some(p => cleanId(p.id) === cleanId(prev))) return prev;
              return finalProjects[0]?.id || "cons-01";
            });
          } catch (err) { console.error(err); }
        };
        rootRef.on('value', handleValue);
        return () => { rootRef.off('value', handleValue); };
      }, [user]);

      const saveSafeConstructionData = (path, storageKey, data) => {
        constructionStorage.set(storageKey, data);
        if (navigator.onLine && db) db.ref(path).set(data);
        else constructionStorage.addToQueue(path, data);
      };

      const currentUserEmail = (user?.email || user?.identifier || "").trim().toLowerCase();
      const sanitizedEmailKey = currentUserEmail.replace(/\./g, '_');

      const isSuperAdminHardcoded = currentUserEmail === SUPER_ADMIN_EMAIL.toLowerCase() || currentUserEmail.includes("mohamedmohy676676");
      const isExecutiveHardcoded = currentUserEmail === EXECUTIVE_DIRECTOR_EMAIL.toLowerCase() || currentUserEmail.includes("aymanmousawahat");
      const isPMHardcoded = PROJECT_MANAGER_EMAILS.some(e => currentUserEmail.includes(e.toLowerCase().trim()));

      const userRoleKey = useMemo(() => {
        if (!currentUserEmail) return 'guest';
        if (isSuperAdminHardcoded) return 'superadmin';
        if (isExecutiveHardcoded) return 'executive';
        if (isPMHardcoded) return 'pm';
        if (userRolesMap[sanitizedEmailKey]) return userRolesMap[sanitizedEmailKey];
        if (DIRECTOR_EMAILS.some(id => currentUserEmail.includes(id.toLowerCase()))) return 'admin';
        if (ENGINEER_EMAILS.some(id => currentUserEmail.includes(id.toLowerCase()))) return 'engineer';
        return 'engineer';
      }, [currentUserEmail, userRolesMap, isSuperAdminHardcoded, isExecutiveHardcoded, isPMHardcoded]);

      const isAdmin = ['superadmin', 'executive', 'pm', 'admin'].includes(userRoleKey);
      const isAccountant = userRoleKey === 'accountant';
      const isEngineer = userRoleKey === 'engineer';
      const isSuperAdminExact = userRoleKey === 'superadmin';
      const canEditOrDelete = isAdmin || isAccountant || isEngineer;

      const userRoleTitle = useMemo(() => {
        if (userRoleKey === 'superadmin') return "مدير النظام (Admin)";
        if (userRoleKey === 'executive') return "المدير التنفيذي (CEO)";
        if (userRoleKey === 'pm') return "مدير مشاريع (PM)";
        if (userRoleKey === 'admin') return "إدارة (Admin)";
        if (userRoleKey === 'accountant') return "محاسب (Accountant)";
        return "مهندس الموقع (Site Engineer)";
      }, [userRoleKey]);

      useEffect(() => {
        if (!isAdmin && activeTab === 'dashboard') setActiveTab('projects');
      }, [isAdmin, activeTab]);

      useEffect(() => {
        if (user && !sessionStorage.getItem('login_recorded')) {
          recordLoginLog(user, userRoleTitle);
          sessionStorage.setItem('login_recorded', 'true');
        }

        let path = '';
        let list = [];

        if (type === 'expense') {
          path = 'expenses';
          const qty = parseNum(data.quantity);
          const price = parseNum(data.unitPrice);
          const updatedItem = { ...data, quantity: qty, unitPrice: price, amount: qty * price };
          list = expenses.map(item => item.id === data.id ? updatedItem : item);
          setExpenses(list);
        } else if (type === 'advance') {
          path = 'advances';
          const updatedItem = { ...data, amount: parseNum(data.amount) };
          list = advances.map(item => item.id === data.id ? updatedItem : item);
          setAdvances(list);
        } else if (type === 'extract') {
          path = 'extracts';
          const qty = parseNum(data.quantity);
          const price = parseNum(data.unitPrice);
          const ded = parseNum(data.deductions);
          const totalWork = qty * price;
          const updatedItem = { ...data, quantity: qty, unitPrice: price, deductions: ded, totalWork, net: totalWork - ded };

          setExtracts(list);
        } else if (type === 'payment') {
          path = 'payments';
          const updatedItem = { ...data, amount: parseNum(data.amount) };
          list = payments.map(item => item.id === data.id ? updatedItem : item);
          setPayments(list);

          const updatedItem = { ...data, amount: parseNum(data.amount) };
          list = supplierPayments.map(item => item.id === data.id ? updatedItem : item);

          list = projects.map(item => item.id === data.id ? updatedItem : item);
          setProjects(list);

      const currentProj = projects.find(p => cleanId(p?.id) === cleanId(selectedProjId)) || projects[0] || {};
      const projExpenses = expenses.filter(e => cleanId(e?.projectId) === cleanId(currentProj?.id));
      const projExtracts = extracts.filter(e => cleanId(e?.projectId) === cleanId(currentProj?.id));
      const projPayments = payments.filter(p => cleanId(p?.projectId) === cleanId(currentProj?.id));
      const projAdvances = advances.filter(a => cleanId(a?.projectId) === cleanId(currentProj?.id));
      const projSuppPayments = supplierPayments.filter(p => cleanId(p?.projectId) === cleanId(currentProj?.id));

      const totalWorkNet = projExtracts.reduce((sum, item) => sum + parseNum(item?.net), 0);
      const totalCost = projExpenses.reduce((sum, item) => sum + parseNum(item?.amount), 0);
      const totalReceived = projPayments.reduce((sum, item) => sum + parseNum(item?.amount), 0);
      const netProfit = totalWorkNet - totalCost;

      const projDirectCashExp = projExpenses.filter(e => e?.paymentMethod !== 'خصم من العهدة' && (e?.billStatus || 'مدفوعة') === 'مدفوعة').reduce((sum, e) => sum + parseNum(e?.amount), 0);
      const projTotalAdvancesGiven = projAdvances.reduce((sum, a) => sum + parseNum(a?.amount), 0);
      const projTotalSuppPaid = projSuppPayments.reduce((sum, p) => sum + parseNum(p?.amount), 0);
      const centralCashRemaining = totalReceived - projDirectCashExp - projTotalAdvancesGiven - projTotalSuppPaid;

      const allEmpCustodyBalance = (settings?.employees || []).reduce((acc, emp) => {
        const adv = projAdvances.filter(a => a?.employeeName === emp).reduce((sum, a) => sum + parseNum(a?.amount), 0);
        const spent = projExpenses.filter(e => e?.paymentMethod === 'خصم من العهدة' && e?.custodyEmployee === emp).reduce((sum, e) => sum + parseNum(e?.amount), 0);
        return acc + Math.max(0, adv - spent);
      }, 0);

      const projBudget = parseNum(currentProj?.budget);
      const budgetConsumedPercent = projBudget > 0 ? Math.min(Math.round((totalCost / projBudget) * 100), 100) : 0;

      const allWork = extracts.reduce((sum, item) => sum + parseNum(item?.totalWork), 0);
      const allExp = expenses.reduce((sum, item) => sum + parseNum(item?.amount), 0);
      const allPay = payments.reduce((sum, item) => sum + parseNum(item?.amount), 0);

      projExpenses.forEach(e => {

        projExpMap[cat] = (projExpMap[cat] || 0) + parseNum(e?.amount);

      const projExpLabels = Object.keys(projExpMap);
      const projExpData = Object.values(projExpMap);

               (searchCostType === "" || e?.costType === searchCostType);

      const filteredSearchTotal = filteredSearchExpenses.reduce((s, e) => s + parseNum(e?.amount), 0);

      const cleanSuppliersList = Array.from(new Set(allSupplierNames));

      const suppliersLedger = cleanSuppliersList.map(supp => {
        const targetExp = suppScope === "project" ? projExpenses : expenses;
        const targetSuppPay = suppScope === "project" ? projSuppPayments : supplierPayments;

        const allInvoices = targetExp.filter(e => String(e?.supplier || '').trim() === supp);
        const totalPurchases = allInvoices.reduce((sum, e) => sum + parseNum(e?.amount), 0);
        const creditPurchases = allInvoices.filter(e => (e?.billStatus || 'مدفوعة') === 'آجلة').reduce((sum, e) => sum + parseNum(e?.amount), 0);
        const paidPurchases = totalPurchases - creditPurchases;
        const totalPaidToCreditor = targetSuppPay.filter(p => String(p?.supplier || '').trim() === supp).reduce((sum, p) => sum + parseNum(p?.amount), 0);
        const balance = totalPaidToCreditor - creditPurchases;

        return { name: supp, totalPurchases, creditPurchases, paidPurchases, totalPaid: totalPaidToCreditor, balance };
      }).filter(s => s.totalPurchases > 0 || s.totalPaid > 0);

                </form>
              </div>
            </div>
          )}

          <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200/80 dark:border-slate-800 shadow-lg z-40 px-2 py-1 flex justify-around items-center">
            {navTabs.slice(0, 4).map(tab => (
              <button 
                key={tab.id} 
                onClick={() => setActiveTab(tab.id)} 
                class={`flex flex-col items-center justify-center py-1.5 px-3 rounded-2xl transition ${
                  activeTab === tab.id ? "text-indigo-600 dark:text-indigo-400 font-black" : "text-slate-400 hover:text-slate-600"
                }`}
              >
                <span class="text-base">{tab.icon}</span>
                <span class="text-[10px] mt-0.5">{tab.label}</span>
              </button>
            ))}
            <button 
              onClick={() => setDrawerOpen(true)} 
              class="flex flex-col items-center justify-center py-1.5 px-3 text-slate-400 hover:text-slate-600"
            >
              <span class="text-base">☰</span>
              <span class="text-[10px] mt-0.5">المزيد</span>
            </button>
          </nav>

          {toast.show && (
            <div class="fixed bottom-16 md:bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none toast-anim">
              <div class={`px-4 py-2.5 rounded-2xl shadow-xl border flex items-center gap-2 text-xs font-bold text-white ${toast.type === 'error' ? 'bg-rose-600 border-rose-500' : 'bg-slate-900 border-slate-800'}`}>
                <span>{toast.type === 'error' ? '⚠️' : '✅'}</span>
                <span>{toast.message}</span>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
